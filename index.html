                          {result.sender_address && <div className={cx("text-xs mt-0.5", mutedText)}>{result.sender_address}</div>}
                        </div>
                        <div className={cx("rounded-lg p-3", boxBg)}>
                          <div className={cx("text-xs mb-1", subtleText)}>TO</div>
                          <div className={cx("font-semibold", titleText)}>{c.destination || "—"}</div>
                          {receiverAddr && <div className={cx("text-xs mt-0.5", mutedText)}>{receiverAddr}</div>}
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4 text-sm">
                        <div><div className={cx("text-xs", subtleText)}>Expected Pickup</div><div className={cx("font-medium", titleText)}>{fmtDateISO(result.created_date)}</div></div>
                        <div><div className={cx("text-xs", subtleText)}>Expected Delivery</div><div className={cx("font-medium", titleText)}>{fmtDateISO(result.eta)}</div></div>
                        <div><div className={cx("text-xs", subtleText)}>Vehicle</div><div className={cx("font-medium", titleText)}>{c.vehiclePlate || "Unassigned"}</div></div>
                      </div>
                    </div>
                    {idx < containers.length - 1 && <div className={cx("border-t pt-2", headerBorder)} />}
                  </div>
                );
              })
            )}
          </div>
        )}
      </div>
      <div className={cx("text-center text-xs py-6 border-t", subtleText, headerBorder)}>© {new Date().getFullYear()} LOGISTIX Transport ERP</div>
    </div>
  );
}

function LogistixERP() {
  const [authSession, setAuthSession] = useState(undefined); // undefined = checking, null = logged out
  const [showAuth, setShowAuth] = useState(false);
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [profile, setProfile] = useState(null);

  const [data, setDataState] = useState(null);
  const [dataLoading, setDataLoading] = useState(false);
  const [view, setView] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [viewSession, setViewSession] = useState({ role: "admin", customerId: null });
  const [excelMeta, setExcelMeta] = useState({ attached: false, filename: null, snapshot: null });
  const [importMsg, setImportMsg] = useState(null);
  const [excelBusy, setExcelBusy] = useState(false);
  const [tabExcel, setTabExcel] = useState({}); // { [viewKey]: { attached, filename, snapshot, busy, message } }
  const [domesticExportFrom, setDomesticExportFrom] = useState("");
  const [domesticExportTo, setDomesticExportTo] = useState("");
  const [contractExcel, setContractExcel] = useState({}); // { [contractGroupId||"orphan"]: { attached, filename, snapshot, busy, message } } - per-contract, so this can't use the generic viewKey-based system above
  const [swapExcel, setSwapExcel] = useState({}); // { [customerId]: { attached, filename, snapshot, busy, message } } - per-customer, same reason
  const [fleetUrl, setFleetUrl] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("logistix-theme") || "dark"; } catch (e) { return "dark"; }
  });
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const fileInputRef = useRef(null);

  function toggleTheme() {
    setTheme((t) => {
      const next = t === "dark" ? "light" : "dark";
      try { localStorage.setItem("logistix-theme", next); } catch (e) { /* ignore */ }
      return next;
    });
  }

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setAuthSession(data.session || null));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setAuthSession(sess));
    try { setFleetUrl(localStorage.getItem(FLEET_LINK_KEY) || null); } catch (e) { /* ignore */ }
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (authSession) loadProfileAndData();
    else { setProfile(null); setDataState(null); }
    // eslint-disable-next-line
  }, [authSession]);

  // Live updates: quietly re-fetch in the background so changes made by other people show
  // up without anyone needing to reload the page. Skipped while a modal is open (someone's
  // likely mid-edit right then) and while a previous refresh is still in flight, so it
  // never piles up requests or clobbers an in-progress form.
  const modalRef = useRef(null);
  const refreshingRef = useRef(false);
  useEffect(() => { modalRef.current = modal; }, [modal]);
  useEffect(() => {
    if (!authSession) return;
    const interval = setInterval(() => {
      if (modalRef.current || refreshingRef.current) return;
      refreshingRef.current = true;
      refreshData().finally(() => { refreshingRef.current = false; });
    }, 15000);
    return () => clearInterval(interval);
  }, [authSession]);

  async function handleLogin(email, password) {
    setAuthBusy(true); setAuthError(null);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setAuthError(error.message);
    setAuthBusy(false);
  }

  async function handleSignup(email, password, name) {
    setAuthBusy(true); setAuthError(null);
    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { name } } });
    if (error) setAuthError(error.message);
    setAuthBusy(false);
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  async function refreshData() {
    const results = await Promise.all(DATA_TABLES.map((t) => supabaseClient.from(t).select("*").order("created_at", { ascending: false })));
    setDataState((prev) => {
      const next = { ...prev };
      DATA_TABLES.forEach((t, i) => {
        const { data: rows, error } = results[i];
        if (error) {
          // Never let a failed background fetch wipe out data that's already on screen —
          // keep whatever was there before and just skip updating this one table.
          console.error(`Failed refreshing ${t}:`, error.message);
          return;
        }
        next[t] = (rows || []).map(fromDbRow);
      });
      return next;
    });
  }

  async function loadProfileAndData() {
    setDataLoading(true);
    const userId = authSession.user.id;
    const { data: profRow } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
    const prof = profRow ? fromDbRow(profRow) : { id: userId, name: authSession.user.email, role: "staff", customerId: "" };
    setProfile(prof);
    setViewSession(prof.role === "customer" ? { role: "customer", customerId: prof.customerId } : { role: prof.role || "admin", customerId: null });
    const allowed = allowedViewsForRole(prof.role);
    if (allowed && allowed.length) setView(allowed[0]);

    await refreshData();
    setDataLoading(false);
  }

  async function saveItem(entity, item) {
    let toSave = item;
    const actor = (profile && profile.name) || "Someone";
    if (entity === "orders") {
      const containers = orderContainers(item).map((c) => {
        if (Array.isArray(c.history) && c.history.length === 1 && !c.history[0].by) {
          return { ...c, history: [{ ...c.history[0], by: actor }] };
        }
        return c;
      });
      toSave = { ...item, containers };
      if (!Array.isArray(toSave.history) || toSave.history.length === 0) {
        toSave.history = [{ id: uid("evt"), message: "Order created and pending confirmation", at: new Date().toISOString(), location: item.origin, by: actor }];
      }
    }
    const row = toDbRow(toSave);
    const { error } = await supabaseClient.from(entity).upsert(row);
    if (error) { window.alert("Couldn't save: " + error.message); return; }
    setDataState((prev) => {
      const list = prev[entity];
      const idx = list.findIndex((x) => x.id === toSave.id);
      const next = idx > -1 ? list.map((x) => (x.id === toSave.id ? toSave : x)) : [toSave, ...list];
      return { ...prev, [entity]: next };
    });
    setModal(null);
  }

  async function deleteItem(entity, idOrIds) {
    const ids = Array.isArray(idOrIds) ? idOrIds : [idOrIds];
    try {
      const { error } = await supabaseClient.from(entity).delete().in("id", ids);
      if (error) { window.alert("Couldn't delete: " + error.message); return; }
      const idSet = new Set(ids);
      setDataState((prev) => ({ ...prev, [entity]: prev[entity].filter((x) => !idSet.has(x.id)) }));
      setConfirm(null);
    } catch (err) {
      window.alert("Couldn't delete: " + (err && err.message ? err.message : String(err)));
    }
  }

  async function updateContainerStage(orderId, containerId, newStageIndex, extraData) {
    const order = data.orders.find((o) => o.id === orderId);
    if (!order) return;
    const st = order.shipmentType || "Import";
    const isDomesticOrder = st === "Domestic";
    const isImportOrder = st === "Import";
    // Which stageIndex means "Delivered" and which array of messages applies, per type.
    const deliveredAtIndex = (isDomesticOrder || isImportOrder) ? 4 : 3;
    const completedAtIndex = isImportOrder ? 5 : -1; // only Import ever reaches Completed
    const messages = isDomesticOrder ? DOMESTIC_STAGE_MESSAGES : isImportOrder ? IMPORT_STAGE_MESSAGES : STAGE_MESSAGES;
    const actor = (profile && profile.name) || "Someone";
    const containers = orderContainers(order).map((c) => {
      if (c.id !== containerId) return c;
      const deliveredDate = newStageIndex >= deliveredAtIndex ? (c.deliveredDate || todayISO()) : c.deliveredDate;
      let message = messages[newStageIndex] || "Status updated";
      if (newStageIndex === deliveredAtIndex && extraData && extraData.podReceivedBy) message = `Delivered — received by ${extraData.podReceivedBy}`;
      if (newStageIndex === 1 && extraData && extraData.dispatchedBy) message = `Picked up — dispatched by ${extraData.dispatchedBy}`;
      if (newStageIndex === completedAtIndex && extraData && extraData.emptyReturnDate) message = `Completed — empty returned ${fmtDate(extraData.emptyReturnDate)}`;
      const location = (newStageIndex === completedAtIndex) ? (c.emptyReturnLocation || c.destination || order.origin) : newStageIndex >= 3 ? (c.destination || order.origin) : order.origin;
      const newEvent = { id: uid("evt"), message, at: new Date().toISOString(), location, by: actor };
      const history = [...(Array.isArray(c.history) ? c.history : []), newEvent];
      const mergedFields = extraData || {};
      return { ...c, stageIndex: newStageIndex, deliveredDate, history, ...mergedFields };
    });
    const { error } = await supabaseClient.from("orders").update({ containers }).eq("id", orderId);
    if (error) { window.alert("Couldn't update container: " + error.message); return; }
    setDataState((prev) => ({ ...prev, orders: prev.orders.map((o) => (o.id === orderId ? { ...o, containers } : o)) }));
  }

  async function updateContainerFields(orderId, containerId, fields, opts) {
    const order = data.orders.find((o) => o.id === orderId);
    if (!order) return;
    const actor = (profile && profile.name) || "Someone";
    const skipLog = opts && opts.skipLog;
    const containers = orderContainers(order).map((c) => {
      if (c.id !== containerId) return c;
      let history = Array.isArray(c.history) ? c.history : [];
      if (!skipLog) {
        const desc = describeFieldChange(fields);
        if (desc) {
          history = [...history, { id: uid("evt"), message: desc, at: new Date().toISOString(), location: "", by: actor }];
        }
      }
      return { ...c, ...fields, history };
    });
    const { error } = await supabaseClient.from("orders").update({ containers }).eq("id", orderId);
    if (error) { window.alert("Couldn't save: " + error.message); return; }
    setDataState((prev) => ({ ...prev, orders: prev.orders.map((o) => (o.id === orderId ? { ...o, containers } : o)) }));
  }

  async function updateDriverStatus(driverId, status) {
    const { error } = await supabaseClient.from("drivers").update({ status }).eq("id", driverId);
    if (error) { window.alert("Couldn't update driver: " + error.message); return; }
    setDataState((prev) => ({ ...prev, drivers: prev.drivers.map((d) => (d.id === driverId ? { ...d, status } : d)) }));
  }

  function handleAttachClick() {
    if (fileInputRef.current) fileInputRef.current.click();
  }

  function handleAttachFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setExcelBusy(true);
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        const found = [];
        let updatedCount = 0, addedCount = 0;
        const next = { ...data };
        const writes = [];
        // Carry forward any snapshot from a file that's already attached, so reverting
        // always restores all the way back to the true pre-import state, even across
        // multiple files attached one after another without detaching in between.
        const snapshot = { ...(excelMeta.snapshot || {}) };
        const SHEET_TABLE_NAME = { Orders: "orders", Customers: "customers", Senders: "senders", Transporters: "transporters", Drivers: "drivers", Vehicles: "vehicles", Invoices: "invoices", Routes: "routes", FuelPrices: "fuel_prices" };
        Object.keys(SHEET_SCHEMAS).forEach((sheetName) => {
          const ws = wb.Sheets[sheetName];
          if (!ws) return;
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
          const table = SHEET_TABLE_NAME[sheetName] || sheetName.toLowerCase();
          found.push(sheetName);
          let coerced;
          if (sheetName === "Orders") coerced = coerceOrders(rows, data);
          if (sheetName === "Customers") coerced = coerceCustomers(rows);
          if (sheetName === "Senders") coerced = coerceSenders(rows);
          if (sheetName === "Transporters") coerced = coerceTransporters(rows);
          if (sheetName === "Drivers") coerced = coerceDrivers(rows);
          if (sheetName === "Vehicles") coerced = coerceVehicles(rows);
          if (sheetName === "Invoices") coerced = coerceInvoices(rows);
          if (sheetName === "Routes") coerced = coerceRoutes(rows);
          if (sheetName === "FuelPrices") coerced = coerceFuelPrices(rows);
          if (!coerced) return;

          const existingList = data[table] || [];
          const existingById = new Map(existingList.map((r) => [r.id, r]));
          const priorEntries = snapshot[table] || [];
          const alreadyTracked = new Set(priorEntries.map((en) => en.id));
          const tableSnapshot = [...priorEntries];
          const mergedList = [...existingList];

          coerced.forEach((row) => {
            const prev = existingById.get(row.id) || null;
            if (prev) updatedCount++; else addedCount++;
            // Only capture the "before" value the first time this record is touched —
            // if a later file changes it again, we still want to revert to the very original.
            if (!alreadyTracked.has(row.id)) tableSnapshot.push({ id: row.id, prev });
            const idx = mergedList.findIndex((r) => r.id === row.id);
            if (idx >= 0) mergedList[idx] = row; else mergedList.push(row);
          });

          next[table] = mergedList;
          snapshot[table] = tableSnapshot;
          if (coerced.length) writes.push(supabaseClient.from(table).upsert(coerced.map(toDbRow)));
        });
        const writeResults = await Promise.all(writes);
        const writeError = writeResults.find((r) => r.error);
        setDataState(next);
        setExcelMeta({ attached: true, filename: file.name, snapshot });
        if (writeError) {
          setImportMsg({ ok: false, text: `Loaded locally, but saving to the database failed: ${writeError.error.message}` });
        } else {
          setImportMsg(found.length
            ? { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"} across ${found.join(", ")}. Everything else is untouched.` }
            : { ok: false, text: "No matching sheet tabs found (expected Orders, Customers, Drivers, Vehicles, Invoices, Routes)." });
        }
      } catch (err) {
        setImportMsg({ ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." });
      } finally {
        setExcelBusy(false);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  async function handleDetach() {
    const snapshot = excelMeta.snapshot;
    if (!snapshot) {
      setExcelMeta({ attached: false, filename: null, snapshot: null });
      setImportMsg(null);
      return;
    }
    setExcelBusy(true);
    try {
      const next = { ...data };
      const writes = [];
      const deletes = [];
      Object.entries(snapshot).forEach(([table, entries]) => {
        const list = [...(data[table] || [])];
        entries.forEach(({ id, prev }) => {
          const idx = list.findIndex((r) => r.id === id);
          if (prev) {
            // existed before the import(s) -> restore it exactly as it was
            if (idx >= 0) list[idx] = prev; else list.push(prev);
            writes.push(supabaseClient.from(table).upsert(toDbRow(prev)));
          } else {
            // didn't exist before -> the import created it, so undo means removing it entirely
            if (idx >= 0) list.splice(idx, 1);
            deletes.push(supabaseClient.from(table).delete().eq("id", id));
          }
        });
        next[table] = list;
      });
      await Promise.all([...writes, ...deletes]);
      setDataState(next);
      setImportMsg({ ok: true, text: "Reverted — the site's data is back to how it was before that file was attached." });
    } catch (err) {
      setImportMsg({ ok: false, text: "Couldn't fully revert: " + err.message });
    } finally {
      setExcelMeta({ attached: false, filename: null, snapshot: null });
      setExcelBusy(false);
    }
  }

  function handleTabAttachFile(viewKey, file) {
    const cfg = TAB_EXCEL_CONFIG[viewKey];
    if (!cfg || !file) return;
    setTabExcel((prev) => ({ ...prev, [viewKey]: { ...(prev[viewKey] || {}), busy: true, message: null } }));
    const reader = new FileReader();
    if (viewKey === "orders_domestic") {
      reader.onload = async (evt) => {
        try {
          const arr = new Uint8Array(evt.target.result);
          const wb = XLSX.read(arr, { type: "array" });
          const sheetNames = ["Finished Goods", "Wrapping Materials", "WM Domestic Karachi"].filter((n) => wb.Sheets[n]);
          if (sheetNames.length === 0) throw new Error("Expected a 'Finished Goods' or 'Wrapping Materials' sheet — that's what this report exports as.");

          // Loading Date is exported as dd/mm/yyyy (matching the rest of the app), not
          // normalizeDateStr's assumed formats — parsing "11/08/2026" with the generic
          // Date() parser would read it as 8 November (US mm/dd/yyyy), silently swapping
          // day and month for any day <= 12. Parse dd/mm/yyyy explicitly instead.
          function parseDDMMYYYY(v) {
            if (!v) return "";
            const s = String(v).trim();
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
            return normalizeDateStr(v); // fallback for ISO-style or other formats
          }

          let updatedCount = 0, createdCount = 0, skippedCount = 0;
          const createIssues = []; // { row/sheet context, reason }
          let updatedOrders = [...data.orders];
          const tableSnapshot = [];
          const touchedOrderIds = new Set();
          const newOrderIds = new Set(); // created orders don't need a "prev" snapshot entry - reverting just deletes them

          sheetNames.forEach((sheetName) => {
            const hasSender = sheetName === "Wrapping Materials" || sheetName === "WM Domestic Karachi";
            const sheetCategory = { "Finished Goods": DOMESTIC_CATEGORIES[0], "Wrapping Materials": DOMESTIC_CATEGORIES[1], "WM Domestic Karachi": DOMESTIC_CATEGORIES[2] }[sheetName];
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "", raw: false });
            rows.forEach((row, rowIdx) => {
              const containerId = xstr(readAnyKey(row, ["Container ID", "container id"])).trim();
              const rowLabel = `${sheetName} row ${rowIdx + 2}`; // +2: header row + 1-indexing

              if (containerId) {
                // Existing shipment - update it. An ID that doesn't match anything is treated
                // as an error, not a new row - a non-blank ID signals intent to update a
                // specific shipment, not to create an unrelated new one.
                const orderIdx = updatedOrders.findIndex((o) => orderContainers(o).some((c) => c.id === containerId));
                if (orderIdx === -1) { skippedCount++; return; }
                const order = updatedOrders[orderIdx];
                const containers = orderContainers(order);
                const cIdx = containers.findIndex((c) => c.id === containerId);
                if (cIdx === -1) { skippedCount++; return; }

                if (!touchedOrderIds.has(order.id)) { touchedOrderIds.add(order.id); tableSnapshot.push({ id: order.id, prev: order }); }

                const newContainers = containers.map((c, i) => {
                  if (i !== cIdx) return c;
                  const loadingDate = parseDDMMYYYY(readAnyKey(row, ["Loading Date"]));
                  return {
                    ...c,
                    poSapNo: xstr(readAnyKey(row, ["PO / SAP No.", "PO/SAP No."])),
                    movementThrough: xstr(readAnyKey(row, ["Movement Through"])),
                    loadingDate,
                    // Fuel Management's report only shows containers with dispatchAt set —
                    // Domestic treats Loading Date as the effective dispatch date (same as
                    // DispatchModal does), so keep dispatchAt in sync with it here too.
                    dispatchAt: loadingDate ? new Date(loadingDate + "T00:00:00").toISOString() : c.dispatchAt,
                    vehiclePlate: xstr(readAnyKey(row, ["Vehicle No."])),
                    vehicleSize: xstr(readAnyKey(row, ["Vehicle Size"])),
                    destination: xstr(readAnyKey(row, ["Destination"])),
                    transporter: xstr(readAnyKey(row, ["Transporter Name"])),
                  };
                });
                const loadingPoint = xstr(readAnyKey(row, ["Loading Point"]));
                updatedOrders[orderIdx] = { ...order, origin: loadingPoint || order.origin, containers: newContainers };
                updatedCount++;
                return;
              }

              // No Container ID - this is a new shipment. A blank Customer, Loading Point, or
              // Destination means there's nothing usable to create from, so those are skipped
              // as empty rows rather than reported as failures.
              const customerName = xstr(readAnyKey(row, ["Customer"])).trim();
              const loadingPoint = xstr(readAnyKey(row, ["Loading Point"])).trim();
              const destination = xstr(readAnyKey(row, ["Destination"])).trim();
              if (!customerName && !loadingPoint && !destination) return;

              const matchedCustomer = (data.customers || []).find((cu) => (cu.name || "").trim().toLowerCase() === customerName.toLowerCase());
              if (!matchedCustomer) { createIssues.push(`${rowLabel}: customer "${customerName}" not found — row not created.`); return; }
              if (!loadingPoint || !destination) { createIssues.push(`${rowLabel}: missing Loading Point or Destination — row not created.`); return; }

              let senderId = "", senderAddress = "";
              if (hasSender) {
                const senderLabel = xstr(readAnyKey(row, ["Sender"])).trim();
                if (senderLabel) {
                  const candidates = [];
                  (data.senders || []).forEach((sd) => {
                    (Array.isArray(sd.addresses) ? sd.addresses : []).forEach((a) => {
                      if ((a.label || "").trim().toLowerCase() === senderLabel.toLowerCase()) candidates.push({ sender: sd, addr: a });
                    });
                  });
                  if (candidates.length === 1) {
                    senderId = candidates[0].sender.id;
                    senderAddress = candidates[0].addr.address;
                  } else if (candidates.length > 1) {
                    createIssues.push(`${rowLabel}: Sender label "${senderLabel}" matches ${candidates.length} different senders — created, but Sender left blank. Set it manually.`);
                  } else {
                    createIssues.push(`${rowLabel}: Sender label "${senderLabel}" not found on any sender — created, but Sender left blank. Set it manually.`);
                  }
                }
              }

              const newLoadingDate = parseDDMMYYYY(readAnyKey(row, ["Loading Date"]));
              const newContainer = {
                ...emptyContainer(),
                poSapNo: xstr(readAnyKey(row, ["PO / SAP No.", "PO/SAP No."])),
                movementThrough: xstr(readAnyKey(row, ["Movement Through"])),
                loadingDate: newLoadingDate,
                dispatchAt: newLoadingDate ? new Date(newLoadingDate + "T00:00:00").toISOString() : "",
                vehiclePlate: xstr(readAnyKey(row, ["Vehicle No."])),
                vehicleSize: xstr(readAnyKey(row, ["Vehicle Size"])),
                destination,
                transporter: xstr(readAnyKey(row, ["Transporter Name"])),
              };
              const newOrder = {
                id: genUUID(), orderNumber: genOrderNumber(), customerId: matchedCustomer.id,
                shipmentType: "Domestic", domesticCategory: sheetCategory,
                origin: loadingPoint, senderId, senderAddress, eta: "", description: "",
                createdDate: todayISO(), cancelled: false, priority: "Normal",
                containers: [newContainer],
              };
              updatedOrders.push(newOrder);
              newOrderIds.add(newOrder.id);
              createdCount++;
            });
          });

          const changedOrders = updatedOrders.filter((o) => touchedOrderIds.has(o.id) || newOrderIds.has(o.id));
          const { error } = changedOrders.length ? await supabaseClient.from("orders").upsert(changedOrders.map(toDbRow)) : { error: null };
          setDataState((prevData) => ({ ...prevData, orders: updatedOrders }));
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: {
              attached: true, filename: file.name,
              snapshot: [...tableSnapshot, ...Array.from(newOrderIds).map((id) => ({ id, prev: null }))],
              busy: false,
              message: error
                ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
                : {
                    ok: true,
                    text: `${file.name}: updated ${updatedCount}, created ${createdCount} shipment${createdCount === 1 ? "" : "s"}.` +
                      (skippedCount > 0 ? ` ${skippedCount} row${skippedCount === 1 ? "" : "s"} had a Container ID that didn't match any shipment and were skipped.` : "") +
                      (createIssues.length > 0 ? ` ${createIssues.length} issue${createIssues.length === 1 ? "" : "s"}: ${createIssues.slice(0, 5).join(" ")}${createIssues.length > 5 ? ` (+${createIssues.length - 5} more)` : ""}` : ""),
                  },
            },
          }));
        } catch (err) {
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Couldn't read that file: " + err.message } },
          }));
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        // Prefer a sheet named to match (e.g. "Orders"); otherwise just use whatever's first —
        // a single-table tab attach doesn't need to follow the multi-sheet naming convention.
        const wsName = wb.Sheets[cfg.sheetName] ? cfg.sheetName : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) throw new Error("That file doesn't have a readable sheet.");
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
        const coerceFn = COERCE_FUNCTIONS[cfg.coerceKey];
        let coerced = coerceFn(rows, data);
        const skippedCount = rows.length - coerced.length;
        if (cfg.forceFields) coerced = coerced.map((r) => ({ ...r, ...cfg.forceFields }));

        const existingList = data[cfg.table] || [];
        if (viewKey === "fuel_prices") {
          // A fuel price should be unique per effective date — if the file's ID didn't round-trip
          // correctly (e.g. a hidden column got stripped when the file was edited), every row would
          // otherwise get a fresh generated ID and never match its existing record, piling up
          // duplicates on every re-attach instead of updating the one entry for that date.
          const existingByDate = new Map(existingList.map((r) => [r.effectiveDate, r]));
          coerced = coerced.map((row) => {
            const existingHasThisId = existingList.some((r) => r.id === row.id);
            if (existingHasThisId) return row; // ID already correctly matched a real record
            const dateMatch = existingByDate.get(row.effectiveDate);
            return dateMatch ? { ...row, id: dateMatch.id } : row;
          });
          // Also de-duplicate within the file itself — if two rows in the same upload share a
          // date (like the duplicate 02/01/2026 / 01/01/2026 / 31/12/2025 rows reported), keep
          // only the last one for that date rather than writing both.
          const seenDates = new Map();
          coerced.forEach((row) => { if (row.effectiveDate) seenDates.set(row.effectiveDate, row); });
          coerced = Array.from(seenDates.values());
        }

        const existingById = new Map(existingList.map((r) => [r.id, r]));
        const priorMeta = tabExcel[viewKey] || {};
        const priorEntries = priorMeta.snapshot || [];
        const alreadyTracked = new Set(priorEntries.map((en) => en.id));
        const tableSnapshot = [...priorEntries];
        const mergedList = [...existingList];
        let updatedCount = 0, addedCount = 0;

        coerced.forEach((row) => {
          const prev = existingById.get(row.id) || null;
          if (prev) updatedCount++; else addedCount++;
          if (!alreadyTracked.has(row.id)) tableSnapshot.push({ id: row.id, prev });
          const idx = mergedList.findIndex((r) => r.id === row.id);
          if (idx >= 0) mergedList[idx] = row; else mergedList.push(row);
        });

        const { error } = coerced.length ? await supabaseClient.from(cfg.table).upsert(coerced.map(toDbRow)) : { error: null };
        setDataState((prevData) => ({ ...prevData, [cfg.table]: mergedList }));
        setTabExcel((prev) => ({
          ...prev,
          [viewKey]: {
            attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
            message: error
              ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
              : { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"}.${skippedCount > 0 ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"} missing required data (e.g. a date).` : ""}` },
          },
        }));
      } catch (err) {
        setTabExcel((prev) => ({
          ...prev,
          [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." } },
        }));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleTabRevert(viewKey) {
    const cfg = TAB_EXCEL_CONFIG[viewKey];
    const meta = tabExcel[viewKey];
    if (!cfg || !meta || !meta.snapshot) {
      setTabExcel((prev) => ({ ...prev, [viewKey]: { attached: false, filename: null, snapshot: null } }));
      return;
    }
    setTabExcel((prev) => ({ ...prev, [viewKey]: { ...meta, busy: true } }));
    try {
      const list = [...(data[cfg.table] || [])];
      const writes = [];
      const deletes = [];
      meta.snapshot.forEach(({ id, prev }) => {
        const idx = list.findIndex((r) => r.id === id);
        if (prev) {
          if (idx >= 0) list[idx] = prev; else list.push(prev);
          writes.push(supabaseClient.from(cfg.table).upsert(toDbRow(prev)));
        } else {
          if (idx >= 0) list.splice(idx, 1);
          deletes.push(supabaseClient.from(cfg.table).delete().eq("id", id));
        }
      });
      await Promise.all([...writes, ...deletes]);
      setDataState((prevData) => ({ ...prevData, [cfg.table]: list }));
      setTabExcel((prev) => ({ ...prev, [viewKey]: { attached: false, filename: null, snapshot: null, message: { ok: true, text: "Reverted — back to how this tab was before that file was attached." } } }));
    } catch (err) {
      setTabExcel((prev) => ({ ...prev, [viewKey]: { ...meta, busy: false, message: { ok: false, text: "Couldn't fully revert: " + err.message } } }));
    }
  }

  const DOMESTIC_EXPORT_HEADERS_BASE = ["Container ID", "Sr.#", "Customer", "PO / SAP No.", "Movement Through", "Loading Date", "Vehicle No.", "Vehicle Size", "Loading Point", "Destination", "General Component (PKR)", "Fuel Adjustment (PKR)", "Full Freight (PKR)", "Transporter Name", "Invoice Number"];
  const DOMESTIC_EXPORT_HEADERS_WM = ["Container ID", "Sr.#", "Customer", "PO / SAP No.", "Movement Through", "Loading Date", "Vehicle No.", "Vehicle Size", "Sender", "Loading Point", "Destination", "General Component (PKR)", "Fuel Adjustment (PKR)", "Full Freight (PKR)", "Transporter Name", "Invoice Number"];

  function buildDomesticExportRow(sr, o, c, includeSender) {
    const cust = getCustomer(data, o.customerId);
    const sender = (data.senders || []).find((s) => s.id === o.senderId) || null;
    const matchedRate = matchContractRateAnyCustomer(o.customerId, o.origin, c, data.contracts, data.contract_groups);
    const fuelBaseRate = matchedRate && matchedRate.group ? xnum(matchedRate.group.fuelBaseRate, null) : null;
    const generalComponent = matchedRate ? xnum(matchedRate.rate) * 0.5 : null;
    const impliedLitres = (generalComponent !== null && fuelBaseRate) ? generalComponent / fuelBaseRate : null;
    const price = c.loadingDate ? fuelPriceOnDate(data.fuel_prices, c.loadingDate) : 0;
    const fuelAdjustment = (impliedLitres !== null && price) ? impliedLitres * price : null;
    const fullFreight = (generalComponent !== null && fuelAdjustment !== null) ? generalComponent + fuelAdjustment : null;
    const invoice = (data.invoices || []).find((inv) => inv.containerId === c.id);
    const noMatchNote = !matchedRate ? "No matching contract rate" : !fuelBaseRate ? "Contract has no Fuel Base Rate" : !price ? "No fuel price for loading date" : "";
    return [
      c.id, sr, cust ? (cust.shortName || cust.name) : "", c.poSapNo || "", c.movementThrough || "", c.loadingDate ? fmtDate(c.loadingDate) : "",
      c.vehiclePlate || "", c.vehicleSize || "",
      ...(includeSender ? [senderShortLabel(o, sender)] : []),
      o.origin || "", c.destination || "",
      generalComponent !== null ? generalComponent : noMatchNote,
      fuelAdjustment !== null ? fuelAdjustment : noMatchNote,
      fullFreight !== null ? fullFreight : noMatchNote,
      c.transporter || "", invoice ? invoice.invoiceNumber || "" : "",
    ];
  }

  async function handleTabExport(viewKey) {
    const cfg = TAB_EXCEL_CONFIG[viewKey];
    if (!cfg) return;
    if (viewKey === "orders_domestic") {
      // Domestic exports as two sheets (Finished Goods / Wrapping Materials, matching the
      // app's own page split) with the automatic contract-rate lookup and fuel-adjustment
      // calculation built in, same formula as the Fuel Management report and Contract Rates.
      // Uses the same hand-rolled OOXML writer as the master Transportation template — plain
      // SheetJS aoa_to_sheet in this environment doesn't actually apply cell styles (wrap
      // text, bold, etc.) on write, only that writer does.
      const domesticOrders = (data.orders || []).filter((o) => (o.shipmentType || "Import") === "Domestic");
      const hasDateFilter = !!(domesticExportFrom || domesticExportTo);
      function inExportRange(loadingDate) {
        if (!hasDateFilter) return true;
        if (!loadingDate) return false; // a range was requested - a shipment with no loading date can't be said to fall inside it
        if (domesticExportFrom && loadingDate < domesticExportFrom) return false;
        if (domesticExportTo && loadingDate > domesticExportTo) return false;
        return true;
      }
      function domesticSheetStyling(colCount, contentWrapCols, boldCols) {
        const headerNoWrap = new Set([1, 2, 6, 7, 8]); // Container ID, Sr.#, Loading Date, Vehicle No., Vehicle Size
        const headerWrap = new Set(Array.from({ length: colCount }, (_, i) => i + 1).filter((c) => !headerNoWrap.has(c)));
        const headerOverrides = buildColStyleMap(colCount, headerWrap, 5, 6);
        const contentDefault = buildColStyleMap(colCount, new Set(contentWrapCols), 9, 8);
        boldCols.forEach((col) => { contentDefault[col] = 22; });
        return { headerOverrides, contentDefault };
      }
      const fgStyling = domesticSheetStyling(15, [4, 9, 10, 14], [3, 11, 12, 13]);
      const wmStyling = domesticSheetStyling(16, [4, 9, 10, 11, 15], [3, 12, 13, 14]);
      const fgColWidths = colWidthsFor(DOMESTIC_EXPORT_HEADERS_BASE); fgColWidths[0] = 20; fgColWidths[1] = 6;
      const wmColWidths = colWidthsFor(DOMESTIC_EXPORT_HEADERS_WM); wmColWidths[0] = 20; wmColWidths[1] = 6;

      // Wrapping Materials and the new WM Domestic Karachi category both use the WM-style
      // layout (with the Sender column) per the request that the new tab match WM's layout;
      // Finished Goods keeps the original layout without Sender.
      const sheetNameForCategory = { [DOMESTIC_CATEGORIES[0]]: "Finished Goods", [DOMESTIC_CATEGORIES[1]]: "Wrapping Materials", [DOMESTIC_CATEGORIES[2]]: "WM Domestic Karachi" };
      const sheets = DOMESTIC_CATEGORIES.map((category) => {
        const hasSender = category !== DOMESTIC_CATEGORIES[0];
        const catOrders = domesticOrders.filter((o) => (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === category);
        const flat = flattenContainers(catOrders, () => true).filter(({ c }) => inExportRange(c.loadingDate));
        const dataRows = flat.map(({ o, c }, i) => buildDomesticExportRow(i + 1, o, c, hasSender));
        const rows = [hasSender ? DOMESTIC_EXPORT_HEADERS_WM : DOMESTIC_EXPORT_HEADERS_BASE, ...dataRows];
        const styling = hasSender ? wmStyling : fgStyling;
        return {
          name: sheetNameForCategory[category],
          rows, headerRowIndex: 1, colWidths: hasSender ? wmColWidths : fgColWidths, freezeRows: 1,
          headerOverrides: styling.headerOverrides, contentDefaultCols: styling.contentDefault,
          hiddenCols: [1], // Container ID — needed for Attach to match rows back correctly, not meant to be seen
        };
      });

      try {
        const buffer = await buildXlsxBuffer(sheets);
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const rangeLabel = hasDateFilter ? `-${domesticExportFrom || "start"}-to-${domesticExportTo || "end"}` : "";
        a.href = url; a.download = `Domestic-Orders${rangeLabel}-${todayISO()}.xlsx`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        window.alert("Couldn't build the domestic orders export: " + err.message);
      }
      return;
    }
    const allRows = data[cfg.table] || [];
    let rows = cfg.filterFn ? allRows.filter(cfg.filterFn) : allRows;
    if (cfg.sheetName === "Orders") {
      rows = rows.map((o) => ({
        ...o,
        customerName: (getCustomer(data, o.customerId) || {}).shortName || (getCustomer(data, o.customerId) || {}).name || "",
        senderName: ((data.senders || []).find((s) => s.id === o.senderId) || {}).name || "",
      }));
    }
    const schema = SHEET_SCHEMAS[cfg.sheetName] || (rows[0] ? Object.keys(rows[0]) : []);
    const wb = XLSX.utils.book_new();
    const ws = buildSheet(rows, schema, cfg.displayHeaders, cfg.sheetName);
    if (cfg.sheetName === "Orders") {
      const descIdx = schema.indexOf("description");
      if (descIdx >= 0 && ws["!cols"] && ws["!cols"][descIdx] && ws["!cols"][descIdx].wch < 40) ws["!cols"][descIdx].wch = 40;
    }
    XLSX.utils.book_append_sheet(wb, ws, cfg.sheetName);
    XLSX.writeFile(wb, `${cfg.label.replace(/\s+/g, "-")}-${todayISO()}.xlsx`);
  }

  function handleSwapAttach(customerId, file) {
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: true, message: null } }));
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        const wsName = wb.Sheets["Fuel Card Swaps"] ? "Fuel Card Swaps" : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) throw new Error("That file doesn't have a readable sheet.");
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });

        const existingList = data.fuel_card_swaps || [];
        const existingById = new Map(existingList.map((r) => [r.id, r]));
        const priorMeta = swapExcel[customerId] || {};
        const priorEntries = priorMeta.snapshot || [];
        const alreadyTracked = new Set(priorEntries.map((en) => en.id));
        const tableSnapshot = [...priorEntries];
        const mergedList = [...existingList];
        let updatedCount = 0, addedCount = 0, skippedCount = 0;
        const toWrite = [];

        rows.forEach((row) => {
          const swapId = xstr(readAnyKey(row, ["Swap ID", "swap id", "id"])).trim();
          const department = xstr(readAnyKey(row, ["Department"])).trim();
          const swappedBy = xstr(readAnyKey(row, ["Swapped By"])).trim();
          const cardNumber = xstr(readAnyKey(row, ["Card No.", "Card No"])).trim();
          const swapDate = normalizeDateStr(readAnyKey(row, ["Swap Date"]));
          const qtyLtr = xnum(readAnyKey(row, ["Qty (Ltr)", "Qty Ltr"]), "");
          const amountPkr = xnum(readAnyKey(row, ["Amount (PKR)", "Amount in PKR"]), "");
          if (!cardNumber && !department && !swapDate) return; // blank row
          if (!swapDate || !cardNumber) { skippedCount++; return; } // required fields missing

          const id = swapId && existingById.has(swapId) ? swapId : genUUID();
          const record = { id, customerId, swapDate, department, swappedBy, cardNumber, qtyLtr, amountPkr };
          const prev = existingById.get(id) || null;
          if (prev) updatedCount++; else addedCount++;
          if (!alreadyTracked.has(id)) tableSnapshot.push({ id, prev });
          const idx = mergedList.findIndex((r) => r.id === id);
          if (idx >= 0) mergedList[idx] = record; else mergedList.push(record);
          toWrite.push(record);
        });

        const { error } = toWrite.length ? await supabaseClient.from("fuel_card_swaps").upsert(toWrite.map(toDbRow)) : { error: null };
        setDataState((prevData) => ({ ...prevData, fuel_card_swaps: mergedList }));
        setSwapExcel((prev) => ({
          ...prev,
          [customerId]: {
            attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
            message: error
              ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
              : { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"}.${skippedCount > 0 ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"} missing Swap Date or Card No.` : ""}` },
          },
        }));
      } catch (err) {
        setSwapExcel((prev) => ({
          ...prev,
          [customerId]: { ...(prev[customerId] || {}), busy: false, message: { ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." } },
        }));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleSwapRevert(customerId) {
    const meta = swapExcel[customerId];
    if (!meta || !meta.snapshot) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { attached: false, filename: null, snapshot: null } }));
      return;
    }
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...meta, busy: true } }));
    try {
      const list = [...(data.fuel_card_swaps || [])];
      const writes = [];
      const deletes = [];
      meta.snapshot.forEach(({ id, prev }) => {
        const idx = list.findIndex((r) => r.id === id);
        if (prev) {
          if (idx >= 0) list[idx] = prev; else list.push(prev);
          writes.push(supabaseClient.from("fuel_card_swaps").upsert(toDbRow(prev)));
        } else {
          if (idx >= 0) list.splice(idx, 1);
          deletes.push(supabaseClient.from("fuel_card_swaps").delete().eq("id", id));
        }
      });
      await Promise.all([...writes, ...deletes]);
      setDataState((prevData) => ({ ...prevData, fuel_card_swaps: list }));
      setSwapExcel((prev) => ({ ...prev, [customerId]: { attached: false, filename: null, snapshot: null, message: { ok: true, text: "Reverted — back to how the swaps list was before that file was attached." } } }));
    } catch (err) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { ...meta, busy: false, message: { ok: false, text: "Couldn't fully revert: " + err.message } } }));
    }
  }

  // Recomputes every existing swap's Amount (PKR) using the Fuel Price tab's currently
  // selected period mode, without opening and re-saving each one individually. Reuses the
  // same snapshot slot as Attach, so the existing Revert button can undo this too.
  async function handleSwapRecalculate(customerId, fuelPriceMode) {
    setConfirm(null);
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: true, message: null } }));
    try {
      const existingList = data.fuel_card_swaps || [];
      const customerSwaps = existingList.filter((s) => s.customerId === customerId);
      const priorMeta = swapExcel[customerId] || {};
      const priorEntries = priorMeta.snapshot || [];
      const alreadyTracked = new Set(priorEntries.map((en) => en.id));
      const tableSnapshot = [...priorEntries];
      let list = [...existingList];
      const toWrite = [];
      let changedCount = 0, unchangedCount = 0;

      customerSwaps.forEach((s) => {
        const newPrice = resolveEffectiveFuelPrice(data.fuel_prices, s.swapDate, fuelPriceMode);
        const newAmount = newPrice && s.qtyLtr !== "" && s.qtyLtr !== null && s.qtyLtr !== undefined ? Number(s.qtyLtr) * newPrice : s.amountPkr;
        if (Math.abs((xnum(newAmount) || 0) - (xnum(s.amountPkr) || 0)) < 0.005) { unchangedCount++; return; }
        if (!alreadyTracked.has(s.id)) tableSnapshot.push({ id: s.id, prev: s });
        const updated = { ...s, amountPkr: newAmount };
        const idx = list.findIndex((r) => r.id === s.id);
        if (idx >= 0) list[idx] = updated;
        toWrite.push(updated);
        changedCount++;
      });

      const { error } = toWrite.length ? await supabaseClient.from("fuel_card_swaps").upsert(toWrite.map(toDbRow)) : { error: null };
      setDataState((prevData) => ({ ...prevData, fuel_card_swaps: list }));
      setSwapExcel((prev) => ({
        ...prev,
        [customerId]: {
          attached: true, filename: prev[customerId] && prev[customerId].filename, snapshot: tableSnapshot, busy: false,
          message: error
            ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
            : { ok: true, text: `Recalculated ${changedCount} entr${changedCount === 1 ? "y" : "ies"}${unchangedCount > 0 ? `, ${unchangedCount} already matched` : ""}. Use Revert to undo.` },
        },
      }));
    } catch (err) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: false, message: { ok: false, text: "Couldn't recalculate: " + err.message } } }));
    }
  }

  function handleDownloadExcel() {
    const wb = buildWorkbook(data);
    const name = excelMeta.filename ? excelMeta.filename.replace(/\.xlsx?$/i, "") + "-updated.xlsx" : "logistix-data.xlsx";
    XLSX.writeFile(wb, name);
  }

  async function handleExportTemplate() {
    setExcelBusy(true);
    try {
      const buffer = await buildTemplateWorkbook(data);
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const today = todayISO();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `Transportation-${today}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      window.alert("Couldn't build the template export: " + err.message);
    } finally {
      setExcelBusy(false);
    }
  }

  function handleOpenFleetLink() {
    if (fleetUrl) { window.open(fleetUrl, "_blank"); return; }
    const url = window.prompt("Paste the hosted URL of your Haulogic Fleet & Drivers app:");
    if (url) {
      setFleetUrl(url);
      try { localStorage.setItem(FLEET_LINK_KEY, url); } catch (e) { /* ignore */ }
      window.open(url, "_blank");
    }
  }

  function handleEditFleetLink() {
    const url = window.prompt("Haulogic Fleet & Drivers app URL:", fleetUrl || "");
    if (url !== null) {
      setFleetUrl(url);
      try { localStorage.setItem(FLEET_LINK_KEY, url); } catch (e) { /* ignore */ }
    }
  }

  // ---- Render ----

  if (typeof window !== "undefined" && window.location.hash.startsWith("#track")) {
    return <PublicTrackingPage />;
  }

  if (authSession === undefined) {
    return (
      <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center">
        <div className="w-8 h-8 rounded-full border-4 border-slate-800 border-t-blue-500 animate-spin" />
      </div>
    );
  }

  if (!authSession) {
    if (!showAuth) return <LandingPage onSignIn={() => setShowAuth(true)} />;
    return <AuthScreen onLogin={handleLogin} busy={authBusy} error={authError} onBack={() => setShowAuth(false)} />;
  }

  if (dataLoading || !data || !profile) {
    return (
      <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center">
        <div className="flex flex-col items-center gap-3">
          <div className="w-10 h-10 rounded-full border-4 border-slate-800 border-t-blue-500 animate-spin" />
          <div className="text-slate-500 text-sm">Loading Logistix...</div>
        </div>
      </div>
    );
  }

  const isAdmin = viewSession.role !== "customer";
  const canSwitchView = profile.role === "admin" || profile.role === "staff";

  return (
    <div className={cx("min-h-screen w-full bg-slate-950 flex text-slate-200", theme === "light" && "light-theme")}>
      <style>{`.table-scroll { scrollbar-width: none; -ms-overflow-style: none; } .table-scroll::-webkit-scrollbar { display: none; }`}</style>
      <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={handleAttachFile} style={{ display: "none" }} />
      <Sidebar
        view={view} setView={setView}
        session={viewSession} setSession={setViewSession} canSwitchView={canSwitchView}
        customers={data.customers} profile={profile} onLogout={handleLogout}
        excelMeta={excelMeta} onAttachClick={handleAttachClick} onDetach={handleDetach}
        onDownloadExcel={handleDownloadExcel} importMsg={importMsg} excelBusy={excelBusy}
        onOpenFleetLink={handleOpenFleetLink} onEditFleetLink={handleEditFleetLink} fleetUrl={fleetUrl}
        theme={theme} onToggleTheme={toggleTheme}
        mobileOpen={mobileNavOpen} onCloseMobileNav={() => setMobileNavOpen(false)}
      />
      <div className="flex-1 min-w-0 flex flex-col">
        <TopBar title={isAdmin ? VIEW_TITLES[view] : "My Orders"} onExportTemplate={handleExportTemplate} onOpenMobileNav={() => setMobileNavOpen(true)} excelBusy={excelBusy} />
        <div className="p-4 sm:p-6" key={isAdmin ? view : "portal"}>
          <div className="animate-fade-in-up">
          {!isAdmin ? (
            <CustomerPortal data={data} customerId={viewSession.customerId} />
          ) : (
            <>
              {TAB_EXCEL_CONFIG[view] && (
                <div className="mb-4">
                  <TabExcelBar
                    label={TAB_EXCEL_CONFIG[view].label}
                    meta={tabExcel[view]}
                    onAttachFile={(file) => handleTabAttachFile(view, file)}
                    onExport={() => handleTabExport(view)}
                    onRevert={() => handleTabRevert(view)}
                  />
                  {view === "orders_domestic" && (
                    <div className="flex items-end gap-3 flex-wrap mt-3">
                      <Field label="Loading Date From (optional)">
                        <input type="date" className={inputCls} style={{ width: 170 }} value={domesticExportFrom} onChange={(e) => setDomesticExportFrom(e.target.value)} />
                      </Field>
                      <Field label="Loading Date To (optional)">
                        <input type="date" className={inputCls} style={{ width: 170 }} value={domesticExportTo} onChange={(e) => setDomesticExportTo(e.target.value)} />
                      </Field>
                      {(domesticExportFrom || domesticExportTo) && (
                        <button className={btnSecondary} onClick={() => { setDomesticExportFrom(""); setDomesticExportTo(""); }}>Clear Dates</button>
                      )}
                    </div>
                  )}
                </div>
              )}
              {view === "dashboard" && <Dashboard data={data} />}
              {view === "orders_domestic" && <OrdersView data={data} openModal={setModal} askDelete={setConfirm} shipmentType="Domestic" role={viewSession.role} />}
              {view === "orders_import" && <OrdersView data={data} openModal={setModal} askDelete={setConfirm} shipmentType="Import" role={viewSession.role} />}
              {view === "orders_export" && <OrdersView data={data} openModal={setModal} askDelete={setConfirm} shipmentType="Export" role={viewSession.role} />}
              {view === "tracking_import" && <TrackingView data={data} updateContainerStage={updateContainerStage} updateContainerFields={updateContainerFields} role={viewSession.role} shipmentTypeFilter="Import" />}
              {view === "tracking_domestic" && <TrackingView data={data} updateContainerStage={updateContainerStage} updateContainerFields={updateContainerFields} role={viewSession.role} shipmentTypeFilter="Domestic" />}
              {view === "tracking_export" && <TrackingView data={data} updateContainerStage={updateContainerStage} updateContainerFields={updateContainerFields} role={viewSession.role} shipmentTypeFilter="Export" />}
              {view === "contracts" && (
                <ContractsView
                  data={data} openModal={setModal} askDelete={setConfirm} role={viewSession.role}
                  contractExcel={contractExcel}
                  onContractRatesExport={handleContractRatesExport}
                  onContractRatesAttach={handleContractRatesAttach}
                  onContractRatesRevert={handleContractRatesRevert}
                />
              )}
              {view === "invoices" && <InvoicesView data={data} openModal={setModal} askDelete={setConfirm} />}
              {view === "fuel_management" && (
                <FuelManagementView
                  data={data} openModal={setModal} askDelete={setConfirm}
                  fuelPriceExcel={tabExcel.fuel_prices}
                  onFuelPriceAttach={(file) => handleTabAttachFile("fuel_prices", file)}
                  onFuelPriceExport={() => handleTabExport("fuel_prices")}
                  onFuelPriceRevert={() => handleTabRevert("fuel_prices")}
                  swapExcel={swapExcel} onSwapAttach={handleSwapAttach} onSwapExport={handleSwapExport} onSwapRevert={handleSwapRevert} onSwapRecalculate={handleSwapRecalculate}
                />
              )}
              {view === "customers" && <CustomersView data={data} openModal={setModal} askDelete={setConfirm} />}
              {view === "senders" && <SendersView data={data} openModal={setModal} askDelete={setConfirm} />}
              {view === "transporters" && <TransportersView data={data} openModal={setModal} askDelete={setConfirm} />}
              {view === "analytics" && <AnalyticsView data={data} />}
              {view === "bill_checker" && <TransporterBillsView data={data} updateContainerFields={updateContainerFields} />}
              {view === "activity_log" && viewSession.role === "admin" && <ActivityLogView data={data} />}
              {view === "order_history" && viewSession.role === "admin" && <OrderHistoryView data={data} openModal={setModal} />}
              {view === "users" && viewSession.role === "admin" && <ManageUsersView />}
            </>
          )}
          </div>
        </div>
      </div>

      {modal && <EntityModal modal={modal} data={data} onClose={() => setModal(null)} onSave={saveItem} role={viewSession.role} />}
      {confirm && (
        <ConfirmModal
          title={confirm.title || (Array.isArray(confirm.id) ? `Delete ${confirm.id.length} ${confirm.label}${confirm.id.length === 1 ? "" : "s"}?` : `Delete this ${confirm.label}?`)}
          message={confirm.message || "This action can't be undone."}
          confirmLabel={confirm.confirmLabel}
          danger={confirm.danger !== undefined ? confirm.danger : true}
          onCancel={() => setConfirm(null)}
          onConfirm={() => confirm.onConfirmAction ? confirm.onConfirmAction() : deleteItem(confirm.entity, confirm.id)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LogistixERP />);
</script>
</body>
</html>
