function createLiteClient(url, anonKey) {
  const AUTH = url + "/auth/v1";
  const REST = url + "/rest/v1";
  const STORE_KEY = "sb-lite-session";
  let session = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) session = JSON.parse(raw); } catch (e) {}
  let listeners = [];

  function persistSession(s) {
    session = s;
    try { if (s) localStorage.setItem(STORE_KEY, JSON.stringify(s)); else localStorage.removeItem(STORE_KEY); } catch (e) {}
    listeners.forEach((fn) => fn(s ? "SIGNED_IN" : "SIGNED_OUT", s));
  }

  async function authFetch(path, opts) {
    opts = opts || {};
    const res = await fetch(AUTH + path, { ...opts, headers: { "Content-Type": "application/json", apikey: anonKey, ...(opts.headers || {}) } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) return { data: null, error: { message: json.error_description || json.msg || json.error || res.statusText } };
    return { data: json, error: null };
  }

  async function refreshIfNeeded() {
    if (!session) return;
    if (session.expires_at && Date.now() / 1000 < session.expires_at - 30) return;
    if (!session.refresh_token) { persistSession(null); return; }
    const { data, error } = await authFetch("/token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (error) { persistSession(null); return; }
    persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
  }

  const auth = {
    async getSession() { await refreshIfNeeded(); return { data: { session } }; },
    onAuthStateChange(cb) {
      listeners.push(cb);
      return { data: { subscription: { unsubscribe() { listeners = listeners.filter((f) => f !== cb); } } } };
    },
    async signInWithPassword({ email, password }) {
      const { data, error } = await authFetch("/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) });
      if (error) return { error };
      persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
      return { error: null };
    },
    async signUp({ email, password, options }) {
      const { data, error } = await authFetch("/signup", { method: "POST", body: JSON.stringify({ email, password, data: options && options.data }) });
      if (error) return { error };
      if (data.access_token) persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
      return { error: null };
    },
    async signInWithOAuth({ provider, options }) {
      const redirectTo = (options && options.redirectTo) || window.location.href.split('#')[0].split('?')[0];
      const scopes = options && options.scopes ? `&scopes=${encodeURIComponent(options.scopes)}` : "";
      window.location.href = `${AUTH}/authorize?provider=${encodeURIComponent(provider)}&redirect_to=${encodeURIComponent(redirectTo)}${scopes}`;
      return { error: null };
    },
    async signOut() { persistSession(null); return { error: null }; },
  };

  // Complete OAuth redirect: Supabase returns tokens in the URL hash.
  (function handleOAuthRedirect() {
    if (typeof window === "undefined" || !window.location.hash) return;
    const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
    const params = new URLSearchParams(hash);
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    if (!access_token) return;
    const expires_in = parseInt(params.get("expires_in") || "3600", 10);
    fetch(AUTH + "/user", { headers: { apikey: anonKey, Authorization: "Bearer " + access_token } })
      .then((r) => r.json())
      .then((user) => {
        persistSession({ access_token, refresh_token, user, expires_at: Date.now() / 1000 + expires_in });
        history.replaceState(null, "", window.location.pathname + window.location.search);
      })
      .catch(() => {});
  })();

  async function headersFor(extra) {
    await refreshIfNeeded(); // keeps the access token from silently going stale mid-session
    const h = { apikey: anonKey, "Content-Type": "application/json", Authorization: "Bearer " + (session && session.access_token ? session.access_token : anonKey), ...(extra || {}) };
    return h;
  }

  function from(table) {
    return {
      select(cols) {
        let query = `${REST}/${table}?select=${encodeURIComponent(cols || "*")}`;
        const builder = {
          eq(col, val) { query += `&${col}=eq.${encodeURIComponent(val)}`; return builder; },
          order(col, opts) { query += `&order=${col}.${opts && opts.ascending === false ? "desc" : "asc"}`; return builder; },
          async maybeSingle() {
            const res = await fetch(query, { headers: await headersFor() });
            const json = await res.json().catch(() => []);
            if (!res.ok) return { data: null, error: { message: (json && json.message) || res.statusText } };
            return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
          },
          then(resolve, reject) {
            return headersFor()
              .then((headers) => fetch(query, { headers }))
              .then(async (res) => {
                const json = await res.json().catch(() => []);
                if (!res.ok) return resolve({ data: null, error: { message: (json && json.message) || res.statusText } });
                resolve({ data: json, error: null });
              })
              .catch(reject);
          },
        };
        return builder;
      },
      async upsert(rows) {
        const body = Array.isArray(rows) ? rows : [rows];
        const res = await fetch(`${REST}/${table}`, { method: "POST", headers: await headersFor({ Prefer: "resolution=merge-duplicates,return=minimal" }), body: JSON.stringify(body) });
        if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
        return { error: null };
      },
      update(fields) {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "PATCH", headers: await headersFor({ Prefer: "return=minimal" }), body: JSON.stringify(fields) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
      delete() {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "DELETE", headers: await headersFor({ Prefer: "return=minimal" }) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
          async in(col, vals) {
            const list = (vals || []).map((v) => encodeURIComponent(v)).join(",");
            const res = await fetch(`${REST}/${table}?${col}=in.(${list})`, { method: "DELETE", headers: await headersFor({ Prefer: "return=minimal" }) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
    };
  }

  return { auth, from };
}

// Generic camelCase <-> snake_case conversion so every entity's field names
// line up with the Postgres columns without hand-writing per-table maps.
function camelToSnake(s) { return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase()); }
function snakeToCamel(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }

function toDbRow(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    out[camelToSnake(k)] = v === "" ? null : v; // empty string -> null (matters for FK columns)
  });
  return out;
}
function fromDbRow(row) {
  const out = {};
  Object.keys(row).forEach((k) => {
    const v = row[k];
    out[snakeToCamel(k)] = v === null ? "" : v; // null -> "" so existing form/view code (which expects "") keeps working
  });
  return out;
}

function ChargesEditor({ charges, onChange }) {
  const [adding, setAdding] = useState(false);
  const [pickType, setPickType] = useState("");
  const list = Array.isArray(charges) ? charges : [];
  const availableTypes = CHARGE_TYPES.filter((t) => !list.some((c) => c.type === t));

  function startAdd() {
    setPickType(availableTypes[0] || "");
    setAdding(true);
  }
  function confirmAdd() {
    if (!pickType) return;
    onChange([...list, { id: uid("chg"), type: pickType, amount: "" }]);
    setAdding(false);
  }
  function removeCharge(id) {
    onChange(list.filter((c) => c.id !== id));
  }
  function setChargeAmount(id, amount) {
    onChange(list.map((c) => (c.id === id ? { ...c, amount } : c)));
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <label className="text-slate-500 text-xs font-medium">Charges</label>
        {availableTypes.length > 0 && !adding && (
          <button type="button" onClick={startAdd} className="text-blue-400 hover:text-blue-300 text-xs font-medium flex items-center gap-1">
            <Plus size={12} /> Add Charge
          </button>
        )}
      </div>
      {adding && (
        <div className="flex items-center gap-2 mb-2 bg-slate-900/50 border border-slate-800 rounded-lg p-2">
          <select className={inputCls} value={pickType} onChange={(e) => setPickType(e.target.value)}>
            {availableTypes.map((t) => <option key={t} value={t}>{t}</option>)}

          <button type="button" onClick={confirmAdd} className="text-emerald-400 hover:text-emerald-300 p-1.5 shrink-0"><CheckCircle2 size={16} /></button>
          <button type="button" onClick={() => setAdding(false)} className="text-slate-500 hover:text-white p-1.5 shrink-0"><X size={16} /></button>
        </div>
      )}
      <div className="space-y-2">
        {list.map((c) => (
          <div key={c.id} className="flex items-center gap-2 bg-slate-900/50 border border-slate-800 rounded-lg p-2">
            <span className="text-slate-300 text-xs flex-1">{c.type}</span>

  );

/* ==================== Helpers ==================== */

function cx(...args) { return args.filter(Boolean).join(" "); }

function uid(prefix) { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
// Some Supabase tables (e.g. contracts) have a real `uuid`-typed id column rather than
// text, so they need an actual RFC4122 UUID — uid()'s "prefix_xxxx" strings get rejected
// with "invalid input syntax for type uuid".
function genUUID() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function randToken(len) {
  const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let s = "";
  for (let i = 0; i < len; i++) s += charset[Math.floor(Math.random() * charset.length)];
  return s;
}

function genOrderNumber() { return `ORD-${randToken(8)}-${randToken(3)}`; }
function genBiltyNumber() { return `BLT-${randToken(6).toUpperCase()}`; }
function genInvoiceNumber() { return `INV-${new Date().getFullYear()}-${randToken(4)}`; }

function formatPKR(n) {
  const num = Number(n) || 0;
  return "Rs " + num.toLocaleString("en-US");
}

function todayISO() { return toLocalDateStr(new Date()); }

function addDaysISO(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return toLocalDateStr(d);
}

// One fixed date format everywhere on the site: DD/MM/YYYY. Previously most of the app used
// this, but a handful of timestamp displays fell back to the browser's own locale (toLocaleDateString/
// toLocaleString with no fixed format), which on a different browser could silently render as
// MM/DD/YYYY instead — same date, different-looking order. fmtDate/fmtDateTime are now the only
// two date-formatting functions used anywhere in the UI, so every page reads the same way regardless
// of the viewer's browser settings.
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return "—";
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return "—";
  const datePart = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
  const timePart = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  return `${datePart} ${timePart}`;
}
const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function fmtMonthYear(v) {
  const d = v instanceof Date ? v : new Date(v);
  if (isNaN(d)) return "—";
  return `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Couldn't read that image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

// Images get resized/compressed; PDFs are read as-is (can't be safely
// re-encoded client-side) — both end up as data URLs either way.
function fileToAttachmentDataUrl(file, maxDim, quality) {
  if (file.type === "application/pdf") return readFileAsDataUrl(file);
  return resizeImageToDataUrl(file, maxDim, quality);
}

function isPdfDataUrl(url) {
  return typeof url === "string" && url.startsWith("data:application/pdf");
}

// Renders an uploaded photo/PDF with a real download affordance either way — previously
// only PDFs had a download link; image files just rendered inline with no way to save
// them off to share (e.g. to a WhatsApp group).
function AttachmentPreview({ dataUrl, alt, downloadName }) {
  if (!dataUrl) return null;
  if (isPdfDataUrl(dataUrl)) {
    return (
      <a href={dataUrl} download={downloadName || "document.pdf"} className="flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2">
        <FileText size={16} /> PDF attached — click to download
      </a>
    );
  }
  return (
    <div className="space-y-1.5">
      <img src={dataUrl} alt={alt || "Attachment"} className="rounded-lg border border-slate-800 max-h-48" />
      <a href={dataUrl} download={downloadName || "photo.jpg"} className={cx(btnSecondary, "inline-flex items-center gap-1.5 text-xs")}>
        <Download size={13} /> Download
      </a>
    </div>
  );
}

const FIELD_LABELS = {
  driverName: "Driver", vehiclePlate: "Vehicle No.", transporter: "Transporter", freightAmount: "Freight Amount", fuelAmount: "Fuel Amount",
  transporterBillDate: "Transporter Bill Date", transporterBillNo: "Transporter Bill No.", billAmountApproved: "Bill Amount Approved",
  charges: "Charges", containerType: "Container Type", containerSize: "Container Size", qtyLabel: "Qty",
  emptyReturnLocation: "Empty Return Location", emptyReturnDate: "Empty Return Date", emptyReturnTime: "Empty Return Time",
  emptyReturnDescription: "Empty Return Notes", amount: "Amount", weight: "Weight", priority: "Priority", destination: "Destination", shifting: "Shifting",
  shiftedContainerNo: "Shifted Container No.", shiftEmptyReturnDate: "Shift Empty Return Date",
  poSapNo: "PO / SAP No.", movementThrough: "Movement Through", loadingDate: "Loading Date", vehicleSize: "Vehicle Size", supplier: "Supplier",
};
function describeFieldChange(fields) {
  const keys = Object.keys(fields || {});
  if (keys.length === 0) return "";
  const parts = keys.map((k) => {
    const label = FIELD_LABELS[k] || k;
    if (k === "charges") return "updated charges";
    const val = fields[k];
    if (val === "" || val === null || val === undefined) return `cleared ${label}`;
    return `set ${label} to "${val}"`;
  });
  return "Updated: " + parts.join(", ");
}

// Combines the separate Container Type + Size fields for display; falls back
// to the old combined qtyLabel field for containers created before the split.
function containerSizeTypeLabel(c) {
  const parts = [c.containerSize, c.containerType].filter(Boolean);
  if (parts.length) return parts.join(" ");
  return c.qtyLabel || "";
}

function emptyContainer() {
  return {
    id: uid("cnt"), containerNumber: "", sealNumber: "", qtyLabel: "", containerType: "", containerSize: "",
    driverName: "", vehiclePlate: "", priority: "Normal", stageIndex: 0, cancelled: false, deliveredDate: null,
    amount: "", transporter: "", freightAmount: "", fuelAmount: "", emptyReturnLocation: "", emptyReturnDate: "", emptyReturnTime: "", emptyReturnDescription: "", shifting: "", shiftedContainerNo: "", shiftEmptyReturnDate: "",
    biltyNumber: genBiltyNumber(),
    destination: "", receiverAddressId: "", receiverAddressCustom: "", weight: "",
    dispatchPhoto: "", dispatchNotes: "", dispatchAt: "", dispatchedBy: "",
    podPhoto: "", podNotes: "", podArrivalAt: "", podOffloadingAt: "", podReceivedBy: "",
    transporterBillDate: "", transporterBillNo: "", billAmountApproved: "", charges: [],
    // Domestic Finished Goods / Wrapping Materials fields
    poSapNo: "", movementThrough: "", loadingDate: "", vehicleSize: "", supplier: "",
    history: [{ id: uid("evt"), message: "Container created and pending confirmation", at: new Date().toISOString(), location: "" }],
  };
}
function resolveReceiverAddress(container, customer) {
  if (container.receiverAddressId) {
    const match = ((customer && customer.deliveryAddresses) || []).find((a) => a.id === container.receiverAddressId);
    if (match) return match.address;
  }
  return container.receiverAddressCustom || "";
}
function receiverAddressShortLabel(container, customer) {
  if (container.receiverAddressId) {
    const match = ((customer && customer.deliveryAddresses) || []).find((a) => a.id === container.receiverAddressId);
    if (match) return match.label || match.address;
  }
  return container.receiverAddressCustom || "";
}

function orderStatus(o) {
  if (o.cancelled) return "Cancelled";
  if (o.stageIndex >= 4) return "Completed";
  if (o.stageIndex >= 3) return "Delivered";
  if (o.stageIndex <= 0) return "Confirmed";
  return "In Transit";
}

function containerStatus(c, shipmentType) {
  if (c.cancelled) return "Cancelled";
  const si = c.stageIndex ?? 0;
  if (shipmentType === "Domestic") {
    if (si >= 4) return "Delivered";
    if (si === 3) return "Under Offloading";
    if (si === 2) return "In Transit";
    if (si === 1) return "Picked Up";
    return "Confirmed";
  }
  if (shipmentType === "Import") {
    if (si >= 5) return "Completed";
    if (si === 4) return "Delivered";
    if (si === 3) return "Under Offloading";
    if (si === 2) return "In Transit";
    if (si === 1) return "Picked Up";
    return "Confirmed";
  }
  // Export — unchanged 4-stage flow, no Under Offloading, no Completed.
  if (si >= 3) return "Delivered";
  if (si === 2) return "In Transit";
  if (si === 1) return "Picked Up";
  return "Confirmed";
}

// True once a container has actually been delivered — whether or not its Import-only
// empty-return "Completed" step has happened yet. Use this (not a straight "Delivered"
// equality check) anywhere delivery itself is what matters, e.g. invoicing eligibility
// or delivery-count stats, so those don't wrongly shrink once an order completes.
// Needs shipmentType passed in — Domestic's stage 3 and Import's stage 3 are both "Under
// Offloading", not delivered yet; Export's stage 3 (unchanged, no Under Offloading) is.
function isDeliveredOrCompleted(c, shipmentType) {
  if (c.cancelled) return false;
  const deliveredAt = (shipmentType === "Domestic" || shipmentType === "Import") ? 4 : 3;
  return (c.stageIndex ?? 0) >= deliveredAt;
}

// Import-only: once a container is Delivered it's "In Process" for empty return,
// and becomes "Received" the moment it's advanced to Completed (i.e. once an empty
// return date has actually been logged by the Empty Return Receiver). Not applicable
// before Delivered, or for Domestic/Export shipments, which never reach Completed.
// Finds the fuel price (PKR/liter) in effect on a given date — the most recent price
// entry whose effective date is on or before it. Fuel prices are company-wide (not
// per-customer), so this looks across the whole list regardless of which customer's
// screen it's being calculated for. Returns 0 if no price has been recorded yet for
// that period.
// The order only stores the sender's full address text, not which of the sender's saved
// addresses it came from — this looks that address back up on the sender to recover its
// short label (e.g. "HQ", "Lahore Warehouse"), falling back to the sender's name if no
// matching labeled address is found.
function senderShortLabel(order, sender) {
  if (sender && Array.isArray(sender.addresses)) {
    const match = sender.addresses.find((a) => a.address === order.senderAddress);
    if (match && match.label) return match.label;
  }
  return sender ? sender.name : "";
}

function fuelPriceOnDate(fuelPrices, dateISO) {
  if (!dateISO) return 0;
  let best = null;
  (fuelPrices || []).forEach((p) => {
    if (p.effectiveDate && p.effectiveDate <= dateISO && (!best || p.effectiveDate > best.effectiveDate)) best = p;
  });
  return best ? Number(best.pricePerLiter) || 0 : 0;
}

// Applies the Fuel Price tab's period mode to resolve which fuel price actually applies to a
// given date, used by the Consumption/Export calculations instead of a straight per-date lookup.
// - daily: unchanged, the price on file as of that exact date.
// - fortnightly: dates in the 1st-15th use the price as of the 1st of that month; dates in the
//   16th-end use the price as of the 16th.
// - monthly: every date in the month uses the price as of the 1st of that month.
function resolveEffectiveFuelPrice(fuelPrices, dateISO, mode) {
  if (!dateISO) return 0;
  if (!mode || mode === "daily") return fuelPriceOnDate(fuelPrices, dateISO);
  const day = Number(dateISO.slice(8, 10));
  const yearMonth = dateISO.slice(0, 7);
  if (mode === "monthly") {
    return fuelPriceOnDate(fuelPrices, `${yearMonth}-01`);
  }
  if (mode === "fortnightly") {
    return day <= 15 ? fuelPriceOnDate(fuelPrices, `${yearMonth}-01`) : fuelPriceOnDate(fuelPrices, `${yearMonth}-16`);
  }
  return fuelPriceOnDate(fuelPrices, dateISO);
}

// Finds the contract rate matching a shipment's customer, Loading Point, Destination,
// Vehicle Size, and Movement Through, across ALL customers at once — used by exports that
// cover multiple customers together. Same match criteria (and same Axle Load Category
// limitation — no such field exists on any order/container) as the per-customer version
// used in the Fuel Management report; kept as a separate function since that one is scoped
// to a single customer's already-filtered rates and isn't worth risking a refactor of.
// Takes origin explicitly rather than reading c.origin — origin (Loading Point) lives on
// the order, not the container, and callers don't consistently merge it onto the container
// object, so reading c.origin directly silently matched nothing.
function matchContractRateAnyCustomer(customerId, origin, c, allContracts, allGroups) {
  const norm = (v) => (v || "").trim().toLowerCase();
  const loadingPoint = norm(origin);
  const destination = norm(c.destination);
  const vehicleSize = norm(c.vehicleSize || c.containerSize);
  const movementThrough = norm(c.movementThrough);
  const match = (allContracts || []).find((k) =>
    k.customerId === customerId &&
    norm(k.loadingPoint) === loadingPoint &&
    norm(k.destination) === destination &&
    norm(k.vehicleSize) === vehicleSize &&
    norm(k.movementThrough) === movementThrough
  );
  if (!match) return null;
  const groupsById = new Map((allGroups || []).map((g) => [g.id, g]));
  return { ...match, group: match.contractGroupId ? groupsById.get(match.contractGroupId) : null };
}

// Fuel Amount (PKR) for a shipment: half of Freight, converted to liters at the fuel
// price in effect on its dispatch date, then back to PKR. This nets out to Freight/2,
// but grounds the figure in an actual per-liter rate rather than an arbitrary fraction —
// so it also gives an implied liters-used figure as a byproduct. Returns null (not 0) when
// no fuel price is on file for that date, so a missing price doesn't get mistaken for Rs. 0.
function computeFuelAmount(freightAmount, fuelPricePerLiter) {
  if (!fuelPricePerLiter) return null;
  const liters = (xnum(freightAmount) / 2) / fuelPricePerLiter;
  return liters * fuelPricePerLiter;
}

function emptyStatusOf(c) {
  const si = c.stageIndex ?? 0;
  if (si >= 5) return "Received";
  if (si === 4) return "In Process";
  return "—";
}

// Once a Completed container has been sitting completed for 2+ days, it's considered
// "settled" — it fades out of the day-to-day operational views (Tracking for dispatcher,
// receiver, and Empty Return Receiver; the Orders tables for Data Entry) and lives on
// permanently in Order History (admin-only) instead. Based on Empty Return Date, since
// that's the date the completion actually happened.
function isSettledOut(c) {
  const si = c.stageIndex ?? 0;
  if (si < 5 || !c.emptyReturnDate) return false;
  const completedAt = new Date(c.emptyReturnDate + "T00:00:00");
  if (isNaN(completedAt)) return false;
  const diffDays = (Date.now() - completedAt.getTime()) / 86400000;
  return diffDays >= 2;
}

// Kept as an alias so any existing references keep working — containerStatus
// itself is now the single, consistent source of truth used everywhere
// (Orders table, order view tab, Tracking page, customer portal, etc.)
function trackingDisplayStatus(c, shipmentType) {
  return containerStatus(c, shipmentType);
}

function orderContainers(order) {
  return Array.isArray(order.containers) && order.containers.length ? order.containers : [];
}

// Aggregate status across all of an order's containers — used anywhere the app
// still needs one status per order (dashboard tiles, order list badges, etc).
function orderAggregateStatus(order) {
  const cs = orderContainers(order);
  if (cs.length === 0) return orderStatus(order); // legacy orders with no containers yet
  if (cs.every((c) => c.cancelled)) return "Cancelled";
  const active = cs.filter((c) => !c.cancelled);
  if (active.length === 0) return "Cancelled";
  const st = order.shipmentType || "Import";
  if (st === "Domestic") {
    if (active.every((c) => (c.stageIndex ?? 0) >= 4)) return "Delivered";
    if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Under Offloading";
    if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
    if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
    return "Confirmed";
  }
  if (st === "Import") {
    if (active.every((c) => (c.stageIndex ?? 0) >= 5)) return "Completed";
    if (active.every((c) => (c.stageIndex ?? 0) >= 4)) return "Delivered";
    if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Under Offloading";
    if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
    if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
    return "Confirmed";
  }
  // Export — unchanged 4-stage flow.
  if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Delivered";
  if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
  if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
  return "Confirmed";
}

function orderAggregateAmount(order) {
  const cs = orderContainers(order);
  if (cs.length === 0) return Number(order.amount) || 0;
  return cs.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
}

function getCustomer(data, id) { return data.customers.find((c) => c.id === id) || null; }
function getDriverName(data, id) { const d = data.drivers.find((x) => x.id === id); return d ? d.name : "Unassigned"; }
function getVehiclePlate(data, id) { const v = data.vehicles.find((x) => x.id === id); return v ? v.plate : "Unassigned"; }
function getOrder(data, id) { return data.orders.find((o) => o.id === id) || null; }

/* ---- Excel attach/detach/download helpers ---- */

// Tolerant number parser used across every Excel import — strips currency symbols (Rs,
// PKR, $, etc.), thousands separators, and stray whitespace before parsing, so a value
// written as "Rs257.08" or "1,234.50" still comes through as a real number instead of
// silently falling back to 0 just because Number() can't parse letters/commas directly.
const xnum = (v, fb = 0) => {
  if (v === null || v === undefined || v === "") return fb;
  if (typeof v === "number") return Number.isFinite(v) ? v : fb;
  const cleaned = String(v).trim().replace(/[^0-9.\-]/g, "");
  const n = Number(cleaned);
  return Number.isFinite(n) && cleaned !== "" ? n : fb;
};
const xstr = (v, fb = "") => (v === null || v === undefined || v === "" ? fb : String(v));
const xbool = (v) => v === true || v === "true" || v === 1 || v === "1" || v === "TRUE";

// Sizes each column to comfortably fit its header and content — previously no width was
// set at all, so every column fell back to Excel's cramped ~8-character default regardless
// of what was actually in it.
function computeColWidths(schema, cleanedRows) {
  return schema.map((key) => {
    let maxLen = String(key).length;
    (cleanedRows || []).slice(0, 300).forEach((r) => {
      const v = r[key];
      if (v !== null && v !== undefined && v !== "") maxLen = Math.max(maxLen, String(v).length);
    });
    return { wch: Math.min(Math.max(maxLen + 6, 14), 60) }; // generous padding, floor of 14, capped at 60 so one huge cell can't blow out the sheet
  });
}
// Converts an internal camelCase field name into a readable column header, e.g.
// "orderNumber" -> "Order Number", "customerId" -> "Customer ID". Used both to generate
// export headers and (via readField) to read them back correctly on re-import.
function humanizeFieldName(key) {
  if (String(key).toLowerCase() === "id") return "ID";
  let s = String(key).replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/^./, (c) => c.toUpperCase());
  s = s.replace(/\bId\b/g, "ID").replace(/\bBl\b/g, "BL").replace(/\bIgm\b/g, "IGM").replace(/\bPo\b/g, "PO").replace(/\bPkr\b/g, "PKR");
  return s;
}
// Fields that must always be real numbers in Excel, never text — listed explicitly per
// sheet (not a blanket "looks numeric" heuristic) so things like phone numbers or a purely-
// numeric Job#/Container No. never get silently reinterpreted and lose meaning.
const NUMERIC_SCHEMA_FIELDS = {
  Orders: new Set(["amount", "weight", "stageIndex"]),
  Vehicles: new Set(["year", "capacityKg", "mileageKm"]),
  Invoices: new Set(["total"]),
  FuelPrices: new Set(["pricePerLiter"]),
};
function buildSheet(rows, schema, displayHeaders, sheetName) {
  const headers = displayHeaders || schema.map(humanizeFieldName);
  // Hidden rather than deleted: id/customerId/senderId are needed for Attach/Revert to match
  // existing records; containers/history hold raw JSON (including base64 photos); stageIndex/
  // cancelled are internal status bookkeeping. None of these are useful for a human reading
  // the sheet, but the data staying present (just not shown) keeps re-import correct.
  const hideKeys = new Set(["id", "customerid", "containers", "history", "stageindex", "cancelled", "senderid"]);
  const hiddenColIdxs = schema.map((k, i) => (hideKeys.has(String(k).toLowerCase()) ? i : -1)).filter((i) => i >= 0);
  const numericFields = NUMERIC_SCHEMA_FIELDS[sheetName] || new Set();
  if (!rows || rows.length === 0) {
    const ws = XLSX.utils.aoa_to_sheet([headers]);
    ws["!cols"] = headers.map((h) => ({ wch: Math.max(String(h).length + 6, 14) }));
    hiddenColIdxs.forEach((i) => { ws["!cols"][i].hidden = true; });
    return ws;
  }
  const cleaned = rows.map((r) => {
    const out = {};
    schema.forEach((k, i) => {
      const val = r[k];
      const isEmpty = val === null || val === undefined || val === "";
      if (isEmpty) {
        // Hidden ID columns must stay truly empty — a literal "-" there would be read back
        // as a real ID on re-import instead of correctly falling back to a freshly generated one.
        out[headers[i]] = hideKeys.has(String(k).toLowerCase()) ? "" : "-";
        return;
      }
      if (typeof val === "object") { out[headers[i]] = JSON.stringify(val); return; }
      out[headers[i]] = numericFields.has(k) ? xnum(val) : val;
    });
    return out;
  });
  const ws = XLSX.utils.json_to_sheet(cleaned, { header: headers });
  ws["!cols"] = computeColWidths(headers, cleaned);

// Cleared Cases + company sheets use a light-gray header, Import/Export use cream,
// Domestic uses blue with white text — matching Excel's stock "Office 2007-2010" theme.
// ==================== Hand-written XLSX generator ====================
// ExcelJS (tried across several versions/builds) was confirmed to write files whose
// styling is only readable by ExcelJS's own parser — real Excel and Google Sheets both
// silently drop the colors, meaning the actual file bytes are spec-non-compliant. Rather
// than depend on a third-party writer with a proven bug, this builds the .xlsx file
// (a zip of plain OOXML XML) directly, using JSZip only to zip up files we write ourselves.
// Five fixed cell styles cover everything this export needs — no per-cell object creation,
// no ambiguity about what gets serialized.
//   0 = default (no fill/border)              1 = gray header  (Cleared Cases + customer sheets)
//   2 = cream header (Import/Export)           3 = blue header, white text (Domestic)
//   4 = title text (16pt bold, no fill)
//   5 = green (Cargo Type "NON-BONDED", Loading Point "QICT")
//   6 = red/pink (Cargo Type "BONDED", Loading Point "PICT", duplicate Bilty No.)
//   7 = cyan (Loading Point "KICT")            8 = solid blue, white text (Loading Point "SAPT")
function xlsxEscape(s) {

  // would otherwise produce an invalid file, not just unstyled one), then escape the
  // standard XML special characters.

  return clean.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));

// 1=gray header wrap   2=gray header no-wrap   3=cream header wrap   4=cream header no-wrap
// 5=blue header wrap   6=blue header no-wrap    7=title (no border)
// 8=data center no-wrap (text+numbers)          9=data center wrap
// 10=Cargo Type green  11=Cargo Type red        12=Cargo Type plain fallback (all Calibri11, centered)
// 13=Loading Point red 14=Loading Point green   15=Loading Point cyan   16=Loading Point blue/white
// 17=Bilty duplicate red, centered + wrap (Bilty No. content is itself a "wrap" column)
// Every style above (except 0/7) now carries a thin border on all 4 sides. 18-21 are freeze-pane-boundary
// variants used only on Import Transportation-2020's columns G(7)/H(8), dropping the border right at the split:
// 18=cream header wrap, no-left border  (col H, "Description")
// 19=cream header wrap, no-right border (col G, "Transporter")
// 20=data center no-wrap, no-right border (col G content)

// Other Charges, Bill Amount Approved, Total Bill Amount, etc.)

// Builds one <row> element. `values` is a plain array (1 per column). Every cell's style
// comes from `cellStyleOverrides[col]` — the caller is expected to have already worked out
// the right style id for every column (header wrap/no-wrap, data wrap/no-wrap, conditional
// colors), since those now vary per-column rather than uniformly per-row. Falls back to
// style 8 (centered, no wrap) for any column that genuinely has no explicit style.
// `fillBlanks`: when true, a genuinely empty data cell gets "-" instead of being skipped —
// used for real data rows so the sheet reads as "checked and confirmed blank" rather than
// looking incomplete. Left false for spacer/title rows, which are blank on purpose.
function xlsxRowXml(rowNum, values, cellStyleOverrides, fillBlanks) {
  const cells = [];
  values.forEach((val, i) => {
    const isEmpty = val === "" || val === null || val === undefined;
    const col = i + 1;
    const override = cellStyleOverrides && cellStyleOverrides[col];
    if (isEmpty && override == null && !fillBlanks) return; // skip empty cells in structural spacer rows
    const ref = `${xlsxColLetter(col)}${rowNum}`;
    const isNumber = typeof val === "number" && Number.isFinite(val);
    const style = override != null ? override : 8;
    const styleAttr = style ? ` s="${style}"` : "";
    if (isNumber) {
      cells.push(`<c r="${ref}"${styleAttr}><v>${val}</v></c>`);
    } else {
      const text = isEmpty ? (fillBlanks ? "-" : "") : String(val);
      cells.push(`<c r="${ref}"${styleAttr} t="inlineStr"><is><t xml:space="preserve">${xlsxEscape(text)}</t></is></c>`);
    }
  });
  return `<row r="${rowNum}">${cells.join("")}</row>`;
}

// sheets: [{ name, colCount, colWidths, rows: [array-of-values, ...], headerRowIndex,
//            headerStyle, titleCell: {row, col} }]
async function buildXlsxBuffer(sheets) {
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("\n")}
</Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`);
  zip.file("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
${sheets.map((s, i) => `<sheet name="${xlsxEscape(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("\n")}
</sheets>
</workbook>`);
  zip.file("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("\n")}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`);
  zip.file("xl/styles.xml", XLSX_STYLES_XML);

  sheets.forEach((s, sheetIdx) => {
    const hiddenColSet = new Set(s.hiddenCols || []);
    const colsXml = (s.colWidths || [])
      .map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"${hiddenColSet.has(i + 1) ? ' hidden="1"' : ""}/>`)
      .join("\n");
    const rowsXml = s.rows
      .map((values, i) => {
        const rowNum = i + 1;
        const isHeader = rowNum === s.headerRowIndex;
        const cellOverrides = {};
        if (isHeader && s.headerOverrides) {
          Object.assign(cellOverrides, s.headerOverrides);
        }
        if (s.titleCell && s.titleCell.row === rowNum) cellOverrides[s.titleCell.col] = 7;
        if (!isHeader) {
          if (s.contentDefaultCols) Object.assign(cellOverrides, s.contentDefaultCols);
          if (s.conditionalCols) {
            Object.entries(s.conditionalCols).forEach(([colIdx, fn]) => {
              const styleId = fn(values[colIdx - 1]);
              if (styleId != null) cellOverrides[colIdx] = styleId;
            });

        }
        const isDataRow = rowNum > s.headerRowIndex;
        const rowXml = xlsxRowXml(rowNum, values, cellOverrides, isDataRow);
        // Every row gets an explicit height + customHeight="1" — without that flag, Excel
        // treats defaultRowHeight as a mere suggestion and auto-expands any row containing
        // wrapped text that needs more vertical room, which is exactly what was happening.
        const height = isHeader ? 59.25 : 30.75;
        return rowXml.replace(`<row r="${rowNum}">`, `<row r="${rowNum}" ht="${height}" customHeight="1">`);
      })
      .join("\n");
    const lastCol = xlsxColLetter(Math.max(1, ...s.rows.map((r) => r.length)));
    const lastRow = Math.max(1, s.rows.length);
    zip.file(`xl/worksheets/sheet${sheetIdx + 1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${lastCol}${lastRow}"/>
<sheetViews>${sheetViewXml(s.freezeCols, s.freezeRows)}</sheetViews>
<sheetFormatPr defaultRowHeight="30.75" customHeight="1"/>
${colsXml ? `<cols>${colsXml}</cols>` : ""}
<sheetData>
${rowsXml}
</sheetData>
</worksheet>`);
  });

  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
}

// Flattens orders into individual containers (cancelled ones excluded — they aren't
// active shipments worth listing in these reports), optionally filtered by order.
function flattenContainers(orders, filterFn) {
  const out = [];
  orders.forEach((o) => {

// Returns a per-cell style function: checks the cell's own text against a list of
// [substring, styleId] rules in order, first match wins. Used for Cargo Type ("NON" before
// "BONDED", so "NON-BONDED" correctly lands on green, not red) and Loading Point.
function textContainsStyle(rules) {
  return (val) => {
    if (val === "" || val === null || val === undefined) return null;
    const s = String(val).toUpperCase();
    for (const [needle, styleId] of rules) {
      if (s.includes(needle.toUpperCase())) return styleId;
    }
    return null;
  };
}
// Flags any value that appears more than once in the given column's data as an error
// (e.g. a Bilty No. that's been accidentally duplicated) — matches the reference file's
// "duplicate values" conditional formatting exactly.
function duplicateStyleFn(allValues, styleId) {
  const counts = {};
  allValues.forEach((v) => {
    const key = String(v == null ? "" : v).trim();
    if (key) counts[key] = (counts[key] || 0) + 1;
  });
  return (val) => {
    const key = String(val == null ? "" : val).trim();
    return key && counts[key] > 1 ? styleId : null;
  };
}

// Builds the <sheetView> element, with a frozen pane when the sheet specifies one.
// freezeCols = how many leftmost columns stay fixed while scrolling horizontally,
// freezeRows = how many top rows (the header) stay fixed while scrolling vertically.
function sheetViewXml(freezeCols, freezeRows) {
  if (!freezeCols && !freezeRows) return '<sheetView workbookViewId="0"/>';
  const topLeftCell = `${xlsxColLetter((freezeCols || 0) + 1)}${(freezeRows || 0) + 1}`;
  const activePane = freezeCols && freezeRows ? "bottomRight" : freezeCols ? "topRight" : "bottomLeft";
  const xSplitAttr = freezeCols ? ` xSplit="${freezeCols}"` : "";
  const ySplitAttr = freezeRows ? ` ySplit="${freezeRows}"` : "";

    if (normalized[nk] !== undefined && normalized[nk] !== "") return normalized[nk];

function compactPKR(n) {
  const num = Number(n) || 0;
  if (Math.abs(num) >= 1e7) return "Rs " + (num / 1e7).toFixed(2) + " Cr";
  if (Math.abs(num) >= 1e5) return "Rs " + (num / 1e5).toFixed(2) + " Lac";
  return "Rs " + num.toLocaleString("en-US");
}

const COMPANY_PROFILE = {
  name: "LOGISTIX",
  tagline: "Forwarding , Transporters & Bonded Carrier Services",
  addressLine1: "",
  addressLine2: "Karachi, Pakistan",
  phone: "",
  email: "",
};

function downloadBiltyReceipt(order, data) {
  try {
    const cust = getCustomer(data, order.customerId);
    const sender = (data.senders || []).find((s) => s.id === order.senderId) || null;
    const isDomestic = (order.shipmentType || "Import") === "Domestic";
    const containers = (Array.isArray(order.containers) && order.containers.length)
      ? order.containers
      : [{ containerNumber: order.containerNumber || "", sealNumber: order.sealNumber || "", qtyLabel: order.qtyLabel || "" }];
    const container = containers[0] || {};

    const SCALE = 2.5;
    const INK = "#111827", SUB = "#4b5563", LINE = "#111827", BAR = "#111827";

    function box(ctx, x, y, w, h, opts) {
      opts = opts || {};
      if (opts.fill) { ctx.fillStyle = opts.fill; ctx.fillRect(x, y, w, h); }
      ctx.strokeStyle = opts.stroke || LINE;
      ctx.lineWidth = opts.lw || 1;
      ctx.strokeRect(x, y, w, h);
    }
    function line(ctx, x1, y1, x2, y2, opts) {
      opts = opts || {};
      ctx.strokeStyle = opts.stroke || LINE;
      ctx.lineWidth = opts.lw || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    function txt(ctx, str, x, y, opts) {
      opts = opts || {};
      ctx.fillStyle = opts.color || INK;
      ctx.font = (opts.weight || "normal") + " " + (opts.size || 12) + "px Arial";
      ctx.textAlign = opts.align || "left";
      ctx.fillText(str || "", x, y);
      ctx.textAlign = "left";
    }

    function finish(canvas, W, H) {
      const imgData = canvas.toDataURL("image/jpeg", 0.85);
      if (!window.jspdf || !window.jspdf.jsPDF) {
        window.alert("PDF library didn't load — check your internet connection and try again.");
        return;
      }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "landscape", unit: "px", format: [W, H], compress: true });
      pdf.addImage(imgData, "JPEG", 0, 0, W, H, undefined, "FAST");
      pdf.save(`Bilty-${order.orderNumber}.pdf`);
    }

    if (isDomestic) {
      // ---- Domestic: its own tailored layout — no Bonded Status, B/L No., Job No.,
      // Shipping Line, Empty Return, or container/seal line items, since none of those
      // apply to a domestic shipment. Shows Domestic Category, PO/SAP No., Movement
      // Through, Loading Date, Vehicle Size, Transporter, and Freight Amount instead.
      const W = 870;
      const fieldRows = ["desc", "poSap", "movement", "loadingDate", "vehicleSize", "transporter", "freight"];
      const pBodyH = 18 + fieldRows.length * 22 + 12;
      const srY = 150;
      const infoY = srY + 82;
      const pY = infoY + 26;
      const remY = pY + 24 + pBodyH + 24;
      const fY = remY + 26;
      const H = fY + 30 + 20;

      const canvas = document.createElement("canvas");
      canvas.width = W * SCALE; canvas.height = H * SCALE;
      const ctx = canvas.getContext("2d");
      ctx.scale(SCALE, SCALE);
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
      box(ctx, 14, 14, W - 28, H - 28, { lw: 1.5 });

      // header: logo + company block
      ctx.beginPath(); ctx.arc(58, 56, 26, 0, Math.PI * 2);
      ctx.fillStyle = "#1e3a5f"; ctx.fill();
      txt(ctx, "IBL", 58, 63, { size: 15, weight: "bold", color: "#ffffff", align: "center" });
      txt(ctx, COMPANY_PROFILE.name, 98, 44, { size: 19, weight: "bold" });
      txt(ctx, COMPANY_PROFILE.tagline, 98, 60, { size: 10, color: SUB });
      txt(ctx, COMPANY_PROFILE.addressLine1, 98, 74, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.addressLine2, 98, 86, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.phone, 98, 100, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.email, 98, 112, { size: 9.5, color: SUB });

      // badges: DOMESTIC + Domestic Category (replaces Bonded Status, which doesn't apply here)
      function badgeStamp(label, x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 128, 22);
        txt(ctx, label, x + 64, y + 15, { size: 11, weight: "bold", color: "#ffffff", align: "center" });
      }
      badgeStamp((order.domesticCategory || "DOMESTIC").toUpperCase(), 430, 30, "#6b7280");
      badgeStamp("DOMESTIC", 430, 58, "#111827");

      // right info box: Bilty No / Loading Date / Vehicle No
      const rbX = 606, rbW = 214;
      box(ctx, rbX, 26, rbW, 112, { lw: 1.2 });
      line(ctx, rbX, 26 + 37, rbX + rbW, 26 + 37);
      line(ctx, rbX, 26 + 74, rbX + rbW, 26 + 74);
      txt(ctx, "BILTY NO.", rbX + 10, 42, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.biltyNumber || order.biltyNumber || "—", rbX + 10, 58, { size: 15, weight: "bold" });
      txt(ctx, "LOADING DATE", rbX + 10, 79, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.loadingDate ? fmtDate(container.loadingDate) : fmtDate(order.createdDate), rbX + 10, 94, { size: 13 });
      txt(ctx, "VEHICLE NO.", rbX + 10, 116, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.vehiclePlate || "Unassigned", rbX + 10, 131, { size: 13, weight: "bold" });

      // sender / receiver
      box(ctx, 32, srY, W - 64, 82, { lw: 1.2 });
      ctx.fillStyle = BAR; ctx.fillRect(32, srY, W - 64, 22);
      line(ctx, 32 + (W - 64) / 2, srY, 32 + (W - 64) / 2, srY + 82);
      txt(ctx, "SENDER'S NAME & ADDRESS", 42, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
      txt(ctx, "RECEIVER'S NAME & ADDRESS", 32 + (W - 64) / 2 + 10, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
      txt(ctx, sender ? sender.name : COMPANY_PROFILE.name, 42, srY + 42, { size: 13, weight: "bold" });
      txt(ctx, order.senderAddress || order.origin || "", 42, srY + 60, { size: 11, color: SUB });
      txt(ctx, cust ? cust.name : "Unknown Customer", 32 + (W - 64) / 2 + 10, srY + 42, { size: 13, weight: "bold" });
      txt(ctx, resolveReceiverAddress(container, cust) || (cust ? cust.location || "" : ""), 32 + (W - 64) / 2 + 10, srY + 60, { size: 11, color: SUB });
      txt(ctx, "Contact# " + (cust ? cust.phone || "—" : "—"), 32 + (W - 64) / 2 + 10, srY + 75, { size: 11, color: SUB });

      // loading point / destination / movement through / vehicle size
      const infoCols = [32, 244, 456, 656, W - 32];
      box(ctx, 32, infoY, W - 64, 26, { lw: 1.2 });
      for (let i = 1; i < infoCols.length - 1; i++) line(ctx, infoCols[i], infoY, infoCols[i], infoY + 26);
      txt(ctx, "Loading Point:  " + (order.origin || "—"), infoCols[0] + 8, infoY + 17, { size: 10.5 });
      txt(ctx, "Destination:  " + (container.destination || "—"), infoCols[1] + 8, infoY + 17, { size: 10.5 });
      txt(ctx, "Movement Through:  " + (container.movementThrough || "—"), infoCols[2] + 8, infoY + 17, { size: 10.5 });
      txt(ctx, "Vehicle Size:  " + (container.vehicleSize || "—"), infoCols[3] + 8, infoY + 17, { size: 10.5 });

      // particulars — simple field list, no container/seal line items, no QTY/Amount/Weight grid
      ctx.fillStyle = BAR; ctx.fillRect(32, pY, W - 64, 24);
      txt(ctx, "Particulars", (32 + W - 32) / 2, pY + 16, { size: 10.5, weight: "bold", color: "#ffffff", align: "center" });
      box(ctx, 32, pY, W - 64, 24 + pBodyH, { lw: 1.2 });

      let py = pY + 24 + 18;
      function pRow(label, value) {
        txt(ctx, label, 32 + 8, py, { size: 10, weight: "bold" });
        const lw = ctx.measureText(label).width;
        txt(ctx, value || "—", 32 + 8 + lw + 6, py, { size: 10.5 });
        py += 22;
      }
      pRow("Item Description:", order.description);
      pRow("PO / SAP No.:", container.poSapNo);
      pRow("Movement Through:", container.movementThrough);
      pRow("Loading Date:", container.loadingDate ? fmtDate(container.loadingDate) : "");
      pRow("Vehicle Size:", container.vehicleSize);
      pRow("Transporter:", container.transporter);
      pRow("Freight Amount:", container.freightAmount !== "" && container.freightAmount !== undefined && container.freightAmount !== null ? formatPKR(container.freightAmount) : "");

      // remarks
      txt(ctx, "Remarks:", 32, remY, { size: 10.5, weight: "bold" });
      line(ctx, 32, remY + 10, W - 32, remY + 10);

      // footer
      const fCols = [32, 330, 610, W - 32];
      box(ctx, 32, fY, W - 64, 30, { lw: 1.2 });
      line(ctx, fCols[1], fY, fCols[1], fY + 30);
      line(ctx, fCols[2], fY, fCols[2], fY + 30);
      txt(ctx, "Note: Don't Deliver Goods Without Bilty", fCols[0] + 8, fY + 19, { size: 9.5, weight: "bold", color: "#b91c1c" });
      txt(ctx, "Booking Company: " + (cust ? cust.name.toUpperCase() : "—"), fCols[1] + 8, fY + 19, { size: 10 });
      txt(ctx, "Logistics Manager:", fCols[2] + 8, fY + 19, { size: 10 });

      finish(canvas, W, H);
      return;
    }

    // ---- Import / Export (unchanged) ----
    // ---- compute layout height up-front (depends on how many containers there are) ----
    const W = 870;
    const fixedRows = 4; // Item Description, DN/LC/SAP No., Job No., B/L No.
    const pBodyH = 18 + fixedRows * 22 + containers.length * 40 + 12;
    const srY = 150;
    const infoY = srY + 82;
    const pY = infoY + 26;
    const gY = pY + 24 + pBodyH;
    const remY = gY + 22 + 70 + 24;
    const fY = remY + 26;
    const H = fY + 30 + 20;

    const canvas = document.createElement("canvas");
    canvas.width = W * SCALE; canvas.height = H * SCALE;
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = "alphabetic";

    function stamp(str, cx, cy, opts) {
      opts = opts || {};
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.35);
      ctx.strokeStyle = opts.color || "#9ca3af";
      ctx.fillStyle = opts.color || "#9ca3af";
      ctx.font = "bold " + (opts.size || 13) + "px Arial";
      ctx.textAlign = "center";
      ctx.globalAlpha = 0.85;
      ctx.strokeText(str, 0, 0);
      ctx.restore();
    }

    // ---- data ----
    const bondedStatus = (order.bondedStatus || "Non-Bonded").toUpperCase();
    const shipmentType = (order.shipmentType || "Import").toUpperCase();

    // ---- background & outer border ----
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    box(ctx, 14, 14, W - 28, H - 28, { lw: 1.5 });

    // ---- header: logo + company block ----
    ctx.beginPath(); ctx.arc(58, 56, 26, 0, Math.PI * 2);
    ctx.fillStyle = "#1e3a5f"; ctx.fill();
    txt(ctx, "IBL", 58, 63, { size: 15, weight: "bold", color: "#ffffff", align: "center" });
    txt(ctx, COMPANY_PROFILE.name, 98, 44, { size: 19, weight: "bold" });
    txt(ctx, COMPANY_PROFILE.tagline, 98, 60, { size: 10, color: SUB });
    txt(ctx, COMPANY_PROFILE.addressLine1, 98, 74, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.addressLine2, 98, 86, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.phone, 98, 100, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.email, 98, 112, { size: 9.5, color: SUB });

    // status badges: NON-BONDED / IMPORT (or whatever the order specifies)
    function badgeStamp(label, x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 128, 22);
      txt(ctx, label, x + 64, y + 15, { size: 11, weight: "bold", color: "#ffffff", align: "center" });
    }
    badgeStamp(bondedStatus, 430, 30, "#6b7280");
    badgeStamp(shipmentType, 430, 58, "#111827");

    // right info box: Bilty No / Loading Date / Vehicle No
    const rbX = 606, rbW = 214;
    box(ctx, rbX, 26, rbW, 112, { lw: 1.2 });
    line(ctx, rbX, 26 + 37, rbX + rbW, 26 + 37);
    line(ctx, rbX, 26 + 74, rbX + rbW, 26 + 74);
    txt(ctx, "BILTY NO.", rbX + 10, 42, { size: 9.5, weight: "bold", color: SUB });
    txt(ctx, container.biltyNumber || order.biltyNumber || "—", rbX + 10, 58, { size: 15, weight: "bold" });
    txt(ctx, "LOADING DATE", rbX + 10, 79, { size: 9.5, weight: "bold", color: SUB });
    txt(ctx, fmtDate(order.createdDate), rbX + 10, 94, { size: 13 });
    txt(ctx, "VEHICLE NO.", rbX + 10, 116, { size: 9.5, weight: "bold", color: SUB });
    txt(ctx, container.vehiclePlate || "Unassigned", rbX + 10, 131, { size: 13, weight: "bold" });

    // ---- sender / receiver ----
    box(ctx, 32, srY, W - 64, 82, { lw: 1.2 });
    ctx.fillStyle = BAR; ctx.fillRect(32, srY, W - 64, 22);
    line(ctx, 32 + (W - 64) / 2, srY, 32 + (W - 64) / 2, srY + 82);
    txt(ctx, "SENDER'S NAME & ADDRESS", 42, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
    txt(ctx, "RECEIVER'S NAME & ADDRESS", 32 + (W - 64) / 2 + 10, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
    txt(ctx, sender ? sender.name : COMPANY_PROFILE.name, 42, srY + 42, { size: 13, weight: "bold" });
    txt(ctx, order.senderAddress || order.origin || "", 42, srY + 60, { size: 11, color: SUB });
    txt(ctx, cust ? cust.name : "Unknown Customer", 32 + (W - 64) / 2 + 10, srY + 42, { size: 13, weight: "bold" });
    txt(ctx, resolveReceiverAddress(container, cust) || (cust ? cust.location || "" : ""), 32 + (W - 64) / 2 + 10, srY + 60, { size: 11, color: SUB });
    txt(ctx, "Contact# " + (cust ? cust.phone || "—" : "—"), 32 + (W - 64) / 2 + 10, srY + 75, { size: 11, color: SUB });

    // ---- loading point / destination / shipping line / empty return ----
    const infoCols = [32, 244, 456, 656, W - 32];
    box(ctx, 32, infoY, W - 64, 26, { lw: 1.2 });
    for (let i = 1; i < infoCols.length - 1; i++) line(ctx, infoCols[i], infoY, infoCols[i], infoY + 26);
    txt(ctx, "Loading Point:  " + order.origin, infoCols[0] + 8, infoY + 17, { size: 10.5 });
    txt(ctx, "Destination:  " + (container.destination || "—"), infoCols[1] + 8, infoY + 17, { size: 10.5 });
    txt(ctx, "Shipping Line:  " + (order.shippingLine || "—"), infoCols[2] + 8, infoY + 17, { size: 10.5 });
    txt(ctx, "Empty Return:  " + (container.emptyReturnLocation || "—"), infoCols[3] + 8, infoY + 17, { size: 10.5 });

    // ---- particulars table ----
    const pCols = [32, 346, 424, 514, 604, 718, W - 32];
    const pHead = ["Particulars", "QTY", "Amount", "Weight", "Advance", "Balance"];
    ctx.fillStyle = BAR; ctx.fillRect(32, pY, W - 64, 24);
    for (let i = 0; i < pHead.length; i++) {
      const cx = (pCols[i] + pCols[i + 1]) / 2;
      txt(ctx, pHead[i], cx, pY + 16, { size: 10.5, weight: "bold", color: "#ffffff", align: "center" });
    }
    box(ctx, 32, pY, W - 64, 24 + pBodyH, { lw: 1.2 });
    for (let i = 1; i < pCols.length - 1; i++) line(ctx, pCols[i], pY, pCols[i], pY + 24 + pBodyH);

    // Each row: bold label immediately followed by its value on the SAME line (not stacked).
    let py = pY + 24 + 18;
    function pRow(label, value) {
      txt(ctx, label, pCols[0] + 8, py, { size: 10, weight: "bold" });
      const lw = ctx.measureText(label).width;
      txt(ctx, value || "—", pCols[0] + 8 + lw + 6, py, { size: 10.5 });
      py += 22;
    }
    pRow("Item Description:", order.description);
    pRow("DN / LC / SAP No.:", order.poNumber);
    pRow("Job No.:", order.jobNumber);
    pRow("B/L No.:", order.blNumber);

    // One row per container — Container No. and Seal No. each get their own line
    // (previously crammed onto one line, which overlapped the QTY column at long values).
    const qtyRows = [];
    containers.forEach((c) => {
      txt(ctx, "Container No.:", pCols[0] + 8, py, { size: 10, weight: "bold" });
      let lw = ctx.measureText("Container No.:").width;
      txt(ctx, c.containerNumber || "—", pCols[0] + 8 + lw + 6, py, { size: 10.5 });
      qtyRows.push({ y: py, qty: containerSizeTypeLabel(c) || "01" });
      py += 20;
      txt(ctx, "Seal No.:", pCols[0] + 8, py, { size: 10, weight: "bold" });
      lw = ctx.measureText("Seal No.:").width;
      txt(ctx, c.sealNumber || "—", pCols[0] + 8 + lw + 6, py, { size: 10.5 });
      py += 20;
    });
    qtyRows.forEach((q) => txt(ctx, q.qty, (pCols[1] + pCols[2]) / 2, q.y, { size: 11, align: "center" }));

    const midY = pY + 24 + pBodyH / 2;
    // Amount / Advance / Balance: pre-printed "Paid" stamps
    stamp("Paid", (pCols[2] + pCols[3]) / 2, midY, { size: 12 });
    // Weight: show the real figure if entered, otherwise the pre-printed placeholder stamp
    if (container.weight && Number(container.weight) > 0) {
      txt(ctx, Number(container.weight).toLocaleString() + " kg", (pCols[3] + pCols[4]) / 2, midY, { size: 12, align: "center" });
    } else {
      stamp("As Per", (pCols[3] + pCols[4]) / 2, midY - 6, { size: 10 });
      stamp("Document", (pCols[3] + pCols[4]) / 2, midY + 10, { size: 10 });
    }
    stamp("Paid", (pCols[4] + pCols[5]) / 2, midY, { size: 12 });
    stamp("Paid", (pCols[5] + pCols[6]) / 2, midY, { size: 12 });

    // ---- gate timestamps ----
    const gCols = [32, 32 + (W - 64) / 3, 32 + 2 * (W - 64) / 3, W - 32];
    ctx.fillStyle = BAR; ctx.fillRect(32, gY, W - 64, 22);
    for (let i = 1; i < gCols.length - 1; i++) line(ctx, gCols[i], gY, gCols[i], gY + 92);
    txt(ctx, "REPORTING DATE & TIME", (gCols[0] + gCols[1]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    txt(ctx, "GATE IN DATE & TIME", (gCols[1] + gCols[2]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    txt(ctx, "GATE OUT DATE & TIME", (gCols[2] + gCols[3]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    box(ctx, 32, gY, W - 64, 22 + 70, { lw: 1.2 });

    // ---- remarks ----
    txt(ctx, "Remarks:", 32, remY, { size: 10.5, weight: "bold" });
    line(ctx, 32, remY + 10, W - 32, remY + 10);

    // ---- footer ----
    const fCols = [32, 330, 610, W - 32];
    box(ctx, 32, fY, W - 64, 30, { lw: 1.2 });
    line(ctx, fCols[1], fY, fCols[1], fY + 30);
    line(ctx, fCols[2], fY, fCols[2], fY + 30);
    txt(ctx, "Note: Don't Deliver Goods Without Bilty", fCols[0] + 8, fY + 19, { size: 9.5, weight: "bold", color: "#b91c1c" });
    txt(ctx, "Booking Company: " + (cust ? cust.name.toUpperCase() : "—"), fCols[1] + 8, fY + 19, { size: 10 });
    txt(ctx, "Logistics Manager:", fCols[2] + 8, fY + 19, { size: 10 });

    finish(canvas, W, H);
  } catch (err) {
    console.error("Bilty receipt error:", err);
    window.alert("Something went wrong generating the bilty receipt: " + err.message);
  }
}

function getWeekData(orders) {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const now = new Date();
  const dayIdx = (now.getDay() + 6) % 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayIdx);
  return days.map((label, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = toLocalDateStr(d);
    const total = orders.filter((o) => o.createdDate === iso).length;
    const delivered = orders.filter((o) => o.deliveredDate === iso).length;
    return { day: label, total, delivered };
  });
}

function getStatusMix(orders) {
  const colors = { Confirmed: "#38bdf8", "Picked Up": "#818cf8", "In Transit": "#3b82f6", Delivered: "#22c55e", Completed: "#a78bfa", Cancelled: "#64748b" };
  const counts = {};
  orders.forEach((o) => { const s = orderAggregateStatus(o); counts[s] = (counts[s] || 0) + 1; });
  return Object.entries(counts).map(([name, value]) => ({ name, value, color: colors[name] || "#64748b" }));
}

function analyticsData(data, rangeDays) {
  const { orders, vehicles, drivers, invoices } = data;
  const cutoff = addDaysISO(todayISO(), -(rangeDays - 1));
  const today = todayISO();
  const inRange = (iso) => iso && iso >= cutoff && iso <= today;

  const ordersInRange = orders.filter((o) => inRange(o.createdDate));

  const allContainers = [];
  orders.forEach((o) => orderContainers(o).forEach((c) => allContainers.push({ ...c, _order: o })));
  const deliveredInRange = allContainers.filter((c) => inRange(c.deliveredDate));

  const activeVehicles = vehicles.filter((v) => v.status === "active").length;
  const paidInvoices = invoices.filter((i) => i.status === "Paid");
  const revenue = paidInvoices.reduce((s, i) => s + i.total, 0);
  const outstanding = invoices.filter((i) => i.status === "Sent" || i.status === "Overdue").reduce((s, i) => s + i.total, 0);

  const onTimeDelivered = deliveredInRange.filter((c) => c._order.eta && c.deliveredDate && c.deliveredDate <= c._order.eta).length;
  const onTimePct = deliveredInRange.length ? Math.round((onTimeDelivered / deliveredInRange.length) * 100) : 0;
  const fleetUtilPct = vehicles.length ? Math.round((activeVehicles / vehicles.length) * 100) : 0;
  const driverList = drivers.filter((d) => d.role === "Driver");
  const onDutyPct = driverList.length ? Math.round((driverList.filter((d) => d.status === "On Duty").length / driverList.length) * 100) : 0;
  const paidRatePct = invoices.length ? Math.round((paidInvoices.length / invoices.length) * 100) : 0;

  const days = [];
  for (let i = rangeDays - 1; i >= 0; i--) days.push(addDaysISO(today, -i));
  const chart = days.map((iso) => ({
    date: iso.slice(5),
    total: orders.filter((o) => o.createdDate === iso).length,
    delivered: allContainers.filter((c) => c.deliveredDate === iso).length,
  }));
  const revenueChart = days.map((iso) => ({
    date: iso.slice(5),
    revenue: invoices.filter((i) => i.status === "Paid" && i.issued === iso).reduce((s, i) => s + i.total, 0),
  }));

  const priorityColors = { Low: "#64748b", Normal: "#38bdf8", Urgent: "#ef4444" };
  const priorityCounts = {};
  allContainers.forEach((c) => { const p = c.priority || "Normal"; priorityCounts[p] = (priorityCounts[p] || 0) + 1; });
  const priorityMix = Object.entries(priorityCounts).map(([name, value]) => ({ name, value, color: priorityColors[name] || "#64748b" }));

  const invoiceStatusColors = { Draft: "#64748b", Sent: "#38bdf8", Paid: "#22c55e", Overdue: "#ef4444" };
  const invStatusCounts = {};
  invoices.forEach((i) => { invStatusCounts[i.status] = (invStatusCounts[i.status] || 0) + 1; });
  const invoiceStatusMix = Object.entries(invStatusCounts).map(([name, value]) => ({ name, value, color: invoiceStatusColors[name] || "#64748b" }));

  const vehiclePalette = ["#3b82f6", "#a855f7", "#22c55e", "#f59e0b", "#ef4444", "#38bdf8"];
  const vehTypeCounts = {};
  vehicles.forEach((v) => { const t = v.type || "Truck"; vehTypeCounts[t] = (vehTypeCounts[t] || 0) + 1; });
  const vehicleTypeMix = Object.entries(vehTypeCounts).map(([name, value], i) => ({ name, value, color: vehiclePalette[i % vehiclePalette.length] }));

  return {
    totalOrders: ordersInRange.length, delivered: deliveredInRange.length, revenue, outstanding,
    activeVehicles, totalVehicles: vehicles.length, fleetUtilPct, onTimePct, onDutyPct, paidRatePct,
    chart, statusMix: getStatusMix(orders),
    revenueChart, priorityMix, invoiceStatusMix, vehicleTypeMix,
  };
}

// A <select> that also lets the user type a value that isn't in the list.

function DropdownWithCustom({ value, onChange, options, selectPlaceholder, customPlaceholder }) {
  const [customMode, setCustomMode] = useState(!!value && !options.includes(value));
  if (customMode) {
    return (
      <div className="flex gap-2">
        <input
          className={inputCls} value={value} autoFocus
          onChange={(e) => onChange(e.target.value)}
          placeholder={customPlaceholder || "Enter custom value"}
        />
        <button type="button" className={cx(btnSecondary, "shrink-0 text-xs px-2.5")} onClick={() => { setCustomMode(false); onChange(""); }}>
          Use list
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls} value={value}
      onChange={(e) => {
        if (e.target.value === "__custom__") { setCustomMode(true); onChange(""); return; }
        onChange(e.target.value);
      }}
    >
      <option value="">{selectPlaceholder || "Select..."}</option>
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__custom__">+ Custom...</option>
    </select>
  );
}

// importable tab (Orders x3, Customers, Senders, Transporters, Invoices). Attaching only
// ever touches this tab's own table (and for Orders, only its own shipment type); Export
// downloads just this tab's current data; Revert undoes exactly what that attach changed.

  const fileInputRef = useRef(null);
  const m = meta || {};
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <input
        ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}

          if (f) onAttachFile(f);
          e.target.value = "";
        }}
      />
      {m.attached && (
        <span className="inline-flex items-center gap-1.5 text-xs text-slate-400 bg-slate-900 border border-slate-800 rounded-md px-2 py-1.5">
          <FileSpreadsheet size={12} className="shrink-0" /> {m.filename}
        </span>
      )}
      <button
        disabled={m.busy}
        onClick={() => fileInputRef.current && fileInputRef.current.click()}
        className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition-colors disabled:opacity-50"
      >
        <Upload size={12} /> {m.busy && !m.attached ? "Loading…" : m.attached ? "Attach another file" : `Attach file to ${label}`}
      </button>
      <button
        disabled={m.busy}
        onClick={onExport}
        className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition-colors disabled:opacity-50"
      >
        <Download size={12} /> Export {label}
      </button>
      {m.attached && (
        <button
          disabled={m.busy}
          title="Undo this import — restores this tab's data to how it was before this file was attached"
          onClick={onRevert}
          className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800 transition-colors disabled:opacity-50"
        >
          {m.busy ? "Reverting…" : "Revert"}
        </button>
      )}
      {m.message && <span className={cx("text-xs", m.message.ok ? "text-emerald-400" : "text-red-400")}>{m.message.text}</span>}
    </div>
  );
}
