function ContractDetail({ customer, group, data, openModal, askDelete, role, contractExcel, onContractRatesExport, onContractRatesAttach, onContractRatesRevert, onBack }) {
  const [q, setQ] = useState("");
  const [calcDate, setCalcDate] = useState("");
  const [rateSortCol, setRateSortCol] = useState("loading");
  const [rateSortDir, setRateSortDir] = useState("asc");
  const groupIds = new Set((data.contract_groups || []).map((g) => g.id));
  const allRows = (data.contracts || []).filter((k) => k.customerId === customer.id && (group ? k.contractGroupId === group.id : (!k.contractGroupId || !groupIds.has(k.contractGroupId))));
  const rateComparators = {
    loading: (a, b) => (a.loadingPoint || "").localeCompare(b.loadingPoint || ""),
    destination: (a, b) => (a.destination || "").localeCompare(b.destination || ""),
    rate: (a, b) => (xnum(a.rate) || 0) - (xnum(b.rate) || 0),
    vehicle: (a, b) => (a.vehicleSize || "").localeCompare(b.vehicleSize || ""),
  };
  function sortRate(col, dir) { setRateSortCol(col); setRateSortDir(dir); }
  const rows = allRows
    .filter((k) => {
      const text = `${k.loadingPoint} ${k.destination} ${k.movementThrough || ""} ${k.vehicleSize || ""} ${k.weightCategory || ""} ${k.axleLoadCategory || ""}`.toLowerCase();
      return !q || text.includes(q.toLowerCase());
    })
    .sort((a, b) => {
      const cmp = rateComparators[rateSortCol](a, b);
      return rateSortDir === "desc" ? -cmp : cmp;
    });
  const title = group ? group.contractTitle : "Unassigned Rates";
  const excelKey = group ? group.id : "orphan";
  const excelMeta = (contractExcel || {})[excelKey];

  // Every rate is treated as half General (fixed) and half Fuel (variable) component. Picking
  // a date looks up the fuel price on file for it (Fuel Management > Fuel Price) and scales
  // just the Fuel half by how much that price has moved relative to this contract's own Fuel
  // Base Rate — the General half never changes. Only possible for a real contract (the
  // "Unassigned Rates" bucket has no Fuel Base Rate to compare against).
  const fuelPriceForDate = calcDate ? fuelPriceOnDate(data.fuel_prices, calcDate) : 0;
  const canCalculate = !!group && group.fuelBaseRate && !!calcDate && fuelPriceForDate > 0;
  function adjustedRateFor(baseRate) {
    if (!canCalculate) return null;
    const general = baseRate * 0.5;
    const fuelComponent = baseRate * 0.5;
    // Fuel component (an amount, e.g. Rs 50,000) ÷ Fuel Base Rate (e.g. Rs 272.77/L) gives
    // how many litres that amount represents at the contract's base price. Multiplying that
    // litre quantity by the fuel price on the chosen date gives the adjusted fuel amount.
    const impliedLitres = fuelComponent / group.fuelBaseRate;
    const adjustedFuel = impliedLitres * fuelPriceForDate;
    return general + adjustedFuel;
  }

  return (
    <div className="space-y-5">
      <button onClick={onBack} className="text-slate-400 hover:text-white text-sm inline-flex items-center gap-1"><ArrowLeft size={14} /> Back to {customer.name}</button>
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-2xl font-bold text-white">{title}</h2>
          <p className="text-slate-500 text-sm mt-1">{customer.name} — agreed freight rates</p>
          {group && (
            <div className="flex items-center gap-4 text-slate-500 text-xs mt-2 flex-wrap">
              <span>Commencement: {group.commencementDate ? fmtDate(group.commencementDate) : "—"}</span>
              <span>Expiry: {group.expiryDate ? fmtDate(group.expiryDate) : "—"}</span>
              <span>Fuel Base Rate: {group.fuelBaseRate !== "" && group.fuelBaseRate !== undefined && group.fuelBaseRate !== null ? `${formatPKR(group.fuelBaseRate)} / litre` : "—"}</span>
            </div>
          )}
        </div>
        <div className="flex items-center gap-2">
          {group && (role === "admin" || role === "finance_manager") && (
            <button className={btnSecondary} onClick={() => openModal({ type: "contract_group", mode: "edit", item: group })}><Pencil size={14} /> Edit Contract</button>
          )}
          <button className={btnPrimary} onClick={() => openModal({ type: "contract", mode: "add", item: null, prefill: { customerId: customer.id, contractGroupId: group ? group.id : "" } })}>
            <Plus size={16} /> Add Rate
          </button>
        </div>
      </div>
      <TabExcelBar
        label="Rates"
        meta={excelMeta}
        onAttachFile={(file) => onContractRatesAttach(customer.id, group ? group.id : "", file)}
        onExport={() => onContractRatesExport(customer.id, group ? group.id : "", title)}
        onRevert={() => onContractRatesRevert(group ? group.id : "")}
      />
      <div className="flex gap-3 flex-wrap items-start">
        <Field label="Search">
          <SearchBox value={q} onChange={setQ} placeholder="Search loading point, destination, vehicle size..." />
        </Field>
        {group && (
          <Field label="Calculate rate as of date">
            <input type="date" className={inputCls} style={{ width: 180 }} value={calcDate} onChange={(e) => setCalcDate(e.target.value)} />
          </Field>
        )}
      </div>
      {calcDate && group && !canCalculate && (
        <p className="text-amber-500 text-xs">
          {!group.fuelBaseRate ? "This contract has no Fuel Base Rate set, so an adjusted rate can't be calculated." : "No fuel price on file for that date yet — set one in Fuel Management > Fuel Price."}
        </p>
      )}
      {rows.length === 0 ? (
        <EmptyState
          icon={FileSpreadsheet} text={allRows.length === 0 ? "No rates yet in this contract." : "No rates match your search."}
          actionLabel={allRows.length === 0 ? "Add first rate" : null}
          onAction={() => openModal({ type: "contract", mode: "add", item: null, prefill: { customerId: customer.id, contractGroupId: group ? group.id : "" } })}
        />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                <SortableTh label="Loading Point" active={rateSortCol === "loading"} direction={rateSortDir} onSort={(dir) => sortRate("loading", dir)} className="text-left font-medium px-4 py-3 whitespace-normal" />
                <SortableTh label="Destination" active={rateSortCol === "destination"} direction={rateSortDir} onSort={(dir) => sortRate("destination", dir)} className="text-left font-medium px-4 py-3 whitespace-normal" />
                <th className="text-left font-medium px-4 py-3 whitespace-normal" style={{ maxWidth: 110 }}>Movement Through</th>
                <SortableTh label="Vehicle Size" active={rateSortCol === "vehicle"} direction={rateSortDir} onSort={(dir) => sortRate("vehicle", dir)} className="text-left font-medium px-4 py-3 whitespace-normal" />
                <th className="text-left font-medium px-4 py-3 whitespace-normal" style={{ maxWidth: 110 }}>Weight Category</th>
                <th className="text-left font-medium px-4 py-3 whitespace-normal" style={{ maxWidth: 110 }}>Vehicle Type</th>
                <SortableTh label="Rate (PKR)" active={rateSortCol === "rate"} direction={rateSortDir} onSort={(dir) => sortRate("rate", dir)} className="text-left font-medium px-4 py-3 whitespace-normal" />
                {canCalculate && <th className="text-left font-medium px-4 py-3 whitespace-normal" style={{ maxWidth: 130 }}>Adjusted Rate ({fmtDate(calcDate)})</th>}
                <th className={thCls}></th>
              </tr>
            </thead>
            <tbody>
              {rows.map((k) => {
                const adjusted = adjustedRateFor(k.rate);
                return (
                  <tr key={k.id} className={trCls}>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 110 }}>{k.loadingPoint}</td>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 110 }}>{k.destination}</td>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 110 }}>{k.movementThrough || "—"}</td>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 90 }}>{k.vehicleSize || "—"}</td>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 110 }}>{k.weightCategory || "—"}</td>
                    <td className="px-4 py-3 text-slate-300 whitespace-normal" style={{ maxWidth: 110 }}>{k.axleLoadCategory || "—"}</td>
                    <td className="px-4 py-3 whitespace-normal text-white font-medium" style={{ maxWidth: 100 }}>{formatPKR(k.rate)}</td>
                    {canCalculate && <td className="px-4 py-3 whitespace-normal text-emerald-400 font-medium" style={{ maxWidth: 130 }}>{adjusted !== null ? formatPKR(adjusted) : "—"}</td>}
                    <td className={tdCls}>
                      <div className="flex items-center gap-1 justify-end">
                        <button className={iconBtn} onClick={() => openModal({ type: "contract", mode: "edit", item: k })}><Pencil size={15} /></button>
                        <button className={iconBtnDanger} onClick={() => askDelete({ entity: "contracts", id: k.id, label: "contract rate" })}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ==================== Fuel Management (Finance Manager + Admin) ==================== */

// Flattens a customer's orders into their containers, tagging each container with
// the parent order's number and shipment type — the source data for fuel reporting.
// Rented trucks are entered per-container on the Tracking page, so vehiclePlate here
// is the free-text plate assigned to that specific trip, not a Fleet record.
function customerOrderContainers(data, customerId) {
  return data.orders
    .filter((o) => o.customerId === customerId)
    .flatMap((o) => orderContainers(o).map((c) => ({ ...c, orderNumber: o.orderNumber, shipmentType: o.shipmentType || "Import", origin: o.origin })));
}

// Groups containers by rented vehicle plate (case/whitespace-normalized) and sums fuel & freight.
function groupFuelByVehicle(containers, fuelPrices) {
  const map = new Map();
  containers.forEach((c) => {
    const plateRaw = (c.vehiclePlate || "").trim();
    const key = plateRaw ? plateRaw.toUpperCase() : "__unassigned__";
    if (!map.has(key)) map.set(key, { plate: plateRaw || "Unassigned", drivers: new Set(), trips: 0, fuelTotal: 0, freightTotal: 0 });
    const g = map.get(key);
    g.trips += 1;
    const price = fuelPriceOnDate(fuelPrices, c.dispatchAt ? toLocalDateStr(new Date(c.dispatchAt)) : "");
    g.fuelTotal += computeFuelAmount(c.freightAmount, price) || 0;
    g.freightTotal += xnum(c.freightAmount);
    if (c.driverName) g.drivers.add(c.driverName);
  });
  return Array.from(map.values()).sort((a, b) => b.fuelTotal - a.fuelTotal || b.trips - a.trips);
}

      ) : (

            const fuelTotal = vehicleGroups.reduce((s, g) => s + g.fuelTotal, 0);

function CustomerFuelDetail({ customer, data, openModal, askDelete, onBack, fuelPriceExcel, onFuelPriceAttach, onFuelPriceExport, onFuelPriceRevert, swapExcel, onSwapAttach, onSwapExport, onSwapRevert, onSwapRecalculate }) {
  const [tab, setTab] = useState("domestic_import"); // "domestic_import" | "export" | "swap_report" | "fuel_price"
  const [fuelPriceMode, setFuelPriceMode] = useState("daily"); // daily | fortnightly | monthly
  const [selectedFuelPriceIds, setSelectedFuelPriceIds] = useState(new Set());
  const [consumptionSortCol, setConsumptionSortCol] = useState("date");
  const [consumptionSortDir, setConsumptionSortDir] = useState("desc");
  function sortConsumption(col, dir) { setConsumptionSortCol(col); setConsumptionSortDir(dir); }
  const allContainers = useMemo(() => customerOrderContainers(data, customer.id), [data.orders, customer.id]);
  const tabContainers = useMemo(
    () => allContainers.filter((c) => (tab === "export" ? c.shipmentType === "Export" : c.shipmentType !== "Export")),
    [allContainers, tab]
  );
  // Every fuel-card-swap entry for this customer — needed early since the domestic_import
  // tab's rows computation below nets swapped fuel out of the Receivable figures.
  const swaps = useMemo(
    () => (data.fuel_card_swaps || [])
      .filter((s) => s.customerId === customer.id)
      .sort((a, b) => (b.swapDate || "").localeCompare(a.swapDate || "")),
    [data.fuel_card_swaps, customer.id]
  );
  // Contract rates for this customer, with their parent contract group (for Fuel Base Rate)
  // pre-attached — used only by the domestic_import tab's automatic rate lookup below.
  const customerRates = useMemo(() => {
    const groupsById = new Map((data.contract_groups || []).map((g) => [g.id, g]));
    return (data.contracts || [])
      .filter((k) => k.customerId === customer.id)
      .map((k) => ({ ...k, group: k.contractGroupId ? groupsById.get(k.contractGroupId) : null }));
  }, [data.contracts, data.contract_groups, customer.id]);

  // Finds the contract rate matching a shipment's Loading Point, Destination, Vehicle Size,
  // and Movement Through. Axle Load Category is deliberately NOT part of this match — there
  // is no such field anywhere on an order or container to compare it against, only on
  // contract rates themselves, so it can't be used to narrow down a shipment's match.
  function matchContractRate(c) {
    const norm = (v) => (v || "").trim().toLowerCase();
    const loadingPoint = norm(c.origin);
    const destination = norm(c.destination);
    const vehicleSize = norm(c.vehicleSize || c.containerSize);
    const movementThrough = norm(c.movementThrough);
    return customerRates.find((k) =>
      norm(k.loadingPoint) === loadingPoint &&
      norm(k.destination) === destination &&
      norm(k.vehicleSize) === vehicleSize &&
      norm(k.movementThrough) === movementThrough
    ) || null;
  }

  // One row per dispatched shipment — Month/Dispatch Date only make sense once a container has actually been dispatched.
  const rows = useMemo(() => {
    // A swap entry belongs to a DATE, not to any specific shipment — if several shipments
    // dispatch on the same date, the swap total must only be counted once, not repeated in
    // full on every one of them (that would both show the wrong number per row and subtract
    // the same swap amount from Receivable multiple times). Credit it to whichever shipment
    // dispatched earliest that day; every other shipment on that date shows no swap at all.
    const claimedSwapDates = new Set();
    const containersInDispatchOrder = [...tabContainers]
      .filter((c) => !!c.dispatchAt)
      .sort((a, b) => new Date(a.dispatchAt) - new Date(b.dispatchAt));

    const mapped = containersInDispatchOrder
      .map((c) => {
        const d = new Date(c.dispatchAt);
        const dispatchDateISO = toLocalDateStr(d);
        const price = resolveEffectiveFuelPrice(data.fuel_prices, dispatchDateISO, fuelPriceMode);
        const manualFreightAmount = xnum(c.freightAmount);

        if (tab !== "domestic_import") {
          // Export tab keeps its existing, unrelated calculation entirely as-is.
          const fuelAmount = computeFuelAmount(manualFreightAmount, price);
          return {
            id: c.id, dispatchAtRaw: d.getTime(), month: fmtMonthYear(d),
            dispatchDate: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`,
            vehiclePlate: (c.vehiclePlate || "").trim() || "Unassigned",
            freightAmount: manualFreightAmount, fuelAmount, net: manualFreightAmount - (fuelAmount || 0),
          };
        }

        // Domestic/Import: Freight is auto-retrieved from the matching contract rate rather
        // than relying on what was manually typed into the dispatch form — falls back to the
        // manual entry only when no contract rate matches this shipment at all.
        const matchedRate = matchContractRate(c);
        const freightAmount = matchedRate ? xnum(matchedRate.rate) : manualFreightAmount;
        const base = {
          id: c.id, dispatchAtRaw: d.getTime(), month: fmtMonthYear(d),
          dispatchDate: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`,
          vehiclePlate: (c.vehiclePlate || "").trim() || "Unassigned",
          freightAmount,
        };

        // Automatic contract-rate lookup + fuel escalation, minus any fuel already swapped on
        // the same date, matching the design set for Contract Rates.
        const fuelBaseRate = matchedRate && matchedRate.group ? xnum(matchedRate.group.fuelBaseRate, null) : null;
        const fuelComponentAmount = matchedRate ? xnum(matchedRate.rate) * 0.5 : null;
        const impliedLitres = (fuelComponentAmount !== null && fuelBaseRate) ? fuelComponentAmount / fuelBaseRate : null;
        const receivablePKR = (impliedLitres !== null && price) ? impliedLitres * price : null;
        const receivableLitres = impliedLitres;

        let swappedLitres = 0, swappedPKR = 0;
        if (!claimedSwapDates.has(dispatchDateISO)) {
          const swapsOnDate = swaps.filter((s) => s.swapDate === dispatchDateISO);
          if (swapsOnDate.length > 0) {
            swappedLitres = swapsOnDate.reduce((sum, s) => sum + (xnum(s.qtyLtr) || 0), 0);
            swappedPKR = swapsOnDate.reduce((sum, s) => sum + (xnum(s.amountPkr) || 0), 0);
            claimedSwapDates.add(dispatchDateISO);
          }
        }

        return {
          ...base,
          matchedRate, fuelBaseRate, fuelComponentAmount, priceOnDate: price,
          // A swap must never be silently lost. If there's no contract-based Receivable to
          // subtract it from (receivablePKR/Litres is null), but there IS a swapped amount,
          // that swap still counts — it becomes a negative Receivable (money owed back),
          // rather than vanishing (null gets treated as 0 in group/grand totals).
          receivablePKR: receivablePKR !== null ? receivablePKR - swappedPKR : (swappedPKR > 0 ? -swappedPKR : null),
          receivableLitres: receivableLitres !== null ? receivableLitres - swappedLitres : (swappedLitres > 0 ? -swappedLitres : null),
          swappedLitres, swappedPKR,
        };
      });

    // Swap entries on a date with no dispatched shipment would otherwise never show up in this
    // report at all — add a synthetic row per such date so the swapped quantity is never
    // silently dropped. Freight/Receivable are genuinely not applicable (there's no shipment
    // to calculate them from), shown as "No dispatch" rather than 0 or blank.
    let withOrphans = mapped;
    if (tab === "domestic_import") {
      const coveredDates = new Set(tabContainers.filter((c) => !!c.dispatchAt).map((c) => toLocalDateStr(new Date(c.dispatchAt))));
      const swapDates = Array.from(new Set(swaps.map((s) => s.swapDate).filter(Boolean)));
      const orphanRows = swapDates
        .filter((sd) => !coveredDates.has(sd))
        .map((sd) => {
          const d = new Date(sd + "T00:00:00");
          const swapsOnDate = swaps.filter((s) => s.swapDate === sd);
          const swappedLitres = swapsOnDate.reduce((sum, s) => sum + (xnum(s.qtyLtr) || 0), 0);
          const swappedPKR = swapsOnDate.reduce((sum, s) => sum + (xnum(s.amountPkr) || 0), 0);
          return {
            id: `swap-only-${sd}`, dispatchAtRaw: d.getTime(), month: fmtMonthYear(d),
            dispatchDate: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`,
            vehiclePlate: "—", freightAmount: 0,
            matchedRate: null, fuelBaseRate: null, fuelComponentAmount: null, priceOnDate: null,
            // No shipment exists on this date at all, so there's nothing to offset the swap
            // against — it's entirely owed back, shown as a negative Receivable rather than
            // null (which would make it vanish from group/grand totals, exactly like before).
            receivablePKR: swappedPKR > 0 ? -swappedPKR : null,
            receivableLitres: swappedLitres > 0 ? -swappedLitres : null,
            swappedLitres, swappedPKR, noDispatch: true,
          };
        });
      withOrphans = [...mapped, ...orphanRows];
    }

    const consumptionComparators = {
      date: (a, b) => a.dispatchAtRaw - b.dispatchAtRaw,
      vehicle: (a, b) => a.vehiclePlate.localeCompare(b.vehiclePlate),
      freight: (a, b) => a.freightAmount - b.freightAmount,
    };
    const sorted = [...withOrphans].sort((a, b) => {
      const cmp = consumptionComparators[consumptionSortCol](a, b);
      return consumptionSortDir === "desc" ? -cmp : cmp;
    });
    return sorted;
  }, [tabContainers, data.fuel_prices, tab, customerRates, swaps, consumptionSortCol, consumptionSortDir, fuelPriceMode]);
  const grandFuel = rows.reduce((s, r) => s + (r.fuelAmount || 0), 0);
  const grandFreight = rows.reduce((s, r) => s + r.freightAmount, 0);
  const grandNet = grandFreight - grandFuel;
  const grandReceivablePKR = rows.reduce((s, r) => s + (r.receivablePKR || 0), 0);
  const grandReceivableLitres = rows.reduce((s, r) => s + (r.receivableLitres || 0), 0);
  const grandSwappedPKR = rows.reduce((s, r) => s + (r.swappedPKR || 0), 0);
  const grandSwappedLitres = rows.reduce((s, r) => s + (r.swappedLitres || 0), 0);

  // Groups consecutive rows sharing the same Month under one collapsible header — shared by
  // both the domestic_import and export tabs since they both use `rows`.
  const [collapsedMonths, setCollapsedMonths] = useState(new Set());
  function toggleMonth(key) {
    setCollapsedMonths((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }
  const monthGroups = useMemo(() => {
    const groups = [];
    rows.forEach((r) => {
      const key = r.month || "";
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push(r);
      else groups.push({ key, items: [r] });
    });
    return groups;
  }, [rows]);

  // Group by month just to build the month filter dropdown's options.
  const swapGroups = useMemo(() => {
    const map = new Map();
    swaps.forEach((s) => {
      const key = (s.swapDate || "").slice(0, 7) || "unknown";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
    });
    return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
  }, [swaps]);
  const [swapMonthFilter, setSwapMonthFilter] = useState("all");
  const [swapDeptFilter, setSwapDeptFilter] = useState("all");
  const [swapSwappedByFilter, setSwapSwappedByFilter] = useState("all");
  const [swapCardFilter, setSwapCardFilter] = useState("all");
  const [swapSortCol, setSwapSortCol] = useState("date");
  const [swapSortDir, setSwapSortDir] = useState("desc");
  function sortSwaps(col, dir) { setSwapSortCol(col); setSwapSortDir(dir); }
  const swapComparators = {
    date: (a, b) => (a.swapDate || "").localeCompare(b.swapDate || ""),
    card: (a, b) => (a.cardNumber || "").localeCompare(b.cardNumber || ""),
    amount: (a, b) => (xnum(a.amountPkr) || 0) - (xnum(b.amountPkr) || 0),
  };
  // Scan every swap entry for this customer to build the Swapped By / Card No. filter
  // options — no fixed list, whatever's actually been entered shows up to pick from.
  const swappedByOptions = useMemo(
    () => Array.from(new Set(swaps.map((s) => s.swappedBy).filter(Boolean))).sort(),
    [swaps]
  );
  const cardNumberOptions = useMemo(
    () => Array.from(new Set(swaps.map((s) => s.cardNumber).filter(Boolean))).sort(),
    [swaps]
  );
  const filteredSwaps = useMemo(() => {
    let list = swapMonthFilter === "all" ? swaps : (swapGroups.find(([key]) => key === swapMonthFilter)?.[1] || []);
    if (swapDeptFilter !== "all") list = list.filter((s) => s.department === swapDeptFilter);
    if (swapSwappedByFilter !== "all") list = list.filter((s) => s.swappedBy === swapSwappedByFilter);
    if (swapCardFilter !== "all") list = list.filter((s) => s.cardNumber === swapCardFilter);
    return [...list].sort((a, b) => {
      const cmp = swapComparators[swapSortCol](a, b);
      return swapSortDir === "desc" ? -cmp : cmp;
    });
  }, [swaps, swapGroups, swapMonthFilter, swapDeptFilter, swapSwappedByFilter, swapCardFilter, swapSortCol, swapSortDir]);

  // Groups consecutive rows sharing the same Swap Date under one collapsible header — collapsed
  // by clicking that header, independently per date.
  const [collapsedSwapDates, setCollapsedSwapDates] = useState(new Set());
  function toggleSwapDate(key) {
    setCollapsedSwapDates((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });
  }
  const swapDateGroups = useMemo(() => {
    const groups = [];
    filteredSwaps.forEach((s) => {
      const key = s.swapDate || "";
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push(s);
      else groups.push({ key, items: [s] });
    });
    return groups;
  }, [filteredSwaps]);

  const tabBtnCls = (active) => cx(
    "px-4 py-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap",
    active ? "border-blue-600 text-white" : "border-transparent text-slate-500 hover:text-slate-300"
  );

  const [fuelPriceSortCol, setFuelPriceSortCol] = useState("date");
  const [fuelPriceSortDir, setFuelPriceSortDir] = useState("desc");
  function sortFuelPrices(col, dir) { setFuelPriceSortCol(col); setFuelPriceSortDir(dir); }
  const fuelPriceComparators = {
    date: (a, b) => (a.effectiveDate || "").localeCompare(b.effectiveDate || ""),
    price: (a, b) => (xnum(a.pricePerLiter) || 0) - (xnum(b.pricePerLiter) || 0),
  };
  const fuelPrices = useMemo(() => {
    const sorted = [...(data.fuel_prices || [])];
    return sorted.sort((a, b) => {
      const cmp = fuelPriceComparators[fuelPriceSortCol](a, b);
      return fuelPriceSortDir === "desc" ? -cmp : cmp;
    });
  }, [data.fuel_prices, fuelPriceSortCol, fuelPriceSortDir]);
  // Keeps the selection in sync with what actually still exists — deleteItem lives at the top
  // level and has no way to reach into this component's local selection state directly, so
  // instead of trying to clear it manually after every delete path (bulk delete, single-row
  // delete, revert, etc.), this just prunes anything no longer present whenever the
  // underlying data changes.
  useEffect(() => {
    setSelectedFuelPriceIds((prev) => {
      if (prev.size === 0) return prev;
      const validIds = new Set(fuelPrices.map((p) => p.id));
      const next = new Set(Array.from(prev).filter((id) => validIds.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [fuelPrices]);

  return (
    <div className="space-y-5">
      <button onClick={onBack} className="text-slate-400 hover:text-white text-sm inline-flex items-center gap-1"><ArrowLeft size={14} /> Back to Fuel Management</button>
      <div>
        <h2 className="text-2xl font-bold text-white">{customer.name}</h2>
        <p className="text-slate-500 text-sm mt-1">Fuel Amount is calculated automatically from Freight and the fuel price on file for that date</p>
      </div>

      <div className="flex border-b border-slate-800 overflow-x-auto">
        <button className={tabBtnCls(tab === "domestic_import")} onClick={() => setTab("domestic_import")}>Import &amp; Domestic Fuel Consumption Report</button>
        <button className={tabBtnCls(tab === "export")} onClick={() => setTab("export")}>Export Fuel Consumption Report</button>
        <button className={tabBtnCls(tab === "swap_report")} onClick={() => setTab("swap_report")}>Fuel Card Swapping Report</button>
        <button className={tabBtnCls(tab === "fuel_price")} onClick={() => setTab("fuel_price")}>Fuel Price</button>
      </div>

      {tab === "swap_report" ? (
        <div className="space-y-4">
          <div className="flex items-start justify-between flex-wrap gap-3">
            <TabExcelBar
              label="Fuel Card Swaps"
              meta={(swapExcel || {})[customer.id]}
              onAttachFile={(file) => onSwapAttach(customer.id, file)}
              onExport={() => onSwapExport(customer.id, customer.name)}
              onRevert={() => onSwapRevert(customer.id)}
            />
            <button
              className={btnSecondary}
              onClick={() => askDelete({
                title: "Recalculate all swap amounts?",
                message: `This recomputes every existing entry's Amount (PKR) using the "${fuelPriceMode === "daily" ? "Daily" : fuelPriceMode === "fortnightly" ? "Fortnightly" : "Monthly"}" price currently selected on the Fuel Price tab. You can undo this afterward with Revert.`,
                confirmLabel: "Yes", danger: false,
                onConfirmAction: () => onSwapRecalculate(customer.id, fuelPriceMode),
              })}
            >
              <RefreshCw size={15} /> Recalculate Amounts
            </button>
          </div>
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-2 flex-wrap">
              <select className={inputCls} style={{ width: 180 }} value={swapMonthFilter} onChange={(e) => setSwapMonthFilter(e.target.value)}>
                <option value="all">All months</option>
                {swapGroups.map(([key]) => (
                  <option key={key} value={key}>{key === "unknown" ? "No date" : fmtMonthYear(new Date(key + "-01T00:00:00"))}</option>
                ))}
              </select>
              <select className={inputCls} style={{ width: 170 }} value={swapDeptFilter} onChange={(e) => setSwapDeptFilter(e.target.value)}>
                <option value="all">All departments</option>
                {SWAP_DEPARTMENTS.map((d) => <option key={d} value={d}>{d}</option>)}
              </select>
              <select className={inputCls} style={{ width: 170 }} value={swapSwappedByFilter} onChange={(e) => setSwapSwappedByFilter(e.target.value)}>
                <option value="all">All swapped by</option>
                {swappedByOptions.map((n) => <option key={n} value={n}>{n}</option>)}
              </select>
              <select className={inputCls} style={{ width: 170 }} value={swapCardFilter} onChange={(e) => setSwapCardFilter(e.target.value)}>
                <option value="all">All card numbers</option>
                {cardNumberOptions.map((n) => <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
            <button className={btnPrimary} onClick={() => openModal({ type: "fuel_card_swap", mode: "add", item: null, prefill: { customerId: customer.id }, meta: { fuelPriceMode } })}>
              <Plus size={16} /> Log Swap
            </button>
          </div>
          {swaps.length === 0 ? (
            <EmptyState
              icon={Fuel} text="No fuel card swaps logged yet for this customer."
              actionLabel="Log first swap"
              onAction={() => openModal({ type: "fuel_card_swap", mode: "add", item: null, prefill: { customerId: customer.id }, meta: { fuelPriceMode } })}
            />
          ) : filteredSwaps.length === 0 ? (
            <EmptyState icon={Fuel} text="No swaps match these filters." />
          ) : (
            <div className={tableWrap}>
              <table className="w-full text-sm">
                <thead className={theadCls}>
                  <tr>
                    <SortableTh label="Swap Date" active={swapSortCol === "date"} direction={swapSortDir} onSort={(dir) => sortSwaps("date", dir)} className={thCls} />
                    <th className={thCls}>Department</th>
                    <th className={thCls}>Swapped By</th>
                    <SortableTh label="Card No." active={swapSortCol === "card"} direction={swapSortDir} onSort={(dir) => sortSwaps("card", dir)} className={thCls} />
                    <th className={thCls}>Qty Ltr</th>
                    <SortableTh label="Amount in PKR" active={swapSortCol === "amount"} direction={swapSortDir} onSort={(dir) => sortSwaps("amount", dir)} className={thCls} />
                    <th className={thCls}></th>
                  </tr>
                </thead>
                <tbody>
                  {swapDateGroups.map((g) => {
                    const isCollapsed = collapsedSwapDates.has(g.key);
                    const dateLabel = g.key ? fmtDate(g.key) : "No date";
                    const groupTotal = g.items.reduce((s, x) => s + (xnum(x.amountPkr) || 0), 0);
                    const groupQty = g.items.reduce((s, x) => s + (xnum(x.qtyLtr) || 0), 0);
                    return (
                      <React.Fragment key={g.key || "no-date"}>
                        <tr className="bg-slate-800/40 hover:bg-slate-800/70 cursor-pointer border-b border-slate-800" onClick={() => toggleSwapDate(g.key)}>
                          <td className={cx(tdCls, "border-l-2 border-l-blue-600/30")}>
                            <div className="flex items-center gap-1.5">
                              {isCollapsed ? <ChevronRight size={14} className="text-slate-400" /> : <ChevronDown size={14} className="text-slate-400" />}
                              <span className="text-white font-medium">{dateLabel}</span>
                            </div>
                          </td>
                          <td className={tdCls}>{g.items.length} swap{g.items.length !== 1 ? "s" : ""}</td>
                          <td className={tdCls}>—</td>
                          <td className={cx(tdCls, "font-mono")}>—</td>
                          <td className={tdCls}>{groupQty.toLocaleString()}</td>
                          <td className={cx(tdCls, "text-white font-medium")}>{formatPKR(groupTotal)}</td>
                          <td className={tdCls}></td>
                        </tr>
                        {!isCollapsed && g.items.map((s) => (
                          <SwapRow key={s.id} s={s} dateLabel={s.swapDate ? fmtDate(s.swapDate) : "—"} openModal={openModal} askDelete={askDelete} fuelPriceMode={fuelPriceMode} />
                        ))}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      ) : tab === "fuel_price" ? (
        <div className="space-y-4">
          <p className="text-slate-500 text-xs">Fuel price is company-wide — set here, it applies when calculating Fuel Amount for every customer's shipments, not just {customer.name}.</p>
          <Field label="Fuel Price Period">
            <select className={inputCls} style={{ width: 280 }} value={fuelPriceMode} onChange={(e) => setFuelPriceMode(e.target.value)}>
              <option value="daily">Daily</option>
              <option value="fortnightly">Fortnightly</option>
              <option value="monthly">Monthly</option>
            </select>
            <p className="text-slate-500 text-xs mt-1">Doesn't change this list — controls which price the Import & Domestic and Export Consumption Reports use for their calculations. Fortnightly/Monthly use the price on file as of the 1st (or 16th) of the month for the whole period.</p>
          </Field>
          <TabExcelBar
            label="Fuel Prices"
            meta={fuelPriceExcel}
            onAttachFile={onFuelPriceAttach}
            onExport={onFuelPriceExport}
            onRevert={onFuelPriceRevert}
          />
          <div className="flex items-center justify-between flex-wrap gap-2">
            {selectedFuelPriceIds.size > 0 ? (
              <div className="flex items-center gap-3">
                <span className="text-slate-400 text-sm">{selectedFuelPriceIds.size} selected</span>
                <button className={btnSecondary} onClick={() => setSelectedFuelPriceIds(new Set())}>Clear</button>
                <button
                  className={btnDanger}
                  onClick={() => askDelete({ entity: "fuel_prices", id: Array.from(selectedFuelPriceIds), label: "fuel price entry" })}
                >
                  <Trash2 size={15} /> Delete Selected ({selectedFuelPriceIds.size})
                </button>
              </div>
            ) : <div />}
            <button className={btnPrimary} onClick={() => openModal({ type: "fuel_price", mode: "add", item: null })}>
              <Plus size={16} /> Add Fuel Price
            </button>
          </div>
          {fuelPrices.length === 0 ? (
            <EmptyState
              icon={Banknote} text="No fuel prices recorded yet."
              actionLabel="Add first fuel price"
              onAction={() => openModal({ type: "fuel_price", mode: "add", item: null })}
            />
          ) : (
            <div className={tableWrap}>
              <table className="w-full text-sm">
                <thead className={theadCls}>
                  <tr>
                    <th className={thCls} style={{ width: 36 }}>
                      <input
                        type="checkbox"
                        checked={selectedFuelPriceIds.size > 0 && selectedFuelPriceIds.size === fuelPrices.length}
                        onChange={(e) => setSelectedFuelPriceIds(e.target.checked ? new Set(fuelPrices.map((p) => p.id)) : new Set())}
                      />
                    </th>
                    <SortableTh label="Effective Date" active={fuelPriceSortCol === "date"} direction={fuelPriceSortDir} onSort={(dir) => sortFuelPrices("date", dir)} className={thCls} />
                    <SortableTh label="Price per Liter (PKR)" active={fuelPriceSortCol === "price"} direction={fuelPriceSortDir} onSort={(dir) => sortFuelPrices("price", dir)} className={thCls} />
                    <th className={thCls}></th>
                  </tr>
                </thead>
                <tbody>
                  {fuelPrices.map((p) => (
                    <tr key={p.id} className={trCls}>
                      <td className={tdCls}>
                        <input
                          type="checkbox"
                          checked={selectedFuelPriceIds.has(p.id)}
                          onChange={(e) => setSelectedFuelPriceIds((prev) => {
                            const next = new Set(prev);
                            if (e.target.checked) next.add(p.id); else next.delete(p.id);
                            return next;
                          })}
                        />
                      </td>
                      <td className={tdCls}>{p.effectiveDate ? fmtDate(p.effectiveDate) : "—"}</td>
                      <td className={cx(tdCls, "text-white font-medium")}>{formatPKR(p.pricePerLiter)}</td>

function FuelForm({ initial, prefill, vehicles, onSave, onCancel }) {

          <div><div className="text-slate-500 text-xs mb-0.5">Container Type</div><div className="text-slate-200">{selectedVehicle.type || "—"}</div></div>

/* ==================== Fuel Card Swap Log ====================
   Tracks a fuel card being moved between rented trucks over time, per customer.
   Uses a free-text vehicle plate (like the Tracking page) rather than a Fleet
   vehicle record, since trucks are rented per-shipment, not company-owned.
   Requires a `fuel_card_swaps` table in Supabase — see setup note in chat. */
const SWAP_DEPARTMENTS = ["Domestic + Import", "Export"];

// A single swap entry, rendered as a normal table row.
function SwapRow({ s, dateLabel, openModal, askDelete, fuelPriceMode }) {
  return (
    <tr className={trCls}>
      <td className={cx(tdCls, "border-l-2 border-l-blue-600/30")}>{dateLabel}</td>
      <td className={tdCls}>{s.department || "—"}</td>
      <td className={tdCls}>{s.swappedBy || "—"}</td>
      <td className={cx(tdCls, "font-mono")}>{s.cardNumber || "—"}</td>
      <td className={tdCls}>{s.qtyLtr || s.qtyLtr === 0 ? Number(s.qtyLtr).toLocaleString() : "—"}</td>
      <td className={cx(tdCls, "text-white font-medium")}>{s.amountPkr || s.amountPkr === 0 ? formatPKR(s.amountPkr) : "—"}</td>
      <td className={tdCls}>
        <div className="flex items-center gap-1 justify-end">
          <button className={iconBtn} onClick={() => openModal({ type: "fuel_card_swap", mode: "edit", item: s, meta: { fuelPriceMode } })}><Pencil size={15} /></button>
          <button className={iconBtnDanger} onClick={() => askDelete({ entity: "fuel_card_swaps", id: s.id, label: "fuel card swap entry" })}><Trash2 size={15} /></button>
        </div>
      </td>
    </tr>
  );
}

function FuelCardSwapForm({ initial, prefill, transporters, fuelPrices, fuelPriceMode, onSave, onCancel }) {
  const isEdit = !!initial;
  const f = initial || prefill || {};
  const [swapDate, setSwapDate] = useState(f.swapDate || "");
  const [department, setDepartment] = useState(f.department || "");
  const [swappedBy, setSwappedBy] = useState(f.swappedBy || "");
  const [cardNumber, setCardNumber] = useState(f.cardNumber || "");
  const [qtyLtr, setQtyLtr] = useState(f.qtyLtr ?? "");

  // Amount is no longer typed in directly — it's Qty (Ltr) x whichever fuel price applies to
  // the swap date under the Fuel Price tab's selected period (Daily/Fortnightly/Monthly), same
  // resolution used for the per-shipment Fuel Amount calculation.
  const priceOnDate = resolveEffectiveFuelPrice(fuelPrices, swapDate, fuelPriceMode);
  const computedAmount = priceOnDate && qtyLtr !== "" ? Number(qtyLtr) * priceOnDate : null;

  function submit(e) {
    e.preventDefault();
    if (!cardNumber.trim() || !department) return;
    onSave({
      id: f.id || genUUID(), customerId: f.customerId,
      swapDate, department, swappedBy: swappedBy.trim(), cardNumber: cardNumber.trim(),
      qtyLtr: qtyLtr === "" ? "" : Number(qtyLtr), amountPkr: computedAmount === null ? "" : computedAmount,
    });
  }

  return (
    <form onSubmit={submit}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Swap Date"><input type="date" className={inputCls} value={swapDate} onChange={(e) => setSwapDate(e.target.value)} required /></Field>
        <Field label="Department">
          <select className={inputCls} value={department} onChange={(e) => setDepartment(e.target.value)}>
            <option value="">Select department</option>
            {SWAP_DEPARTMENTS.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Swapped By">
        <DropdownWithCustom
          value={swappedBy} onChange={setSwappedBy} options={(transporters || []).map((t) => t.name)}
          selectPlaceholder="Select transporter" customPlaceholder="Company / person name"
        />
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Card No."><input className={inputCls} value={cardNumber} onChange={(e) => setCardNumber(e.target.value)} placeholder="e.g. 7001 0003 6875 3657" /></Field>
        <Field label="Qty (Ltr)"><input type="number" min="0" step="0.01" className={inputCls} value={qtyLtr} onChange={(e) => setQtyLtr(e.target.value)} /></Field>
      </div>
      <Field label="Amount in PKR (calculated automatically)">
        <div className={cx(inputCls, "bg-slate-900/60 text-slate-300")}>
          {computedAmount === null ? "No fuel price on file for this date" : formatPKR(computedAmount)}
        </div>
      </Field>
      <div className="flex justify-end gap-2 mt-2">
        <button type="button" className={btnSecondary} onClick={onCancel}>Cancel</button>
        <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Log Swap"}</button>
      </div>
    </form>
  );
}

// Company-wide fuel price (PKR per liter), effective from a given date — used to
// automatically calculate each shipment's Fuel Amount from its Freight Amount.
function FuelPriceForm({ initial, onSave, onCancel }) {
  const isEdit = !!initial;
  const f = initial || {};
  const [pricePerLiter, setPricePerLiter] = useState(f.pricePerLiter ?? "");
  const [effectiveDate, setEffectiveDate] = useState(f.effectiveDate || "");

  function submit(e) {
    e.preventDefault();
    if (pricePerLiter === "" || !effectiveDate) return;
    onSave({ id: f.id || genUUID(), pricePerLiter: Number(pricePerLiter), effectiveDate });
  }

  return (
    <form onSubmit={submit}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Price per Liter (PKR)"><input type="number" min="0" step="0.01" className={inputCls} value={pricePerLiter} onChange={(e) => setPricePerLiter(e.target.value)} placeholder="e.g. 281" /></Field>
        <Field label="Effective Date"><input type="date" className={inputCls} value={effectiveDate} onChange={(e) => setEffectiveDate(e.target.value)} required /></Field>
      </div>
      <p className="text-slate-600 text-xs -mt-1">Applies to shipments dispatched on or after this date, until a newer price is added.</p>
      <div className="flex justify-end gap-2 mt-2">
        <button type="button" className={btnSecondary} onClick={onCancel}>Cancel</button>
        <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Add Fuel Price"}</button>
      </div>
    </form>
  );
}

/* ==================== Activity Log (admin only) ==================== */

function ActivityLogView({ data }) {
  const [q, setQ] = useState("");

  const events = [];
  data.orders.forEach((o) => {
    const cust = getCustomer(data, o.customerId);
    orderContainers(o).forEach((c) => {
      (Array.isArray(c.history) ? c.history : []).forEach((h) => {
        events.push({
          ...h,
          orderNumber: o.orderNumber,
          containerNumber: c.containerNumber || "—",
          customerName: cust ? cust.name : "Unknown",
        });
      });
    });
  });
  events.sort((a, b) => new Date(b.at) - new Date(a.at));

  const rows = events.filter((e) => {
    const text = `${e.orderNumber} ${e.containerNumber} ${e.customerName} ${e.message} ${e.by || ""}`.toLowerCase();
    return !q || text.includes(q.toLowerCase());
  });

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-white">Activity Log</h2>
        <p className="text-slate-500 text-sm mt-1">Every change across every order — who did what, and when</p>
      </div>
      <SearchBox value={q} onChange={setQ} placeholder="Search by order, container, customer, person..." />
      {rows.length === 0 ? (
        <EmptyState icon={Clock} text="No activity recorded yet." />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                <th className={thCls}>When</th>
                <th className={thCls}>Who</th>
                <th className={thCls}>What</th>
                <th className={thCls}>Order</th>
                <th className={thCls}>Container</th>
                <th className={thCls}>Customer</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((e, i) => (
                <tr key={e.id || i} className={trCls}>
                  <td className={cx(tdCls, "text-slate-400 whitespace-nowrap")}>{fmtDateTime(e.at)}</td>
                  <td className={cx(tdCls, "text-white font-medium")}>{e.by || "—"}</td>
                  <td className={tdCls} style={{ whiteSpace: "normal", maxWidth: 320 }}>{e.message}</td>
                  <td className={cx(tdCls, "font-mono text-xs")}>{e.orderNumber}</td>
                  <td className={cx(tdCls, "font-mono text-xs")}>{e.containerNumber}</td>
                  <td className={tdCls}>{e.customerName}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Admin-only archive of every Completed order, regardless of age — the permanent record
// that dispatcher/receiver/Empty Return Receiver/Data Entry lose day-to-day visibility
// into once a container has been Completed for 2+ days (see isSettledOut).
function OrderHistoryView({ data, openModal }) {
  const [q, setQ] = useState("");

  const rows = [];
  data.orders.forEach((o) => {
    const cust = getCustomer(data, o.customerId);
    orderContainers(o).forEach((c) => {
      if (containerStatus(c, o.shipmentType) === "Completed") {
        rows.push({ order: o, container: c, customerName: cust ? cust.name : "Unknown" });
      }
    });
  });
  rows.sort((a, b) => (b.container.emptyReturnDate || "").localeCompare(a.container.emptyReturnDate || ""));

  const filtered = rows.filter(({ order: o, container: c, customerName }) => {
    const text = `${o.orderNumber} ${o.jobNumber || ""} ${customerName} ${c.containerNumber || ""} ${c.vehiclePlate || ""}`.toLowerCase();
    return !q || text.includes(q.toLowerCase());
  });

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-white">Order History</h2>
        <p className="text-slate-500 text-sm mt-1">Every completed order — these drop out of day-to-day views 2 days after completion, but stay here permanently</p>
      </div>
      <SearchBox value={q} onChange={setQ} placeholder="Search by order, customer, container, vehicle..." />
      {filtered.length === 0 ? (
        <EmptyState icon={CheckCircle2} text="No completed orders yet." />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                <th className={thCls}>Job No.</th>
                <th className={thCls}>Customer</th>
                <th className={thCls}>Container No.</th>
                <th className={thCls}>Vehicle No.</th>
                <th className={thCls}>Completed On</th>
                <th className={thCls}>Notes</th>
                <th className={thCls}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(({ order: o, container: c, customerName }) => (
                <tr key={c.id} className={trCls}>

/* ==================== Manage Users (admin only) ==================== */

function ManageUsersView() {
  const [profiles, setProfiles] = useState(null);
  const [error, setError] = useState(null);
  const ROLE_OPTIONS = Object.keys(ROLE_LABELS);

  useEffect(() => {
    (async () => {
      const { data: rows, error: err } = await supabaseClient.from("profiles").select("*");
      if (err) { setError(err.message); return; }
      setProfiles((rows || []).map(fromDbRow));
    })();
  }, []);

  async function changeRole(id, role) {
    const { error: err } = await supabaseClient.from("profiles").update({ role }).eq("id", id);
    if (err) { window.alert("Couldn't update role: " + err.message); return; }
    setProfiles((prev) => prev.map((p) => (p.id === id ? { ...p, role } : p)));
  }

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-white">Manage Users</h2>
        <p className="text-slate-500 text-sm mt-1">Assign roles to team accounts. New accounts are created by an administrator in the Supabase dashboard (Authentication → Users) — signup is disabled in the app.</p>
      </div>
      {error && <div className={cx(cardCls, "p-4 text-red-400 text-sm")}>{error}</div>}
      {!profiles ? (
        <div className="text-slate-500 text-sm">Loading…</div>
      ) : profiles.length === 0 ? (
        <EmptyState icon={Users} text="No user profiles found." />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr><th className={thCls}>Name</th><th className={thCls}>Role</th></tr>
            </thead>
            <tbody>
              {profiles.map((p) => (
                <tr key={p.id} className={trCls}>
                  <td className={cx(tdCls, "text-white font-medium")}>{p.name || p.id}</td>
                  <td className={tdCls}>
                    <select className={inputCls} style={{ width: 220 }} value={p.role} onChange={(e) => changeRole(p.id, e.target.value)}>
                      {ROLE_OPTIONS.map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function OrderForm({ initial, customers, senders, drivers, vehicles, data, presetShipmentType, role, onSave, onCancel }) {
  const isEdit = !!initial;
  const o = initial || {};
  const [customerId, setCustomerId] = useState(o.customerId || "");
  const [origin, setOrigin] = useState(o.origin || "");
  const [description, setDescription] = useState(o.description || "");
  const [eta, setEta] = useState(o.eta || "");
  const [shipping, setShipping] = useState(() => {
    const init = {};
    SHIPPING_FIELDS.forEach((f) => { init[f.key] = o[f.key] || f.default || ""; });
    return init;
  });
  const [containers, setContainers] = useState(() => {
    if (Array.isArray(o.containers) && o.containers.length) return o.containers;
    return [emptyContainer()];
  });
  const [expandedIds, setExpandedIds] = useState(() => new Set());
  const [domesticCategory, setDomesticCategory] = useState(o.domesticCategory || "");
  const [senderId, setSenderId] = useState(o.senderId || "");
  const [senderAddress, setSenderAddress] = useState(o.senderAddress || "");
  const selectedCustomer = customers.find((cu) => cu.id === customerId);
  const savedAddresses = (selectedCustomer && Array.isArray(selectedCustomer.deliveryAddresses)) ? selectedCustomer.deliveryAddresses : [];
  const senderList = senders || [];
  const selectedSender = senderList.find((sd) => sd.id === senderId);
  const senderAddresses = (selectedSender && Array.isArray(selectedSender.addresses)) ? selectedSender.addresses : [];
  const driverOptions = drivers.filter((d) => d.role === "Driver");

  function setShippingField(key, val) {
    setShipping((s) => ({ ...s, [key]: val }));
  }
  function toggleExpanded(id) {
    setExpandedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }
  function addContainer() {
    const nc = emptyContainer();
    setContainers((cs) => [...cs, nc]);
    setExpandedIds((prev) => new Set(prev).add(nc.id));
  }
  function removeContainer(id) {
    setContainers((cs) => (cs.length > 1 ? cs.filter((c) => c.id !== id) : cs));
  }
  function setContainerField(id, key, val) {
    setContainers((cs) => cs.map((c) => (c.id === id ? { ...c, [key]: val } : c)));
  }
  function setContainerStatus(id, statusChoice) {
    const st = presetShipmentType || o.shipmentType || "Import";
    const stageMap = st === "Domestic"
      ? { Confirmed: 0, "Picked Up": 1, "In Transit": 2, "Under Offloading": 3, Delivered: 4 }
      : st === "Import"
      ? { Confirmed: 0, "In Transit": 2, "Under Offloading": 3, Delivered: 4, Completed: 5 }
      : { Confirmed: 0, "In Transit": 2, Delivered: 3 };
    const deliveredAtIndex = (st === "Domestic" || st === "Import") ? 4 : 3;
    setContainers((cs) => cs.map((c) => {
      if (c.id !== id) return c;
      if (statusChoice === "Cancelled") return { ...c, cancelled: true };
      return {
        ...c, cancelled: false, stageIndex: stageMap[statusChoice],
        deliveredDate: (stageMap[statusChoice] >= deliveredAtIndex) ? (c.deliveredDate || todayISO()) : c.deliveredDate,
      };
    }));
  }

  const resolvedShipmentType = presetShipmentType || o.shipmentType || "Import";

  function downloadThisContainer(container) {
    const orderLike = {
      orderNumber: o.orderNumber || genOrderNumber(), customerId, senderId, senderAddress, origin,
      createdDate: o.createdDate || todayISO(), description,
      bondedStatus: shipping.bondedStatus, shipmentType: resolvedShipmentType,
      containers: [container],
    };
    downloadBiltyReceipt(orderLike, { customers, senders: senderList, vehicles });
  }

  function submit(e) {
    e.preventDefault();
    if (!customerId || !origin.trim()) return;
    const cleanContainers = containers.filter((c) => c.containerNumber.trim() || c.sealNumber.trim());
    onSave({
      id: o.id || uid("ord"),
      orderNumber: o.orderNumber || genOrderNumber(),
      customerId, origin: origin.trim(), description: description.trim(),
      createdDate: o.createdDate || todayISO(),
      eta,
      ...shipping,
      cargoType: resolvedShipmentType, // Cargo Type always mirrors Shipment Type - not independently editable
      shipmentType: resolvedShipmentType,
      domesticCategory: resolvedShipmentType === "Domestic" ? domesticCategory : "",
      senderId,
      senderAddress,
      containers: cleanContainers,
    });
  }

  if (resolvedShipmentType === "Domestic") {
    // Domestic Orders (Finished Goods / Wrapping Materials) get their own minimal form —
    // only Customer, Sender, and the fields the data entry operator is responsible for.
    // No repeatable container/shipment structure here — just one flat set of fields.
    // Vehicle No. and Transporter Name are deliberately absent here: those are the
    // dispatcher's fields, entered later through the dispatch form (see DispatchModal).
    const dc = containers[0] || emptyContainer();
    function submitDomestic(e) {
      e.preventDefault();
      if (!customerId || !origin.trim()) return;
      onSave({
        id: o.id || uid("ord"),
        orderNumber: o.orderNumber || genOrderNumber(),
        customerId, origin: origin.trim(), description: "",
        createdDate: o.createdDate || todayISO(),
        eta,
        cargoType: "Domestic", shipmentType: "Domestic",
        domesticCategory,
        bondedStatus: "Non-Bonded",
        senderId, senderAddress,
        containers: [dc],
      });
    }
    return (
      <form onSubmit={submitDomestic}>
        <div className="mb-3 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-600/10 text-blue-400 border border-blue-800/50">
          Domestic Order
        </div>
        <Field label="Domestic Category">
          <select className={inputCls} value={domesticCategory} onChange={(e) => setDomesticCategory(e.target.value)}>
            <option value="">Select category</option>
            {DOMESTIC_CATEGORIES.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Customer">
            <select className={inputCls} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
              <option value="">Select customer</option>
              {customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            {customers.length === 0 && <p className="text-amber-500 text-xs mt-1.5">Add a customer first from the Customers page.</p>}
          </Field>
          <Field label="Sender Name">
            <select className={inputCls} value={senderId} onChange={(e) => { setSenderId(e.target.value); setSenderAddress(""); }}>
              <option value="">Select sender (optional)</option>
              {senderList.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Sender Address">
          {senderAddresses.length > 0 && (
            <select
              className={inputCls}
              value={senderAddresses.some((a) => a.address === senderAddress) ? senderAddress : "__custom__"}
              onChange={(e) => setSenderAddress(e.target.value === "__custom__" ? "" : e.target.value)}
            >
              <option value="__custom__">— Type a custom address —</option>
              {senderAddresses.map((a) => <option key={a.id} value={a.address}>{a.label ? `${a.label}: ` : ""}{a.address}</option>)}
            </select>
          )}
          {(senderAddresses.length === 0 || !senderAddresses.some((a) => a.address === senderAddress)) && (
            <input
              className={inputCls}
              style={senderAddresses.length > 0 ? { marginTop: 8 } : undefined}
              value={senderAddress}
              onChange={(e) => setSenderAddress(e.target.value)}
              placeholder="Full pickup / warehouse address"
            />
          )}
        </Field>
        <Field label="Est. Delivery Date"><input type="date" className={inputCls} value={eta} onChange={(e) => setEta(e.target.value)} /></Field>

        <div className="mt-4 pt-3 border-t border-slate-800 space-y-2">
          <div className="grid grid-cols-2 gap-2">
            <Field label="PO / SAP No."><input className={inputCls} value={dc.poSapNo || ""} onChange={(e) => setContainerField(dc.id, "poSapNo", e.target.value)} /></Field>
            <Field label="Movement Through">
              <select className={inputCls} value={dc.movementThrough || ""} onChange={(e) => setContainerField(dc.id, "movementThrough", e.target.value)}>
                <option value="">Select</option>
                {MOVEMENT_THROUGH_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Loading Date"><input type="date" className={inputCls} value={dc.loadingDate || ""} onChange={(e) => setContainerField(dc.id, "loadingDate", e.target.value)} /></Field>
            <Field label="Vehicle Size">
              <select className={inputCls} value={dc.vehicleSize || ""} onChange={(e) => setContainerField(dc.id, "vehicleSize", e.target.value)}>
                <option value="">Select</option>
                {CONTAINER_SIZES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
          </div>
          <Field label="Loading Point"><input className={inputCls} value={origin} onChange={(e) => setOrigin(e.target.value)} placeholder="e.g. Karachi" /></Field>
          <Field label="Destination"><input className={inputCls} value={dc.destination} onChange={(e) => setContainerField(dc.id, "destination", e.target.value)} /></Field>
          {role !== "data_entry" && (
            <Field label="Status">
              <select
                className={inputCls}
                value={dc.cancelled ? "Cancelled" : (dc.stageIndex >= 4 ? "Delivered" : dc.stageIndex >= 3 ? "Under Offloading" : dc.stageIndex >= 2 ? "In Transit" : dc.stageIndex >= 1 ? "Picked Up" : "Confirmed")}
                onChange={(e) => setContainerStatus(dc.id, e.target.value)}
              >
                {DOMESTIC_STAGES.concat("Cancelled").map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
          )}
        </div>

        <div className="flex justify-end gap-2 mt-4">
          <button type="button" onClick={onCancel} className={btnSecondary}>Cancel</button>
          <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Create Order"}</button>
        </div>
      </form>
    );
  }

  return (
    <form onSubmit={submit}>
      <div className="mb-3 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-600/10 text-blue-400 border border-blue-800/50">
        {resolvedShipmentType} Order
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Customer">
          <select className={inputCls} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
            <option value="">Select customer</option>
            {customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          {customers.length === 0 && <p className="text-amber-500 text-xs mt-1.5">Add a customer first from the Customers page.</p>}
        </Field>
        <Field label="Sender Name">
          <select
            className={inputCls}
            value={senderId}
            onChange={(e) => { setSenderId(e.target.value); setSenderAddress(""); }}
          >
            <option value="">Select sender (optional)</option>
            {senderList.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          {senderList.length === 0 && <p className="text-slate-500 text-xs mt-1.5">No senders saved yet — add one from the Senders page to get a dropdown here.</p>}
        </Field>
      </div>

      <Field label="Sender Address">
        {senderAddresses.length > 0 && (
          <select
            className={inputCls}
            value={senderAddresses.some((a) => a.address === senderAddress) ? senderAddress : "__custom__"}
            onChange={(e) => setSenderAddress(e.target.value === "__custom__" ? "" : e.target.value)}
          >
            <option value="__custom__">— Type a custom address —</option>
            {senderAddresses.map((a) => <option key={a.id} value={a.address}>{a.label ? `${a.label}: ` : ""}{a.address}</option>)}
          </select>
        )}
        {(senderAddresses.length === 0 || !senderAddresses.some((a) => a.address === senderAddress)) && (
          <input
            className={inputCls}
            style={senderAddresses.length > 0 ? { marginTop: 8 } : undefined}
            value={senderAddress}
            onChange={(e) => setSenderAddress(e.target.value)}
            placeholder="Full pickup / warehouse address"
          />
        )}

      <Field label="Est. Delivery Date"><input type="date" className={inputCls} value={eta} onChange={(e) => setEta(e.target.value)} /></Field>

      <div className="pt-3 mt-1 mb-3 border-t border-slate-800">
        <h4 className="text-slate-300 text-sm font-semibold">Shipment Details</h4>
        <p className="text-slate-500 text-xs mt-0.5">Customs &amp; documentation info — shown on the bilty receipt.</p>
      </div>
      <div className="grid grid-cols-2 gap-3">
        {SHIPPING_FIELDS.map((f) => (
          <Field key={f.key} label={f.label}>

                {f.options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}

  );

  function addAddress() {
    setDeliveryAddresses((a) => [...a, { id: uid("addr"), label: "", address: "" }]);
  }
  function removeAddress(id) {
    setDeliveryAddresses((a) => (a.length > 1 ? a.filter((x) => x.id !== id) : a));
  }
  function setAddressField(id, key, val) {
    setDeliveryAddresses((a) => a.map((x) => (x.id === id ? { ...x, [key]: val } : x)));

function TransporterForm({ initial, onSave, onCancel }) {
  const isEdit = !!initial;
  const s = initial || {};
  const [name, setName] = useState(s.name || "");
  const [email, setEmail] = useState(s.email || "");
  const [phone, setPhone] = useState(s.phone || "");
  const [contact, setContact] = useState(s.contact || "");
  const [addresses, setAddresses] = useState(() =>
    Array.isArray(s.addresses) && s.addresses.length
      ? s.addresses
      : [{ id: uid("addr"), label: "", address: "" }]
  );

  function addAddress() {
    setAddresses((a) => [...a, { id: uid("addr"), label: "", address: "" }]);
  }
  function removeAddress(id) {
    setAddresses((a) => (a.length > 1 ? a.filter((x) => x.id !== id) : a));
  }
  function setAddressField(id, key, val) {
    setAddresses((a) => a.map((x) => (x.id === id ? { ...x, [key]: val } : x)));
  }

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    const cleanAddresses = addresses.filter((a) => a.address.trim()).map((a) => ({ ...a, label: a.label.trim(), address: a.address.trim() }));
    onSave({ id: s.id || uid("transporter"), name: name.trim(), email: email.trim(), phone: phone.trim(), contact: contact.trim(), addresses: cleanAddresses });
  }

  return (
    <form onSubmit={submit}>
      <Field label="Transporter Name"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Ameer Abbas Goods Transport" /></Field>
      <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Phone"><input className={inputCls} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+92..." /></Field>
        <Field label="Contact Person"><input className={inputCls} value={contact} onChange={(e) => setContact(e.target.value)} /></Field>
      </div>

      <div className="mt-3">
        <div className="flex items-center justify-between mb-2">
          <label className="text-slate-400 text-xs font-medium">Addresses</label>
          <button type="button" onClick={addAddress} className="text-blue-400 hover:text-blue-300 text-xs font-medium flex items-center gap-1">
            <Plus size={12} /> Add Address
          </button>
        </div>
        <p className="text-slate-500 text-xs mb-2">Optional — office/yard addresses for this transporter.</p>
        <div className="space-y-2">
          {addresses.map((a, idx) => (
            <div key={a.id} className="grid grid-cols-[1fr_2fr_auto] gap-2 items-center bg-slate-900/50 border border-slate-800 rounded-lg p-2">
              <input className={inputCls} value={a.label} onChange={(e) => setAddressField(a.id, "label", e.target.value)} placeholder={`Label (e.g. Yard ${idx + 1})`} />
              <input className={inputCls} value={a.address} onChange={(e) => setAddressField(a.id, "address", e.target.value)} placeholder="Full address" />
              <button type="button" onClick={() => removeAddress(a.id)} disabled={addresses.length === 1} className="text-slate-500 hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed p-1.5">
                <Trash2 size={14} />
              </button>
            </div>
          ))}
        </div>
      </div>

      <div className="flex justify-end gap-2 mt-3">
        <button type="button" className={btnSecondary} onClick={onCancel}>Cancel</button>
        <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Add Transporter"}</button>
      </div>
    </form>
  );
}

function EntityModal({ modal, data, onClose, onSave, role }) {
  const { type, mode, item } = modal;
  const titles = {
    order: mode === "view" ? "Order Details" : mode === "edit" ? "Edit Order" : "New Order",
    vehicle: mode === "edit" ? "Edit Vehicle" : "Add Vehicle",
    driver: mode === "edit" ? "Edit Team Member" : "Add Team Member",
    invoice: mode === "view" ? "Invoice Details" : mode === "edit" ? "Edit Invoice" : "New Invoice",
    customer: mode === "edit" ? "Edit Customer" : "Add Customer",
    sender: mode === "edit" ? "Edit Sender" : "Add Sender",
    transporter: mode === "edit" ? "Edit Transporter" : "Add Transporter",
    contract: mode === "edit" ? "Edit Contract Rate" : "Add Contract Rate",
    contract_group: mode === "edit" ? "Edit Contract" : "Create Contract",
    fuel: mode === "edit" ? "Edit Fuel Card" : "Add Fuel Card",
    fuel_card_swap: mode === "edit" ? "Edit Fuel Card Swap" : "Log Fuel Card Swap",
    fuel_price: mode === "edit" ? "Edit Fuel Price" : "Add Fuel Price",
  };
  return (
    <Modal title={titles[type]} onClose={onClose} wide={type === "order" || type === "invoice"} size={type === "order" && mode === "view" ? "xl" : undefined}>
      {type === "order" && (mode === "view"

      {type === "vehicle" && <VehicleForm initial={mode === "edit" ? item : null} drivers={data.drivers} onSave={(i) => onSave("vehicles", i)} onCancel={onClose} />}
      {type === "driver" && <DriverForm initial={mode === "edit" ? item : null} onSave={(i) => onSave("drivers", i)} onCancel={onClose} />}
      {type === "invoice" && (mode === "view"
        ? <InvoiceDetail invoice={item} data={data} />
        : <InvoiceForm initial={mode === "edit" ? item : null} prefill={modal.prefill} orders={data.orders} customers={data.customers} onSave={(i) => onSave("invoices", i)} onCancel={onClose} />)}
      {type === "customer" && <CustomerForm initial={mode === "edit" ? item : null} onSave={(i) => onSave("customers", i)} onCancel={onClose} />}
      {type === "sender" && <SenderForm initial={mode === "edit" ? item : null} onSave={(i) => onSave("senders", i)} onCancel={onClose} />}

function PublicStageStepper({ currentIndex, cancelled }) {
  const labels = ["Pending", "Confirmed", "In Transit", "Delivered"];
  return (
    <div className="flex items-start">
      {labels.map((label, i) => {
        const isDone = !cancelled && i < currentIndex;
        const isCurrent = !cancelled && i === currentIndex;
        return (
          <React.Fragment key={label}>
            <div className="flex flex-col items-center gap-2" style={{ width: 0, overflow: "visible" }}>
              <div className={cx(
                "w-9 h-9 rounded-full flex items-center justify-center border-2 shrink-0",
                cancelled ? "border-slate-700 text-slate-600"
                  : (isDone || isCurrent) ? "border-white text-white"
                  : "border-slate-700 text-slate-600"
              )}>
                {isDone ? <CheckCircle2 size={18} /> : isCurrent ? <span className="w-2.5 h-2.5 rounded-full bg-blue-500" /> : null}
              </div>
              <span className={cx("text-xs font-medium whitespace-nowrap", cancelled ? "text-slate-600" : (isDone || isCurrent) ? "text-white" : "text-slate-600")}>{label}</span>
            </div>
            {i < labels.length - 1 && (
              <div className={cx("flex-1 h-0.5 mt-[18px] mx-1", !cancelled && i < currentIndex ? "bg-white" : "bg-slate-800")} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// Simplifies the internal stageIndex down to the public page's 4 statuses (Pending/
// Confirmed/In Transit/Delivered). Needs shipmentType because stageIndex 3 means different
// things per type: Export has no Under Offloading step (3 = Delivered already), but Import
// and Domestic both do (3 = Under Offloading, not delivered yet — showing "Delivered" this
// early would be misleading, so it maps to "In Transit" instead until the real Delivered step).
function publicStageIndexFor(stageIndex, shipmentType) {
  const si = stageIndex ?? 0;
  if (shipmentType === "Export") {
    const map = [1, 2, 2, 3];
    return map[si] ?? 3;
  }
  const map = [1, 2, 2, 2, 3, 3]; // Import (6 stages) and Domestic (5 stages) both fit this
  return map[si] ?? 3;
}

  Confirmed: { color: "#3b82f6", bg: "rgba(59,130,246,0.08)", border: "rgba(59,130,246,0.35)", desc: "Your shipment has been confirmed and is being prepared for pickup." },
  "In Transit": { color: "#6366f1", bg: "rgba(99,102,241,0.1)", border: "rgba(99,102,241,0.4)", desc: "Your shipment is on the way! It has been picked up and is heading to the destination." },
  Delivered: { color: "#22c55e", bg: "rgba(34,197,94,0.08)", border: "rgba(34,197,94,0.35)", desc: "Your shipment has been delivered successfully." },
  Cancelled: { color: "#ef4444", bg: "rgba(239,68,68,0.08)", border: "rgba(239,68,68,0.35)", desc: "This order has been cancelled." },
};

function PublicTrackingPage() {
  const [orderNumberInput, setOrderNumberInput] = useState(() => {
    const m = window.location.hash.match(/#track=(.+)/);
    return m ? decodeURIComponent(m[1]) : "";
  });
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [lightMode, setLightMode] = useState(false);

  async function doTrack(e) {
    if (e) e.preventDefault();
    if (!orderNumberInput.trim()) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/public_track_order`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_order_number: orderNumberInput.trim() }),
      });
      const json = await res.json().catch(() => null);
      const row = Array.isArray(json) ? json[0] : json;
      if (!res.ok || !row || !row.order_number) {
        setError("No shipment found with that order number. Double-check it and try again.");
      } else {
        setResult(row);
      }
    } catch (err) {
      setError("Something went wrong looking that up. Please check your connection and try again.");
    }
    setLoading(false);
  }

  useEffect(() => {
    if (orderNumberInput) doTrack();
    // eslint-disable-next-line
  }, []);

  const containers = result && Array.isArray(result.containers) ? result.containers : [];
  const customerLike = { deliveryAddresses: (result && Array.isArray(result.customer_addresses)) ? result.customer_addresses : [] };

  // This page is public-facing, so it gets its own light/dark styling rather than
  // touching the shared cardCls/inputCls constants used everywhere else in the app.

    ? "bg-white border border-slate-200 rounded-xl shadow-sm"
    : "bg-slate-900 border border-slate-800 rounded-xl";

  const boxBg = lightMode ? "bg-slate-50" : "bg-slate-900/60";

  return (
    <div className={cx("min-h-screen flex flex-col", pageBg)}>
      <div className={cx("border-b px-6 py-4 flex items-center justify-between", headerBorder)}>

        </div>

          <div className={cx("text-sm", mutedText)}>Shipment Tracking</div>
          <button
            className={cx("p-2 rounded-lg border", lightMode ? "border-slate-300 text-slate-600 hover:bg-slate-100" : "border-slate-700 text-slate-400 hover:bg-slate-900")}

        <div className="text-center mb-8">
