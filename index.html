function DispatchModal({ containerLabel, initial, transporters, isDomestic, contracts, contractGroups, customerId, loadingPoint, destination, onClose, onConfirm }) {
  const c = initial || {};
  const isEdit = !!initial;
  const [photo, setPhoto] = useState(c.dispatchPhoto || "");
  const [notes, setNotes] = useState(c.dispatchNotes || "");
  const [dispatchedBy, setDispatchedBy] = useState(c.dispatchedBy || "");
  const [dispatchAt, setDispatchAt] = useState(() => (c.dispatchAt ? c.dispatchAt.slice(0, 16) : ""));
  const [transporter, setTransporter] = useState(c.transporter || "");
  const [transporterCustomMode, setTransporterCustomMode] = useState(false);
  const [vehiclePlate, setVehiclePlate] = useState(c.vehiclePlate || "");
  const [freightAmount, setFreightAmount] = useState(c.freightAmount ?? "");
  const [loadingDate, setLoadingDate] = useState(c.loadingDate || "");
  const [emptyReturnLocation, setEmptyReturnLocation] = useState(c.emptyReturnLocation || "");
  const [shifting, setShifting] = useState(c.shifting || "no");
  const [shiftedContainerNo, setShiftedContainerNo] = useState(c.shiftedContainerNo || "");
  const [shiftEmptyReturnDate, setShiftEmptyReturnDate] = useState(c.shiftEmptyReturnDate || "");
  const [busy, setBusy] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [formError, setFormError] = useState(null);

  // Apply Contract Rate: when Yes, Freight Amount is looked up automatically from this
  // customer's contract rates (matching Loading Point, Destination, Movement Through,
  // Vehicle Size, and Vehicle Type — same rate table whether the shipment is Import or
  // Domestic, since a customer's contract isn't split by shipment type) rather than typed
  // in manually. Starts blank (not defaulted to either option) since it's a required choice.
  const [applyContractRate, setApplyContractRate] = useState(c.applyContractRate || "");
  const [movementThrough, setMovementThrough] = useState(c.movementThrough || "");
  const [vehicleSize, setVehicleSize] = useState(c.vehicleSize || c.containerSize || "");
  const [vehicleType, setVehicleType] = useState(c.vehicleType || "");

  const matchedContractRate = useMemo(() => {
    if (applyContractRate !== "yes") return null;
    const norm = (v) => (v || "").trim().toLowerCase();
    const normDestination = norm(destination);
    const match = (contracts || []).find((k) =>
      k.customerId === customerId &&
      norm(k.loadingPoint) === norm(loadingPoint) &&
      norm(k.destination) === normDestination &&
      norm(k.movementThrough) === norm(movementThrough) &&
      norm(k.vehicleSize) === norm(vehicleSize) &&
      norm(k.axleLoadCategory) === norm(vehicleType)
    );
    if (!match) return null;
    const groupsById = new Map((contractGroups || []).map((g) => [g.id, g]));
    return { ...match, group: match.contractGroupId ? groupsById.get(match.contractGroupId) : null };
  }, [applyContractRate, contracts, contractGroups, customerId, loadingPoint, destination, movementThrough, vehicleSize, vehicleType]);

  useEffect(() => {
    if (applyContractRate === "yes" && matchedContractRate) setFreightAmount(matchedContractRate.rate);
  }, [applyContractRate, matchedContractRate]);

  const transporterNames = (transporters || []).map((t) => t.name);
  const isKnownTransporter = !!transporter && transporterNames.includes(transporter);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    setPhotoError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setPhoto(dataUrl);
    } catch (err) {
      setPhotoError("Couldn't read that file — try a different image or PDF.");
    }
    setBusy(false);
  }

  function submit(e) {
    e.preventDefault();
    setFormError(null);
    if (!isDomestic && !photo) { setPhotoError("A loading photo or document is required to confirm dispatch."); return; }
    if (applyContractRate !== "yes" && applyContractRate !== "no") {
      setFormError("Apply Contract Rate is required — select Yes or No.");
      return;
    }
    if (applyContractRate === "yes" && !matchedContractRate) {
      setFormError("Rate not available for this route.");
      return;
    }
    if (!isDomestic && (!transporter.trim() || !vehiclePlate.trim() || freightAmount === "" || !emptyReturnLocation.trim())) {
      setFormError("Transporter, Vehicle No., Freight Amount, and Empty Return Location are all required.");
      return;
    }
    if (isDomestic && (!transporter.trim() || !vehiclePlate.trim() || freightAmount === "")) {
      setFormError("Transporter, Vehicle No., and Freight Amount are all required.");
      return;
    }
    if (!isDomestic && shifting === "yes" && (!shiftedContainerNo.trim() || !shiftEmptyReturnDate)) {
      setFormError("Shifted Container No. and Empty Return Date are required when Shifting is Yes.");
      return;
    }
    onConfirm({
      dispatchPhoto: photo,
      dispatchNotes: notes.trim(),
      dispatchedBy: dispatchedBy.trim(),
      dispatchAt: new Date(dispatchAt).toISOString(),
      transporter: transporter.trim(),
      vehiclePlate: vehiclePlate.trim(),
      freightAmount: Number(freightAmount),
      emptyReturnLocation: emptyReturnLocation.trim(),
      ...(isDomestic ? { loadingDate } : {}),
      shifting,
      shiftedContainerNo: shifting === "yes" ? shiftedContainerNo.trim() : "",
      shiftEmptyReturnDate: shifting === "yes" ? shiftEmptyReturnDate : "",
      applyContractRate, movementThrough: movementThrough.trim(), vehicleSize: vehicleSize.trim(), vehicleType: vehicleType.trim(),
    });
  }

  return (
    <Modal title={`${isEdit ? "Edit Dispatch Details" : "Confirm Dispatch"} — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Actual Dispatch / Pickup Time">
          <input type="datetime-local" className={inputCls} value={dispatchAt} onChange={(e) => setDispatchAt(e.target.value)} required />
        </Field>
        {isDomestic && (
          <Field label="Loading Date (viewable and editable by dispatcher)">
            <input type="date" className={inputCls} value={loadingDate} onChange={(e) => setLoadingDate(e.target.value)} />
          </Field>
        )}
        <div className="grid grid-cols-2 gap-3">
          <Field label="Transporter">
            {!transporterCustomMode ? (
              <select
                className={inputCls}
                value={isKnownTransporter ? transporter : (transporter ? "__custom__" : "")}
                onChange={(e) => {
                  if (e.target.value === "__custom__") { setTransporterCustomMode(true); return; }
                  setTransporter(e.target.value);
                }}
              >
                <option value="">Select transporter</option>
                {transporterNames.map((n) => <option key={n} value={n}>{n}</option>)}
                <option value="__custom__">+ Custom...</option>
              </select>
            ) : (
              <input className={inputCls} value={transporter} onChange={(e) => setTransporter(e.target.value)} placeholder="Custom transporter" autoFocus />
            )}
          </Field>
          <Field label="Vehicle No."><input className={inputCls} value={vehiclePlate} onChange={(e) => setVehiclePlate(e.target.value)} placeholder="Vehicle number" /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Vehicle Size"><input className={inputCls} value={vehicleSize} onChange={(e) => setVehicleSize(e.target.value)} placeholder="e.g. 40'" /></Field>
          <Field label="Vehicle Type">
            <DropdownWithCustom
              value={vehicleType} onChange={setVehicleType} options={AXLE_LOAD_CATEGORIES}
              selectPlaceholder="Select vehicle type" customPlaceholder="e.g. 5x"
            />
          </Field>
        </div>
        <Field label="Movement Through">
          <select className={inputCls} value={movementThrough} onChange={(e) => setMovementThrough(e.target.value)}>
            <option value="">Select</option>
            {MOVEMENT_THROUGH_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Apply Contract Rate">
          <select className={inputCls} value={applyContractRate} onChange={(e) => setApplyContractRate(e.target.value)} required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </Field>
        {applyContractRate === "yes" && !matchedContractRate && (
          <div className="text-red-400 text-xs mb-3 -mt-2">
            <p>Rate not available for this route.</p>
            <p className="text-slate-500 mt-1">Matching against: Loading Point "{loadingPoint || "(blank)"}" · Destination "{destination || "(blank)"}"</p>
          </div>
        )}
        <div className={cx("grid gap-3", isDomestic ? "grid-cols-1" : "grid-cols-2")}>
          <Field label="Freight Amount (PKR)">
            <input
              type="number" min="0" className={inputCls} value={freightAmount}
              onChange={(e) => setFreightAmount(e.target.value)}
              readOnly={applyContractRate === "yes" && !!matchedContractRate}
            />
          </Field>
          {!isDomestic && (
            <Field label="Empty Return Location"><input className={inputCls} value={emptyReturnLocation} onChange={(e) => setEmptyReturnLocation(e.target.value)} /></Field>
          )}
        </div>
        {!isDomestic && (
          <>
            <Field label="Shifting">
              <select className={inputCls} value={shifting} onChange={(e) => setShifting(e.target.value)}>
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </Field>
            {shifting === "yes" && (
              <div className="grid grid-cols-2 gap-3">
                <Field label="Shifted Container No."><input className={inputCls} value={shiftedContainerNo} onChange={(e) => setShiftedContainerNo(e.target.value)} /></Field>
                <Field label="Empty Return Date"><input type="date" className={inputCls} value={shiftEmptyReturnDate} onChange={(e) => setShiftEmptyReturnDate(e.target.value)} /></Field>
              </div>
            )}
            <Field label="Dispatched By (name)">
              <input className={inputCls} value={dispatchedBy} onChange={(e) => setDispatchedBy(e.target.value)} placeholder="Who released/loaded it at origin" />
            </Field>
            <Field label="Loading Photo or Document (required)">
              <input type="file" accept="image/*,application/pdf" onChange={handleFile} className={inputCls} required={!photo} />
              {photoError && <p className="text-red-400 text-xs mt-1">{photoError}</p>}
              {photo && !isPdfDataUrl(photo) && <img src={photo} alt="Dispatch photo" className="mt-2 rounded-lg border border-slate-800 max-h-40 animate-fade-in" />}
              {photo && isPdfDataUrl(photo) && (
                <a href={photo} download="dispatch-document.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2 animate-fade-in">
                  <FileText size={16} /> PDF attached — click to view
                </a>
              )}
            </Field>
          </>
        )}
        <Field label="Notes (seal check, loading discrepancies, etc.)">
          <textarea className={inputCls} rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g. Seal verified and matches manifest, loaded on schedule" />

      </form>

}

function PodModal({ containerLabel, showArrivalReference, existingArrivalDate, onClose, onConfirm }) {
  const [photo, setPhoto] = useState("");
  const [notes, setNotes] = useState("");
  const [receivedBy, setReceivedBy] = useState("");
  const [arrivalAt, setArrivalAt] = useState("");
  const [offloadingAt, setOffloadingAt] = useState("");
  const [busy, setBusy] = useState(false);
  const [photoError, setPhotoError] = useState(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    setPhotoError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setPhoto(dataUrl);
    } catch (err) {
      setPhotoError("Couldn't read that file — try a different image or PDF.");
    }
    setBusy(false);
  }

  function submit(e) {
    e.preventDefault();
    if (!photo) { setPhotoError("A delivery photo or document is required to confirm delivery."); return; }
    onConfirm({
      podPhoto: photo,
      podNotes: notes.trim(),
      podReceivedBy: receivedBy.trim(),
      // Import/Domestic already recorded their arrival date during Under Offloading - keep
      // that value rather than overwriting it with "now".
      ...(showArrivalReference ? {} : { podArrivalAt: new Date(arrivalAt).toISOString() }),
      podOffloadingAt: offloadingAt ? new Date(offloadingAt).toISOString() : "",
    });
  }

  return (
    <Modal title={`Confirm Delivery — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        {showArrivalReference ? (
          <Field label="Actual Arrival Date &amp; Time">
            <div className={cx(inputCls, "bg-slate-900/60 text-slate-300")}>{existingArrivalDate ? fmtDateTime(existingArrivalDate) : "Not recorded"}</div>
          </Field>
        ) : (
          <Field label="Actual Arrival Time">
            <input type="datetime-local" className={inputCls} value={arrivalAt} onChange={(e) => setArrivalAt(e.target.value)} required />
          </Field>
        )}
        <Field label="Offloading Date & Time">
          <input type="datetime-local" className={inputCls} value={offloadingAt} onChange={(e) => setOffloadingAt(e.target.value)} />
        </Field>
        <Field label="Received By (name)">
          <input className={inputCls} value={receivedBy} onChange={(e) => setReceivedBy(e.target.value)} placeholder="Who signed for it at the destination" />
        </Field>
        <Field label="Delivery Photo or Document (required)">
          <input type="file" accept="image/*,application/pdf" onChange={handleFile} className={inputCls} required={!photo} />
          {photoError && <p className="text-red-400 text-xs mt-1">{photoError}</p>}
          {photo && !isPdfDataUrl(photo) && <img src={photo} alt="Proof of delivery" className="mt-2 rounded-lg border border-slate-800 max-h-40 animate-fade-in" />}
          {photo && isPdfDataUrl(photo) && (
            <a href={photo} download="delivery-document.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2 animate-fade-in">
              <FileText size={16} /> PDF attached — click to view
            </a>
          )}
        </Field>
        <Field label="Notes (damage, shortages, discrepancies, etc.)">
          <textarea className={inputCls} rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g. Minor dent on rear door, otherwise all good" />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" disabled={busy || !photo} className={cx(btnPrimary, (busy || !photo) && "opacity-60 cursor-not-allowed")}>
            {busy ? "Processing…" : "Confirm Delivery"}
          </button>
        </div>
      </form>
    </Modal>
  );
}

// Captures the two things the Empty Return Receiver logs when the rented container's
// box has gone back to the empty yard: the date it happened and any notes. This is what
// advances a container from Delivered (3) to the Import-only Completed (4) stage.
function EmptyReturnModal({ containerLabel, defaultLocation, onClose, onConfirm }) {
  const [emptyReturnDate, setEmptyReturnDate] = useState("");
  const [emptyReturnDescription, setEmptyReturnDescription] = useState("");

  function submit(e) {
    e.preventDefault();
    if (!emptyReturnDate) return;
    onConfirm({ emptyReturnDate, emptyReturnDescription: emptyReturnDescription.trim() });
  }

  return (
    <Modal title={`Confirm Empty Return — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        {defaultLocation && (
          <p className="text-slate-500 text-xs mb-3">Return location on file: <span className="text-slate-300">{defaultLocation}</span></p>
        )}
        <Field label="Empty Return Date">
          <input type="date" className={inputCls} value={emptyReturnDate} onChange={(e) => setEmptyReturnDate(e.target.value)} required />
        </Field>
        <Field label="Description (condition, gate, receipt no., etc.)">
          <textarea className={inputCls} rows={3} value={emptyReturnDescription} onChange={(e) => setEmptyReturnDescription(e.target.value)} placeholder="Notes about the empty return" />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" className={btnPrimary}>Mark Completed</button>
        </div>
      </form>
    </Modal>
  );
}

function Gauge({ pct, color, label }) {
  const r = 42, c = 2 * Math.PI * r;
  const dash = c * (Math.min(100, Math.max(0, pct)) / 100);
  return (
    <div className="flex flex-col items-center">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r={r} fill="none" stroke="#1e293b" strokeWidth="10" />
        <circle
          cx="55" cy="55" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform="rotate(-90 55 55)"
        />
        <text x="55" y="61" textAnchor="middle" fontSize="19" fontWeight="700" fill="#ffffff">{Math.round(pct)}%</text>
      </svg>
      <div className="text-xs text-slate-400 mt-2 text-center">{label}</div>
    </div>
  );
}

function TrackingProgress({ stageIndex, cancelled, stages }) {
  const list = stages || STAGES;
  return (
    <div className="flex items-center">
      {list.map((s, i) => (
        <React.Fragment key={s}>
          <div
            title={s}
            className={cx(
              "w-6 h-6 shrink-0 rounded-full flex items-center justify-center text-xs font-semibold",
              cancelled ? "bg-slate-800 text-slate-600"
                : i < stageIndex ? "bg-blue-600 text-white"
                : i === stageIndex ? "bg-blue-600 text-white ring-4 ring-blue-950"
                : "bg-slate-800 text-slate-600"
            )}
          >
            {i < stageIndex ? "✓" : i + 1}
          </div>
          {i < list.length - 1 && (
            <div className={cx("flex-1 h-0.5", !cancelled && i < stageIndex ? "bg-blue-600" : "bg-slate-800")} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

/* ==================== Orders ==================== */

function OrdersView({ data, openModal, askDelete, shipmentType, role }) {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("All Status");
  const [domesticCategory, setDomesticCategory] = useState(null); // null = show category tiles
  const typeLabel = { Domestic: "Domestic", Import: "Import", Export: "Export" }[shipmentType] || "";
  const isDomestic = shipmentType === "Domestic";
  // Import and (once a category is picked) Domestic both get the full status block row —
  // dispatcher/admin only. Export never reaches beyond Delivered so it doesn't get one.
  const showStatusBlocks = (shipmentType === "Import" && (role === "admin" || role === "dispatcher_import"))
    || (isDomestic && !!domesticCategory && (role === "admin" || role === "dispatcher_domestic"));

  // Domestic Orders opens on a category picker (tiles, like the Customers page) rather
  // than straight into a table — pick Finished Goods or Wrapping Materials to go further.
  if (isDomestic && !domesticCategory) {
    const counts = {};
    DOMESTIC_CATEGORIES.forEach((cat) => {
      counts[cat] = data.orders.filter((o) => (o.shipmentType || "Import") === "Domestic" && (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === cat).length;
    });
    const tileIcons = { [DOMESTIC_CATEGORIES[0]]: { icon: Package, bg: "bg-blue-600" }, [DOMESTIC_CATEGORIES[1]]: { icon: Package, bg: "bg-purple-600" }, [DOMESTIC_CATEGORIES[2]]: { icon: Package, bg: "bg-teal-600" } };
    return (
      <div className="space-y-5">
        <div>
          <h2 className="text-2xl font-bold text-white">Domestic Orders</h2>
          <p className="text-slate-500 text-sm mt-1">Choose a category to view its orders</p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {DOMESTIC_CATEGORIES.map((cat) => {
            const { icon: Icon, bg } = tileIcons[cat];
            const count = counts[cat];
            return (
              <div key={cat} className={cx(cardCls, "p-6 cursor-pointer")} onClick={() => setDomesticCategory(cat)}>
                <div className={cx("w-12 h-12 rounded-lg flex items-center justify-center mb-3", bg)}><Icon size={22} className="text-white" /></div>
                <div className="text-white font-semibold text-lg mb-1">{cat}</div>
                <div className="text-slate-500 text-sm">{count} order{count === 1 ? "" : "s"}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Flatten to one row per container so Job No / Container No / Vehicle No
  // can be real table columns, and orders with multiple containers just get
  // multiple rows instead of being crammed into one cell.
  // For Data Entry specifically, anything settled for 2+ days has "settled" and moves
  // to Order History (admin-only) instead of lingering in their day-to-day orders table.
  const flat = [];
  data.orders.filter((o) => (o.shipmentType || "Import") === shipmentType).filter((o) => !isDomestic || (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === domesticCategory).forEach((o) => {
    const containers = orderContainers(o);
    if (containers.length === 0) {
      flat.push({ order: o, container: null });
    } else {
      containers.forEach((c) => {
        if (role === "data_entry" && isSettledOut(c)) return;
        flat.push({ order: o, container: c });
      });
    }
  });

  const statusOf = ({ order: o, container: c }) => (c ? containerStatus(c, shipmentType) : orderAggregateStatus(o));
  const confirmedCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Confirmed").length : 0;
  const pickedUpCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Picked Up").length : 0;
  const inTransitCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "In Transit").length : 0;
  const underOffloadingCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Under Offloading").length : 0;
  const deliveredCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Delivered").length : 0;
  const completedCount = showStatusBlocks && !isDomestic ? flat.filter((r) => statusOf(r) === "Completed").length : 0;

  const rows = flat.filter(({ order: o, container: c }) => {
    const cust = getCustomer(data, o.customerId);
    const text = `${o.orderNumber} ${cust ? cust.name : ""} ${cust ? cust.shortName || "" : ""} ${o.origin} ${o.jobNumber || ""} ${o.poNumber || ""} ${c ? c.containerNumber || "" : ""} ${o.blNumber || ""}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    const st = c ? containerStatus(c, shipmentType) : orderAggregateStatus(o);
    const matchesStatus = status === "All Status" || st === status;
    return matchesQ && matchesStatus;
  });

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          {isDomestic && (
            <button onClick={() => setDomesticCategory(null)} className="text-slate-400 hover:text-white text-sm inline-flex items-center gap-1 mb-2"><ArrowLeft size={14} /> Back to categories</button>
          )}
          <h2 className="text-2xl font-bold text-white">{isDomestic ? domesticCategory : `${typeLabel} Orders`}</h2>
          <p className="text-slate-500 text-sm mt-1">Manage your {typeLabel.toLowerCase()} shipment orders</p>
        </div>
        <button className={btnPrimary} onClick={() => openModal({ type: "order", mode: "add", item: null, presetShipmentType: shipmentType })}>
          <Plus size={16} /> New {typeLabel} Order
        </button>
      </div>

      {showStatusBlocks && (
        <div className={cx("grid grid-cols-2 gap-4", isDomestic ? "lg:grid-cols-5" : "lg:grid-cols-6")}>
          <MiniStat
            label="Confirmed" value={confirmedCount} color="text-blue-400"
            onClick={() => setStatus(status === "Confirmed" ? "All Status" : "Confirmed")}
            active={status === "Confirmed"}
          />
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setStatus(status === "Picked Up" ? "All Status" : "Picked Up")}
            active={status === "Picked Up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setStatus(status === "In Transit" ? "All Status" : "In Transit")}
            active={status === "In Transit"}
          />
          <MiniStat
            label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
            onClick={() => setStatus(status === "Under Offloading" ? "All Status" : "Under Offloading")}
            active={status === "Under Offloading"}
          />
          <MiniStat
            label="Delivered" value={deliveredCount} color="text-emerald-400"
            onClick={() => setStatus(status === "Delivered" ? "All Status" : "Delivered")}
            active={status === "Delivered"}
          />
          {!isDomestic && (
            <MiniStat
              label="Completed" value={completedCount} color="text-violet-400"
              onClick={() => setStatus(status === "Completed" ? "All Status" : "Completed")}
              active={status === "Completed"}
            />
          )}
        </div>
      )}

      <div className="flex gap-3 flex-wrap">
        <SearchBox value={q} onChange={setQ} placeholder="Search orders, customers, containers..." />
        <select className={inputCls} style={{ width: 170 }} value={status} onChange={(e) => setStatus(e.target.value)}>
          {(isDomestic
            ? ["All Status", "Confirmed", "Picked Up", "In Transit", "Under Offloading", "Delivered", "Cancelled"]
            : showStatusBlocks
            ? ["All Status", "Confirmed", "Picked Up", "In Transit", "Under Offloading", "Delivered", "Completed", "Cancelled"]
            : ["All Status", "Confirmed", "Picked Up", "In Transit", "Delivered", "Cancelled"]
          ).map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      {rows.length === 0 ? (
        <EmptyState
          icon={Package}
          text={`No ${typeLabel.toLowerCase()} orders found.`}
          actionLabel={flat.length === 0 ? `Create your first ${typeLabel.toLowerCase()} order` : null}
          onAction={() => openModal({ type: "order", mode: "add", item: null, presetShipmentType: shipmentType })}
        />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                {isDomestic ? (
                  <>
                    <th className={thCls}>Customer</th>
                    <th className={thCls}>PO / SAP No.</th>
                    <th className={thCls}>Movement Through</th>
                    <th className={thCls}>Loading Date</th>
                    <th className={thCls}>Vehicle No.</th>
                    <th className={thCls}>Vehicle Size</th>
                    {(domesticCategory === DOMESTIC_CATEGORIES[1] || domesticCategory === DOMESTIC_CATEGORIES[2]) && <th className={thCls}>Sender</th>}
                    <th className={thCls}>Loading Point</th>
                    <th className={thCls}>Destination</th>
                    <th className={thCls}>Transporter Name</th>
                    <th className={thCls}>Status</th>
                    <th className={thCls}></th>
                  </>
                ) : (
                  <>
                    <th className={thCls}>Job No.</th>
                    <th className={thCls}>Customer</th>
                    <th className={thCls}>Destination</th>
                    <th className={thCls}>Description</th>
                    <th className={thCls}>Container No.</th>
                    <th className={thCls}>Vehicle No.</th>
                    <th className={thCls}>Status</th>
                    {shipmentType === "Import" && <th className={thCls}>Empty Status</th>}
                    <th className={thCls}></th>
                  </>
                )}
              </tr>
            </thead>
            <tbody>
              {rows.map(({ order: o, container: c }, idx) => {
                const cust = getCustomer(data, o.customerId);
                const st = c ? containerStatus(c, shipmentType) : orderAggregateStatus(o);
                const emptyStatus = c ? emptyStatusOf(c) : "—";
                const sender = isDomestic ? (data.senders || []).find((s) => s.id === o.senderId) || null : null;
                return (
                  <tr key={c ? c.id : o.id + "-" + idx} className={trCls}>
                    {isDomestic ? (
                      <>
                        <td className={cx(tdCls, "text-white font-medium")}>{cust ? (cust.shortName || cust.name) : "Unknown"}</td>
                        <td className={cx(tdCls, "font-mono text-slate-200")}>{c ? (c.poSapNo || "—") : "—"}</td>
                        <td className={tdCls}>{c ? (c.movementThrough || "—") : "—"}</td>
                        <td className={tdCls}>{c && c.loadingDate ? fmtDate(c.loadingDate) : "—"}</td>
                        <td className={tdCls}>{c ? (c.vehiclePlate || "—") : "—"}</td>
                        <td className={tdCls}>{c ? (c.vehicleSize || "—") : "—"}</td>
                        {(domesticCategory === DOMESTIC_CATEGORIES[1] || domesticCategory === DOMESTIC_CATEGORIES[2]) && <td className={tdCls}>{senderShortLabel(o, sender) || "—"}</td>}
                        <td className={tdCls}>{o.origin || "—"}</td>
                        <td className={tdCls}>{c ? (c.destination || "—") : "—"}</td>
                        <td className={tdCls}>{c ? (c.transporter || "—") : "—"}</td>
                        <td className={tdCls}><Badge text={st} className={orderStatusColor[st]} /></td>
                      </>
                    ) : (
                      <>
                        <td className={cx(tdCls, "font-mono text-slate-200")}>{o.jobNumber || "—"}</td>
                        <td className={cx(tdCls, "text-white font-medium")}>{cust ? (cust.shortName || cust.name) : "Unknown"}</td>
                        <td className={tdCls}>{c ? (c.destination || "—") : "—"}</td>
                        <td className={tdCls} style={{ whiteSpace: "normal", maxWidth: 220 }}>{o.description || "—"}</td>
                        <td className={cx(tdCls, "font-mono")}>{c ? (c.containerNumber || "—") : "—"}</td>
                        <td className={tdCls}>{c ? (c.vehiclePlate || "—") : "—"}</td>
                        <td className={tdCls}><Badge text={st} className={orderStatusColor[st]} /></td>
                        {shipmentType === "Import" && (
                          <td className={tdCls}>{emptyStatus === "—" ? "—" : <Badge text={emptyStatus} className={emptyStatusColor[emptyStatus]} />}</td>
                        )}
                      </>
                    )}
                    <td className={tdCls}>
                      <div className="flex items-center gap-1 justify-end">
                        <button className={iconBtn} title="View" onClick={() => openModal({ type: "order", mode: "view", item: o })}><Eye size={15} /></button>
                        <button className={iconBtn} title="Edit" onClick={() => openModal({ type: "order", mode: "edit", item: o })}><Pencil size={15} /></button>
                        <button className={iconBtnDanger} title="Delete" onClick={() => askDelete({ entity: "orders", id: o.id, label: "order" })}><Trash2 size={15} /></button>
                        {c && <button className={iconBtn} title="Download Bilty" onClick={() => downloadBiltyReceipt({ ...o, containers: [c] }, data)}><Receipt size={15} /></button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

          {["All Status", ...ROUTE_STATUSES].map((s) => <option key={s} value={s}>{cap(s)}</option>)}
        </select>
      </div>
      {rows.length === 0 ? (
        <EmptyState
          icon={MapPin}
          text="No routes found."
          actionLabel="Create your first route"
          onAction={() => openModal({ type: "route", mode: "add", item: null })}
        />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {rows.map((r) => (
            <div key={r.id} className={cx(cardCls, "p-5")}>
              <div className="flex items-start justify-between mb-3">
                <div className="text-white font-semibold">{r.name}</div>
                <Badge text={cap(r.status)} className={routeStatusColor[r.status]} />
              </div>
              <div className="text-slate-300 text-sm mb-3">{r.origin} → {r.destination}</div>
              <div className="text-slate-500 text-xs space-y-1 mb-4">
                <div>Driver: <span className="text-slate-300">{getDriverName(data, r.driverId)}</span></div>
                <div>Vehicle: <span className="text-slate-300">{getVehiclePlate(data, r.vehicleId)}</span></div>
                {r.orderId && <div>Order: <span className="text-slate-300 font-mono">{getOrder(data, r.orderId) ? getOrder(data, r.orderId).orderNumber : "—"}</span></div>}
              </div>
              <div className="flex gap-2">
                <button className={cx(btnSecondary, "flex-1 justify-center")} onClick={() => openModal({ type: "route", mode: "edit", item: r })}><Pencil size={14} /> Edit</button>
                <button className={iconBtnDanger} onClick={() => askDelete({ entity: "routes", id: r.id, label: "route" })}><Trash2 size={16} /></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ==================== Tracking ==================== */

// A plain <input type="date"> bound directly to onChange fires on every digit typed into
// the year segment — including incomplete years like "0002" partway through typing "2026".
// Wiring that straight to a database write (as this used to be) meant every keystroke sent
// a real update, sometimes with a garbage date. This keeps the typed value in local state
// and only commits a change once the field loses focus AND the value is a complete,
// plausible date (a 4-digit year between 2000-2100) — anything else reverts silently.
function EmptyReturnDateField({ orderId, containerId, value, updateContainerStage }) {
  const [local, setLocal] = useState(value || "");
  useEffect(() => { setLocal(value || ""); }, [value]);

  function commit(val) {
    if (val === "") {
      updateContainerStage(orderId, containerId, 4, { emptyReturnDate: "" });
      return;
    }
    const year = Number(val.slice(0, 4));
    const isCompleteDate = /^\d{4}-\d{2}-\d{2}$/.test(val) && year >= 2000 && year <= 2100;
    if (isCompleteDate) {
      updateContainerStage(orderId, containerId, 5, { emptyReturnDate: val });
    } else {
      setLocal(value || ""); // not a real, complete date yet - discard and revert the field
    }
  }

  return (
    <input
      type="date"
      className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
      value={local}
      onChange={(e) => setLocal(e.target.value)}
      onBlur={(e) => commit(e.target.value)}
    />
  );
}

// Domestic-specific: the form shown when advancing In Transit -> Under Offloading. Deliberately
// just one field, and deliberately starts blank (no auto-filled "now") so the receiver has to
// actually pick the real arrival date and time rather than accept a default that might be wrong.
function ArrivalDateModal({ containerLabel, onClose, onConfirm }) {
  const [arrivalAt, setArrivalAt] = useState("");

  function submit(e) {
    e.preventDefault();
    if (!arrivalAt) return;
    onConfirm({ podArrivalAt: new Date(arrivalAt).toISOString() });
  }

  return (
    <Modal title={`Confirm Arrival — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Actual Arrival Date &amp; Time">
          <input type="datetime-local" className={inputCls} value={arrivalAt} onChange={(e) => setArrivalAt(e.target.value)} required />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" className={btnPrimary}>Confirm</button>
        </div>
      </form>
    </Modal>
  );
}

function TrackingView({ data, updateContainerStage, updateContainerFields, role, shipmentTypeFilter }) {
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [receiverTab, setReceiverTab] = useState("picked_up"); // Picked Up / In Transit / Delivered
  const [podTarget, setPodTarget] = useState(null); // { orderId, containerId, label }
  const [arrivalTarget, setArrivalTarget] = useState(null); // { orderId, containerId, label } - Domestic's In Transit -> Under Offloading step
  const [dispatchTarget, setDispatchTarget] = useState(null); // { orderId, containerId, label }
  const [emptyReturnTarget, setEmptyReturnTarget] = useState(null); // { orderId, containerId, label, defaultLocation } - Delivered -> Completed step, Import only
  const today = todayISO();
  const isDispatcher = role === "dispatcher_import" || role === "dispatcher_domestic" || role === "dispatcher_export";
  const isReceiver = role === "receiver_import_domestic" || role === "receiver_export";
  const isEmptyReturnReceiver = role === "empty_return_receiver";
  const isAdmin = role === "admin";
  // Admin and the Empty Return Receiver look back through all delivered containers (not
  // just today's) to find what still needs its empty box returned.
  const showAllDelivered = isAdmin || isEmptyReturnReceiver;
  // Dispatcher no longer sees Delivered or Completed at all — their containers leave their
  // view entirely once advanced to In Transit, so those two blocks would always read zero.
  const showDeliveredBlock = !isDispatcher;
  const showCompletedBlock = isAdmin || isEmptyReturnReceiver;

  // Dispatchers can move a container up through In Transit, but not all the way to Delivered.
  // Receivers take it from there — Export is still the single final step (In Transit ->
  // Delivered); Import and Domestic both have an extra Under Offloading step in between,
  // both button-driven with their own small confirmation forms (ArrivalDateModal / PodModal).
  function canAdvance(c, o) {
    const si = c.stageIndex ?? 0;
    const st = o.shipmentType || "Import";
    const hasUnderOffloading = st === "Domestic" || st === "Import";
    if (isDispatcher) return si < 2;
    if (isReceiver) return si === 2 || (si === 3 && hasUnderOffloading);
    return true;
  }
  function maxStageIndex(o) {
    const st = o.shipmentType || "Import";
    if (st === "Import") return 5;
    if (st === "Domestic") return 4;
    return 3;
  }

  // Flatten every order's containers into individual trackable rows, scoped to this
  // page's shipment type (Import/Domestic/Export each get their own Tracking page).
  const flat = [];
  data.orders.forEach((o) => {
    if (shipmentTypeFilter && (o.shipmentType || "Import") !== shipmentTypeFilter) return;
    orderContainers(o).forEach((c) => flat.push({ order: o, container: c }));
  });
  const visible = isReceiver
    ? flat.filter((r) => {
        const si = r.container.stageIndex ?? 0;
        if (r.container.cancelled) return false;
        if (isSettledOut(r.container)) return false;
        return si >= 1 && si <= (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import" ? 4 : 3); // Picked Up / In Transit / (Under Offloading) / Delivered — categorized into tabs below
      })
    : isEmptyReturnReceiver
    ? flat.filter((r) => {
        if (r.container.cancelled) return false;
        if ((r.order.shipmentType || "Import") !== "Import") return false;
        if (isSettledOut(r.container)) return false;
        const si = r.container.stageIndex ?? 0;
        return si === 4 || si === 5;
      })
    : isDispatcher
    ? flat.filter((r) => !r.container.cancelled && (r.container.stageIndex ?? 0) < 2) // gone once advanced to In Transit
    : flat; // admin/staff see everything, unrestricted — Order History is the archive for them

  const confirmedCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Confirmed").length;
  const pickedUpCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Picked Up").length;
  const inTransitCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "In Transit").length;
  const underOffloadingCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Under Offloading").length;
  const deliveredTodayCount = visible.filter((r) => r.container.deliveredDate === today).length;
  const deliveredAllCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Delivered").length;
  const completedCount = visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Completed").length;

  const rows = visible.filter(({ order, container }) => {
    const st = trackingDisplayStatus(container, shipmentTypeFilter);
    const cust = getCustomer(data, order.customerId);
    const text = `${order.orderNumber} ${cust ? cust.name : ""} ${container.containerNumber || ""}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    if (isReceiver) {
      const si = container.stageIndex ?? 0;
      const hasUnderOffloadingFilter = shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import";
      const tabSi = receiverTab === "picked_up" ? 1 : receiverTab === "in_transit" ? 2 : hasUnderOffloadingFilter && receiverTab === "under_offloading" ? 3 : hasUnderOffloadingFilter ? 4 : 3;
      if (si !== tabSi) return false;
      return matchesQ;
    }
    let matchesFilter = true;
    if (filter === "active") matchesFilter = st === "Confirmed" || st === "Picked Up" || st === "In Transit";
    else if (filter === "delivered") matchesFilter = st === "Delivered";
    else if (filter === "completed") matchesFilter = st === "Completed";
    else if (filter === "confirmed") matchesFilter = st === "Confirmed";
    else if (filter === "picked_up") matchesFilter = st === "Picked Up";
    else if (filter === "in_transit") matchesFilter = st === "In Transit";
    else if (filter === "under_offloading") matchesFilter = st === "Under Offloading";
    else if (filter === "delivered_today") matchesFilter = container.deliveredDate === today;
    return matchesQ && matchesFilter;
  });

  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-white">Live Tracking</h2>
        <p className="text-slate-500 text-sm mt-1">
          {isReceiver ? "Containers dispatched and in transit — confirm arrival on delivery"
            : isEmptyReturnReceiver ? "Delivered import containers awaiting empty return"
            : "Monitor active containers and update delivery status"}
        </p>
      </div>
      {isReceiver ? (
        <div className={cx("grid grid-cols-2 gap-4", (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") ? "lg:grid-cols-4" : "lg:grid-cols-3")}>
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setReceiverTab("picked_up")}
            active={receiverTab === "picked_up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setReceiverTab("in_transit")}
            active={receiverTab === "in_transit"}
          />
          {(shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") && (
            <MiniStat
              label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
              onClick={() => setReceiverTab("under_offloading")}
              active={receiverTab === "under_offloading"}
            />
          )}
          <MiniStat
            label="Delivered" value={deliveredAllCount} color="text-emerald-400"
            onClick={() => setReceiverTab("delivered")}
            active={receiverTab === "delivered"}
          />
        </div>
      ) : (
        <div className={cx("grid grid-cols-2 gap-4", showCompletedBlock ? "lg:grid-cols-6" : (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") ? "lg:grid-cols-5" : showDeliveredBlock ? "lg:grid-cols-4" : "lg:grid-cols-3")}>
          <MiniStat
            label="Confirmed" value={confirmedCount} color="text-blue-400"
            onClick={() => setFilter(filter === "confirmed" ? "all" : "confirmed")}
            active={filter === "confirmed"}
          />
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setFilter(filter === "picked_up" ? "all" : "picked_up")}
            active={filter === "picked_up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setFilter(filter === "in_transit" ? "all" : "in_transit")}
            active={filter === "in_transit"}
          />
          {(shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") && (
            <MiniStat
              label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
              onClick={() => setFilter(filter === "under_offloading" ? "all" : "under_offloading")}
              active={filter === "under_offloading"}
            />
          )}
          {showDeliveredBlock && (showAllDelivered ? (
            <MiniStat
              label="Delivered" value={deliveredAllCount} color="text-emerald-400"
              onClick={() => setFilter(filter === "delivered" ? "all" : "delivered")}
              active={filter === "delivered"}
            />
          ) : (
            <MiniStat
              label="Delivered" value={deliveredTodayCount} color="text-emerald-400"
              onClick={() => setFilter(filter === "delivered_today" ? "all" : "delivered_today")}
              active={filter === "delivered_today"}
            />
          ))}
          {showCompletedBlock && (
            <MiniStat
              label="Completed" value={completedCount} color="text-violet-400"
              onClick={() => setFilter(filter === "completed" ? "all" : "completed")}
              active={filter === "completed"}
            />
          )}
        </div>
      )}
      <div className="flex gap-3 flex-wrap">
        <SearchBox value={q} onChange={setQ} placeholder="Search orders, containers..." />
        {!isReceiver && !isDispatcher && !isEmptyReturnReceiver && (
          <select className={inputCls} style={{ width: 240 }} value={filter} onChange={(e) => setFilter(e.target.value)}>
            <option value="active">Active (Confirmed + Picked Up + In Transit)</option>
            <option value="delivered">Delivered</option>
            <option value="completed">Completed</option>
            <option value="all">All</option>
          </select>
        )}
      </div>
      {rows.length === 0 ? (
        <EmptyState icon={Navigation} text="No containers to track." />
      ) : (
        <div className="space-y-3">
          {rows.map(({ order: o, container: c }) => {
            const st = trackingDisplayStatus(c, shipmentTypeFilter);
            const cust = getCustomer(data, o.customerId);
            const maxIdx = maxStageIndex(o);
            const showPod = (isAdmin || isEmptyReturnReceiver) && c.podPhoto && (c.stageIndex ?? 0) >= 3;
            const si = c.stageIndex ?? 0;
            const canEditDispatch = (role === "admin" || isDispatcher) && si < 2;
            return (
              <div key={c.id} className={cx(cardCls, "p-4 border-l-4", statusAccentBorder[st] || "border-l-slate-600")}>
                {shipmentTypeFilter === "Domestic" ? (
                  <div className="flex items-start justify-between gap-3 flex-wrap">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap mb-0.5">
                        <span className="font-mono text-blue-400 text-xs">{o.orderNumber}</span>
                      </div>
                      <div className="text-white font-semibold text-sm">{cust ? cust.name : "Unknown"}</div>
                      <div className="text-slate-500 text-xs mt-0.5 flex items-center gap-1"><MapPin size={11} className="shrink-0" />{o.origin} <ChevronRight size={11} className="shrink-0 text-slate-600" /> {c.destination || "—"}</div>
                    </div>
                    <div className="flex gap-1.5 shrink-0"><Badge text={st} className={orderStatusColor[st]} /><Badge text={c.priority || "Normal"} className={priorityColor[c.priority || "Normal"]} /></div>
                  </div>
                ) : (
                  <div className="flex items-start justify-between gap-3 flex-wrap">
                    <div className="min-w-0">
                      <div className="font-mono text-blue-400 text-xs">{o.orderNumber}</div>
                      <div className="text-white font-bold text-sm mb-0.5">{cust ? (cust.shortName || cust.name) : "Unknown"}</div>
                      <div className="flex gap-3 text-xs mb-0.5 flex-wrap">
                        <span className="font-mono font-extrabold text-slate-300">{o.jobNumber || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.containerNumber || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.vehiclePlate || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.containerSize || "—"}</span>
                      </div>
                      {o.description && <div className="text-slate-300 font-bold text-xs">{o.description}</div>}
                    </div>
                    <div className="text-right shrink-0">
                      <div className="flex gap-1.5 justify-end mb-0.5"><Badge text={st} className={orderStatusColor[st]} /><Badge text={c.priority || "Normal"} className={priorityColor[c.priority || "Normal"]} /></div>
                      <div className="text-slate-300 font-bold text-xs mt-0.5">{c.destination || "—"}</div>
                      <div className="text-slate-300 font-bold text-xs mt-0.5">ETA: {fmtDateISO(o.eta)}</div>
                    </div>
                  </div>
                )}
                {shipmentTypeFilter === "Domestic" && o.domesticCategory && (
                  <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-slate-600 text-xs mt-2">
                    <span>PO/SAP {c.poSapNo || "—"}</span>
                    <span>·</span>
                    <span>{c.movementThrough || "—"}</span>
                    <span>·</span>
                    <span>Loading {c.loadingDate ? fmtDate(c.loadingDate) : "—"}</span>
                    <span>·</span>
                    <span>{c.vehicleSize || "—"}</span>
                  </div>
                )}
                <div className="mt-3"><TrackingProgress stageIndex={c.stageIndex ?? 0} cancelled={!!c.cancelled} stages={stagesFor(o.shipmentType)} /></div>
                <div className="flex items-center justify-between mt-3 flex-wrap gap-2">
                  <div className="flex items-center gap-3 text-slate-500 text-xs flex-wrap">
                    <span className="flex items-center gap-1"><Send size={11} />{c.transporter || "No transporter"}</span>
                    {shipmentTypeFilter === "Domestic" && (
                      <span className="flex items-center gap-1"><Truck size={11} />{c.vehiclePlate || "Unassigned"}</span>
                    )}
                    {!isEmptyReturnReceiver && !isReceiver && c.freightAmount !== "" && c.freightAmount !== undefined && c.freightAmount !== null && (
                      <span className="flex items-center gap-1"><Banknote size={11} />{formatPKR(c.freightAmount)}</span>
                    )}
                    {shipmentTypeFilter !== "Domestic" && (
                      <span className="flex items-center gap-1"><MapPin size={11} />{c.emptyReturnLocation || "Empty return TBD"}</span>
                    )}
                    {c.shifting === "yes" && (
                      <>
                        <span className="flex items-center gap-1"><ArrowLeft size={11} className="rotate-90" />Shifted: {c.shiftedContainerNo || "—"}</span>
                        <span className="flex items-center gap-1"><Clock size={11} />Shift empty return: {c.shiftEmptyReturnDate ? fmtDateISO(c.shiftEmptyReturnDate) : "—"}</span>
                      </>
                    )}
                    {shipmentTypeFilter === "Domestic" && <span>ETA {fmtDateISO(o.eta)}</span>}
                    {showPod && c.podPhoto && (
                      <a
                        href={c.podPhoto}
                        download={`pod-${c.containerNumber || o.orderNumber}.jpg`}
                        className="flex items-center gap-1 text-blue-400 hover:text-blue-300"
                      ><FileText size={11} /> {`pod-${c.containerNumber || o.orderNumber}.jpg`}</a>
                    )}
                    {canEditDispatch && si >= 1 && (
                      <button
                        className="flex items-center gap-1 text-blue-400 hover:text-blue-300"
                        onClick={() => setDispatchTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, editingContainer: c, customerId: o.customerId, origin: o.origin, destination: c.destination })}
                      ><Pencil size={11} /> Edit</button>
                    )}
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <button
                      className={iconBtn}
                      title="Open public tracking page"
                      onClick={() => {
                        const link = `${window.location.origin}${window.location.pathname}#track=${encodeURIComponent(o.orderNumber)}`;
                        window.open(link, "_blank");
                      }}
                    ><ExternalLink size={14} /></button>
                    <button className={iconBtn} title="Download Bilty Receipt" onClick={() => downloadBiltyReceipt({ ...o, containers: [c] }, data)}><Receipt size={14} /></button>
                    {!c.cancelled && si < maxIdx && canAdvance(c, o) && (
                      <button
                        className={cx(btnPrimary, "!px-3 !py-1.5 !text-xs")}
                        onClick={() => {
                          const nextIdx = si + 1;
                          const st = o.shipmentType || "Import";
                          const hasUnderOffloading = st === "Domestic" || st === "Import";
                          const podStageIndex = hasUnderOffloading ? 4 : 3;
                          const arrivalStageIndex = hasUnderOffloading ? 3 : -1;
                          const completedStageIndex = st === "Import" ? 5 : -1;
                          if (nextIdx === arrivalStageIndex) setArrivalTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber });
                          else if (nextIdx === podStageIndex) setPodTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, stageIndex: podStageIndex });
                          else if (nextIdx === completedStageIndex) setEmptyReturnTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, defaultLocation: c.emptyReturnLocation || "" });
                          else if (nextIdx === 1) setDispatchTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, editingContainer: null, customerId: o.customerId, origin: o.origin, destination: c.destination });
                          else updateContainerStage(o.id, c.id, nextIdx);
                        }}
                      >
                        Advance to {(stagesFor(o.shipmentType))[si + 1]}
                      </button>
                    )}
                    {!c.cancelled && si < 3 && !canAdvance(c, o) && isDispatcher && (
                      <span className="text-slate-500 text-xs italic">Awaiting Receiver</span>
                    )}
                    {!c.cancelled && isEmptyReturnReceiver && (si === 4 || si === 5) && (
                      <div className="flex items-center gap-1.5">
                        <span className="text-slate-500 text-xs">Empty Return</span>
                        <EmptyReturnDateField orderId={o.id} containerId={c.id} value={c.emptyReturnDate} updateContainerStage={updateContainerStage} />
                        <Badge text={c.emptyReturnDate ? "Received" : "In Process"} className={c.emptyReturnDate ? "bg-emerald-950 text-emerald-400 border-emerald-800" : "bg-amber-950 text-amber-400 border-amber-800"} />
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {podTarget && (() => {
        const podOrder = data.orders.find((o) => o.id === podTarget.orderId);
        const podContainer = podOrder ? orderContainers(podOrder).find((c) => c.id === podTarget.containerId) : null;
        const podShipmentType = podOrder ? (podOrder.shipmentType || "Import") : "Import";
        const hasArrivalReference = podShipmentType === "Domestic" || podShipmentType === "Import";
        return (
          <PodModal
            containerLabel={podTarget.label}
            showArrivalReference={hasArrivalReference}
            existingArrivalDate={podContainer ? podContainer.podArrivalAt : ""}
            onClose={() => setPodTarget(null)}
            onConfirm={(podData) => {
              updateContainerStage(podTarget.orderId, podTarget.containerId, podTarget.stageIndex, podData);
              setPodTarget(null);
            }}
          />
        );
      })()}
      {arrivalTarget && (
        <ArrivalDateModal
          containerLabel={arrivalTarget.label}
          onClose={() => setArrivalTarget(null)}
          onConfirm={(arrivalData) => {
            updateContainerStage(arrivalTarget.orderId, arrivalTarget.containerId, 3, arrivalData);
            setArrivalTarget(null);
          }}
        />
      )}
      {dispatchTarget && (
        <DispatchModal
          containerLabel={dispatchTarget.label}
          initial={dispatchTarget.editingContainer}
          transporters={data.transporters}
          isDomestic={shipmentTypeFilter === "Domestic"}
          contracts={data.contracts}
          contractGroups={data.contract_groups}
          customerId={dispatchTarget.customerId}
          loadingPoint={dispatchTarget.origin}
          destination={dispatchTarget.destination}
          onClose={() => setDispatchTarget(null)}
          onConfirm={(dispatchData) => {
            if (dispatchTarget.editingContainer) updateContainerFields(dispatchTarget.orderId, dispatchTarget.containerId, dispatchData);
            else updateContainerStage(dispatchTarget.orderId, dispatchTarget.containerId, 1, dispatchData);
            setDispatchTarget(null);
          }}
        />
      )}
      {emptyReturnTarget && (
        <EmptyReturnModal
          containerLabel={emptyReturnTarget.label}
          defaultLocation={emptyReturnTarget.defaultLocation}

/* ==================== Invoices ==================== */

function InvoicesView({ data, openModal, askDelete }) {
  const [q, setQ] = useState("");
  const [tab, setTab] = useState("All");
  const [showPicker, setShowPicker] = useState(false);
  const today = todayISO();

  // Delivered containers that don't have an invoice linked to them yet.
  const invoicedContainerIds = new Set(data.invoices.map((i) => i.containerId).filter(Boolean));
  const eligibleContainers = [];
  data.orders.forEach((o) => {
    orderContainers(o).forEach((c) => {
      if (isDeliveredOrCompleted(c, o.shipmentType) && !invoicedContainerIds.has(c.id)) {
        eligibleContainers.push({ order: o, container: c });
      }
    });
  });

  function pickContainer(order, container) {
    setShowPicker(false);
    openModal({
      type: "invoice", mode: "add", item: null,
      prefill: {
        orderId: order.id, containerId: container.id, customerId: order.customerId,
        total: Number(container.amount) || 0, issued: todayISO(), due: addDaysISO(todayISO(), 30), status: "Draft",
      },
    });
  }

  const withComputedStatus = data.invoices.map((inv) => {
    let st = inv.status;
    if (st !== "Paid" && st !== "Cancelled" && st !== "Draft" && inv.due < today) st = "Overdue";
    return { ...inv, computedStatus: st };
  });

  const totalRevenue = withComputedStatus.filter((i) => i.status === "Paid").reduce((s, i) => s + i.total, 0);
  const outstanding = withComputedStatus.filter((i) => i.computedStatus === "Sent" || i.computedStatus === "Overdue").reduce((s, i) => s + i.total, 0);
  const paidCount = withComputedStatus.filter((i) => i.status === "Paid").length;
  const overdueCount = withComputedStatus.filter((i) => i.computedStatus === "Overdue").length;

  const counts = { All: withComputedStatus.length };
  INVOICE_STATUSES.forEach((s) => { counts[s] = withComputedStatus.filter((i) => i.computedStatus === s).length; });

  const rows = withComputedStatus.filter((i) => {
    const cust = getCustomer(data, i.customerId);
    const ord = getOrder(data, i.orderId);
    const text = `${i.invoiceNumber} ${cust ? cust.name : ""} ${ord ? ord.orderNumber : ""}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    const matchesTab = tab === "All" || i.computedStatus === tab;
    return matchesQ && matchesTab;
  });

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-2xl font-bold text-white">Invoicing &amp; Billing</h2>
          <p className="text-slate-500 text-sm mt-1">Generate, track, and manage invoices</p>
        </div>
        <div className="flex items-center gap-2">
          <button className={btnSecondary} onClick={() => setShowPicker(true)}>
            <CheckCircle2 size={16} /> Create from Delivered {eligibleContainers.length > 0 && `(${eligibleContainers.length})`}
          </button>
          <button className={btnPrimary} onClick={() => openModal({ type: "invoice", mode: "add", item: null })}>
            <Plus size={16} /> New Invoice
          </button>
        </div>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <MiniStat label="Total Revenue" value={formatPKR(totalRevenue)} color="text-emerald-400" />
        <MiniStat label="Outstanding" value={formatPKR(outstanding)} color="text-amber-400" />
        <MiniStat label="Paid" value={paidCount} color="text-emerald-400" />
        <MiniStat label="Overdue" value={overdueCount} color="text-red-400" />
      </div>
      <div className="flex flex-wrap gap-2">
        {["All", ...INVOICE_STATUSES].map((s) => (
          <button
            key={s}
            onClick={() => setTab(s)}
            className={cx(
              "px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors",
              tab === s ? "bg-blue-600 border-blue-600 text-white" : "border-slate-700 text-slate-400 hover:bg-slate-900"
            )}
          >
            {s} <span className="opacity-70">{counts[s] || 0}</span>
          </button>
        ))}
      </div>
      <SearchBox value={q} onChange={setQ} placeholder="Search invoices, customers, orders..." />
      {rows.length === 0 ? (
        <EmptyState icon={FileText} text="No invoices found." />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                <th className={thCls}>Invoice</th>
                <th className={thCls}>Customer</th>
                <th className={thCls}>Issued</th>
                <th className={thCls}>Due</th>
                <th className={thCls}>Total</th>
                <th className={thCls}>Status</th>
                <th className={thCls}></th>
              </tr>
            </thead>
            <tbody>
              {rows.map((i) => {
                const cust = getCustomer(data, i.customerId);
                const ord = getOrder(data, i.orderId);
                return (
                  <tr key={i.id} className={trCls}>
                    <td className={tdCls}>
                      <div className="text-blue-400 font-mono">{i.invoiceNumber}</div>
                      {ord && <div className="text-slate-600 text-xs font-mono">{ord.orderNumber}</div>}
                    </td>
                    <td className={tdCls}>
                      <div className="text-white font-medium">{cust ? cust.name : "Unknown"}</div>
                      <div className="text-slate-600 text-xs">{cust ? cust.email : ""}</div>
                    </td>
                    <td className={tdCls}>{fmtDate(i.issued)}</td>
                    <td className={tdCls}>{fmtDate(i.due)}</td>
                    <td className={cx(tdCls, "text-white font-medium")}>{formatPKR(i.total)}</td>
                    <td className={tdCls}><Badge text={i.computedStatus} className={invoiceStatusColor[i.computedStatus]} /></td>
                    <td className={tdCls}>
                      <div className="flex items-center gap-1 justify-end">
                        <button className={iconBtn} title="View" onClick={() => openModal({ type: "invoice", mode: "view", item: i })}><Eye size={15} /></button>
                        <button className={iconBtn} title="Edit" onClick={() => openModal({ type: "invoice", mode: "edit", item: i })}><Pencil size={15} /></button>
                        <button className={iconBtnDanger} title="Delete" onClick={() => askDelete({ entity: "invoices", id: i.id, label: "invoice" })}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      {showPicker && (
        <Modal title="Create Invoice from a Delivered Container" onClose={() => setShowPicker(false)}>
          {eligibleContainers.length === 0 ? (
            <p className="text-slate-400 text-sm">No delivered containers are waiting for an invoice right now.</p>
          ) : (
            <div className="space-y-2">
              {eligibleContainers.map(({ order, container }) => {
                const cust = getCustomer(data, order.customerId);
                return (
                  <button
                    key={container.id}
                    type="button"
                    onClick={() => pickContainer(order, container)}
                    className="w-full text-left bg-slate-900/50 border border-slate-800 rounded-lg p-3 hover:border-blue-600 transition-colors"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-white font-medium text-sm">{cust ? cust.name : "Unknown"}</span>
                      <span className="text-emerald-400 font-medium text-sm">{formatPKR(container.amount)}</span>
                    </div>
                    <div className="text-slate-500 text-xs font-mono mt-0.5">{order.orderNumber} · Container {container.containerNumber || "—"}</div>
                  </button>
                );
              })}
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

function containerTotalBillAmount(c) {
  const freight = Number(c.freightAmount) || 0;
  const chargesTotal = (Array.isArray(c.charges) ? c.charges : []).reduce((sum, ch) => sum + (Number(ch.amount) || 0), 0);
  return freight + chargesTotal;
}

function TransporterBillModal({ order, container, updateContainerFields, onClose }) {
  const [billDate, setBillDate] = useState(container.transporterBillDate || "");
  const [billNo, setBillNo] = useState(container.transporterBillNo || "");
  const [charges, setCharges] = useState(Array.isArray(container.charges) ? container.charges : []);
  const total = containerTotalBillAmount({ ...container, charges });

  function commitAll(nextCharges) {
    const chargesToUse = nextCharges !== undefined ? nextCharges : charges;
    updateContainerFields(order.id, container.id, {
      transporterBillDate: billDate,
      transporterBillNo: billNo,
      billAmountApproved: containerTotalBillAmount({ ...container, charges: chargesToUse }),
      charges: chargesToUse,
    });
  }
  function commitCharges(next) {
    setCharges(next);
    commitAll(next);
  }

  return (
    <Modal title={`Transporter Bill — Container ${container.containerNumber || "—"}`} onClose={onClose}>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label className="text-slate-500 text-xs block mb-1">Transporter Bill Date</label>
          <input type="date" className={inputCls} value={billDate} onChange={(e) => setBillDate(e.target.value)} onBlur={() => commitAll()} />
        </div>
        <div>
          <label className="text-slate-500 text-xs block mb-1">Transporter Bill No.</label>
          <input className={inputCls} value={billNo} onChange={(e) => setBillNo(e.target.value)} onBlur={() => commitAll()} />
        </div>
      </div>
      <div className="mb-3 bg-slate-900/60 border border-slate-800 rounded-lg p-3">
        <div className="flex items-center justify-between text-xs text-slate-500 mb-1">
          <span>Freight Amount</span><span>{formatPKR(container.freightAmount)}</span>
        </div>
        {charges.map((ch) => (
          <div key={ch.id} className="flex items-center justify-between text-xs text-slate-500 mb-1">
            <span>{ch.type}</span><span>{formatPKR(ch.amount)}</span>
          </div>
        ))}
        <div className="flex items-center justify-between text-sm font-semibold text-white pt-2 mt-1 border-t border-slate-800">
          <span>Total Bill Amount Approved</span><span>{formatPKR(total)}</span>
        </div>
      </div>
      <ChargesEditor charges={charges} onChange={commitCharges} />
      <div className="flex justify-end mt-4">
        <button type="button" onClick={onClose} className={btnPrimary}>Done</button>
      </div>
    </Modal>
  );
}
