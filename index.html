/* ==================== Tracking ==================== */

// A plain <input type="date"> bound directly to onChange fires on every digit typed into
// the year segment — including incomplete years like "0002" partway through typing "2026".
// Wiring that straight to a database write (as this used to be) meant every keystroke sent
// a real update, sometimes with a garbage date. This keeps the typed value in local state
// and only commits a change once the field loses focus AND the value is a complete,
// plausible date (a 4-digit year between 2000-2100) — anything else reverts silently.
function EmptyReturnDateField({ orderId, containerId, value, updateContainerStage }) {
  const [local, setLocal] = useState(value || "");
  useEffect(() => { setLocal(value || ""); }, [value]);

  function commit(val) {
    if (val === "") {
      updateContainerStage(orderId, containerId, 4, { emptyReturnDate: "" });
      return;
    }
    const year = Number(val.slice(0, 4));
    const isCompleteDate = /^\d{4}-\d{2}-\d{2}$/.test(val) && year >= 2000 && year <= 2100;
    if (isCompleteDate) {
      updateContainerStage(orderId, containerId, 5, { emptyReturnDate: val });
    } else {
      setLocal(value || ""); // not a real, complete date yet - discard and revert the field
    }
  }

  return (
    <input
      type="date"
      className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:ring-1 focus:ring-blue-600"
      value={local}
      onChange={(e) => setLocal(e.target.value)}
      onBlur={(e) => commit(e.target.value)}
    />
  );
}

// Domestic-specific: the form shown when advancing In Transit -> Under Offloading. Deliberately
// just one field, and deliberately starts blank (no auto-filled "now") so the receiver has to
// actually pick the real arrival date and time rather than accept a default that might be wrong.
function ArrivalDateModal({ containerLabel, onClose, onConfirm }) {
  const [arrivalAt, setArrivalAt] = useState("");

  function submit(e) {
    e.preventDefault();
    if (!arrivalAt) return;
    onConfirm({ podArrivalAt: new Date(arrivalAt).toISOString() });
  }

  return (
    <Modal title={`Confirm Arrival — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Actual Arrival Date &amp; Time">
          <input type="datetime-local" className={inputCls} value={arrivalAt} onChange={(e) => setArrivalAt(e.target.value)} required />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" className={btnPrimary}>Confirm</button>
        </div>
      </form>
    </Modal>
  );
}

function TrackingView({ data, updateContainerStage, updateContainerFields, role, shipmentTypeFilter }) {
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const [receiverTab, setReceiverTab] = useState("picked_up"); // Picked Up / In Transit / Delivered
  const [podTarget, setPodTarget] = useState(null); // { orderId, containerId, label }
  const [arrivalTarget, setArrivalTarget] = useState(null); // { orderId, containerId, label } - Domestic's In Transit -> Under Offloading step
  const [dispatchTarget, setDispatchTarget] = useState(null); // { orderId, containerId, label }
  const [emptyReturnTarget, setEmptyReturnTarget] = useState(null); // { orderId, containerId, label, defaultLocation } - Delivered -> Completed step, Import only
  // Rendering every matching row at once got expensive with hundreds of orders in the system -
  // each tracking card is a fairly heavy subtree (progress bar, multiple animated segments,
  // several buttons). Cap what's actually in the DOM and let people load more as needed.
  const [visibleCount, setVisibleCount] = useState(30);
  const today = todayISO();
  const isDispatcher = role === "dispatcher_import" || role === "dispatcher_domestic" || role === "dispatcher_export";
  const isReceiver = role === "receiver_import_domestic" || role === "receiver_export";
  const isEmptyReturnReceiver = role === "empty_return_receiver";
  const isAdmin = role === "admin";
  // Admin and the Empty Return Receiver look back through all delivered containers (not
  // just today's) to find what still needs its empty box returned.
  const showAllDelivered = isAdmin || isEmptyReturnReceiver;
  // Dispatcher no longer sees Delivered or Completed at all — their containers leave their
  // view entirely once advanced to In Transit, so those two blocks would always read zero.
  const showDeliveredBlock = !isDispatcher;
  const showCompletedBlock = isAdmin || isEmptyReturnReceiver;

  // Dispatchers can move a container up through In Transit, but not all the way to Delivered.
  // Receivers take it from there — Export is still the single final step (In Transit ->
  // Delivered); Import and Domestic both have an extra Under Offloading step in between,
  // both button-driven with their own small confirmation forms (ArrivalDateModal / PodModal).
  function canAdvance(c, o) {
    const si = c.stageIndex ?? 0;
    const st = o.shipmentType || "Import";
    const hasUnderOffloading = st === "Domestic" || st === "Import";
    if (isDispatcher) return si < 2;
    if (isReceiver) return si === 2 || (si === 3 && hasUnderOffloading);
    return true;
  }
  function maxStageIndex(o) {
    const st = o.shipmentType || "Import";
    if (st === "Import") return 5;
    if (st === "Domestic") return 4;
    return 3;
  }

  // Flatten every order's containers into individual trackable rows, scoped to this
  // page's shipment type (Import/Domestic/Export each get their own Tracking page).
  const flat = useMemo(() => {
    const out = [];
    data.orders.forEach((o) => {
      if (shipmentTypeFilter && (o.shipmentType || "Import") !== shipmentTypeFilter) return;
      orderContainers(o).forEach((c) => out.push({ order: o, container: c }));
    });
    return out;
  }, [data.orders, shipmentTypeFilter]);

  const visible = useMemo(() => (
    isReceiver
      ? flat.filter((r) => {
          const si = r.container.stageIndex ?? 0;
          if (r.container.cancelled) return false;
          if (isSettledOut(r.container)) return false;
          return si >= 1 && si <= (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import" ? 4 : 3); // Picked Up / In Transit / (Under Offloading) / Delivered — categorized into tabs below
        })
      : isEmptyReturnReceiver
      ? flat.filter((r) => {
          if (r.container.cancelled) return false;
          if ((r.order.shipmentType || "Import") !== "Import") return false;
          if (isSettledOut(r.container)) return false;
          const si = r.container.stageIndex ?? 0;
          return si === 4 || si === 5;
        })
      : isDispatcher
      ? flat.filter((r) => !r.container.cancelled && (r.container.stageIndex ?? 0) < 2) // gone once advanced to In Transit
      : flat // admin/staff see everything, unrestricted — Order History is the archive for them
  ), [flat, isReceiver, isEmptyReturnReceiver, isDispatcher, shipmentTypeFilter]);

  const counts = useMemo(() => ({
    confirmedCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Confirmed").length,
    pickedUpCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Picked Up").length,
    inTransitCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "In Transit").length,
    underOffloadingCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Under Offloading").length,
    deliveredTodayCount: visible.filter((r) => r.container.deliveredDate === today).length,
    deliveredAllCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Delivered").length,
    completedCount: visible.filter((r) => trackingDisplayStatus(r.container, shipmentTypeFilter) === "Completed").length,
  }), [visible, shipmentTypeFilter, today]);
  const {
    confirmedCount, pickedUpCount, inTransitCount, underOffloadingCount,
    deliveredTodayCount, deliveredAllCount, completedCount,
  } = counts;

  const rows = useMemo(() => visible.filter(({ order, container }) => {
    const st = trackingDisplayStatus(container, shipmentTypeFilter);
    const cust = getCustomer(data, order.customerId);
    const text = `${order.orderNumber} ${cust ? cust.name : ""} ${container.containerNumber || ""}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    if (isReceiver) {
      const si = container.stageIndex ?? 0;
      const hasUnderOffloadingFilter = shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import";
      const tabSi = receiverTab === "picked_up" ? 1 : receiverTab === "in_transit" ? 2 : hasUnderOffloadingFilter && receiverTab === "under_offloading" ? 3 : hasUnderOffloadingFilter ? 4 : 3;
      if (si !== tabSi) return false;
      return matchesQ;
    }
    let matchesFilter = true;
    if (filter === "active") matchesFilter = st === "Confirmed" || st === "Picked Up" || st === "In Transit";
    else if (filter === "delivered") matchesFilter = st === "Delivered";
    else if (filter === "completed") matchesFilter = st === "Completed";
    else if (filter === "confirmed") matchesFilter = st === "Confirmed";
    else if (filter === "picked_up") matchesFilter = st === "Picked Up";
    else if (filter === "in_transit") matchesFilter = st === "In Transit";
    else if (filter === "under_offloading") matchesFilter = st === "Under Offloading";
    else if (filter === "delivered_today") matchesFilter = container.deliveredDate === today;
    return matchesQ && matchesFilter;
  }), [visible, shipmentTypeFilter, data, q, isReceiver, receiverTab, filter, today]);

  useEffect(() => { setVisibleCount(30); }, [shipmentTypeFilter, q, receiverTab, filter]);
  const visibleRows = rows.slice(0, visibleCount);
  return (
    <div className="space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-white">Live Tracking</h2>
        <p className="text-slate-500 text-sm mt-1">
          {isReceiver ? "Containers dispatched and in transit — confirm arrival on delivery"
            : isEmptyReturnReceiver ? "Delivered import containers awaiting empty return"
            : "Monitor active containers and update delivery status"}
        </p>
      </div>
      {isReceiver ? (
        <div className={cx("grid grid-cols-2 gap-4", (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") ? "lg:grid-cols-4" : "lg:grid-cols-3")}>
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setReceiverTab("picked_up")}
            active={receiverTab === "picked_up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setReceiverTab("in_transit")}
            active={receiverTab === "in_transit"}
          />
          {(shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") && (
            <MiniStat
              label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
              onClick={() => setReceiverTab("under_offloading")}
              active={receiverTab === "under_offloading"}
            />
          )}
          <MiniStat
            label="Delivered" value={deliveredAllCount} color="text-emerald-400"
            onClick={() => setReceiverTab("delivered")}
            active={receiverTab === "delivered"}
          />
        </div>
      ) : (
        <div className={cx("grid grid-cols-2 gap-4", showCompletedBlock ? "lg:grid-cols-6" : (shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") ? "lg:grid-cols-5" : showDeliveredBlock ? "lg:grid-cols-4" : "lg:grid-cols-3")}>
          <MiniStat
            label="Confirmed" value={confirmedCount} color="text-blue-400"
            onClick={() => setFilter(filter === "confirmed" ? "all" : "confirmed")}
            active={filter === "confirmed"}
          />
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setFilter(filter === "picked_up" ? "all" : "picked_up")}
            active={filter === "picked_up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setFilter(filter === "in_transit" ? "all" : "in_transit")}
            active={filter === "in_transit"}
          />
          {(shipmentTypeFilter === "Domestic" || shipmentTypeFilter === "Import") && (
            <MiniStat
              label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
              onClick={() => setFilter(filter === "under_offloading" ? "all" : "under_offloading")}
              active={filter === "under_offloading"}
            />
          )}
          {showDeliveredBlock && (showAllDelivered ? (
            <MiniStat
              label="Delivered" value={deliveredAllCount} color="text-emerald-400"
              onClick={() => setFilter(filter === "delivered" ? "all" : "delivered")}
              active={filter === "delivered"}
            />
          ) : (
            <MiniStat
              label="Delivered" value={deliveredTodayCount} color="text-emerald-400"
              onClick={() => setFilter(filter === "delivered_today" ? "all" : "delivered_today")}
              active={filter === "delivered_today"}
            />
          ))}
          {showCompletedBlock && (
            <MiniStat
              label="Completed" value={completedCount} color="text-violet-400"
              onClick={() => setFilter(filter === "completed" ? "all" : "completed")}
              active={filter === "completed"}
            />
          )}
        </div>
      )}
      <div className="flex gap-3 flex-wrap">
        <SearchBox value={q} onChange={setQ} placeholder="Search orders, containers..." />
        {!isReceiver && !isDispatcher && !isEmptyReturnReceiver && (
          <select className={inputCls} style={{ width: 240 }} value={filter} onChange={(e) => setFilter(e.target.value)}>
            <option value="active">Active (Confirmed + Picked Up + In Transit)</option>
            <option value="delivered">Delivered</option>
            <option value="completed">Completed</option>
            <option value="all">All</option>
          </select>
        )}
      </div>
      {rows.length === 0 ? (
        <EmptyState icon={Navigation} text="No containers to track." />
      ) : (
        <div className="space-y-3">
          {visibleRows.map(({ order: o, container: c }) => {
            const st = trackingDisplayStatus(c, shipmentTypeFilter);
            const cust = getCustomer(data, o.customerId);
            const maxIdx = maxStageIndex(o);
            const showPod = (isAdmin || isEmptyReturnReceiver) && c.podPhoto && (c.stageIndex ?? 0) >= 3;
            const si = c.stageIndex ?? 0;
            const canEditDispatch = (role === "admin" || isDispatcher) && si < 2;
            return (
              <div key={c.id} className={cx(cardCls, "p-4 border-l-4", statusAccentBorder[st] || "border-l-slate-600")}>
                {shipmentTypeFilter === "Domestic" ? (
                  <div className="flex items-start justify-between gap-3 flex-wrap">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap mb-0.5">
                        <span className="font-mono text-blue-400 text-xs">{o.orderNumber}</span>
                      </div>
                      <div className="text-white font-semibold text-sm">{cust ? cust.name : "Unknown"}</div>
                      <div className="text-slate-500 text-xs mt-0.5 flex items-center gap-1"><MapPin size={11} className="shrink-0" />{o.origin} <ChevronRight size={11} className="shrink-0 text-slate-600" /> {c.destination || "—"}</div>
                    </div>
                    <div className="flex gap-1.5 shrink-0"><Badge text={st} className={orderStatusColor[st]} /><Badge text={c.priority || "Normal"} className={priorityColor[c.priority || "Normal"]} /></div>
                  </div>
                ) : (
                  <div className="flex items-start justify-between gap-3 flex-wrap">
                    <div className="min-w-0">
                      <div className="font-mono text-blue-400 text-xs">{o.orderNumber}</div>
                      <div className="text-white font-bold text-sm mb-0.5">{cust ? (cust.shortName || cust.name) : "Unknown"}</div>
                      <div className="flex gap-3 text-xs mb-0.5 flex-wrap">
                        <span className="font-mono font-extrabold text-slate-300">{o.jobNumber || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.containerNumber || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.vehiclePlate || "—"}</span>
                        <span className="font-mono font-extrabold text-slate-300">{c.containerSize || "—"}</span>
                      </div>
                      {o.description && <div className="text-slate-300 font-bold text-xs">{o.description}</div>}
                    </div>
                    <div className="text-right shrink-0">
                      <div className="flex gap-1.5 justify-end mb-0.5"><Badge text={st} className={orderStatusColor[st]} /><Badge text={c.priority || "Normal"} className={priorityColor[c.priority || "Normal"]} /></div>
                      <div className="text-slate-300 font-bold text-xs mt-0.5">{c.destination || "—"}</div>
                      <div className="text-slate-300 font-bold text-xs mt-0.5">ETA: {fmtDateISO(o.eta)}</div>
                    </div>
                  </div>
                )}
                {shipmentTypeFilter === "Domestic" && o.domesticCategory && (
                  <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-slate-600 text-xs mt-2">
                    <span>PO/SAP {c.poSapNo || "—"}</span>
                    <span>·</span>
                    <span>{c.movementThrough || "—"}</span>
                    <span>·</span>
                    <span>Loading {c.loadingDate ? fmtDate(c.loadingDate) : "—"}</span>
                    <span>·</span>
                    <span>{c.vehicleSize || "—"}</span>
                  </div>
                )}
                <div className="mt-3"><TrackingProgress stageIndex={c.stageIndex ?? 0} cancelled={!!c.cancelled} stages={stagesFor(o.shipmentType)} /></div>
                <div className="flex items-center justify-between mt-3 flex-wrap gap-2">
                  <div className="flex items-center gap-3 text-slate-500 text-xs flex-wrap">
                    <span className="flex items-center gap-1"><Send size={11} />{c.transporter || "No transporter"}</span>
                    {shipmentTypeFilter === "Domestic" && (
                      <span className="flex items-center gap-1"><Truck size={11} />{c.vehiclePlate || "Unassigned"}</span>
                    )}
                    {!isEmptyReturnReceiver && !isReceiver && c.freightAmount !== "" && c.freightAmount !== undefined && c.freightAmount !== null && (
                      <span className="flex items-center gap-1"><Banknote size={11} />{formatPKR(c.freightAmount)}</span>
                    )}
                    {shipmentTypeFilter !== "Domestic" && (
                      <span className="flex items-center gap-1"><MapPin size={11} />{c.emptyReturnLocation || "Empty return TBD"}</span>
                    )}
                    {c.shifting === "yes" && (
                      <>
                        <span className="flex items-center gap-1"><ArrowLeft size={11} className="rotate-90" />Shifted: {c.shiftedContainerNo || "—"}</span>
                        <span className="flex items-center gap-1"><Clock size={11} />Shift empty return: {c.shiftEmptyReturnDate ? fmtDateISO(c.shiftEmptyReturnDate) : "—"}</span>
                      </>
                    )}
                    {shipmentTypeFilter === "Domestic" && <span>ETA {fmtDateISO(o.eta)}</span>}
                    {showPod && c.podPhoto && (
                      <a
                        href={c.podPhoto}
                        download={`pod-${c.containerNumber || o.orderNumber}.jpg`}
                        className="flex items-center gap-1 text-blue-400 hover:text-blue-300"
                      ><FileText size={11} /> {`pod-${c.containerNumber || o.orderNumber}.jpg`}</a>
                    )}
                    {canEditDispatch && si >= 1 && (
                      <button
                        className="flex items-center gap-1 text-blue-400 hover:text-blue-300"
                        onClick={() => setDispatchTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, editingContainer: c, customerId: o.customerId, origin: o.origin, destination: c.destination })}
                      ><Pencil size={11} /> Edit</button>
                    )}
                  </div>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <button
                      className={iconBtn}
                      title="Open public tracking page"
                      onClick={() => {
                        const link = `${window.location.origin}${window.location.pathname}#track=${encodeURIComponent(o.orderNumber)}`;
                        window.open(link, "_blank");
                      }}
                    ><ExternalLink size={14} /></button>
                    <button className={iconBtn} title="Download Bilty Receipt" onClick={() => downloadBiltyReceipt({ ...o, containers: [c] }, data)}><Receipt size={14} /></button>
                    {!c.cancelled && si < maxIdx && canAdvance(c, o) && (
                      <button
                        className={cx(btnPrimary, "!px-3 !py-1.5 !text-xs")}
                        onClick={() => {
                          const nextIdx = si + 1;
                          const st = o.shipmentType || "Import";
                          const hasUnderOffloading = st === "Domestic" || st === "Import";
                          const podStageIndex = hasUnderOffloading ? 4 : 3;
                          const arrivalStageIndex = hasUnderOffloading ? 3 : -1;
                          const completedStageIndex = st === "Import" ? 5 : -1;
                          if (nextIdx === arrivalStageIndex) setArrivalTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber });
                          else if (nextIdx === podStageIndex) setPodTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, stageIndex: podStageIndex });
                          else if (nextIdx === completedStageIndex) setEmptyReturnTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, defaultLocation: c.emptyReturnLocation || "" });
                          else if (nextIdx === 1) setDispatchTarget({ orderId: o.id, containerId: c.id, label: c.containerNumber || o.orderNumber, editingContainer: null, customerId: o.customerId, origin: o.origin, destination: c.destination });
                          else updateContainerStage(o.id, c.id, nextIdx);
                        }}
                      >
                        Advance to {(stagesFor(o.shipmentType))[si + 1]}
                      </button>
                    )}
                    {!c.cancelled && si < 3 && !canAdvance(c, o) && isDispatcher && (
                      <span className="text-slate-500 text-xs italic">Awaiting Receiver</span>
                    )}
                    {!c.cancelled && isEmptyReturnReceiver && (si === 4 || si === 5) && (
                      <div className="flex items-center gap-1.5">
                        <span className="text-slate-500 text-xs">Empty Return</span>
                        <EmptyReturnDateField orderId={o.id} containerId={c.id} value={c.emptyReturnDate} updateContainerStage={updateContainerStage} />
                        <Badge text={c.emptyReturnDate ? "Received" : "In Process"} className={c.emptyReturnDate ? "bg-emerald-950 text-emerald-400 border-emerald-800" : "bg-amber-950 text-amber-400 border-amber-800"} />
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {rows.length > visibleCount && (
        <div className="flex justify-center pt-2">
          <button className={btnSecondary} onClick={() => setVisibleCount((n) => n + 30)}>
            Load More ({rows.length - visibleCount} remaining)
          </button>
        </div>
      )}
      {podTarget && (() => {
        const podOrder = data.orders.find((o) => o.id === podTarget.orderId);
        const podContainer = podOrder ? orderContainers(podOrder).find((c) => c.id === podTarget.containerId) : null;
        const podShipmentType = podOrder ? (podOrder.shipmentType || "Import") : "Import";
        const hasArrivalReference = podShipmentType === "Domestic" || podShipmentType === "Import";
        return (
          <PodModal
            containerLabel={podTarget.label}
            showArrivalReference={hasArrivalReference}
            existingArrivalDate={podContainer ? podContainer.podArrivalAt : ""}
            onClose={() => setPodTarget(null)}
            onConfirm={(podData) => {
              updateContainerStage(podTarget.orderId, podTarget.containerId, podTarget.stageIndex, podData);
              setPodTarget(null);
            }}
          />
        );
      })()}
      {arrivalTarget && (
        <ArrivalDateModal
          containerLabel={arrivalTarget.label}
          onClose={() => setArrivalTarget(null)}
          onConfirm={(arrivalData) => {
            updateContainerStage(arrivalTarget.orderId, arrivalTarget.containerId, 3, arrivalData);
            setArrivalTarget(null);
          }}
        />
      )}
      {dispatchTarget && (
        <DispatchModal
          containerLabel={dispatchTarget.label}
          initial={dispatchTarget.editingContainer}
          transporters={data.transporters}
          isDomestic={shipmentTypeFilter === "Domestic"}
          contracts={data.contracts}
          contractGroups={data.contract_groups}
          customerId={dispatchTarget.customerId}
          loadingPoint={dispatchTarget.origin}
          destination={dispatchTarget.destination}
          onClose={() => setDispatchTarget(null)}
          onConfirm={(dispatchData) => {
            if (dispatchTarget.editingContainer) updateContainerFields(dispatchTarget.orderId, dispatchTarget.containerId, dispatchData);
            else updateContainerStage(dispatchTarget.orderId, dispatchTarget.containerId, 1, dispatchData);
            setDispatchTarget(null);
          }}
        />
      )}
      {emptyReturnTarget && (
        <EmptyReturnModal
          containerLabel={emptyReturnTarget.label}
          defaultLocation={emptyReturnTarget.defaultLocation}
          onClose={() => setEmptyReturnTarget(null)}
          onConfirm={(emptyReturnData) => {
            updateContainerStage(emptyReturnTarget.orderId, emptyReturnTarget.containerId, 5, emptyReturnData);
            setEmptyReturnTarget(null);
          }}
        />
      )}
    </div>
  );
}

/* ==================== Invoices ==================== */

function InvoicesView({ data, openModal, askDelete, isColVisible }) {
  const [q, setQ] = useState("");
  const [tab, setTab] = useState("All");
  const [showPicker, setShowPicker] = useState(false);
  const today = todayISO();

  // Delivered containers that don't have an invoice linked to them yet.
  const invoicedContainerIds = new Set(data.invoices.map((i) => i.containerId).filter(Boolean));
  const eligibleContainers = [];
  data.orders.forEach((o) => {
    orderContainers(o).forEach((c) => {
      if (isDeliveredOrCompleted(c, o.shipmentType) && !invoicedContainerIds.has(c.id)) {
        eligibleContainers.push({ order: o, container: c });
      }
    });
  });

  function pickContainer(order, container) {
    setShowPicker(false);
    openModal({
      type: "invoice", mode: "add", item: null,
      prefill: {
        orderId: order.id, containerId: container.id, customerId: order.customerId,
        total: Number(container.amount) || 0, issued: todayISO(), due: addDaysISO(todayISO(), 30), status: "Draft",
      },
    });
  }

  const withComputedStatus = data.invoices.map((inv) => {
    let st = inv.status;
    if (st !== "Paid" && st !== "Cancelled" && st !== "Draft" && inv.due < today) st = "Overdue";
    return { ...inv, computedStatus: st };
  });

  const totalRevenue = withComputedStatus.filter((i) => i.status === "Paid").reduce((s, i) => s + i.total, 0);
