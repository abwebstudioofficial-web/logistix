/* ==================== Transporter Bills (Transporter Bill Checker role) ==================== */

// Domestic containers track their own "Loading Date"; Import/Export containers don't have that
// field, so their dispatch date/time doubles as the loading date for this table.
function containerLoadingDate(c) {
  if (c.loadingDate) return fmtDate(c.loadingDate);
  if (c.dispatchAt) return fmtDate(toLocalDateStr(new Date(c.dispatchAt)));
  return "—";
}

function containerTotalBillAmount(c) {
  const freight = Number(c.freightAmount) || 0;
  const chargesTotal = (Array.isArray(c.charges) ? c.charges : []).reduce((sum, ch) => sum + (Number(ch.amount) || 0), 0);
  return freight + chargesTotal;
}

const BILL_STAGES = ["Pending", "Bill Received", "Pending Approval", "Posted", "Paid"];
const billStageColor = {
  Pending: "bg-slate-800 text-slate-400 border-slate-700",
  "Bill Received": "bg-blue-950 text-blue-400 border-blue-800",
  "Pending Approval": "bg-amber-950 text-amber-400 border-amber-800",
  Posted: "bg-violet-950 text-violet-400 border-violet-800",
  Paid: "bg-emerald-950 text-emerald-400 border-emerald-800",
};
// Same hues as billStageColor above, just the plain text-color class MiniStat expects
// (matching the color prop format used by the Orders page's own status blocks).
const billStageTextColor = {
  Pending: "text-slate-400",
  "Bill Received": "text-blue-400",
  "Pending Approval": "text-amber-400",
  Posted: "text-violet-400",
  Paid: "text-emerald-400",
};
// A bill's stage is driven by three manual flags, each set by its own click. billReceived is
// set by the Mark-Bill-Received form (which is also where the transporter bill date/no,
// charges, and attachment get entered - see TransporterBillModal). billApproved and billPosted
// are each a single click with no form, advancing one stage at a time. Since charges are
// already entered by the time billReceived is set, Posted/Paid can't be inferred from the
// total being > 0 anymore (it already would be) - every step past Bill Received is purely an
// explicit click, and only the final Posted -> Paid split still comes from actual data (the
// paid amount).
function billStage(c) {
  if (!c.billReceived) return "Pending";
  if (!c.billApproved) return "Bill Received";
  if (!c.billPosted) return "Pending Approval";
  const total = containerTotalBillAmount(c);
  const paid = Number(c.billPaidAmount) || 0;
  if (paid < total) return "Posted";
  return "Paid";
}

// Sortable table header cell. Defined at module scope (not inside TransporterBillsView) so
// React treats it as the same component across renders — defining a component inside another
// component's body creates a brand-new function identity every render, which forces React to
// unmount/remount the whole subtree each time instead of just updating it, causing layout
// jank under rapid clicks.
function SortTh({ colKey, label, sortKey, sortDir, onSort }) {
  const active = sortKey === colKey;
  return (
    <th className={cx(thCls, "cursor-pointer select-none hover:text-slate-300")} onClick={() => onSort(colKey)}>
      <span className="inline-flex items-center gap-2">
        {label}
        <span className="inline-flex flex-col -space-y-0.5 shrink-0">
          <ChevronUp size={13} className={cx("stroke-[3]", active && sortDir === "asc" ? "text-blue-400" : "text-slate-600")} />
          <ChevronDown size={13} className={cx("stroke-[3]", active && sortDir === "desc" ? "text-blue-400" : "text-slate-600")} />
        </span>
      </span>
    </th>
  );
}

const PAYMENT_METHODS = ["Cheque", "Online Transfer", "Cash", "Fuel Card"];

// Form for manually adding a "Payment to Transporter" entry not tied to any specific bill
// (advances, adjustments, etc). Saved onto the transporter record itself (manualPayments),
// since unlike the bill-derived rows there's no container to attach it to.
function ManualPaymentModal({ transporter, updateTransporterManualPayments, onClose }) {
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState("");
  const [billAmount, setBillAmount] = useState("");
  const [paidAmount, setPaidAmount] = useState("");
  const [paymentThrough, setPaymentThrough] = useState(PAYMENT_METHODS[0]);
  const [referenceNo, setReferenceNo] = useState("");
  const [attachment, setAttachment] = useState("");
  const [attachmentError, setAttachmentError] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setAttachmentError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setAttachment(dataUrl);
    } catch (err) {
      setAttachmentError("Couldn't read that file — try a different image or PDF.");
    }
  }

  async function save() {
    if (!date || !description.trim() || !paidAmount) {
      window.alert("Date, Description, and Paid Amount are required.");
      return;
    }
    setBusy(true);
    try {
      const entry = {
        id: uid("pay"), date, description: description.trim(),
        billAmount: xnum(billAmount, 0), paidAmount: xnum(paidAmount, 0),
        paymentThrough, referenceNo: referenceNo.trim(), attachment,
      };
      const nextPayments = [...(Array.isArray(transporter.manualPayments) ? transporter.manualPayments : []), entry];
      const ok = await updateTransporterManualPayments(transporter.name, nextPayments);
      if (ok) onClose();
    } finally {
      setBusy(false);
    }
  }

  return (
    <Modal title={`Add Payment — ${transporter.name}`} onClose={onClose}>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label className="text-slate-500 text-xs block mb-1">Date <span className="text-red-400">*</span></label>
          <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
        </div>
        <div>
          <label className="text-slate-500 text-xs block mb-1">Reference No.</label>
          <input className={inputCls} value={referenceNo} onChange={(e) => setReferenceNo(e.target.value)} placeholder="Optional" />
        </div>
      </div>
      <div className="mb-2">
        <label className="text-slate-500 text-xs block mb-1">Description <span className="text-red-400">*</span></label>
        <input className={inputCls} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What this payment was for" />
      </div>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label className="text-slate-500 text-xs block mb-1">Bill Amount</label>
          <input type="number" min="0" className={inputCls} value={billAmount} onChange={(e) => setBillAmount(e.target.value)} placeholder="0" />
        </div>
        <div>
          <label className="text-slate-500 text-xs block mb-1">Paid Amount <span className="text-red-400">*</span></label>
          <input type="number" min="0" className={inputCls} value={paidAmount} onChange={(e) => setPaidAmount(e.target.value)} placeholder="0" />
        </div>
      </div>
      <div className="mb-3">
        <label className="text-slate-500 text-xs block mb-1">Paid Through</label>
        <select className={inputCls} value={paymentThrough} onChange={(e) => setPaymentThrough(e.target.value)}>
          {PAYMENT_METHODS.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      <div className="mb-3">
        <label className="text-slate-500 text-xs block mb-1">Attachment (image or PDF, optional)</label>
        <input ref={fileInputRef} type="file" accept="image/*,application/pdf" onChange={handleFile} style={{ display: "none" }} />
        <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} className={btnSecondary}>
          {attachment ? "Replace File" : "Choose File"}
        </button>
        {attachmentError && <p className="text-red-400 text-xs mt-1">{attachmentError}</p>}
        {attachment && !isPdfDataUrl(attachment) && (
          <a href={attachment} target="_blank" rel="noreferrer" className="block mt-2">
            <img src={attachment} alt="Payment attachment" className="rounded-lg border border-slate-800 max-h-40" />
          </a>
        )}
        {attachment && isPdfDataUrl(attachment) && (
          <a href={attachment} download="payment-attachment.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2">
            <FileText size={16} /> PDF attached — click to view or download
          </a>
        )}
      </div>
      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onClose} disabled={busy} className={btnSecondary}>Cancel</button>
        <button type="button" onClick={save} disabled={busy} className={btnPrimary}>{busy ? "Saving…" : "Save Payment"}</button>
      </div>
    </Modal>
  );
}

function TransporterBillsView({ data, updateContainerFields, updateTransporterManualPayments, isColVisible, onStatementExport, role }) {
  // Bill Checker's job ends once a bill is forwarded: Mark Bill Received and Forward for
  // Approval (Pending -> Bill Received -> Pending Approval) are both theirs to do. Everything
  // from Pending Approval onward (posting, marking paid) plus the Statement of Account/Excel
  // export belong to Finance Manager. Admin always has full access.
  const isFinance = role === "admin" || role === "finance_manager" || !role;
  const canAdvancePastReceived = isFinance;
  const canExportStatement = isFinance;
  const [pickerQ, setPickerQ] = useState("");
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null); // { order, container, modal: "post" | "paid" }
  const [selectedTransporter, setSelectedTransporter] = useState(null);
  const [stageTab, setStageTab] = useState("All");
  const [sortKey, setSortKey] = useState("type");
  const [sortDir, setSortDir] = useState("asc"); // "asc" | "desc"
  const [frozenOrderIds, setFrozenOrderIds] = useState(null);
  const [showPayments, setShowPayments] = useState(false);
  const [showAddPayment, setShowAddPayment] = useState(false);
  const [paySortDir, setPaySortDir] = useState("asc");
  const [showStatement, setShowStatement] = useState(false);
  const [stmtFrom, setStmtFrom] = useState("");
  const [stmtTo, setStmtTo] = useState("");
  const [stmtDisplayed, setStmtDisplayed] = useState(false);
  const [stmtError, setStmtError] = useState("");
  const [stmtSortDir, setStmtSortDir] = useState("asc");

  const flat = [];
  data.orders.forEach((o) => {
    orderContainers(o).forEach((c) => flat.push({ order: o, container: c }));
  });

  // Group every container by its transporter so the picker tiles below can show a
  // bill count + running total per transporter, same pattern as the Domestic Orders
  // category picker (tiles you click into rather than one giant flat table).
  const transporterGroups = useMemo(() => {
    const map = new Map();
    flat.forEach(({ container: c }) => {
      const name = (c.transporter || "").trim() || "Unassigned";
      if (!map.has(name)) map.set(name, { name, count: 0, total: 0 });
      const g = map.get(name);
      g.count += 1;
      g.total += containerTotalBillAmount(c);
    });
    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
  }, [data.orders]);

  function sortValue(row, key) {
    const { order: o, container: c } = row;
    switch (key) {
      case "type": return ({ Domestic: 0, Import: 1, Export: 2 })[o.shipmentType] ?? 3;
      case "stage": return BILL_STAGES.indexOf(billStage(c));
      case "jobNo": return (o.jobNumber || "").toLowerCase();
      case "customer": return ((getCustomer(data, o.customerId) || {}).shortName || (getCustomer(data, o.customerId) || {}).name || "").toLowerCase();
      case "loadingPoint": return (o.origin || "").toLowerCase();
      case "destination": return (c.destination || o.destination || "").toLowerCase();
      case "containerNo": return (c.containerNumber || "").toLowerCase();
      case "vehicleNo": return (c.vehiclePlate || "").toLowerCase();
      case "loadingDate": return c.loadingDate || (c.dispatchAt ? toLocalDateStr(new Date(c.dispatchAt)) : "");
      case "freightAmount": return Number(c.freightAmount) || 0;
      case "totalBillAmount": return containerTotalBillAmount(c);
      case "paidAmount": return Number(c.billPaidAmount) || 0;
      default: return 0;
    }
  }
  function compareRows(a, b) {
    const va = sortValue(a, sortKey);
    const vb = sortValue(b, sortKey);
    const cmp = typeof va === "number" && typeof vb === "number"
      ? va - vb
      : (va < vb ? -1 : va > vb ? 1 : 0); // plain ordinal comparison for text/date strings
    return sortDir === "desc" ? -cmp : cmp;
  }
  function toggleSort(key) {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  }

  // selectedTransporter is null on the picker screen, so this naturally resolves to an
  // empty array then (nothing matches a null transporter name) — safe to compute unconditionally.
  const transporterRows = flat.filter(({ container: c }) => ((c.transporter || "").trim() || "Unassigned") === selectedTransporter);
  const searchedRows = transporterRows.filter(({ order, container }) => {
    const cust = getCustomer(data, order.customerId);
    const text = `${order.orderNumber} ${order.jobNumber || ""} ${cust ? (cust.shortName || cust.name) : ""} ${container.containerNumber || ""}`.toLowerCase();
    return !q || text.includes(q.toLowerCase());
  });

  // Block counts reflect the current search, so narrowing the search also narrows what each block shows.
  const stageCounts = {};
  BILL_STAGES.forEach((s) => { stageCounts[s] = 0; });
  searchedRows.forEach(({ container: c }) => { stageCounts[billStage(c)] += 1; });

  const filteredRows = searchedRows.filter(({ container: c }) => stageTab === "All" || billStage(c) === stageTab);
  // Total Bill Amount is meaningless before charges are posted (always Rs 0 for Pending/Bill
  // Received/Approved), so it's only worth showing once you're actually looking at Posted or
  // Paid bills — or the unfiltered "All" view, where some rows will have it and some won't.
  // The Stage blocks above already show/select the current stage once you've filtered to one,
  // so the Stage column itself is only useful in the unfiltered "All" view where rows are a mix.
  const showStage = isColVisible("transporterBills", "stage") && stageTab === "All";
  const showTotalBillAmount = isColVisible("transporterBills", "totalBillAmount") && stageTab !== "Pending";
  // Paid Amount is only meaningful once a bill has actually been posted — Pending, Bill
  // Received, and Pending Approval are all still Rs 0 by definition.
  const showPaidAmount = isColVisible("transporterBills", "paidAmount") && !["Pending", "Bill Received", "Pending Approval"].includes(stageTab);
  const sortedRows = [...filteredRows].sort(compareRows);

  // While a bill's edit modal is open, pin the row order as it was the moment you opened it —
  // editing a bill you're currently sorted by (e.g. Paid Amount) would otherwise change its
  // sort value live and yank it to a new spot mid-edit. Values inside the row still update
  // live; only its position holds until you close the modal, at which point it re-sorts.
  useEffect(() => {
    setFrozenOrderIds(editing ? sortedRows.map(({ container: c }) => c.id) : null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editing]);
  const displayRows = frozenOrderIds
    ? frozenOrderIds.map((id) => sortedRows.find(({ container: c }) => c.id === id)).filter(Boolean)
    : sortedRows;

  // Payment to Transporter — manually-added entries only (advances, adjustments, or any
  // payment you record here directly). Bill-derived rows used to be auto-included too, but
  // that's been removed - this is now purely what's been entered through Add Payment.
  const currentTransporter = (data.transporters || []).find((t) => t.name === selectedTransporter);
  const manualPayments = Array.isArray(currentTransporter && currentTransporter.manualPayments) ? currentTransporter.manualPayments : [];
  const paymentRows = manualPayments
    .filter((p) => !q || `${p.description} ${p.referenceNo || ""}`.toLowerCase().includes(q.toLowerCase()))
    .map((p) => ({
      kind: "manual", key: p.id, date: p.date || "", description: p.description || "—",
      billAmount: Number(p.billAmount) || 0, paidAmount: Number(p.paidAmount) || 0,
      paymentThrough: p.paymentThrough || "", referenceNo: p.referenceNo || "", attachment: p.attachment || "",
    }))
    .sort((a, b) => {
      const cmp = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return paySortDir === "desc" ? -cmp : cmp;
    });

  // Statement of Account — a separate view, not a stage filter. Same "has this transporter's
  // bill actually been received" scope as the Excel export, so the numbers always agree with
  // what you'd download, just with date-range filtering. Sorted/filtered by the Transporter
  // Bill Date ("Date" column) rather than Loading Date - the bill date is what this statement
  // is actually organized around. Combines bill-derived rows with manually-added "Payment to
  // Transporter" entries, so anything added there also shows up here (Payment to Transporter
  // itself stays manual-only - this merge is specific to Statement).
  const stmtBilledRows = searchedRows.filter(({ container: c }) => c.billReceived);
  function statementDescription(o, c) {
    return [o.jobNumber, c.containerNumber, c.vehiclePlate].filter(Boolean).join(" · ") || "—";
  }
  const stmtBillEntries = stmtBilledRows.map(({ order: o, container: c }) => ({
    kind: "bill", key: c.id, type: o.shipmentType || "Import", description: statementDescription(o, c),
    date: c.transporterBillDate || "", transporterBillNo: c.transporterBillNo || "", status: billStage(c),
    billAmount: containerTotalBillAmount(c), paidAmount: Number(c.billPaidAmount) || 0,
  }));
  const stmtManualEntries = manualPayments.map((p) => ({
    kind: "manual", key: p.id, type: "—", description: p.description || "—",
    date: p.date || "", transporterBillNo: p.referenceNo || "", status: "—",
    billAmount: Number(p.billAmount) || 0, paidAmount: Number(p.paidAmount) || 0,
  }));
  const statementRows = [...stmtBillEntries, ...stmtManualEntries]
    .filter((r) => {
      if (stmtFrom && r.date && r.date < stmtFrom) return false;
      if (stmtTo && r.date && r.date > stmtTo) return false;
      return true;
    })
    .sort((a, b) => {
      const cmp = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return stmtSortDir === "desc" ? -cmp : cmp;
    });

  // Picker screen — choose a transporter before seeing any bills.
  if (!selectedTransporter) {
    const visibleGroups = transporterGroups.filter((g) => !pickerQ || g.name.toLowerCase().includes(pickerQ.toLowerCase()));
    return (
      <div className="space-y-5">
        <div>
          <h2 className="text-2xl font-bold text-white">Transporter Bills</h2>
          <p className="text-slate-500 text-sm mt-1">Choose a transporter to view and manage their bills</p>
        </div>
        <SearchBox value={pickerQ} onChange={setPickerQ} placeholder="Search transporters..." />
        {visibleGroups.length === 0 ? (
          <EmptyState icon={Receipt} text="No transporters found." />
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {visibleGroups.map((g) => (
              <div
                key={g.name}
                className={cx(cardCls, "p-6 cursor-pointer")}
                onClick={() => setSelectedTransporter(g.name)}
              >
                <div className="w-12 h-12 rounded-lg flex items-center justify-center mb-3 bg-blue-600"><Truck size={22} className="text-white" /></div>
                <div className="text-white font-semibold text-lg mb-1">{g.name}</div>
                <div className="text-slate-500 text-sm">{g.count} bill{g.count === 1 ? "" : "s"} · {formatPKR(g.total)}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="space-y-5" key={`${selectedTransporter}-${stageTab}`}>
      <div>
        <button onClick={() => { setSelectedTransporter(null); setQ(""); }} className="text-slate-400 hover:text-white text-sm inline-flex items-center gap-1 mb-2"><ArrowLeft size={14} /> Back to transporters</button>
        <h2 className="text-2xl font-bold text-white">{selectedTransporter}</h2>
        <p className="text-slate-500 text-sm mt-1">Record transporter billing details and approved charges for each container</p>
      </div>
      <div className={cx("grid grid-cols-2 gap-4", canExportStatement ? "lg:grid-cols-7" : "lg:grid-cols-5")} key={`blocks-${stageTab}-${showPayments}-${showStatement}`}>
        {BILL_STAGES.map((s) => (
          <MiniStat
            key={s}
            label={s} value={stageCounts[s] || 0} color={billStageTextColor[s]}
            onClick={() => { setShowPayments(false); setShowStatement(false); setStageTab(stageTab === s ? "All" : s); }}
            active={!showPayments && !showStatement && stageTab === s}
          />
        ))}
        {/* Neither of these is a stage — both are separate report views, toggled on their own
            rather than filtering the stage table like the blocks above. Finance Manager/Admin
            only - neither viewing nor exporting these is part of Bill Checker's job. */}
        {canExportStatement && (
          <div
            onClick={() => { setShowStatement(false); setShowPayments((v) => !v); }}
            className={cx(
              cardCls, "p-5 cursor-pointer flex flex-col justify-center",
              showPayments && "ring-2 ring-blue-500 border-blue-600"
            )}
          >
            <div className="text-slate-500 text-xs font-medium mb-2 flex items-center gap-1.5"><Receipt size={13} /> Payment to Transporter</div>
            <div className="text-lg font-bold text-white">{paymentRows.length}</div>
          </div>
        )}
        {canExportStatement && (
          <div
            onClick={() => { setShowPayments(false); setShowStatement((v) => !v); }}
            className={cx(
              cardCls, "p-5 cursor-pointer flex flex-col justify-center",
              showStatement && "ring-2 ring-blue-500 border-blue-600"
            )}
          >
            <div className="text-slate-500 text-xs font-medium mb-2 flex items-center gap-1.5"><Receipt size={13} /> Statement</div>
            <div className="text-lg font-bold text-white">{statementRows.length}</div>
          </div>
        )}
      </div>
      {showPayments && canExportStatement && (
        <div className="space-y-4">
          <div className="flex justify-end">
            <button type="button" onClick={() => setShowAddPayment(true)} className={btnPrimary}>
              <Plus size={16} /> Add Payment
            </button>
          </div>
          {paymentRows.length === 0 ? (
            <EmptyState icon={Receipt} text="No payments recorded yet for this transporter." />
          ) : (
            <div className={tableWrap} key={`pay-${paySortDir}`}>
              <table className="w-full text-sm">
                <thead className={theadCls}>
                  <tr>
                    <th
                      className={cx(thCls, "cursor-pointer select-none hover:text-slate-300")}
                      onClick={() => setPaySortDir((d) => (d === "asc" ? "desc" : "asc"))}
                    >
                      <span className="inline-flex items-center gap-2">
                        Date
                        <span className="inline-flex flex-col -space-y-0.5 shrink-0">
                          <ChevronUp size={13} className={cx("stroke-[3]", paySortDir === "asc" ? "text-blue-400" : "text-slate-600")} />
                          <ChevronDown size={13} className={cx("stroke-[3]", paySortDir === "desc" ? "text-blue-400" : "text-slate-600")} />
                        </span>
                      </span>
                    </th>
                    <th className={thCls}>Description</th>
                    <th className={thCls}>Bill Amount</th>
                    <th className={thCls}>Paid Amount</th>
                    <th className={thCls}>Paid Through</th>
                    <th className={thCls}>Reference No.</th>
                    <th className={thCls}>Attachment</th>
                  </tr>
                </thead>
                <tbody>
                  {paymentRows.map((r) => (
                    <tr key={r.key} className={trCls}>
                      <td className={tdCls}>{r.date ? fmtDate(r.date) : "—"}</td>
                      <td className={tdCls}>{r.description}</td>
                      <td className={tdCls}>{formatPKR(r.billAmount)}</td>
                      <td className={cx(tdCls, "text-emerald-400 font-medium")}>{formatPKR(r.paidAmount)}</td>
                      <td className={tdCls}>{r.paymentThrough || "—"}</td>
                      <td className={cx(tdCls, "font-mono")}>{r.referenceNo || "—"}</td>
                      <td className={tdCls}>
                        {r.attachment ? (
                          <a
                            href={r.attachment}
                            target={isPdfDataUrl(r.attachment) ? undefined : "_blank"}
                            rel={isPdfDataUrl(r.attachment) ? undefined : "noreferrer"}
                            download={isPdfDataUrl(r.attachment) ? "payment-attachment.pdf" : undefined}
                            className="text-blue-400 hover:text-blue-300 inline-flex items-center gap-1"
                          >
                            <FileText size={14} /> {isPdfDataUrl(r.attachment) ? "PDF" : "View"}
                          </a>
                        ) : (
                          <span className="text-slate-600">—</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
      {showAddPayment && (
        <ManualPaymentModal
          transporter={currentTransporter || { id: null, name: selectedTransporter, manualPayments: [] }}
          updateTransporterManualPayments={updateTransporterManualPayments}
          onClose={() => setShowAddPayment(false)}
        />
      )}
      {(showStatement || showPayments) && canExportStatement ? (showStatement ? (
        <div className="space-y-4">
          <div className="flex flex-wrap items-end gap-3">
            <div>
              <label className="text-slate-500 text-xs block mb-1">From</label>
              <input
                type="date" className={inputCls} value={stmtFrom}
                onChange={(e) => { setStmtFrom(e.target.value); setStmtDisplayed(false); setStmtError(""); }}
              />
            </div>
            <div>
              <label className="text-slate-500 text-xs block mb-1">To</label>
              <input
                type="date" className={inputCls} value={stmtTo}
                onChange={(e) => { setStmtTo(e.target.value); setStmtDisplayed(false); setStmtError(""); }}
              />
            </div>
            <button
              type="button"
              onClick={() => {
                if (!stmtFrom || !stmtTo) { setStmtError("Select both a From and To date first."); return; }
                setStmtError(""); setStmtDisplayed(true);
              }}
              className={btnSecondary}
            >
              Display Statement
            </button>
            <button
              type="button"
              onClick={() => {
                if (!stmtFrom || !stmtTo) { setStmtError("Select both a From and To date first."); return; }
                setStmtError(""); onStatementExport(selectedTransporter, stmtFrom, stmtTo);
              }}
              className="inline-flex items-center gap-1.5 rounded-md px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition-all duration-150 active:scale-[0.97]"
              title="Download this transporter's Statement of Account as Excel, for the selected date range"
            >
              <Download size={14} /> Download Statement
            </button>
            {(stmtFrom || stmtTo) && (
              <button
                type="button"
                onClick={() => { setStmtFrom(""); setStmtTo(""); setStmtDisplayed(false); setStmtError(""); }}
                className="text-slate-400 hover:text-white text-xs underline decoration-dotted underline-offset-4 mb-2"
              >
                Clear filters
              </button>
            )}
          </div>
          {stmtError && <p className="text-amber-400 text-sm">{stmtError}</p>}
          {stmtDisplayed && statementRows.length > 0 && (
            <div className="inline-flex items-stretch divide-x divide-slate-800 bg-slate-900/60 border border-slate-800 rounded-lg overflow-hidden">
              <div className="px-4 py-2">
                <div className="text-slate-500 text-xs mb-0.5">Total Bill Amount</div>
                <div className="text-white font-semibold text-lg">
                  {formatPKR(statementRows.reduce((sum, r) => sum + r.billAmount, 0))}
                </div>
              </div>
              <div className="px-4 py-2">
                <div className="text-slate-500 text-xs mb-0.5">Total Paid Amount</div>
                <div className="text-white font-semibold text-lg">
                  {formatPKR(statementRows.reduce((sum, r) => sum + r.paidAmount, 0))}
                </div>
              </div>
              <div className="px-4 py-2">
                <div className="text-slate-500 text-xs mb-0.5">Total Outstanding</div>
                <div className="text-white font-semibold text-lg">
                  {formatPKR(statementRows.reduce((sum, r) => sum + (r.billAmount - r.paidAmount), 0))}
                </div>
              </div>
            </div>
          )}
          {!stmtDisplayed ? (
            <EmptyState icon={Receipt} text="Select a From and To date, then click Display Statement to see entries." />
          ) : statementRows.length === 0 ? (
            <EmptyState icon={Receipt} text="No billed containers match these filters." />
          ) : (
            <div className={tableWrap} key={`stmt-${stmtSortDir}-${stmtFrom}-${stmtTo}`}>
              <table className="w-full text-sm">
                <thead className={theadCls}>
                  <tr>
                    <th className={thCls}>Sr.</th>
                    <th className={thCls}>Type</th>
                    <th className={thCls}>Description</th>
                    <th
                      className={cx(thCls, "cursor-pointer select-none hover:text-slate-300")}
                      onClick={() => setStmtSortDir((d) => (d === "asc" ? "desc" : "asc"))}
                    >
                      <span className="inline-flex items-center gap-2">
                        Date
                        <span className="inline-flex flex-col -space-y-0.5 shrink-0">
                          <ChevronUp size={13} className={cx("stroke-[3]", stmtSortDir === "asc" ? "text-blue-400" : "text-slate-600")} />
                          <ChevronDown size={13} className={cx("stroke-[3]", stmtSortDir === "desc" ? "text-blue-400" : "text-slate-600")} />
                        </span>
                      </span>
                    </th>
                    <th className={thCls}>Transporter Bill No.</th>
                    <th className={thCls}>Status</th>
                    <th className={thCls}>Total Bill Amount</th>
                    <th className={thCls}>Paid Amount</th>
                    <th className={thCls}>Outstanding</th>
                  </tr>
                </thead>
                <tbody>
                  {statementRows.map((r, i) => (
                    <tr key={r.key} className={trCls}>
                      <td className={tdCls}>{i + 1}</td>
                      <td className={tdCls}>{r.type === "—" ? "—" : <Badge text={r.type} className={shipmentTypeColor[r.type] || priorityColor.Normal} />}</td>
                      <td className={cx(tdCls, "font-mono text-slate-200")}>{r.description}</td>
                      <td className={tdCls}>{r.date ? fmtDate(r.date) : "—"}</td>
                      <td className={tdCls}>{r.transporterBillNo || "—"}</td>
                      <td className={tdCls}>{r.status === "—" ? "—" : <Badge text={r.status} className={billStageColor[r.status]} />}</td>
                      <td className={tdCls}>{formatPKR(r.billAmount)}</td>
                      <td className={tdCls}>{formatPKR(r.paidAmount)}</td>
                      <td className={tdCls}>{formatPKR(r.billAmount - r.paidAmount)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      ) : null) : (
        <>
      <SearchBox value={q} onChange={setQ} placeholder="Search orders, containers..." />
      {displayRows.length === 0 ? (
        <EmptyState icon={Receipt} text="No containers found." />
      ) : (
        // key forces React to fully rebuild this table (rather than reconcile/reorder the
        // existing <tr> elements in place) whenever the sort or filter changes. A fresh mount
        // with a given sort was always confirmed correct in testing; only in-place reordering
        // of the existing rows was producing a stale/wrong visual order despite the underlying
        // data being provably correct - forcing a clean rebuild sidesteps that entirely.
        <div className={tableWrap} key={`${sortKey}-${sortDir}-${stageTab}-${q}-${showStage}-${showTotalBillAmount}-${showPaidAmount}`}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                {isColVisible("transporterBills", "type") && <SortTh colKey="type" label="Type" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {showStage && <SortTh colKey="stage" label="Stage" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "jobNo") && <SortTh colKey="jobNo" label="Job No." sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "customer") && <SortTh colKey="customer" label="Customer" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "loadingPoint") && <SortTh colKey="loadingPoint" label="Loading Point" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "destination") && <SortTh colKey="destination" label="Destination" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "containerNo") && <SortTh colKey="containerNo" label="Container No." sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "vehicleNo") && <SortTh colKey="vehicleNo" label="Vehicle No." sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "loadingDate") && <SortTh colKey="loadingDate" label="Loading Date" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "freightAmount") && <SortTh colKey="freightAmount" label="Freight Amount" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {showTotalBillAmount && <SortTh colKey="totalBillAmount" label="Total Bill Amount Approved" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {showPaidAmount && <SortTh colKey="paidAmount" label="Paid Amount" sortKey={sortKey} sortDir={sortDir} onSort={toggleSort} />}
                {isColVisible("transporterBills", "attachment") && stageTab !== "Pending" && <th className={thCls}>Bill Attachment</th>}
                {isColVisible("transporterBills", "action") && <th className={thCls}>Action</th>}
              </tr>
            </thead>
            <tbody>
              {displayRows.map(({ order: o, container: c }) => {
                const cust = getCustomer(data, o.customerId);
                const shipType = o.shipmentType || "Import";
                return (
                  <tr key={c.id} className={trCls}>
                    {isColVisible("transporterBills", "type") && (
                      <td className={tdCls}><Badge text={shipType} className={shipmentTypeColor[shipType] || priorityColor.Normal} /></td>
                    )}
                    {showStage && (
                      <td className={tdCls}><Badge text={billStage(c)} className={billStageColor[billStage(c)]} /></td>
                    )}
                    {isColVisible("transporterBills", "jobNo") && <td className={cx(tdCls, "font-mono text-slate-200")}>{o.jobNumber || "—"}</td>}
                    {isColVisible("transporterBills", "customer") && <td className={cx(tdCls, "text-white font-medium")}>{cust ? (cust.shortName || cust.name) : "Unknown"}</td>}
                    {isColVisible("transporterBills", "loadingPoint") && <td className={tdCls}>{o.origin || "—"}</td>}
                    {isColVisible("transporterBills", "destination") && <td className={tdCls}>{c.destination || o.destination || "—"}</td>}
                    {isColVisible("transporterBills", "containerNo") && <td className={cx(tdCls, "font-mono")}>{c.containerNumber || "—"}</td>}
                    {isColVisible("transporterBills", "vehicleNo") && <td className={tdCls}>{c.vehiclePlate || "—"}</td>}
                    {isColVisible("transporterBills", "loadingDate") && <td className={tdCls}>{containerLoadingDate(c)}</td>}
                    {isColVisible("transporterBills", "freightAmount") && <td className={tdCls}>{c.freightAmount ? formatPKR(c.freightAmount) : "—"}</td>}
                    {showTotalBillAmount && (
                      <td className={tdCls}>
                        {billStage(c) === "Bill Received" ? (
                          <button
                            type="button"
                            onClick={() => setEditing({ order: o, container: c, modal: "post" })}
                            className="text-blue-400 hover:text-blue-300 font-medium underline decoration-dotted underline-offset-4"
                          >
                            {formatPKR(containerTotalBillAmount(c))}
                          </button>
                        ) : (
                          <span className="text-slate-300 font-medium">{formatPKR(containerTotalBillAmount(c))}</span>
                        )}
                      </td>
                    )}
                    {showPaidAmount && (
                      <td className={tdCls}>
                        {(canAdvancePastReceived && billStage(c) === "Paid") ? (
                          <button
                            type="button"
                            onClick={() => setEditing({ order: o, container: c, modal: "paid" })}
                            className="text-blue-400 hover:text-blue-300 font-medium underline decoration-dotted underline-offset-4"
                          >
                            {c.billPaidAmount ? formatPKR(c.billPaidAmount) : "Rs 0"}
                          </button>
                        ) : (
                          <span className="text-slate-300 font-medium">{c.billPaidAmount ? formatPKR(c.billPaidAmount) : "Rs 0"}</span>
                        )}
                      </td>
                    )}
                    {isColVisible("transporterBills", "attachment") && stageTab !== "Pending" && (
                      <td className={tdCls}>
                        {c.billAttachment ? (
                          <a
                            href={c.billAttachment}
                            target={isPdfDataUrl(c.billAttachment) ? undefined : "_blank"}
                            rel={isPdfDataUrl(c.billAttachment) ? undefined : "noreferrer"}
                            download={isPdfDataUrl(c.billAttachment) ? "transporter-bill.pdf" : undefined}
                            className="text-blue-400 hover:text-blue-300 inline-flex items-center gap-1"
                          >
                            <FileText size={14} /> {isPdfDataUrl(c.billAttachment) ? "PDF" : "View"}
                          </a>
                        ) : (
                          <span className="text-slate-600">—</span>
                        )}
                      </td>
                    )}
                    {isColVisible("transporterBills", "action") && (
                      <td className={tdCls}>
                        {(() => {
                          const stage = billStage(c);
                          if (stage === "Pending") {
                            return (
                              <button type="button" onClick={() => setEditing({ order: o, container: c, modal: "post" })} className={btnSecondary}>
                                Mark Bill Received
                              </button>
                            );
                          }
                          if (stage === "Bill Received") {
                            // One click, no form - charges are already on file from the Mark Bill Received
                            // form. This is Bill Checker's job too: receive it, check it, forward it -
                            // this is the last action they take on a bill before it becomes Finance's.
                            const total = containerTotalBillAmount(c);
                            if (total < 1000) {
                              return (
                                <span className="text-amber-500 text-xs" title="Total Bill Amount is under Rs 1,000 — check the entered charges before forwarding">
                                  Amount too low to forward
                                </span>
                              );
                            }
                            return (
                              <button type="button" onClick={() => updateContainerFields(o.id, c.id, { billApproved: true })} className={btnSecondary}>
                                Forward for Approval
                              </button>
                            );
                          }
                          // Pending Approval onward is Finance Manager's job - Bill Checker can see
                          // the stage but can't advance it any further.
                          if (!canAdvancePastReceived) {
                            return <span className="text-slate-600 text-xs" title="Finance Manager handles this stage onward">—</span>;
                          }
                          if (stage === "Pending Approval") {
                            // One click, no form.
                            return (
                              <button type="button" onClick={() => updateContainerFields(o.id, c.id, { billPosted: true })} className={btnSecondary}>
                                Post
                              </button>
                            );
                          }
                          if (stage === "Posted") {
                            return (
                              <button type="button" onClick={() => setEditing({ order: o, container: c, modal: "paid" })} className={btnPrimary}>
                                Mark Paid
                              </button>
                            );
                          }
                          // Paid - nothing left to advance, but still editable in case a correction is needed.
                          return (
                            <button type="button" onClick={() => setEditing({ order: o, container: c, modal: "paid" })} className="text-slate-500 hover:text-slate-300 text-xs underline decoration-dotted underline-offset-4">
                              Edit paid amount
                            </button>
                          );
                        })()}
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
        </>
      )}
      {editing && editing.modal === "post" && (
        <TransporterBillModal
          order={editing.order}
          container={editing.container}
          updateContainerFields={updateContainerFields}
          onClose={() => setEditing(null)}
        />
      )}
      {editing && editing.modal === "paid" && (
        <PaidAmountModal
          order={editing.order}
          container={editing.container}
          updateContainerFields={updateContainerFields}
          onClose={() => setEditing(null)}
        />
      )}
    </div>
  );
}

function TransporterBillModal({ order, container, updateContainerFields, onClose }) {
  const [billDate, setBillDate] = useState(container.transporterBillDate || "");
  const [billNo, setBillNo] = useState(container.transporterBillNo || "");
  const [charges, setCharges] = useState(Array.isArray(container.charges) ? container.charges : []);
  const [attachment, setAttachment] = useState(container.billAttachment || "");
  const [attachmentError, setAttachmentError] = useState(null);
  const fileInputRef = useRef(null);
  const total = containerTotalBillAmount({ ...container, charges });

  // Required: Bill Date, Bill No., and the attachment — Charges are optional (some bills
  // genuinely have none beyond freight). billReceived only flips to true once all three are
  // actually present, so an incomplete entry correctly stays in Pending (with whatever was
  // typed so far preserved) rather than being able to advance with missing information.
  function commitAll(nextCharges, nextAttachment, nextBillDate, nextBillNo) {
    const chargesToUse = nextCharges !== undefined ? nextCharges : charges;
    const attachmentToUse = nextAttachment !== undefined ? nextAttachment : attachment;
    const billDateToUse = nextBillDate !== undefined ? nextBillDate : billDate;
    const billNoToUse = nextBillNo !== undefined ? nextBillNo : billNo;
    const complete = !!(billDateToUse && billNoToUse.trim() && attachmentToUse);
    updateContainerFields(order.id, container.id, {
      billReceived: complete,
      transporterBillDate: billDateToUse,
      transporterBillNo: billNoToUse,
      billAmountApproved: containerTotalBillAmount({ ...container, charges: chargesToUse }),
      charges: chargesToUse,
      billAttachment: attachmentToUse,
    });
  }
  function commitCharges(next) {
    setCharges(next);
    commitAll(next);
  }
  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setAttachmentError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setAttachment(dataUrl);
      commitAll(undefined, dataUrl);
    } catch (err) {
      setAttachmentError("Couldn't read that file — try a different image or PDF.");
    }
  }
  const missing = [];
  if (!billDate) missing.push("Transporter Bill Date");
  if (!billNo.trim()) missing.push("Transporter Bill No.");
  if (!attachment) missing.push("Bill Attachment");

  return (
    <Modal title={`Transporter Bill — Container ${container.containerNumber || "—"}`} onClose={onClose}>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label className="text-slate-500 text-xs block mb-1">Transporter Bill Date <span className="text-red-400">*</span></label>
          <input type="date" className={inputCls} value={billDate} onChange={(e) => setBillDate(e.target.value)} onBlur={() => commitAll()} required />
        </div>
        <div>
          <label className="text-slate-500 text-xs block mb-1">Transporter Bill No. <span className="text-red-400">*</span></label>
          <input className={inputCls} value={billNo} onChange={(e) => setBillNo(e.target.value)} onBlur={() => commitAll()} required />
        </div>
      </div>
      <div className="mb-3">
        <label className="text-slate-500 text-xs block mb-1">Bill Attachment (image or PDF) <span className="text-red-400">*</span></label>
        <input ref={fileInputRef} type="file" accept="image/*,application/pdf" onChange={handleFile} style={{ display: "none" }} />
        <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} className={btnSecondary}>
          {attachment ? "Replace File" : "Choose File"}
        </button>
        {attachmentError && <p className="text-red-400 text-xs mt-1">{attachmentError}</p>}
        {attachment && !isPdfDataUrl(attachment) && (
          <a href={attachment} target="_blank" rel="noreferrer" className="block mt-2">
            <img src={attachment} alt="Transporter bill" className="rounded-lg border border-slate-800 max-h-40" />
          </a>
        )}
        {attachment && isPdfDataUrl(attachment) && (
          <a href={attachment} download="transporter-bill.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2">
            <FileText size={16} /> PDF attached — click to view or download
          </a>
        )}
      </div>
      <div className="mb-3 bg-slate-900/60 border border-slate-800 rounded-lg p-3">
        <div className="flex items-center justify-between text-xs text-slate-500 mb-1">
          <span>Freight Amount</span><span>{formatPKR(container.freightAmount)}</span>
        </div>
        {charges.map((ch) => (
          <div key={ch.id} className="flex items-center justify-between text-xs text-slate-500 mb-1">
            <span>{ch.type}</span><span>{formatPKR(ch.amount)}</span>
          </div>
        ))}
        <div className="flex items-center justify-between text-sm font-semibold text-white pt-2 mt-1 border-t border-slate-800">
          <span>Total Bill Amount Approved</span><span>{formatPKR(total)}</span>
        </div>
      </div>
      <ChargesEditor charges={charges} onChange={commitCharges} />
      {missing.length > 0 && (
        <p className="text-amber-400 text-xs mt-3">Still needed before this can move forward: {missing.join(", ")}.</p>
      )}
      <div className="flex justify-end mt-4">
        <button type="button" onClick={onClose} className={btnPrimary}>Done</button>
      </div>
    </Modal>
  );
}

// Dedicated Paid Amount form, separate from the charges/Post form above — kept as its own
// short, single-purpose step so marking a bill paid doesn't require reopening the whole
// charges breakdown just to log a payment.
function PaidAmountModal({ order, container, updateContainerFields, onClose }) {
  const total = containerTotalBillAmount(container);
  const [paidAmount, setPaidAmount] = useState(container.billPaidAmount || total || "");
  const [busy, setBusy] = useState(false);

  // Was previously fire-and-forget: the modal closed immediately while the save was still in
  // flight, so a slow connection (or a save that failed outright — updateContainerFields alerts
  // on error but the modal had already closed by then) could make an edit look like it silently
  // did nothing. Now the modal stays open and the button shows "Saving..." until the save has
  // actually finished, so it always either closes on a genuine success or stays open on failure.
  async function save() {
    setBusy(true);
    await updateContainerFields(order.id, container.id, { billPaidAmount: paidAmount });
    setBusy(false);
    onClose();
  }

  return (
    <Modal title={`Mark Paid — Container ${container.containerNumber || "—"}`} onClose={onClose}>
      <div className="mb-3 bg-slate-900/60 border border-slate-800 rounded-lg p-3 flex items-center justify-between text-sm">
        <span className="text-slate-400">Total Bill Amount Approved</span>
        <span className="text-white font-semibold">{formatPKR(total)}</span>
      </div>
      <label className="text-slate-500 text-xs block mb-1">Paid Amount</label>
      <input
        type="number" min="0" autoFocus className={inputCls} value={paidAmount}
        onChange={(e) => setPaidAmount(e.target.value)} placeholder="0"
      />
      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onClose} disabled={busy} className={btnSecondary}>Cancel</button>
        <button type="button" onClick={save} disabled={busy} className={btnPrimary}>{busy ? "Saving…" : "Save"}</button>
      </div>
    </Modal>
  );
}

function ContractDetail({ customer, group, data, openModal, askDelete, role, contractExcel, onContractRatesExport, onContractRatesAttach, onContractRatesRevert, onBack, isColVisible }) {
  const [q, setQ] = useState("");
  const [calcDate, setCalcDate] = useState("");
  const [rateSortCol, setRateSortCol] = useState("loading");
  const [rateSortDir, setRateSortDir] = useState("asc");
  const groupIds = new Set((data.contract_groups || []).map((g) => g.id));
  const allRows = (data.contracts || []).filter((k) => k.customerId === customer.id && (group ? k.contractGroupId === group.id : (!k.contractGroupId || !groupIds.has(k.contractGroupId))));
  const rateComparators = {
    loading: (a, b) => (a.loadingPoint || "").localeCompare(b.loadingPoint || ""),
    destination: (a, b) => (a.destination || "").localeCompare(b.destination || ""),
    rate: (a, b) => (xnum(a.rate) || 0) - (xnum(b.rate) || 0),
    vehicle: (a, b) => (a.vehicleSize || "").localeCompare(b.vehicleSize || ""),
  };
  function sortRate(col, dir) { setRateSortCol(col); setRateSortDir(dir); }
  const rows = allRows
    .filter((k) => {
      const text = `${k.loadingPoint} ${k.destination} ${k.movementThrough || ""} ${k.vehicleSize || ""} ${k.weightCategory || ""} ${k.axleLoadCategory || ""}`.toLowerCase();
      return !q || text.includes(q.toLowerCase());
    })
    .sort((a, b) => {
      const cmp = rateComparators[rateSortCol](a, b);
      return rateSortDir === "desc" ? -cmp : cmp;
    });
  const title = group ? group.contractTitle : "Unassigned Rates";
  const excelKey = group ? group.id : "orphan";
  const excelMeta = (contractExcel || {})[excelKey];

  // Every rate is treated as half General (fixed) and half Fuel (variable) component. Picking
  // a date looks up the fuel price on file for it (Fuel Management > Fuel Price) and scales
  // just the Fuel half by how much that price has moved relative to this contract's own Fuel
  // Base Rate — the General half never changes. Only possible for a real contract (the
  // "Unassigned Rates" bucket has no Fuel Base Rate to compare against).
  const fuelPriceForDate = calcDate ? fuelPriceOnDate(data.fuel_prices, calcDate) : 0;
  const canCalculate = !!group && group.fuelBaseRate && !!calcDate && fuelPriceForDate > 0;
  function adjustedRateFor(k) {
    if (!canCalculate) return null;
    const { general, fuelComponent } = contractRateComponents(k);
    // Fuel component (an amount, e.g. Rs 50,000) ÷ Fuel Base Rate (e.g. Rs 272.77/L) gives
    // how many litres that amount represents at the contract's base price. Multiplying that
    // litre quantity by the fuel price on the chosen date gives the adjusted fuel amount.
    const impliedLitres = fuelComponent / group.fuelBaseRate;
    const adjustedFuel = impliedLitres * fuelPriceForDate;
    return general + adjustedFuel;
  }

  return (
    <div className="space-y-5">

function ContractForm({ initial, prefill, onSave, onCancel }) {
  const isEdit = !!initial;
  const k = initial || prefill || {};
  const [loadingPoint, setLoadingPoint] = useState(k.loadingPoint || "");
  const [destination, setDestination] = useState(k.destination || "");
  const [movementThrough, setMovementThrough] = useState(k.movementThrough || "");
  const [vehicleSize, setVehicleSize] = useState(k.vehicleSize || "");
  const [weightCategory, setWeightCategory] = useState(k.weightCategory || "");
  const [axleLoadCategory, setAxleLoadCategory] = useState(k.axleLoadCategory || "");
  // General/Fixed and Fuel are now independently editable, rather than always being exactly
  // half of a single rate figure. Existing rows (saved before this split existed) only have
  // "rate" — default each half to rate/2 here so editing an old row doesn't silently lose
  // its value, but from this point on the two are tracked and revised separately.
  const [generalComponent, setGeneralComponent] = useState(k.generalComponent ?? (k.rate ? k.rate / 2 : ""));
  const [fuelComponent, setFuelComponent] = useState(k.fuelComponent ?? (k.rate ? k.rate / 2 : ""));
  const [validFrom, setValidFrom] = useState(k.validFrom || "");
  const [validTo, setValidTo] = useState(k.validTo || "");
  const totalRate = (Number(generalComponent) || 0) + (Number(fuelComponent) || 0);

  function submit(e) {
    e.preventDefault();
    if (!loadingPoint.trim() || !destination.trim() || generalComponent === "" || fuelComponent === "") return;
    if (validFrom && validTo && validTo < validFrom) return;
    onSave({
      id: k.id || genUUID(), customerId: k.customerId, contractGroupId: k.contractGroupId,
      loadingPoint: loadingPoint.trim(), destination: destination.trim(), movementThrough,
      vehicleSize: vehicleSize.trim(), weightCategory: weightCategory.trim(), axleLoadCategory: axleLoadCategory.trim(),
      generalComponent: Number(generalComponent), fuelComponent: Number(fuelComponent),
      rate: totalRate, // kept in sync as the total, for existing sort/display/search code that reads it directly
      validFrom, validTo,
    });
  }

  return (
    <form onSubmit={submit}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Loading Point"><input className={inputCls} value={loadingPoint} onChange={(e) => setLoadingPoint(e.target.value)} placeholder="e.g. Karachi Port" /></Field>

        <select className={inputCls} value={movementThrough} onChange={(e) => setMovementThrough(e.target.value)}>
          <option value="">Select</option>
          {MOVEMENT_THROUGH_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Vehicle Size">
          <DropdownWithCustom

        <Field label="Weight Category">
          <DropdownWithCustom

        </Field>
      </div>
      <Field label="Vehicle Type">
        <DropdownWithCustom
          value={axleLoadCategory} onChange={setAxleLoadCategory} options={AXLE_LOAD_CATEGORIES}
          selectPlaceholder="Select vehicle type" customPlaceholder="e.g. 5x"

      <div className="grid grid-cols-2 gap-3">
        <Field label="General/Fixed Component (PKR)"><input type="number" min="0" className={inputCls} value={generalComponent} onChange={(e) => setGeneralComponent(e.target.value)} /></Field>
        <Field label="Fuel Component (PKR)"><input type="number" min="0" className={inputCls} value={fuelComponent} onChange={(e) => setFuelComponent(e.target.value)} /></Field>
      </div>
      <p className="text-slate-400 text-sm -mt-2 mb-3">Total Rate: <span className="text-white font-medium">{formatPKR(totalRate)}</span></p>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Valid From (optional)"><input type="date" className={inputCls} value={validFrom} onChange={(e) => setValidFrom(e.target.value)} /></Field>

      </div>

/* ==================== Fuel Management (Finance Manager + Admin) ==================== */

// Flattens a customer's orders into their containers, tagging each container with
// the parent order's number and shipment type — the source data for fuel reporting.
// Rented trucks are entered per-container on the Tracking page, so vehiclePlate here
// is the free-text plate assigned to that specific trip, not a Fleet record.
function customerOrderContainers(data, customerId) {
  return data.orders
    .filter((o) => o.customerId === customerId)
    .flatMap((o) => orderContainers(o).map((c) => ({ ...c, orderNumber: o.orderNumber, shipmentType: o.shipmentType || "Import", origin: o.origin })));
}

// Groups containers by rented vehicle plate (case/whitespace-normalized) and sums fuel & freight.
function groupFuelByVehicle(containers, fuelPrices) {
  const map = new Map();
  containers.forEach((c) => {
    const plateRaw = (c.vehiclePlate || "").trim();
    const key = plateRaw ? plateRaw.toUpperCase() : "__unassigned__";
    if (!map.has(key)) map.set(key, { plate: plateRaw || "Unassigned", drivers: new Set(), trips: 0, fuelTotal: 0, freightTotal: 0 });
    const g = map.get(key);
    g.trips += 1;
    const price = fuelPriceOnDate(fuelPrices, c.dispatchAt ? toLocalDateStr(new Date(c.dispatchAt)) : "");
    g.fuelTotal += computeFuelAmount(c.freightAmount, price) || 0;
    g.freightTotal += xnum(c.freightAmount);
    if (c.driverName) g.drivers.add(c.driverName);
  });
  return Array.from(map.values()).sort((a, b) => b.fuelTotal - a.fuelTotal || b.trips - a.trips);
}
