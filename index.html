  /* ---- Light theme: overrides the dark palette only inside .light-theme ---- */
  .light-theme.bg-slate-950 { background-color: #f8fafc !important; }
  .light-theme .bg-slate-950 { background-color: #f1f5f9 !important; }
  .light-theme .bg-slate-900 { background-color: #ffffff !important; }
  .light-theme .bg-slate-900\/50 { background-color: #f8fafc !important; }
  .light-theme .bg-slate-900\/60 { background-color: #f1f5f9 !important; }
  .light-theme .bg-slate-800 { background-color: #e2e8f0 !important; }
  .light-theme .bg-slate-600 { background-color: #cbd5e1 !important; }
  .light-theme .bg-black { background-color: rgba(15, 23, 42, 0.4) !important; }

  .light-theme .border-slate-800,
  .light-theme .border-slate-800\/60 { border-color: #e2e8f0 !important; }
  .light-theme .border-slate-700 { border-color: #cbd5e1 !important; }
  .light-theme .border-slate-200 { border-color: #e2e8f0 !important; }

  /* Colored left-accent stripes (status border on Tracking cards, grouped-table row accents).
     Placed after the generic .border-slate-800 rule above so these win the cascade for
     border-left-color specifically — without this, cards combining a neutral border-slate-800
     with a border-l-{color} accent had the left stripe silently overridden to plain gray. */
  .light-theme .border-l-blue-500,
  .light-theme .border-l-blue-600 { border-left-color: #2563eb !important; }
  .light-theme .border-l-emerald-500 { border-left-color: #059669 !important; }
  .light-theme .border-l-amber-500 { border-left-color: #d97706 !important; }
  .light-theme .border-l-violet-500 { border-left-color: #7c3aed !important; }
  .light-theme .border-l-indigo-500 { border-left-color: #4f46e5 !important; }
  .light-theme .border-l-sky-500 { border-left-color: #0284c7 !important; }
  .light-theme .border-l-slate-600 { border-left-color: #94a3b8 !important; }

  /* Text gradient corrected to a proper descending scale (400 and 500 previously mapped to
     the identical color, losing the visual distinction between them) */
  .light-theme .text-white { color: #0f172a !important; }
  .light-theme .text-slate-200 { color: #1e293b !important; }
  .light-theme .text-slate-300 { color: #334155 !important; }
  .light-theme .text-slate-400 { color: #475569 !important; }
  .light-theme .text-slate-500 { color: #64748b !important; }
  .light-theme .text-slate-600 { color: #94a3b8 !important; }
  .light-theme .text-slate-700,
  .light-theme .text-slate-800,
  .light-theme .text-slate-900 { color: #0f172a !important; }

  .light-theme select.bg-slate-950,
  .light-theme input.bg-slate-950 { background-color: #ffffff !important; }

  /* hover states referencing the dark palette */
  .light-theme .hover\:bg-slate-900:hover,
  .light-theme .hover\:bg-slate-800:hover { background-color: #f1f5f9 !important; }
  .light-theme .hover\:text-slate-200:hover,
  .light-theme .hover\:text-slate-300:hover { color: #0f172a !important; }

  /* Accent colors (status badges, links, active states) — the app's dark-mode palette uses
     light/vibrant -300/-400/-500 shades meant to pop against a dark background, and near-black
     -950 badge backgrounds. Neither works on white: the light shades wash out (low contrast),
     and the -950 backgrounds render as near-black boxes clashing with an otherwise white UI.
     Each accent shifts to a darker, more saturated text shade for contrast on white, and badge
     backgrounds/borders shift to light pastel equivalents instead of staying near-black. */
  .light-theme .text-blue-300,
  .light-theme .text-blue-400,
  .light-theme .text-blue-500 { color: #1d4ed8 !important; }
  .light-theme .text-emerald-300,

  .light-theme .text-amber-500 { color: #b45309 !important; }
  .light-theme .text-violet-400 { color: #6d28d9 !important; }
  .light-theme .text-indigo-400 { color: #4338ca !important; }
  .light-theme .text-sky-400 { color: #0369a1 !important; }
  .light-theme .text-purple-400 { color: #7e22ce !important; }
  .light-theme .text-pink-400 { color: #be185d !important; }

  .light-theme .bg-emerald-950 { background-color: #ecfdf5 !important; }
  .light-theme .bg-red-950 { background-color: #fef2f2 !important; }
  .light-theme .bg-amber-950 { background-color: #fffbeb !important; }
  .light-theme .bg-violet-950 { background-color: #f5f3ff !important; }
  .light-theme .bg-indigo-950 { background-color: #eef2ff !important; }
  .light-theme .bg-sky-950 { background-color: #f0f9ff !important; }
  .light-theme .bg-purple-950 { background-color: #faf5ff !important; }

  .light-theme .border-blue-800,
  .light-theme .border-blue-600,
  .light-theme .border-blue-500 { border-color: #bfdbfe !important; }
  .light-theme .border-emerald-800 { border-color: #a7f3d0 !important; }
  .light-theme .border-red-800 { border-color: #fecaca !important; }
  .light-theme .border-amber-800 { border-color: #fde68a !important; }
  .light-theme .border-violet-800 { border-color: #ddd6fe !important; }
  .light-theme .border-indigo-800 { border-color: #c7d2fe !important; }
  .light-theme .border-sky-800 { border-color: #bae6fd !important; }
  .light-theme .border-purple-800 { border-color: #e9d5ff !important; }

  /* ---- Lightweight animations (opacity/transform only — cheap, GPU-composited) ---- */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .animate-fade-in { animation: fadeIn 0.18s ease-out; }
  .animate-fade-in-up { animation: fadeInUp 0.22s ease-out; }
  .animate-modal-in { animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

  /* ---- Tracking progress stepper: pulsing ring on the current stage, flowing shimmer on
     completed connector lines ---- */
  /* Both use only transform/opacity (GPU-composited, no repaint needed per frame) via a
     pseudo-element, rather than animating box-shadow or background-position directly on the
     element - those properties force the browser to repaint every frame, which is fine for
     one element but adds up fast with many tracking cards animating simultaneously. */
  @keyframes pulseRingExpand {
    0% { transform: scale(1); opacity: 0.45; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  @keyframes shimmerSweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .animate-pulse-ring { position: relative; }
  .animate-pulse-ring::after {
    content: ""; position: absolute; inset: -4px; border-radius: 9999px; z-index: -1;
    background: #2563eb; pointer-events: none;
    animation: pulseRingExpand 1.8s ease-out infinite;
  }
  .animate-progress-shimmer {
    position: relative; overflow: hidden; background-color: #2563eb;
  }
  .animate-progress-shimmer::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    animation: shimmerSweep 2.2s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-fade-in, .animate-fade-in-up, .animate-modal-in { animation: none; }
    .animate-pulse-ring::after, .animate-progress-shimmer::after { animation: none; display: none; }
  }
</style>

function createLiteClient(url, anonKey) {
  const AUTH = url + "/auth/v1";
  const REST = url + "/rest/v1";
  const STORE_KEY = "sb-lite-session";
  let session = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) session = JSON.parse(raw); } catch (e) {}
  let listeners = [];

  function persistSession(s) {
    session = s;
    try { if (s) localStorage.setItem(STORE_KEY, JSON.stringify(s)); else localStorage.removeItem(STORE_KEY); } catch (e) {}
    listeners.forEach((fn) => fn(s ? "SIGNED_IN" : "SIGNED_OUT", s));
  }

  async function authFetch(path, opts) {
    opts = opts || {};
    const res = await fetch(AUTH + path, { ...opts, headers: { "Content-Type": "application/json", apikey: anonKey, ...(opts.headers || {}) } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) return { data: null, error: { message: json.error_description || json.msg || json.error || res.statusText } };
    return { data: json, error: null };
  }

  async function refreshIfNeeded() {
    if (!session) return;
    if (session.expires_at && Date.now() / 1000 < session.expires_at - 30) return;
    if (!session.refresh_token) { persistSession(null); return; }
    const { data, error } = await authFetch("/token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (error) { persistSession(null); return; }
    persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
  }

  const auth = {
    async getSession() { await refreshIfNeeded(); return { data: { session } }; },
    onAuthStateChange(cb) {
      listeners.push(cb);
      return { data: { subscription: { unsubscribe() { listeners = listeners.filter((f) => f !== cb); } } } };
    },
    async signInWithPassword({ email, password }) {
      const { data, error } = await authFetch("/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) });
      if (error) return { error };
      persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
      return { error: null };
    },
    async signUp({ email, password, options }) {
      const { data, error } = await authFetch("/signup", { method: "POST", body: JSON.stringify({ email, password, data: options && options.data }) });
      if (error) return { error };
      if (data.access_token) persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
      return { error: null };
    },
    async signInWithOAuth({ provider, options }) {
      const redirectTo = (options && options.redirectTo) || window.location.href.split('#')[0].split('?')[0];
      const scopes = options && options.scopes ? `&scopes=${encodeURIComponent(options.scopes)}` : "";
      window.location.href = `${AUTH}/authorize?provider=${encodeURIComponent(provider)}&redirect_to=${encodeURIComponent(redirectTo)}${scopes}`;
      return { error: null };
    },
    async signOut() { persistSession(null); return { error: null }; },
  };

  // Complete OAuth redirect: Supabase returns tokens in the URL hash.
  (function handleOAuthRedirect() {
    if (typeof window === "undefined" || !window.location.hash) return;
    const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
    const params = new URLSearchParams(hash);
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    if (!access_token) return;
    const expires_in = parseInt(params.get("expires_in") || "3600", 10);
    fetch(AUTH + "/user", { headers: { apikey: anonKey, Authorization: "Bearer " + access_token } })
      .then((r) => r.json())
      .then((user) => {
        persistSession({ access_token, refresh_token, user, expires_at: Date.now() / 1000 + expires_in });
        history.replaceState(null, "", window.location.pathname + window.location.search);
      })
      .catch(() => {});
  })();

  async function headersFor(extra) {
    await refreshIfNeeded(); // keeps the access token from silently going stale mid-session
    const h = { apikey: anonKey, "Content-Type": "application/json", Authorization: "Bearer " + (session && session.access_token ? session.access_token : anonKey), ...(extra || {}) };
    return h;
  }

  function from(table) {
    return {
      select(cols) {
        let query = `${REST}/${table}?select=${encodeURIComponent(cols || "*")}`;
        let rangeHeader = null;
        const builder = {
          eq(col, val) { query += `&${col}=eq.${encodeURIComponent(val)}`; return builder; },
          order(col, opts) { query += `&order=${col}.${opts && opts.ascending === false ? "desc" : "asc"}`; return builder; },
          // PostgREST's row-count pagination: range(0, 999) asks for rows 0-999 (the first
          // 1000) via the Range header. Without this, every query is silently capped at the
          // server's default max-rows limit (commonly 1000) no matter how many rows actually
          // exist - this resurfaces the rest via count (below), so a caller can loop through
          // however many pages it actually takes to get everything.
          range(from, to) { rangeHeader = `${from}-${to}`; return builder; },
          async maybeSingle() {
            const res = await fetch(query, { headers: await headersFor() });
            const json = await res.json().catch(() => []);
            if (!res.ok) return { data: null, error: { message: (json && json.message) || res.statusText } };
            return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
          },
          then(resolve, reject) {
            const extraHeaders = rangeHeader ? { Range: rangeHeader, Prefer: "count=exact" } : {};
            return headersFor(extraHeaders)
              .then((headers) => fetch(query, { headers }))
              .then(async (res) => {
                const json = await res.json().catch(() => []);
                if (!res.ok) return resolve({ data: null, error: { message: (json && json.message) || res.statusText } });
                // Content-Range looks like "0-999/2345" - the total after the slash is how
                // many rows exist in total, "*" if the count wasn't requested.
                const contentRange = res.headers.get("content-range") || "";
                const total = contentRange.includes("/") ? parseInt(contentRange.split("/")[1], 10) : null;
                resolve({ data: json, error: null, count: Number.isFinite(total) ? total : null });
              })
              .catch(reject);
          },
        };
        return builder;
      },
      async upsert(rows) {
        const body = Array.isArray(rows) ? rows : [rows];

        if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
        return { error: null };
      },
      update(fields) {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "PATCH", headers: await headersFor({ Prefer: "return=minimal" }), body: JSON.stringify(fields) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
      delete() {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "DELETE", headers: await headersFor({ Prefer: "return=minimal" }) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
          async in(col, vals) {
            const list = (vals || []).map((v) => encodeURIComponent(v)).join(",");
            const res = await fetch(`${REST}/${table}?${col}=in.(${list})`, { method: "DELETE", headers: await headersFor({ Prefer: "return=minimal" }) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
    };
  }

  return { auth, from };
}

// Generic camelCase <-> snake_case conversion so every entity's field names
// line up with the Postgres columns without hand-writing per-table maps.
function camelToSnake(s) { return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase()); }
function snakeToCamel(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }

function toDbRow(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    out[camelToSnake(k)] = v === "" ? null : v; // empty string -> null (matters for FK columns)
  });
  return out;
}
function fromDbRow(row) {
  const out = {};
  Object.keys(row).forEach((k) => {
    const v = row[k];
    out[snakeToCamel(k)] = v === null ? "" : v; // null -> "" so existing form/view code (which expects "") keeps working
  });
  return out;
}

// actual save) on blur — matching Bill Date/Bill No. elsewhere in this modal. Previously the
// amount input called onChange on every keystroke, meaning typing "5000" fired four separate
// full-container saves to Supabase in rapid succession; those requests can resolve out of
// order over the network, so whichever one happened to land last silently won - which is
// exactly how "5000" could end up saved as just "5", and why the bill's stage (computed live
// from whatever was in the database at that moment) could visibly jump ahead mid-keystroke,
// before the person had even finished typing or clicked Done.
function ChargeAmountInput({ amount, onCommit }) {

      value={draft} onChange={(e) => setDraft(e.target.value)} onBlur={() => onCommit(draft)}
      placeholder="Amount (PKR)"
    />
  );
}

/* ==================== Helpers ==================== */

function cx(...args) { return args.filter(Boolean).join(" "); }

function uid(prefix) { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
// Some Supabase tables (e.g. contracts) have a real `uuid`-typed id column rather than
// text, so they need an actual RFC4122 UUID — uid()'s "prefix_xxxx" strings get rejected
// with "invalid input syntax for type uuid".
function genUUID() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function randToken(len) {
  const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let s = "";
  for (let i = 0; i < len; i++) s += charset[Math.floor(Math.random() * charset.length)];
  return s;
}

function genOrderNumber() { return `ORD-${randToken(8)}-${randToken(3)}`; }

function todayISO() { return toLocalDateStr(new Date()); }

function addDaysISO(iso, days) {
  const d = new Date(iso + "T00:00:00");

}

// One fixed date format everywhere on the site: DD/MM/YYYY. Previously most of the app used
// this, but a handful of timestamp displays fell back to the browser's own locale (toLocaleDateString/
// toLocaleString with no fixed format), which on a different browser could silently render as
// MM/DD/YYYY instead — same date, different-looking order. fmtDate/fmtDateTime are now the only
// two date-formatting functions used anywhere in the UI, so every page reads the same way regardless
// of the viewer's browser settings.
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return "—";
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  if (isNaN(d)) return "—";
  const datePart = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
  const timePart = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  return `${datePart} ${timePart}`;
}
const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function fmtMonthYear(v) {
  const d = v instanceof Date ? v : new Date(v);
  if (isNaN(d)) return "—";
  return `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function resizeImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Couldn't read that image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Couldn't read that file."));
    reader.readAsDataURL(file);
  });
}

// Images get resized/compressed; PDFs are read as-is (can't be safely
// re-encoded client-side) — both end up as data URLs either way.
function fileToAttachmentDataUrl(file, maxDim, quality) {
  if (file.type === "application/pdf") return readFileAsDataUrl(file);
  return resizeImageToDataUrl(file, maxDim, quality);
}

function isPdfDataUrl(url) {
  return typeof url === "string" && url.startsWith("data:application/pdf");
}

// Renders an uploaded photo/PDF with a real download affordance either way — previously
// only PDFs had a download link; image files just rendered inline with no way to save
// them off to share (e.g. to a WhatsApp group).
function AttachmentPreview({ dataUrl, alt, downloadName }) {
  if (!dataUrl) return null;

function orderStatus(o) {
  if (o.cancelled) return "Cancelled";
  if (o.stageIndex >= 4) return "Completed";
  if (o.stageIndex >= 3) return "Delivered";
  if (o.stageIndex <= 0) return "Confirmed";
  return "In Transit";
}

function containerStatus(c, shipmentType) {
  if (c.cancelled) return "Cancelled";
  const si = c.stageIndex ?? 0;
  if (shipmentType === "Domestic") {
    if (si >= 4) return "Delivered";
    if (si === 3) return "Under Offloading";
    if (si === 2) return "In Transit";
    if (si === 1) return "Picked Up";
    return "Confirmed";
  }
  if (shipmentType === "Import") {
    if (si >= 5) return "Completed";
    if (si === 4) return "Delivered";
    if (si === 3) return "Under Offloading";
    if (si === 2) return "In Transit";
    if (si === 1) return "Picked Up";
    return "Confirmed";
  }
  // Export — unchanged 4-stage flow, no Under Offloading, no Completed.
  if (si >= 3) return "Delivered";
  if (si === 2) return "In Transit";
  if (si === 1) return "Picked Up";
  return "Confirmed";
}

// True once a container has actually been delivered — whether or not its Import-only
// empty-return "Completed" step has happened yet. Use this (not a straight "Delivered"
// equality check) anywhere delivery itself is what matters, e.g. invoicing eligibility
// or delivery-count stats, so those don't wrongly shrink once an order completes.
// Needs shipmentType passed in — Domestic's stage 3 and Import's stage 3 are both "Under
// Offloading", not delivered yet; Export's stage 3 (unchanged, no Under Offloading) is.
function isDeliveredOrCompleted(c, shipmentType) {
  if (c.cancelled) return false;
  const deliveredAt = (shipmentType === "Domestic" || shipmentType === "Import") ? 4 : 3;
  return (c.stageIndex ?? 0) >= deliveredAt;
}

// Import-only: once a container is Delivered it's "In Process" for empty return,
// and becomes "Received" the moment it's advanced to Completed (i.e. once an empty
// return date has actually been logged by the Empty Return Receiver). Not applicable
// before Delivered, or for Domestic/Export shipments, which never reach Completed.
// Finds the fuel price (PKR/liter) in effect on a given date — the most recent price
// entry whose effective date is on or before it. Fuel prices are company-wide (not
// per-customer), so this looks across the whole list regardless of which customer's
// screen it's being calculated for. Returns 0 if no price has been recorded yet for
// that period.
// The order only stores the sender's full address text, not which of the sender's saved
// addresses it came from — this looks that address back up on the sender to recover its
// short label (e.g. "HQ", "Lahore Warehouse"), falling back to the sender's name if no
// matching labeled address is found.
function senderShortLabel(order, sender) {
  if (sender && Array.isArray(sender.addresses)) {
    const match = sender.addresses.find((a) => a.address === order.senderAddress);
    if (match && match.label) return match.label;
  }
  return sender ? sender.name : "";
}

function fuelPriceOnDate(fuelPrices, dateISO) {
  if (!dateISO) return 0;
  let best = null;
  (fuelPrices || []).forEach((p) => {
    if (p.effectiveDate && p.effectiveDate <= dateISO && (!best || p.effectiveDate > best.effectiveDate)) best = p;
  });
  return best ? Number(best.pricePerLiter) || 0 : 0;
}

// Applies the Fuel Price tab's period mode to resolve which fuel price actually applies to a
// given date, used by the Consumption/Export calculations instead of a straight per-date lookup.
// - daily: unchanged, the price on file as of that exact date.
// - fortnightly: dates in the 1st-15th use the price as of the 1st of that month; dates in the
//   16th-end use the price as of the 16th.
// - monthly: every date in the month uses the price as of the 1st of that month.
function resolveEffectiveFuelPrice(fuelPrices, dateISO, mode) {
  if (!dateISO) return 0;
  if (!mode || mode === "daily") return fuelPriceOnDate(fuelPrices, dateISO);
  const day = Number(dateISO.slice(8, 10));
  const yearMonth = dateISO.slice(0, 7);
  if (mode === "monthly") {
    return fuelPriceOnDate(fuelPrices, `${yearMonth}-01`);
  }
  if (mode === "fortnightly") {
    return day <= 15 ? fuelPriceOnDate(fuelPrices, `${yearMonth}-01`) : fuelPriceOnDate(fuelPrices, `${yearMonth}-16`);
  }
  return fuelPriceOnDate(fuelPrices, dateISO);
}

// Finds the contract rate matching a shipment's customer, Loading Point, Destination,
// Vehicle Size, Movement Through, AND date (a rate only matches if the shipment's date falls
// within its Valid From/Valid To range — a rate with neither set matches any date, for
// backward compatibility with rates entered before date ranges existed). Used by exports
// that cover multiple customers together. Same match criteria (and same Axle Load Category
// limitation — no such field exists on any order/container) as the per-customer version
// used in the Fuel Management report; kept as a separate function since that one is scoped
// to a single customer's already-filtered rates and isn't worth risking a refactor of.
// Takes origin explicitly rather than reading c.origin — origin (Loading Point) lives on
// the order, not the container, and callers don't consistently merge it onto the container
// object, so reading c.origin directly silently matched nothing.
function contractRateCoversDate(k, dateISO) {
  if (!dateISO) return true; // no date to check against - don't exclude on this basis
  if (k.validFrom && dateISO < k.validFrom) return false;
  if (k.validTo && dateISO > k.validTo) return false;
  return true;
}

// being exactly half of a single number - this lets the annual Fixed-component revision (e.g.
// +10%) apply without disturbing the Fuel component's base, which should only move with fuel
// price changes. Rows saved before this split existed only have "rate" set, so those fall back
// to the old 50/50 behavior automatically.
function contractRateComponents(k) {
  const hasSplit = k.generalComponent !== undefined && k.generalComponent !== "" && k.generalComponent !== null;
  if (hasSplit) {
    return { general: xnum(k.generalComponent), fuelComponent: xnum(k.fuelComponent) };
  }

  return { general: total * 0.5, fuelComponent: total * 0.5 };
}
function matchContractRateAnyCustomer(customerId, origin, c, allContracts, allGroups, shipmentDate) {
  const norm = (v) => (v || "").trim().toLowerCase();
  const loadingPoint = norm(origin);
  const destination = norm(c.destination);
  const vehicleSize = norm(c.vehicleSize || c.containerSize);
  const movementThrough = norm(c.movementThrough);
  const match = (allContracts || []).find((k) =>
    k.customerId === customerId &&
    norm(k.loadingPoint) === loadingPoint &&
    norm(k.destination) === destination &&
    norm(k.vehicleSize) === vehicleSize &&
    norm(k.movementThrough) === movementThrough &&
    contractRateCoversDate(k, shipmentDate)

  const groupsById = new Map((allGroups || []).map((g) => [g.id, g]));
  return { ...match, group: match.contractGroupId ? groupsById.get(match.contractGroupId) : null };
}

// Fuel Amount (PKR) for a shipment: half of Freight, converted to liters at the fuel
// price in effect on its dispatch date, then back to PKR. This nets out to Freight/2,
// but grounds the figure in an actual per-liter rate rather than an arbitrary fraction —
// so it also gives an implied liters-used figure as a byproduct. Returns null (not 0) when
// no fuel price is on file for that date, so a missing price doesn't get mistaken for Rs. 0.
function computeFuelAmount(freightAmount, fuelPricePerLiter) {
  if (!fuelPricePerLiter) return null;
  const liters = (xnum(freightAmount) / 2) / fuelPricePerLiter;
  return liters * fuelPricePerLiter;
}

function emptyStatusOf(c) {
  const si = c.stageIndex ?? 0;
  if (si >= 5) return "Received";
  if (si === 4) return "In Process";
  return "—";
}

// Once a Completed container has been sitting completed for 2+ days, it's considered
// "settled" — it fades out of the day-to-day operational views (Tracking for dispatcher,
// receiver, and Empty Return Receiver; the Orders tables for Data Entry) and lives on
// permanently in Order History (admin-only) instead. Based on Empty Return Date, since
// that's the date the completion actually happened.
function isSettledOut(c) {
  const si = c.stageIndex ?? 0;
  if (si < 5 || !c.emptyReturnDate) return false;
  const completedAt = new Date(c.emptyReturnDate + "T00:00:00");
  if (isNaN(completedAt)) return false;
  const diffDays = (Date.now() - completedAt.getTime()) / 86400000;
  return diffDays >= 2;
}

// Kept as an alias so any existing references keep working — containerStatus
// itself is now the single, consistent source of truth used everywhere
// (Orders table, order view tab, Tracking page, customer portal, etc.)
function trackingDisplayStatus(c, shipmentType) {
  return containerStatus(c, shipmentType);

function orderContainers(order) {
  return Array.isArray(order.containers) && order.containers.length ? order.containers : [];

// Aggregate status across all of an order's containers — used anywhere the app
// still needs one status per order (dashboard tiles, order list badges, etc).
function orderAggregateStatus(order) {
  const cs = orderContainers(order);
  if (cs.length === 0) return orderStatus(order); // legacy orders with no containers yet
  if (cs.every((c) => c.cancelled)) return "Cancelled";
  const active = cs.filter((c) => !c.cancelled);
  if (active.length === 0) return "Cancelled";
  const st = order.shipmentType || "Import";
  if (st === "Domestic") {
    if (active.every((c) => (c.stageIndex ?? 0) >= 4)) return "Delivered";
    if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Under Offloading";
    if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
    if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
    return "Confirmed";
  }
  if (st === "Import") {
    if (active.every((c) => (c.stageIndex ?? 0) >= 5)) return "Completed";
    if (active.every((c) => (c.stageIndex ?? 0) >= 4)) return "Delivered";
    if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Under Offloading";
    if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
    if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
    return "Confirmed";
  }
  // Export — unchanged 4-stage flow.
  if (active.every((c) => (c.stageIndex ?? 0) >= 3)) return "Delivered";
  if (active.some((c) => (c.stageIndex ?? 0) === 2)) return "In Transit";
  if (active.some((c) => (c.stageIndex ?? 0) === 1)) return "Picked Up";
  return "Confirmed";
}

function orderAggregateAmount(order) {
  const cs = orderContainers(order);
  if (cs.length === 0) return Number(order.amount) || 0;
  return cs.reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
}

// Tolerant number parser used across every Excel import — strips currency symbols (Rs,
// PKR, $, etc.), thousands separators, and stray whitespace before parsing, so a value
// written as "Rs257.08" or "1,234.50" still comes through as a real number instead of
// silently falling back to 0 just because Number() can't parse letters/commas directly.
const xnum = (v, fb = 0) => {
  if (v === null || v === undefined || v === "") return fb;
  if (typeof v === "number") return Number.isFinite(v) ? v : fb;

// export headers and (via readField) to read them back correctly on re-import.
function humanizeFieldName(key) {

const NUMERIC_SCHEMA_FIELDS = {

// Domestic Transportation sheets, Bilty receipts, the on-screen tables) — not left as the raw
// ISO string, which is what was happening here and is what caused Fuel Prices' export to show

const DATE_SCHEMA_FIELDS = {

// descriptor (styled: blue header, Tahoma data, bordered, matching every other export in the
// app) instead of a plain unstyled XLSX.utils worksheet.
function styledSheetFromSchema(sheetName, records, schema, displayHeaders) {
  const headers = displayHeaders || schema.map(humanizeFieldName);
  const hideKeys = new Set(["id", "customerid", "containers", "history", "stageindex", "cancelled", "senderid", "orderid", "containerid"]);
  const hiddenColIdxs = schema.map((k, i) => (hideKeys.has(String(k).toLowerCase()) ? i + 1 : -1)).filter((i) => i > 0);
  const numericFields = NUMERIC_SCHEMA_FIELDS[sheetName] || new Set();

    schema.map((k) => {

      if (isEmpty) return hideKeys.has(String(k).toLowerCase()) ? "" : "-";

// ==================== Hand-written XLSX generator ====================
// ExcelJS (tried across several versions/builds) was confirmed to write files whose

// than depend on a third-party writer with a proven bug, this builds the .xlsx file
// (a zip of plain OOXML XML) directly, using JSZip only to zip up files we write ourselves.
// Five fixed cell styles cover everything this export needs — no per-cell object creation,
// no ambiguity about what gets serialized.
//   0 = default (no fill/border)              1 = gray header  (Cleared Cases + customer sheets)
//   2 = cream header (Import/Export)           3 = blue header, white text (Domestic)
//   4 = title text (16pt bold, no fill)
//   5 = green (Cargo Type "NON-BONDED", Loading Point "QICT")

// Style IDs: 0=unused spare
// 1=gray header wrap   2=gray header no-wrap   3=cream header wrap   4=cream header no-wrap
// 5=blue header wrap   6=blue header no-wrap    7=title (no border)
// 8=data center no-wrap (text+numbers)          9=data center wrap
// 10=Cargo Type green  11=Cargo Type red        12=Cargo Type plain fallback (all Calibri11, centered)
// 13=Loading Point red 14=Loading Point green   15=Loading Point cyan   16=Loading Point blue/white
// 17=Bilty duplicate red, centered + wrap (Bilty No. content is itself a "wrap" column)
// Every style above (except 0/7) now carries a thin border on all 4 sides. 18-21 are freeze-pane-boundary
// variants used only on Import Transportation's columns G(7)/H(8), dropping the border right at the split:
// 18=cream header wrap, no-left border  (col H, "Description")
// 19=cream header wrap, no-right border (col G, "Transporter")
// 20=data center no-wrap, no-right border (col G content)
// 21=data center wrap, no-left border     (col H content)
// 22=data center no-wrap, BOLD (Tahoma10) — for charges/amount columns (Freight, LOLO/Stay/
// Other Charges, Bill Amount Approved, Total Bill Amount, etc.)
// 23=Bill stage: Pending (gray)     24=Bill stage: Bill Received (blue)
// 25=Bill stage: Pending Approval (amber)   26=Bill stage: Posted (violet)
// Bill stage "Paid" reuses style 10 (Cargo Type green) — same "complete/good" meaning.

// Builds one <row> element. `values` is a plain array (1 per column). Every cell's style
// comes from `cellStyleOverrides[col]` — the caller is expected to have already worked out
// the right style id for every column (header wrap/no-wrap, data wrap/no-wrap, conditional
// colors), since those now vary per-column rather than uniformly per-row. Falls back to
// style 8 (centered, no wrap) for any column that genuinely has no explicit style.
// `fillBlanks`: when true, a genuinely empty data cell gets "-" instead of being skipped —
// used for real data rows so the sheet reads as "checked and confirmed blank" rather than
// looking incomplete. Left false for spacer/title rows, which are blank on purpose.
function xlsxRowXml(rowNum, values, cellStyleOverrides, fillBlanks) {
  const cells = [];
  values.forEach((val, i) => {
    const isEmpty = val === "" || val === null || val === undefined;
    const col = i + 1;
    const override = cellStyleOverrides && cellStyleOverrides[col];
    if (isEmpty && override == null && !fillBlanks) return; // skip empty cells in structural spacer rows
    const ref = `${xlsxColLetter(col)}${rowNum}`;
    const isNumber = typeof val === "number" && Number.isFinite(val);
    const style = override != null ? override : 8;
    const styleAttr = style ? ` s="${style}"` : "";
    if (isNumber) {
      cells.push(`<c r="${ref}"${styleAttr}><v>${val}</v></c>`);
    } else {
      const text = isEmpty ? (fillBlanks ? "-" : "") : String(val);
      cells.push(`<c r="${ref}"${styleAttr} t="inlineStr"><is><t xml:space="preserve">${xlsxEscape(text)}</t></is></c>`);
    }
  });
  return `<row r="${rowNum}">${cells.join("")}</row>`;
}

// sheets: [{ name, colCount, colWidths, rows: [array-of-values, ...], headerRowIndex,
//            headerStyle, titleCell: {row, col} }]
async function buildXlsxBuffer(sheets) {
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("\n")}
</Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`);
  zip.file("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>
${sheets.map((s, i) => `<sheet name="${xlsxEscape(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("\n")}
</sheets>
</workbook>`);
  zip.file("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("\n")}
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`);
  zip.file("xl/styles.xml", XLSX_STYLES_XML);

  sheets.forEach((s, sheetIdx) => {
    const hiddenColSet = new Set(s.hiddenCols || []);
    const colsXml = (s.colWidths || [])
      .map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"${hiddenColSet.has(i + 1) ? ' hidden="1"' : ""}/>`)
      .join("\n");
    const rowsXml = s.rows
      .map((values, i) => {
        const rowNum = i + 1;
        const isHeader = rowNum === s.headerRowIndex;
        const isTitleRow = !!(s.titleCell && s.titleCell.row === rowNum);
        const cellOverrides = {};
        if (isHeader && s.headerOverrides) {
          Object.assign(cellOverrides, s.headerOverrides);
        }
        if (!isHeader && !isTitleRow) {
          if (s.contentDefaultCols) Object.assign(cellOverrides, s.contentDefaultCols);
          if (s.conditionalCols) {
            Object.entries(s.conditionalCols).forEach(([colIdx, fn]) => {
              const styleId = fn(values[colIdx - 1]);
              if (styleId != null) cellOverrides[colIdx] = styleId;
            });
          }
        }
        if (isTitleRow) cellOverrides[s.titleCell.col] = 7; // applied last so it always wins over any content default
        const noFillRowSet = new Set(s.noFillRows || []);
        const isDataRow = rowNum > s.headerRowIndex && !noFillRowSet.has(rowNum) && !isTitleRow;
        const rowXml = xlsxRowXml(rowNum, values, cellOverrides, isDataRow);
        // Every row gets an explicit height + customHeight="1" — without that flag, Excel
        // treats defaultRowHeight as a mere suggestion and auto-expands any row containing
        // wrapped text that needs more vertical room, which is exactly what was happening.
        const height = isHeader ? (s.headerRowHeight ?? 59.25) : (s.dataRowHeight ?? 30.75);
        return rowXml.replace(`<row r="${rowNum}">`, `<row r="${rowNum}" ht="${height}" customHeight="1">`);
      })
      .join("\n");
    const lastCol = xlsxColLetter(Math.max(1, ...s.rows.map((r) => r.length)));
    const lastRow = Math.max(1, s.rows.length);
    const mergeCellsXml = (s.mergeCells && s.mergeCells.length)
      ? `<mergeCells count="${s.mergeCells.length}">${s.mergeCells.map((m) => `<mergeCell ref="${xlsxColLetter(m.startCol)}${m.row}:${xlsxColLetter(m.endCol)}${m.row}"/>`).join("")}</mergeCells>`
      : "";
    zip.file(`xl/worksheets/sheet${sheetIdx + 1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${lastCol}${lastRow}"/>
<sheetViews>${sheetViewXml(s.freezeCols, s.freezeRows)}</sheetViews>
<sheetFormatPr defaultRowHeight="${s.dataRowHeight ?? 30.75}" customHeight="1"/>
${colsXml ? `<cols>${colsXml}</cols>` : ""}
<sheetData>
${rowsXml}
</sheetData>
${mergeCellsXml}
</worksheet>`);
  });

  return zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
}

// Flattens orders into individual containers (cancelled ones excluded — they aren't
// active shipments worth listing in these reports), optionally filtered by order.
function flattenContainers(orders, filterFn) {
  const out = [];
  orders.forEach((o) => {
    if (filterFn && !filterFn(o)) return;
    orderContainers(o).forEach((c) => { if (!c.cancelled) out.push({ o, c }); });
  });
  return out;
}

// Returns a per-cell style function: checks the cell's own text against a list of
// [substring, styleId] rules in order, first match wins. Used for Cargo Type ("NON" before
// "BONDED", so "NON-BONDED" correctly lands on green, not red) and Loading Point.
function textContainsStyle(rules) {
  return (val) => {
    if (val === "" || val === null || val === undefined) return null;
    const s = String(val).toUpperCase();
    for (const [needle, styleId] of rules) {
      if (s.includes(needle.toUpperCase())) return styleId;
    }
    return null;
  };
}
// Flags any value that appears more than once in the given column's data as an error
// (e.g. a Bilty No. that's been accidentally duplicated) — matches the reference file's
// "duplicate values" conditional formatting exactly.
function duplicateStyleFn(allValues, styleId) {
  const counts = {};
  allValues.forEach((v) => {
    const key = String(v == null ? "" : v).trim();
    if (key) counts[key] = (counts[key] || 0) + 1;
  });
  return (val) => {
    const key = String(val == null ? "" : val).trim();
    return key && counts[key] > 1 ? styleId : null;
  };
}

// Builds the <sheetView> element, with a frozen pane when the sheet specifies one.
// freezeCols = how many leftmost columns stay fixed while scrolling horizontally,
// freezeRows = how many top rows (the header) stay fixed while scrolling vertically.
function sheetViewXml(freezeCols, freezeRows) {
  if (!freezeCols && !freezeRows) return '<sheetView workbookViewId="0"/>';
  const topLeftCell = `${xlsxColLetter((freezeCols || 0) + 1)}${(freezeRows || 0) + 1}`;
  const activePane = freezeCols && freezeRows ? "bottomRight" : freezeCols ? "topRight" : "bottomLeft";
  const xSplitAttr = freezeCols ? ` xSplit="${freezeCols}"` : "";
  const ySplitAttr = freezeRows ? ` ySplit="${freezeRows}"` : "";
  return `<sheetView workbookViewId="0"><pane${xSplitAttr}${ySplitAttr} topLeftCell="${topLeftCell}" activePane="${activePane}" state="frozen"/><selection pane="${activePane}" activeCell="${topLeftCell}" sqref="${topLeftCell}"/></sheetView>`;
}

function colWidthsFor(headers) {
  return headers.map((h) => Math.min(Math.max(String(h || "").length + 6, 14), 50));
}

// Builds a {col: styleId} map for every column 1..colCount — wrapCols get wrapStyle,
// everything else gets noWrapStyle. Used for both header rows (per-color wrap/no-wrap) and
// data rows (content wrap/no-wrap), since the same wrap-or-not decision now varies per
// column rather than applying uniformly to a whole row.
function buildColStyleMap(colCount, wrapCols, wrapStyle, noWrapStyle) {
  const map = {};
  for (let c = 1; c <= colCount; c++) map[c] = wrapCols.has(c) ? wrapStyle : noWrapStyle;
  return map;
}

// Cargo Type always stays Calibri 11 regardless of match — colored (green/red) when it
// says NON-BONDED/BONDED, plain style 12 (also Calibri 11, centered) for anything else,
// rather than falling through to the Tahoma 10 data default like every other column does.
const CARGO_TYPE_RULE = (val) => {
  if (val === "" || val === null || val === undefined) return null; // truly empty cell - let it get skipped normally
  const s = String(val).toUpperCase();
  if (s.includes("NON")) return 10;
  if (s.includes("BONDED")) return 11;
  return 12;
};
const LOADING_POINT_RULE = textContainsStyle([["PICT", 13], ["QICT", 14], ["KICT", 15], ["SAPT", 16]]);

// Colors the Status column in the Transporter Bills Statement of Account to match the same
// stage badge colors used on the site (billStageColor) — gray/blue/amber/violet/green.
const BILL_STATUS_COLOR_RULE = (val) => {
  switch (val) {
    case "Pending": return 23;
    case "Bill Received": return 24;
    case "Pending Approval": return 25;
    case "Posted": return 26;
    case "Paid": return 10; // reuse Cargo Type green - same "complete/good" meaning
    default: return null;
  }
};

async function buildTemplateWorkbook(data, mode) {
  const allOrders = data.orders || [];
  // "current" = only active/ongoing shipments, filtered out once a container reaches
  // Completed - Export has no Completed stage at all (it stops at Delivered), so this only
  // meaningfully filters Import/Domestic. Applied per-container, not per-order, since an
  // order's other containers might still be active even if one of them is done.
  const orders = mode === "current"
    ? allOrders.map((o) => {
        const st = o.shipmentType || "Import";
        const containers = orderContainers(o).filter((c) => trackingDisplayStatus(c, st) !== "Completed");
        return { ...o, containers };
      }).filter((o) => orderContainers(o).length > 0)
    : allOrders;
  const today = todayISO();
  const sheets = [];

  // --- Shared layout/rules for the customer-specific sheets below (used to be also used by
  // a "Cleared Cases-01" sheet here, which has been removed from this export) ---
  // Not explicitly covered in the wrap/no-wrap spec (that was given for the Import sheet's
  // columns) — headers here are wrapped uniformly since most of its 48 labels are long
  // detention-tracking phrases, and content-wrap is applied to the same *concepts* the
  // Import sheet marks as wrap (Job#, SAP/PO No., Shipping Line, Description, B/L No.,
  // Truck No., I.G.M Date, Destination, Empty Return Place).
  const clearedHeaderWrap = new Set(Array.from({ length: 48 }, (_, i) => i + 1)); // all wrap
  const clearedContentWrap = new Set([2, 3, 6, 8, 9, 15, 17, 27, 28]);
  const clearedHeaderOverrides = buildColStyleMap(48, clearedHeaderWrap, 1, 2);
  const clearedContentDefault = buildColStyleMap(48, clearedContentWrap, 9, 8);
  // Charges/amount columns — bold: Detention Calculated USD/PKR, Placement Charges,
  // Damage Repair/Other Chgs, Total Amount Payable in PKR.
  [40, 42, 43, 44, 45].forEach((col) => { clearedContentDefault[col] = 22; });

  // --- Import Transportation (cream header) ---
  // Header wrap: everything except Job#, B/L No., Container No., Bilty No., Truck No., YEAR.
  const importHeaderNoWrap = new Set([2, 9, 10, 18, 19, 32]);
  const importHeaderWrap = new Set(Array.from({ length: 32 }, (_, i) => i + 1).filter((c) => !importHeaderNoWrap.has(c)));
  const importHeaderOverrides = buildColStyleMap(32, importHeaderWrap, 3, 4);
  // Content wrap: Job#, PO NO./LC NO., Shipping Line, Description, B/L No., Seal Number,
  // I.G.M Date, Destination, Consignee, Empty Return Location, Bilty No., Truck No.
  const importContentWrap = new Set([2, 3, 6, 8, 9, 11, 14, 15, 16, 17, 18, 19]);
  const importContentDefault = buildColStyleMap(32, importContentWrap, 9, 8);
  // Freeze panes split right between columns G(7) and H(8) — drop the border on that exact
  // edge so it doesn't look like a double line where the frozen pane meets the scrollable area.
  importHeaderOverrides[7] = 19; // G header: wrap, no right border
  importHeaderOverrides[8] = 18; // H header: wrap, no left border
  importContentDefault[7] = 20; // G content: no-wrap, no right border
  importContentDefault[8] = 21; // H content: wrap, no left border
  // Charges/amount columns — bold: Freight, Freight Paid By Vide Cheque#, Bill Amount Approved,
  // LOLO/Stay/Other Charges, Total Bill Amount. Customer (16) also bold, since it now shows
  // the short form (e.g. "PTC") rather than the full name.

  const importFlat = flattenContainers(orders, (o) => orderKind(o) === "import");
  const importDataRows = importFlat.map(({ o, c }, i) => buildImportRow(i + 1, o, c, data));
  const importRows = [IMPORT_HEADERS, ...importDataRows];
  sheets.push({
    name: "Import Transportation", rows: importRows, headerRowIndex: 1,
    colWidths: importColWidths(), freezeCols: 7, freezeRows: 1,
    headerOverrides: importHeaderOverrides, contentDefaultCols: importContentDefault,

  const domHeaderWrap = new Set(Array.from({ length: 15 }, (_, i) => i + 1).filter((c) => !domHeaderNoWrap.has(c)));

  domContentDefault[15] = 22; // Freight Amount — bold
  domContentDefault[3] = 22; // Customer (now short form, e.g. "PTC") — bold

  function buildDomesticSheet(sheetName, category) {
    const flat = flattenContainers(orders, (o) => orderKind(o) === "domestic" && (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === category);
    const dataRows = flat.map(({ o, c }, i) => buildDomesticRow(i + 1, o, c, data));
    const rows = [DOMESTIC_HEADERS, ...dataRows];
    const domColWidths = colWidthsFor(DOMESTIC_HEADERS);
    domColWidths[0] = 6.29; // Sr. — narrow, matching Import Transportation's Sr. column
    domColWidths[3] = 24; // Sender Name — wider

      name: sheetName, rows, headerRowIndex: 1,
      colWidths: domColWidths, freezeRows: 1,
      headerOverrides: domHeaderOverrides, contentDefaultCols: domContentDefault,
      conditionalCols: { 12: LOADING_POINT_RULE, 7: duplicateStyleFn(dataRows.map((r) => r[6]), 17) },
    });
  }
  buildDomesticSheet("Finished Goods", DOMESTIC_CATEGORIES[0]);
  buildDomesticSheet("Wrapping Materials", DOMESTIC_CATEGORIES[1]);
  buildDomesticSheet("WM Domestic Karachi", DOMESTIC_CATEGORIES[2]);

  // --- Export Transportation (cream header) ---
  const expHeaderNoWrap = new Set([2, 8, 11, 14]); // Job#, Container No., Truck No., Bilty No.
  const expHeaderWrap = new Set(Array.from({ length: 18 }, (_, i) => i + 1).filter((c) => !expHeaderNoWrap.has(c)));
  const expHeaderOverrides = buildColStyleMap(18, expHeaderWrap, 3, 4);
  const expContentWrap = new Set([2, 3, 4, 7, 11, 14, 17]); // Job#, Shipper(~Consignee), Empty Pickup Loc, Shipping Line, Truck No., Bilty No., Destination
  const expContentDefault = buildColStyleMap(18, expContentWrap, 9, 8);
  expContentDefault[15] = 22; // Freight — bold
  expContentDefault[3] = 22; // Customer (now short form, e.g. "PTC") — bold

  const expFlat = flattenContainers(orders, (o) => orderKind(o) === "export");
  const expDataRows = expFlat.map(({ o, c }, i) => buildExportRow(i + 1, o, c, data));
  const expRows = [EXPORT_HEADERS, ...expDataRows];
  const expColWidths = colWidthsFor(EXPORT_HEADERS);
  expColWidths[0] = 6.29; // Sr. — narrow, matching Import Transportation's Sr. column
  sheets.push({
    name: "Export Transportation", rows: expRows, headerRowIndex: 1,
    colWidths: expColWidths, freezeCols: 6, freezeRows: 1,
    headerOverrides: expHeaderOverrides, contentDefaultCols: expContentDefault,
    conditionalCols: { 16: CARGO_TYPE_RULE, 5: LOADING_POINT_RULE, 14: duplicateStyleFn(expDataRows.map((r) => r[13]), 16) },

  const fuelPriceRows = [fuelPriceHeaders, ...(data.fuel_prices || [])
    .slice()
    .sort((a, b) => (b.effectiveDate || "").localeCompare(a.effectiveDate || ""))
    .map((p, i) => [i + 1, p.effectiveDate ? fmtDate(p.effectiveDate) : "", xnum(p.pricePerLiter, "")])];
  sheets.push({
    name: "Fuel Prices", rows: fuelPriceRows, headerRowIndex: 1, freezeRows: 1,
    colWidths: (() => { const w = colWidthsFor(fuelPriceHeaders); w[0] = 6.29; return w; })(),
    headerOverrides: buildColStyleMap(3, new Set(), 0, 6),
    contentDefaultCols: buildColStyleMap(3, new Set(), 0, 8),
  });

  // --- Contract Rates (blue header, every customer's rates combined into one sheet, with
  // a Customer column added since this isn't scoped to one customer like the per-customer
  // Contracts page export is) ---

  const contractRows = [contractHeaders, ...(data.contracts || []).map((k, i) => {
    const cust = getCustomer(data, k.customerId);

      i + 1, cust ? (cust.shortName || cust.name) : "", k.loadingPoint || "", k.destination || "", k.movementThrough || "",
      k.vehicleSize || "", k.weightCategory || "", k.axleLoadCategory || "",

  const contractContentDefault = buildColStyleMap(contractHeaders.length, new Set(), 0, 8);
  contractContentDefault[2] = 22; // Customer — bold, matching the Domestic/Import sheets' convention

    .sort((a, b) => new Date(a.c.dispatchAt) - new Date(b.c.dispatchAt)); // chronological, so per-date swap dedup below credits the earliest shipment first - same rule as the page

  const fuelReportRows = [fuelReportHeaders];
  fuelReportFlat.forEach(({ o, c }) => {

    const cust = getCustomer(data, o.customerId);
    const matchedRate = matchContractRateAnyCustomer(o.customerId, o.origin, c, data.contracts, data.contract_groups, dispatchDateISO);
    const freightAmount = matchedRate ? xnum(matchedRate.rate) : xnum(c.freightAmount, null);
    const fuelBaseRate = matchedRate && matchedRate.group ? xnum(matchedRate.group.fuelBaseRate, null) : null;
    const fuelComponentAmount = matchedRate ? contractRateComponents(matchedRate).fuelComponent : null;
    const impliedLitres = (fuelComponentAmount !== null && fuelBaseRate) ? fuelComponentAmount / fuelBaseRate : null;
    const price = resolveEffectiveFuelPrice(data.fuel_prices, dispatchDateISO, fuelReportPriceMode);
    const fuelAdjustment = (impliedLitres !== null && price) ? impliedLitres * price : null;

    let swappedLitres = 0, swappedPKR = 0;
    const claimedDates = claimedSwapDatesByCustomer.get(o.customerId) || new Set();
    if (!claimedDates.has(dispatchDateISO)) {
      const swapsOnDate = (data.fuel_card_swaps || []).filter((s) => s.customerId === o.customerId && s.swapDate === dispatchDateISO);
      if (swapsOnDate.length > 0) {
        swappedLitres = swapsOnDate.reduce((sum, s) => sum + (xnum(s.qtyLtr) || 0), 0);
        swappedPKR = swapsOnDate.reduce((sum, s) => sum + (xnum(s.amountPkr) || 0), 0);

    // it becomes a negative Receivable (money owed back) instead of vanishing. Same rule as page.
    const receivablePKR = fuelAdjustment !== null ? fuelAdjustment - swappedPKR : (swappedPKR > 0 ? -swappedPKR : null);
    const receivableLitres = impliedLitres !== null ? impliedLitres - swappedLitres : (swappedLitres > 0 ? -swappedLitres : null);
    const naNote = !matchedRate ? "No matching contract rate" : !fuelBaseRate ? "Contract has no Fuel Base Rate" : !price ? "No fuel price for this date" : "";
    fuelReportRows.push([
      fuelReportRows.length, cust ? (cust.shortName || cust.name) : "", fmtDate(dispatchDateISO), c.vehiclePlate || "",
      freightAmount !== null ? freightAmount : naNote,
      swappedPKR || "", swappedLitres || "",
      receivablePKR !== null ? receivablePKR : naNote,
      receivableLitres !== null ? receivableLitres : naNote,

  });

  // Swap entries on a date with no dispatched shipment for that customer would otherwise never
  // appear anywhere in this sheet - add a synthetic row per such date/customer so the swapped
  // quantity is never silently dropped, same as the page's orphan-row handling.
  const coveredByCustomer = new Map(); // customerId -> Set of covered dispatch dates
  fuelReportFlat.forEach(({ o, c }) => {
    const set = coveredByCustomer.get(o.customerId) || new Set();
    set.add(toLocalDateStr(new Date(c.dispatchAt)));
    coveredByCustomer.set(o.customerId, set);
  });
  const swapsByCustomerDate = new Map(); // "customerId|date" -> swaps
  (data.fuel_card_swaps || []).forEach((s) => {
    if (!s.swapDate) return;
    const key = `${s.customerId}|${s.swapDate}`;
    const list = swapsByCustomerDate.get(key) || [];
    list.push(s);
    swapsByCustomerDate.set(key, list);
  });
  swapsByCustomerDate.forEach((swapsOnDate, key) => {
    const [customerId, sd] = key.split("|");
    const covered = coveredByCustomer.get(customerId) || new Set();
    if (covered.has(sd)) return; // already represented by a real shipment row above
    const cust = getCustomer(data, customerId);
    const swappedLitres = swapsOnDate.reduce((sum, s) => sum + (xnum(s.qtyLtr) || 0), 0);
    const swappedPKR = swapsOnDate.reduce((sum, s) => sum + (xnum(s.amountPkr) || 0), 0);
    fuelReportRows.push([
      fuelReportRows.length, cust ? (cust.shortName || cust.name) : "", fmtDate(sd), "—",
      "No dispatch", swappedPKR || "", swappedLitres || "",
      swappedPKR > 0 ? -swappedPKR : "No dispatch", swappedLitres > 0 ? -swappedLitres : "No dispatch",
    ]);
  });

  const fuelReportContentDefault = buildColStyleMap(fuelReportHeaders.length, new Set(), 0, 8);
  fuelReportContentDefault[2] = 22; // Customer — bold, matching the Domestic/Import sheets' convention
  sheets.push({
    name: "Fuel Report", rows: fuelReportRows, headerRowIndex: 1, freezeRows: 1,
    colWidths: (() => { const w = colWidthsFor(fuelReportHeaders); w[0] = 6.29; return w; })(),
    headerOverrides: buildColStyleMap(fuelReportHeaders.length, new Set(), 0, 6),
    contentDefaultCols: fuelReportContentDefault,
  });

  return buildXlsxBuffer(sheets);

  const nameVal = xstr(readField(r, "customerName")) || xstr(readField(r, "Customer"));
  if (nameVal && data && data.customers) {
    const match = data.customers.find((c) => c.name && c.name.toLowerCase().trim() === nameVal.toLowerCase().trim());
    if (match) return match.id;

  if (nameVal && data && data.senders) {

/* ---- Bilty receipt generator (downloads a PDF, styled like a real bilty form) ---- */

function compactPKR(n) {
  const num = Number(n) || 0;
  if (Math.abs(num) >= 1e7) return "Rs " + (num / 1e7).toFixed(2) + " Cr";
  if (Math.abs(num) >= 1e5) return "Rs " + (num / 1e5).toFixed(2) + " Lac";
  return "Rs " + num.toLocaleString("en-US");
}
