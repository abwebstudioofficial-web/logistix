}

// Simplifies the internal stageIndex down to the public page's 4 statuses (Pending/
// Confirmed/In Transit/Delivered). Needs shipmentType because stageIndex 3 means different
// things per type: Export has no Under Offloading step (3 = Delivered already), but Import
// and Domestic both do (3 = Under Offloading, not delivered yet — showing "Delivered" this
// early would be misleading, so it maps to "In Transit" instead until the real Delivered step).
function publicStageIndexFor(stageIndex, shipmentType) {
  const si = stageIndex ?? 0;
  if (shipmentType === "Export") {
    const map = [1, 2, 2, 3];
    return map[si] ?? 3;
  }
  const map = [1, 2, 2, 2, 3, 3]; // Import (6 stages) and Domestic (5 stages) both fit this
  return map[si] ?? 3;
}

function PublicTrackingPage() {
  const [orderNumberInput, setOrderNumberInput] = useState(() => {
    const m = window.location.hash.match(/#track=(.+)/);
    return m ? decodeURIComponent(m[1]) : "";
  });
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [lightMode, setLightMode] = useState(false);

  async function doTrack(e) {
    if (e) e.preventDefault();
    if (!orderNumberInput.trim()) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/public_track_order`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_order_number: orderNumberInput.trim() }),
      });
      const json = await res.json().catch(() => null);
      const row = Array.isArray(json) ? json[0] : json;
      if (!res.ok || !row || !row.order_number) {
        setError("No shipment found with that order number. Double-check it and try again.");
      } else {
        setResult(row);
      }
    } catch (err) {
      setError("Something went wrong looking that up. Please check your connection and try again.");
    }
    setLoading(false);
  }

  useEffect(() => {
    if (orderNumberInput) doTrack();
    // eslint-disable-next-line
  }, []);

  const containers = result && Array.isArray(result.containers) ? result.containers : [];
  const customerLike = { deliveryAddresses: (result && Array.isArray(result.customer_addresses)) ? result.customer_addresses : [] };

  // This page is public-facing, so it gets its own light/dark styling rather than
  // touching the shared cardCls/inputCls constants used everywhere else in the app.

      <div className="flex-1 max-w-2xl w-full mx-auto px-6 py-12">
        <div className="text-center mb-8">
          <div className="w-14 h-14 rounded-full bg-blue-600/10 flex items-center justify-center mx-auto mb-4"><MapPin size={26} className="text-blue-500" /></div>
          <h1 className={cx("text-3xl font-bold mb-2", titleText)}>Track Your Shipment</h1>

        </div>
        <form onSubmit={doTrack} className="flex gap-2 mb-8">
          <input className={inputLocal} style={{ flex: 1 }} value={orderNumberInput} onChange={(e) => setOrderNumberInput(e.target.value)} placeholder="e.g. ORD-MS1REP4K-BTJ" />
          <button type="submit" className={cx(btnPrimary, "flex items-center gap-1.5")} disabled={loading}>
            <Search size={15} />{loading ? "Searching…" : "Track"}
          </button>
        </form>

        {error && <div className={cx(cardLocal, "p-4 text-red-400 text-sm text-center mb-6")}>{error}</div>}

        {result && (
          <div className="space-y-6">
            <div className={cx(cardLocal, "p-5")}>
              <div className={cx("text-xs", subtleText)}>ORDER</div>
              <div className={cx("font-bold font-mono mb-2", titleText)}>{result.order_number}</div>

            {containers.length === 0 ? (

            ) : (
              containers.map((c, idx) => {
                const cancelled = !!c.cancelled;

                const statusLabel = cancelled ? "Cancelled" : ["Pending", "Confirmed", "In Transit", "Delivered"][publicIndex];
                const statusInfo = PUBLIC_STATUS_INFO[statusLabel] || PUBLIC_STATUS_INFO.Pending;
                const receiverAddr = resolveReceiverAddress(c, customerLike);
                return (
                  <div key={c.id || idx} className="space-y-4">

                      <div className={cx("text-sm", lightMode ? "text-slate-700" : "text-slate-300")}>{statusInfo.desc}</div>
                    </div>
                    <div className={cx(cardLocal, "p-5 pb-6")}>
                      <PublicStageStepper currentIndex={publicIndex} cancelled={cancelled} />
                    </div>
                    <div className={cx(cardLocal, "p-5")}>
                      <div className={cx("flex items-start justify-between mb-4 pb-4 border-b", headerBorder)}>
                        <div><div className={cx("text-xs", subtleText)}>SEAL NO.</div><div className={cx("font-bold font-mono", titleText)}>{c.sealNumber || "—"}</div></div>
                        {c.weight ? <div className="text-right"><div className={cx("text-xs", subtleText)}>WEIGHT</div><div className={cx("font-bold", titleText)}>{Number(c.weight).toLocaleString()} kg</div></div> : null}
                      </div>
                      <div className="grid grid-cols-2 gap-3 mb-4 items-center">
                        <div className={cx("rounded-lg p-3", boxBg)}>
                          <div className={cx("text-xs mb-1", subtleText)}>FROM</div>
                          <div className={cx("font-semibold", titleText)}>{result.origin}</div>
                          {result.sender_address && <div className={cx("text-xs mt-0.5", mutedText)}>{result.sender_address}</div>}
                        </div>
                        <div className={cx("rounded-lg p-3", boxBg)}>
                          <div className={cx("text-xs mb-1", subtleText)}>TO</div>
                          <div className={cx("font-semibold", titleText)}>{c.destination || "—"}</div>
                          {receiverAddr && <div className={cx("text-xs mt-0.5", mutedText)}>{receiverAddr}</div>}
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4 text-sm">
                        <div><div className={cx("text-xs", subtleText)}>Expected Pickup</div><div className={cx("font-medium", titleText)}>{fmtDateISO(result.created_date)}</div></div>
                        <div><div className={cx("text-xs", subtleText)}>Expected Delivery</div><div className={cx("font-medium", titleText)}>{fmtDateISO(result.eta)}</div></div>
                        <div><div className={cx("text-xs", subtleText)}>Vehicle</div><div className={cx("font-medium", titleText)}>{c.vehiclePlate || "Unassigned"}</div></div>
                      </div>
                    </div>
                    {idx < containers.length - 1 && <div className={cx("border-t pt-2", headerBorder)} />}
                  </div>
                );
              })
            )}
          </div>
        )}
      </div>
      <div className={cx("text-center text-xs py-6 border-t", subtleText, headerBorder)}>© {new Date().getFullYear()} LOGISTIX Transport ERP</div>
    </div>
  );
}

function LogistixERP() {
  const [authSession, setAuthSession] = useState(undefined); // undefined = checking, null = logged out
  const [showAuth, setShowAuth] = useState(false);
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [profile, setProfile] = useState(null);

  const [data, setDataState] = useState(null);
  const dataRef = useRef(null);
  useEffect(() => { dataRef.current = data; }, [data]);
  const [dataLoading, setDataLoading] = useState(false);
  const [view, setView] = useState("dashboard");
  // Lifted out of OrdersView so the Export/Attach bar (rendered at this level, above the tab
  // content) can know which Domestic category is currently open and scope the Excel
  // export/attach to just that one, instead of always covering all three categories.
  const [domesticCategory, setDomesticCategory] = useState(null);
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [viewSession, setViewSession] = useState({ role: "admin", customerId: null });
  const [excelMeta, setExcelMeta] = useState({ attached: false, filename: null, snapshot: null });
  // Per-browser display preference for which table columns show/hide, managed from Settings.
  const [columnVisibility, setColumnVisibilityState] = useState(loadColumnVisibility);
  function setColumnVisibility(tableKey, columnKey, visible) {
    setColumnVisibilityState((prev) => {
      const next = { ...prev, [tableKey]: { ...(prev[tableKey] || {}), [columnKey]: visible } };
      try { window.localStorage.setItem(COLUMN_VISIBILITY_STORAGE_KEY, JSON.stringify(next)); } catch {}
      return next;
    });
  }
  function isColVisible(tableKey, columnKey) {
    const v = columnVisibility[tableKey] && columnVisibility[tableKey][columnKey];
    return v !== false; // undefined (never toggled) or true -> visible; only explicit false hides it
  }
  const [importMsg, setImportMsg] = useState(null);
  const [excelBusy, setExcelBusy] = useState(false);
  const [showExportChoice, setShowExportChoice] = useState(false);
  const [tabExcel, setTabExcel] = useState({}); // { [viewKey]: { attached, filename, snapshot, busy, message } }
  const [domesticExportFrom, setDomesticExportFrom] = useState("");
  const [domesticExportTo, setDomesticExportTo] = useState("");
  const [contractExcel, setContractExcel] = useState({}); // { [contractGroupId||"orphan"]: { attached, filename, snapshot, busy, message } } - per-contract, so this can't use the generic viewKey-based system above
  const [swapExcel, setSwapExcel] = useState({}); // { [customerId]: { attached, filename, snapshot, busy, message } } - per-customer, same reason
  const [fleetUrl, setFleetUrl] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("logistix-theme") || "dark"; } catch (e) { return "dark"; }
  });
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const fileInputRef = useRef(null);

  function toggleTheme() {
    setTheme((t) => {
      const next = t === "dark" ? "light" : "dark";
      try { localStorage.setItem("logistix-theme", next); } catch (e) { /* ignore */ }
      return next;
    });
  }

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setAuthSession(data.session || null));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setAuthSession(sess));
    try { setFleetUrl(localStorage.getItem(FLEET_LINK_KEY) || null); } catch (e) { /* ignore */ }
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (authSession) loadProfileAndData();
    else { setProfile(null); setDataState(null); }
    // eslint-disable-next-line
  }, [authSession]);

  // Live updates: quietly re-fetch in the background so changes made by other people show
  // up without anyone needing to reload the page. Skipped while a modal is open (someone's
  // likely mid-edit right then) and while a previous refresh is still in flight, so it
  // never piles up requests or clobbers an in-progress form.
  const modalRef = useRef(null);
  const refreshingRef = useRef(false);
  // Signature (row count + latest updated_at) per table from the last successful refresh.
  // Empty on mount, which is how refreshData() below knows to do a real full fetch the first
  // time rather than trying the lightweight pre-check against nothing.
  const lastSignatureRef = useRef({});
  useEffect(() => { modalRef.current = modal; }, [modal]);
  useEffect(() => {
    if (!authSession) return;
    const interval = setInterval(() => {
      if (modalRef.current || refreshingRef.current) return;
      refreshingRef.current = true;
      refreshData().finally(() => { refreshingRef.current = false; });
    }, 30000);
    return () => clearInterval(interval);
  }, [authSession]);

  async function handleLogin(email, password) {
    setAuthBusy(true); setAuthError(null);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setAuthError(error.message);
    setAuthBusy(false);
  }

  async function handleSignup(email, password, name) {
    setAuthBusy(true); setAuthError(null);
    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { name } } });
    if (error) setAuthError(error.message);
    setAuthBusy(false);
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  // Loops through a table in pages of 1000 (Supabase/PostgREST's typical default max-rows
  // limit) until every row has been fetched, rather than silently stopping at whatever that
  // limit is - a single .select("*") with no range() would otherwise cap out there
  // regardless of how many rows actually exist, which is exactly what happened once total
  // orders crossed 1000: newer rows pushed older ones out of the truncated result entirely.
  async function fetchAllRows(table) {
    const PAGE_SIZE = 1000;
    let from = 0;
    let all = [];
    while (true) {
      const { data, error, count } = await supabaseClient.from(table).select("*").order("created_at", { ascending: false }).range(from, from + PAGE_SIZE - 1);
      if (error) return { data: all.length ? all : null, error };
      all = all.concat(data || []);
      const total = count != null ? count : null;
      const gotFullPage = (data || []).length === PAGE_SIZE;
      from += PAGE_SIZE;
      if (!gotFullPage) break; // last page was short (or empty) - nothing more to fetch
      if (total != null && all.length >= total) break; // reached the known total early
    }
    return { data: all, error: null };
  }

  // Cheap "has this table changed?" probe: just the row count plus the single most-recently-
  // touched row's updated_at, instead of every column of every row. A few hundred bytes
  // instead of megabytes. Catches inserts, edits, and deletes (all three move the count and/or
  // the latest updated_at), and is what makes the 30s poll affordable at this dataset size -
  // previously every poll re-downloaded every table in full regardless of whether anything had
  // actually changed, which is what was driving egress usage into gigabytes per day.
  // Uses .range(0, 0) rather than .limit() - this app's lite Supabase client (createLiteClient)
  // is a hand-rolled REST wrapper, not the real supabase-js library, and its query builder only
  // implements .eq/.order/.range/.maybeSingle - no .limit(). Calling .limit() threw a TypeError
  // on every single poll, which silently broke live data sync entirely (the error happened
  // before setDataState was ever reached) until this was caught. .range(0, 0) asks for just the
  // first row and, per that client's own implementation, automatically requests an exact count
  // via the response's Content-Range header - giving both pieces of the signature in one call.
  async function fetchTableSignature(table) {
    try {
      const { data, count, error } = await supabaseClient
        .from(table)
        .select("updated_at")
        .order("updated_at", { ascending: false })
        .range(0, 0);
      if (error) return null; // unknown - caller treats this as "assume changed, fetch for real"
      const latest = (data && data[0] && data[0].updated_at) || "";
      return `${count}:${latest}`;
    } catch (e) {
      return null; // network hiccup etc - never let this take down the whole poll cycle
    }
  }

  async function refreshData() {
    try {
      const isInitialLoad = Object.keys(lastSignatureRef.current).length === 0;
      let tablesToFetch = DATA_TABLES;
      if (!isInitialLoad) {
        const signatures = await Promise.all(DATA_TABLES.map((t) => fetchTableSignature(t)));
        tablesToFetch = DATA_TABLES.filter((t, i) => signatures[i] === null || signatures[i] !== lastSignatureRef.current[t]);
        if (tablesToFetch.length === 0) return; // nothing changed anywhere this poll - skip entirely
      }

      const results = await Promise.all(tablesToFetch.map((t) => fetchAllRows(t)));
      tablesToFetch.forEach((t, i) => {
        const { data: rows } = results[i];
        if (!rows) return; // failed fetch - leave last known signature as-is so it's retried next poll
        const latest = rows.reduce((max, r) => (r.updated_at && r.updated_at > max ? r.updated_at : max), "");
        lastSignatureRef.current[t] = `${rows.length}:${latest}`;
      });

      setDataState((prev) => {
        // prev is null on the very first load (before any data has ever been set) - refreshData
        // is reused both for that initial load and the 30-second background poll, but only the
        // poll case can assume prev already has real data to compare against.
        const base = prev || {};
        const next = { ...base };
        let anyTableChanged = !prev;
        tablesToFetch.forEach((t, i) => {
          const { data: rows, error } = results[i];
          if (error) {
            // Never let a failed background fetch wipe out data that's already on screen —
            // keep whatever was there before and just skip updating this one table.
            console.error(`Failed refreshing ${t}:`, error.message);
            return;
          }
          const fetched = (rows || []).map(fromDbRow);
          // Cheap-ish but reliable: only swap in the new array (a new reference, which is what
          // actually triggers re-renders) if the data is genuinely different. Every poll was
          // previously replacing every table's reference unconditionally, forcing the whole
          // app to re-render even when nothing in the database had actually changed.
          if (!prev || JSON.stringify(fetched) !== JSON.stringify(base[t])) {
            next[t] = fetched;
            anyTableChanged = true;
          }
        });
        return anyTableChanged ? next : prev; // no change anywhere -> keep the exact same state object
      });
    } catch (e) {
      // Whatever else goes wrong here, it must never propagate as an uncaught rejection that
      // silently kills every future poll — log it and let the next 30s cycle try again.
      console.error("refreshData failed:", e);
    }
  }

  async function loadProfileAndData() {
    setDataLoading(true);
    const userId = authSession.user.id;
    const { data: profRow } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
    const prof = profRow ? fromDbRow(profRow) : { id: userId, name: authSession.user.email, role: "staff", customerId: "" };
    setProfile(prof);
    setViewSession(prof.role === "customer" ? { role: "customer", customerId: prof.customerId } : { role: prof.role || "admin", customerId: null });
    const allowed = allowedViewsForRole(prof.role);
    if (allowed && allowed.length) setView(allowed[0]);

    await refreshData();
    setDataLoading(false);
  }

  async function saveItem(entity, item) {
    let toSave = item;
    const actor = (profile && profile.name) || "Someone";
    if (entity === "orders") {
      const containers = orderContainers(item).map((c) => {
        if (Array.isArray(c.history) && c.history.length === 1 && !c.history[0].by) {
          return { ...c, history: [{ ...c.history[0], by: actor }] };
        }
        return c;
      });
      toSave = { ...item, containers };
      if (!Array.isArray(toSave.history) || toSave.history.length === 0) {
        toSave.history = [{ id: uid("evt"), message: "Order created and pending confirmation", at: new Date().toISOString(), location: item.origin, by: actor }];
      }
    }
    const row = toDbRow(toSave);
    const { error } = await supabaseClient.from(entity).upsert(row);
    if (error) { window.alert("Couldn't save: " + error.message); return; }
    setDataState((prev) => {
      const list = prev[entity];
      const idx = list.findIndex((x) => x.id === toSave.id);
      const next = idx > -1 ? list.map((x) => (x.id === toSave.id ? toSave : x)) : [toSave, ...list];
      return { ...prev, [entity]: next };
    });
    setModal(null);
  }

  async function deleteItem(entity, idOrIds) {
    const ids = Array.isArray(idOrIds) ? idOrIds : [idOrIds];
    try {
      const { error } = await supabaseClient.from(entity).delete().in("id", ids);
      if (error) { window.alert("Couldn't delete: " + error.message); return; }
      const idSet = new Set(ids);
      setDataState((prev) => ({ ...prev, [entity]: prev[entity].filter((x) => !idSet.has(x.id)) }));
      setConfirm(null);
    } catch (err) {
      window.alert("Couldn't delete: " + (err && err.message ? err.message : String(err)));
    }
  }

  async function updateContainerStage(orderId, containerId, newStageIndex, extraData) {
    const order = data.orders.find((o) => o.id === orderId);
    if (!order) return;
    const st = order.shipmentType || "Import";
    const isDomesticOrder = st === "Domestic";
    const isImportOrder = st === "Import";
    // Which stageIndex means "Delivered" and which array of messages applies, per type.
    const deliveredAtIndex = (isDomesticOrder || isImportOrder) ? 4 : 3;
    const completedAtIndex = isImportOrder ? 5 : -1; // only Import ever reaches Completed
    const messages = isDomesticOrder ? DOMESTIC_STAGE_MESSAGES : isImportOrder ? IMPORT_STAGE_MESSAGES : STAGE_MESSAGES;
    const actor = (profile && profile.name) || "Someone";
    const containers = orderContainers(order).map((c) => {
      if (c.id !== containerId) return c;
      const deliveredDate = newStageIndex >= deliveredAtIndex ? (c.deliveredDate || todayISO()) : c.deliveredDate;
      let message = messages[newStageIndex] || "Status updated";
      if (newStageIndex === deliveredAtIndex && extraData && extraData.podReceivedBy) message = `Delivered — received by ${extraData.podReceivedBy}`;
      if (newStageIndex === 1 && extraData && extraData.dispatchedBy) message = `Picked up — dispatched by ${extraData.dispatchedBy}`;
      if (newStageIndex === completedAtIndex && extraData && extraData.emptyReturnDate) message = `Completed — empty returned ${fmtDate(extraData.emptyReturnDate)}`;
      const location = (newStageIndex === completedAtIndex) ? (c.emptyReturnLocation || c.destination || order.origin) : newStageIndex >= 3 ? (c.destination || order.origin) : order.origin;
      const newEvent = { id: uid("evt"), message, at: new Date().toISOString(), location, by: actor };
      const history = [...(Array.isArray(c.history) ? c.history : []), newEvent];
      const mergedFields = extraData || {};
      return { ...c, stageIndex: newStageIndex, deliveredDate, history, ...mergedFields };
    });
    const { error } = await supabaseClient.from("orders").update({ containers }).eq("id", orderId);
    if (error) { window.alert("Couldn't update container: " + error.message); return; }
    setDataState((prev) => ({ ...prev, orders: prev.orders.map((o) => (o.id === orderId ? { ...o, containers } : o)) }));
  }

  const updateQueueRef = useRef(Promise.resolve());
  async function updateContainerFields(orderId, containerId, fields, opts) {
    // Serialized so near-simultaneous edits to a container (e.g. editing a charge amount,
    // then immediately clicking Forward for Approval) never race. Previously each call read
    // data.orders independently at the moment it started; if a second call started before the
    // first one's database write + state update had finished, both computed their change from
    // the same stale snapshot, and whichever one's write landed last silently overwrote the
    // other's — which is exactly how a freshly-edited Rs 5000 charge could revert back toward
    // an old value after clicking Forward for Approval right after editing it. Now every call
    // waits its turn and reads dataRef.current, which is updated the instant the previous call
    // finishes, not just whenever React gets around to re-rendering.
    const run = async () => {
      const source = dataRef.current || data;
      if (!source) return;
      const order = source.orders.find((o) => o.id === orderId);
      if (!order) return;
      const actor = (profile && profile.name) || "Someone";
      const skipLog = opts && opts.skipLog;
      const containers = orderContainers(order).map((c) => {
        if (c.id !== containerId) return c;
        let history = Array.isArray(c.history) ? c.history : [];
        if (!skipLog) {
          const desc = describeFieldChange(fields);
          if (desc) {
            history = [...history, { id: uid("evt"), message: desc, at: new Date().toISOString(), location: "", by: actor }];
          }
        }
        return { ...c, ...fields, history };
      });
      const { error } = await supabaseClient.from("orders").update({ containers }).eq("id", orderId);
      if (error) { window.alert("Couldn't save: " + error.message); return; }
      const next = { ...source, orders: source.orders.map((o) => (o.id === orderId ? { ...o, containers } : o)) };
      dataRef.current = next;
      setDataState(next);
    };
    const result = updateQueueRef.current.then(run, run);
    updateQueueRef.current = result.catch(() => {}); // keep the chain alive even if one call fails
    return result;
  }

  // Manually-added "Payment to Transporter" entries live on the transporter record itself
  // (manualPayments, a JSON array) rather than on any specific order/container - some
  // payments (advances, adjustments) aren't tied to one bill. Same serialized-queue pattern
  // as updateContainerFields, for the same reason: two payments added close together must
  // not race and silently drop one. Keyed by NAME rather than id, and creates a minimal
  // transporter record on first use if one doesn't already exist - "transporter" here is
  // often just free text typed into a container's Transporter field, with no formal record
  // in the transporters table at all, which is exactly what made Add Payment silently do
  // nothing before: it was looking up a record that was never there.
  async function updateTransporterManualPayments(transporterName, nextPayments) {
    const run = async () => {
      try {
        const source = dataRef.current || data;
        if (!source) return false;
        let transporter = source.transporters.find((t) => t.name === transporterName);
        let transportersList = source.transporters;
        if (!transporter) {
          // This lite client has no .insert() - upsert is what's actually available for
          // creating a new row. Using .insert() here previously threw a TypeError with
          // nothing to catch it, which is exactly what left "Saving..." stuck forever.
          transporter = { id: uid("transporter"), name: transporterName, email: "", phone: "", contact: "", addresses: [], manualPayments: [] };
          const { error: insertError } = await supabaseClient.from("transporters").upsert(toDbRow(transporter));
          if (insertError) { window.alert("Couldn't create transporter record: " + insertError.message); return false; }
          transportersList = [...transportersList, transporter];
        }
        const { error } = await supabaseClient.from("transporters").update({ manual_payments: nextPayments }).eq("id", transporter.id);
        if (error) { window.alert("Couldn't save: " + error.message); return false; }
        const next = { ...source, transporters: transportersList.map((t) => (t.id === transporter.id ? { ...t, manualPayments: nextPayments } : t)) };
        dataRef.current = next;
        setDataState(next);
        return true;
      } catch (e) {
        // Whatever else might go wrong here, it must never leave the caller's "Saving..."
        // state stuck with no way out - always surface it and let the caller move on.
        window.alert("Couldn't save: " + e.message);
        return false;
      }
    };
    const result = updateQueueRef.current.then(run, run);
    updateQueueRef.current = result.catch(() => {});
    return result;
  }

  async function updateDriverStatus(driverId, status) {

    if (error) { window.alert("Couldn't update driver: " + error.message); return; }

  function handleAttachFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setExcelBusy(true);
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        const found = [];
        let updatedCount = 0, addedCount = 0;
        const next = { ...data };
        const writes = [];
        // Carry forward any snapshot from a file that's already attached, so reverting
        // always restores all the way back to the true pre-import state, even across
        // multiple files attached one after another without detaching in between.
        const snapshot = { ...(excelMeta.snapshot || {}) };
        const SHEET_TABLE_NAME = { Orders: "orders", Drivers: "drivers", Vehicles: "vehicles", Invoices: "invoices", Routes: "routes", FuelPrices: "fuel_prices" };
        Object.keys(SHEET_SCHEMAS).forEach((sheetName) => {
          const ws = wb.Sheets[sheetName];
          if (!ws) return;
          const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
          const table = SHEET_TABLE_NAME[sheetName] || sheetName.toLowerCase();
          found.push(sheetName);
          let coerced;
          if (sheetName === "Orders") coerced = coerceOrders(rows, data);
          if (sheetName === "Drivers") coerced = coerceDrivers(rows);
          if (sheetName === "Vehicles") coerced = coerceVehicles(rows);
          if (sheetName === "Invoices") coerced = coerceInvoices(rows);
          if (sheetName === "Routes") coerced = coerceRoutes(rows);
          if (sheetName === "FuelPrices") coerced = coerceFuelPrices(rows);
          if (!coerced) return;

          const existingList = data[table] || [];
          const existingById = new Map(existingList.map((r) => [r.id, r]));
          const priorEntries = snapshot[table] || [];
          const alreadyTracked = new Set(priorEntries.map((en) => en.id));
          const tableSnapshot = [...priorEntries];
          const mergedList = [...existingList];

          coerced.forEach((row) => {
            const prev = existingById.get(row.id) || null;
            if (prev) updatedCount++; else addedCount++;
            // Only capture the "before" value the first time this record is touched —
            // if a later file changes it again, we still want to revert to the very original.
            if (!alreadyTracked.has(row.id)) tableSnapshot.push({ id: row.id, prev });
            const idx = mergedList.findIndex((r) => r.id === row.id);
            if (idx >= 0) mergedList[idx] = row; else mergedList.push(row);
          });

          next[table] = mergedList;
          snapshot[table] = tableSnapshot;
          if (coerced.length) writes.push(supabaseClient.from(table).upsert(coerced.map(toDbRow)));
        });
        const writeResults = await Promise.all(writes);
        const writeError = writeResults.find((r) => r.error);
        setDataState(next);
        setExcelMeta({ attached: true, filename: file.name, snapshot });
        if (writeError) {
          setImportMsg({ ok: false, text: `Loaded locally, but saving to the database failed: ${writeError.error.message}` });
        } else {
          setImportMsg(found.length
            ? { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"} across ${found.join(", ")}. Everything else is untouched.` }
            : { ok: false, text: "No matching sheet tabs found (expected Orders, Customers, Drivers, Vehicles, Invoices, Routes)." });
        }
      } catch (err) {
        setImportMsg({ ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." });
      } finally {
        setExcelBusy(false);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  async function handleDetach() {
    const snapshot = excelMeta.snapshot;
    if (!snapshot) {
      setExcelMeta({ attached: false, filename: null, snapshot: null });
      setImportMsg(null);
      return;
    }
    setExcelBusy(true);
    try {
      const next = { ...data };
      const writes = [];
      const deletes = [];
      Object.entries(snapshot).forEach(([table, entries]) => {
        const list = [...(data[table] || [])];
        entries.forEach(({ id, prev }) => {
          const idx = list.findIndex((r) => r.id === id);
          if (prev) {
            // existed before the import(s) -> restore it exactly as it was
            if (idx >= 0) list[idx] = prev; else list.push(prev);
            writes.push(supabaseClient.from(table).upsert(toDbRow(prev)));
          } else {
            // didn't exist before -> the import created it, so undo means removing it entirely
            if (idx >= 0) list.splice(idx, 1);
            deletes.push(supabaseClient.from(table).delete().eq("id", id));
          }
        });
        next[table] = list;
      });
      await Promise.all([...writes, ...deletes]);
      setDataState(next);
      setImportMsg({ ok: true, text: "Reverted — the site's data is back to how it was before that file was attached." });
    } catch (err) {
      setImportMsg({ ok: false, text: "Couldn't fully revert: " + err.message });
    } finally {
      setExcelMeta({ attached: false, filename: null, snapshot: null });
      setExcelBusy(false);
    }
  }

  function handleTabAttachFile(viewKey, file) {
    const cfg = TAB_EXCEL_CONFIG[viewKey];
    if (!cfg || !file) return;
    setTabExcel((prev) => ({ ...prev, [viewKey]: { ...(prev[viewKey] || {}), busy: true, message: null } }));
    const reader = new FileReader();
    if (viewKey === "orders_domestic") {
      reader.onload = async (evt) => {
        try {
          const arr = new Uint8Array(evt.target.result);
          const wb = XLSX.read(arr, { type: "array" });
          const sheetNames = ["Finished Goods", "Wrapping Materials", "WM Domestic Karachi"].filter((n) => wb.Sheets[n]);
          if (sheetNames.length === 0) throw new Error("Expected a 'Finished Goods' or 'Wrapping Materials' sheet — that's what this report exports as.");

          // Loading Date is exported as dd/mm/yyyy (matching the rest of the app), not
          // normalizeDateStr's assumed formats — parsing "11/08/2026" with the generic
          // Date() parser would read it as 8 November (US mm/dd/yyyy), silently swapping
          // day and month for any day <= 12. Parse dd/mm/yyyy explicitly instead.
          function parseDDMMYYYY(v) {
            if (!v) return "";
            const s = String(v).trim();
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
            return normalizeDateStr(v); // fallback for ISO-style or other formats
          }

          let updatedCount = 0, createdCount = 0, skippedCount = 0;
          const createIssues = []; // { row/sheet context, reason }
          let updatedOrders = [...data.orders];
          const tableSnapshot = [];
          const touchedOrderIds = new Set();
          const newOrderIds = new Set(); // created orders don't need a "prev" snapshot entry - reverting just deletes them

          sheetNames.forEach((sheetName) => {
            const hasSender = true; // Sender now applies to all Domestic categories, including Finished Goods
            const sheetCategory = { "Finished Goods": DOMESTIC_CATEGORIES[0], "Wrapping Materials": DOMESTIC_CATEGORIES[1], "WM Domestic Karachi": DOMESTIC_CATEGORIES[2] }[sheetName];
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "", raw: false });
            rows.forEach((row, rowIdx) => {
              const containerId = xstr(readAnyKey(row, ["Container ID", "container id"])).trim();
              const rowLabel = `${sheetName} row ${rowIdx + 2}`; // +2: header row + 1-indexing

              if (containerId) {
                // Existing shipment - update it. An ID that doesn't match anything is treated
                // as an error, not a new row - a non-blank ID signals intent to update a
                // specific shipment, not to create an unrelated new one.
                const orderIdx = updatedOrders.findIndex((o) => orderContainers(o).some((c) => c.id === containerId));
                if (orderIdx === -1) { skippedCount++; return; }
                const order = updatedOrders[orderIdx];
                const containers = orderContainers(order);
                const cIdx = containers.findIndex((c) => c.id === containerId);
                if (cIdx === -1) { skippedCount++; return; }

                if (!touchedOrderIds.has(order.id)) { touchedOrderIds.add(order.id); tableSnapshot.push({ id: order.id, prev: order }); }

                const newContainers = containers.map((c, i) => {
                  if (i !== cIdx) return c;
                  const loadingDate = parseDDMMYYYY(readAnyKey(row, ["Loading Date"]));
                  return {
                    ...c,
                    poSapNo: xstr(readAnyKey(row, ["PO / SAP No.", "PO/SAP No."])),
                    movementThrough: xstr(readAnyKey(row, ["Movement Through"])),
                    loadingDate,
                    // Fuel Management's report only shows containers with dispatchAt set —
                    // Domestic treats Loading Date as the effective dispatch date (same as
                    // DispatchModal does), so keep dispatchAt in sync with it here too.
                    dispatchAt: loadingDate ? new Date(loadingDate + "T00:00:00").toISOString() : c.dispatchAt,
                    vehiclePlate: xstr(readAnyKey(row, ["Vehicle No."])),
                    vehicleSize: xstr(readAnyKey(row, ["Vehicle Size"])),
                    destination: xstr(readAnyKey(row, ["Destination"])),
                    transporter: xstr(readAnyKey(row, ["Transporter Name"])),
                  };
                });
                const loadingPoint = xstr(readAnyKey(row, ["Loading Point"]));
                updatedOrders[orderIdx] = { ...order, origin: loadingPoint || order.origin, containers: newContainers };
                updatedCount++;
                return;
              }

              // No Container ID - this is a new shipment. A blank Customer, Loading Point, or
              // Destination means there's nothing usable to create from, so those are skipped
              // as empty rows rather than reported as failures.
              const customerName = xstr(readAnyKey(row, ["Customer"])).trim();
              const loadingPoint = xstr(readAnyKey(row, ["Loading Point"])).trim();
              const destination = xstr(readAnyKey(row, ["Destination"])).trim();
              if (!customerName && !loadingPoint && !destination) return;

              const matchedCustomer = (data.customers || []).find((cu) => {
                const full = (cu.name || "").trim().toLowerCase();
                const short = (cu.shortName || "").trim().toLowerCase();
                const target = customerName.toLowerCase();
                return full === target || (short && short === target);
              });
              if (!matchedCustomer) { createIssues.push(`${rowLabel}: customer "${customerName}" not found — row not created.`); return; }
              if (!loadingPoint || !destination) { createIssues.push(`${rowLabel}: missing Loading Point or Destination — row not created.`); return; }

              let senderId = "", senderAddress = "";
              if (hasSender) {
                const senderLabel = xstr(readAnyKey(row, ["Sender"])).trim();
                if (senderLabel) {
                  const candidates = [];
                  (data.senders || []).forEach((sd) => {
                    (Array.isArray(sd.addresses) ? sd.addresses : []).forEach((a) => {
                      if ((a.label || "").trim().toLowerCase() === senderLabel.toLowerCase()) candidates.push({ sender: sd, addr: a });
                    });
                  });
                  if (candidates.length === 1) {
                    senderId = candidates[0].sender.id;
                    senderAddress = candidates[0].addr.address;
                  } else if (candidates.length > 1) {
                    createIssues.push(`${rowLabel}: Sender label "${senderLabel}" matches ${candidates.length} different senders — created, but Sender left blank. Set it manually.`);
                  } else {
                    createIssues.push(`${rowLabel}: Sender label "${senderLabel}" not found on any sender — created, but Sender left blank. Set it manually.`);
                  }
                }
              }

              const newLoadingDate = parseDDMMYYYY(readAnyKey(row, ["Loading Date"]));
              const newContainer = {
                ...emptyContainer(),
                poSapNo: xstr(readAnyKey(row, ["PO / SAP No.", "PO/SAP No."])),
                movementThrough: xstr(readAnyKey(row, ["Movement Through"])),
                loadingDate: newLoadingDate,
                dispatchAt: newLoadingDate ? new Date(newLoadingDate + "T00:00:00").toISOString() : "",
                vehiclePlate: xstr(readAnyKey(row, ["Vehicle No."])),
                vehicleSize: xstr(readAnyKey(row, ["Vehicle Size"])),
                destination,
                transporter: xstr(readAnyKey(row, ["Transporter Name"])),
              };
              const newOrder = {
                id: genUUID(), orderNumber: genOrderNumber(), customerId: matchedCustomer.id,
                shipmentType: "Domestic", domesticCategory: sheetCategory,
                origin: loadingPoint, senderId, senderAddress, eta: "", description: "",
                createdDate: todayISO(), cancelled: false, priority: "Normal",
                containers: [newContainer],
              };
              updatedOrders.push(newOrder);
              newOrderIds.add(newOrder.id);
              createdCount++;
            });
          });

          if (createdCount >= 5 && createdCount > updatedCount) {
            const proceed = window.confirm(
              `This file would create ${createdCount} new order${createdCount === 1 ? "" : "s"} and update only ${updatedCount}. ` +
              `If this file was re-exported from this app, that usually means the hidden "Container ID" column didn't match existing records — ` +
              `often because it got deleted or the file was re-saved by another program that stripped hidden columns. ` +
              `Continuing will create ${createdCount} new orders rather than updating your existing ones, which may result in duplicates.\n\n` +
              `Click OK only if you're sure these are genuinely new shipments. Click Cancel to stop and check the file first.`
            );
            if (!proceed) {
              setTabExcel((prev) => ({
                ...prev,
                [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Attach cancelled — no changes were made." } },
              }));
              return;
            }
          }

          const changedOrders = updatedOrders.filter((o) => touchedOrderIds.has(o.id) || newOrderIds.has(o.id));
          const { error } = changedOrders.length ? await supabaseClient.from("orders").upsert(changedOrders.map(toDbRow)) : { error: null };
          setDataState((prevData) => ({ ...prevData, orders: updatedOrders }));
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: {
              attached: true, filename: file.name,
              snapshot: [...tableSnapshot, ...Array.from(newOrderIds).map((id) => ({ id, prev: null }))],

                      (createIssues.length > 0 ? ` ${createIssues.length} issue${createIssues.length === 1 ? "" : "s"}: ${createIssues.slice(0, 5).join(" ")}${createIssues.length > 5 ? ` (+${createIssues.length - 5} more)` : ""}` : ""),
                  },
            },
          }));
        } catch (err) {
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Couldn't read that file: " + err.message } },
          }));
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }
    if (viewKey === "orders_import") {
      // Same field set as the Import Transportation sheet. Matches an existing shipment by

          // Exported as dd/mm/yyyy (matching the rest of the app) — parse explicitly rather

          function parseDDMMYYYY(v) {

              origin: xstr(readAnyKey(row, ["Loading Point"])) || order.origin,
              shippingLine: xstr(readAnyKey(row, ["Shipping Line"])),
              bondedStatus: xstr(readAnyKey(row, ["Bonded Status"])) || order.bondedStatus,
              containers: newContainers,
            };
            updatedCount++;
          });

          const changedOrders = updatedOrders.filter((o) => touchedOrderIds.has(o.id));
          const { error } = changedOrders.length ? await supabaseClient.from("orders").upsert(changedOrders.map(toDbRow)) : { error: null };
          setDataState((prevData) => ({ ...prevData, orders: updatedOrders }));
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: {
              attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
              message: error
                ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
                : { ok: true, text: `${file.name}: updated ${updatedCount} shipment${updatedCount === 1 ? "" : "s"}.` + (skippedCount > 0 ? ` ${skippedCount} row${skippedCount === 1 ? "" : "s"} had no matching Container ID and were skipped.` : "") },
            },
          }));
        } catch (err) {
          setTabExcel((prev) => ({
            ...prev,
            [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Couldn't read that file: " + err.message } },
          }));
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        // Prefer a sheet named to match (e.g. "Orders"); otherwise just use whatever's first —
        // a single-table tab attach doesn't need to follow the multi-sheet naming convention.
        const wsName = wb.Sheets[cfg.sheetName] ? cfg.sheetName : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) throw new Error("That file doesn't have a readable sheet.");
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
        const coerceFn = COERCE_FUNCTIONS[cfg.coerceKey];
        let coerced = coerceFn(rows, data);
        const skippedCount = rows.length - coerced.length;
        if (cfg.forceFields) coerced = coerced.map((r) => ({ ...r, ...cfg.forceFields }));

        const existingList = data[cfg.table] || [];
        if (viewKey === "fuel_prices") {
          // A fuel price should be unique per effective date — if the file's ID didn't round-trip
          // correctly (e.g. a hidden column got stripped when the file was edited), every row would
          // otherwise get a fresh generated ID and never match its existing record, piling up
          // duplicates on every re-attach instead of updating the one entry for that date.
          const existingByDate = new Map(existingList.map((r) => [r.effectiveDate, r]));
          coerced = coerced.map((row) => {
            const existingHasThisId = existingList.some((r) => r.id === row.id);
            if (existingHasThisId) return row; // ID already correctly matched a real record
            const dateMatch = existingByDate.get(row.effectiveDate);
            return dateMatch ? { ...row, id: dateMatch.id } : row;
          });
          // Also de-duplicate within the file itself — if two rows in the same upload share a
          // date (like the duplicate 02/01/2026 / 01/01/2026 / 31/12/2025 rows reported), keep
          // only the last one for that date rather than writing both.
          const seenDates = new Map();
          coerced.forEach((row) => { if (row.effectiveDate) seenDates.set(row.effectiveDate, row); });
          coerced = Array.from(seenDates.values());
        }

        const existingById = new Map(existingList.map((r) => [r.id, r]));
        const priorMeta = tabExcel[viewKey] || {};
        const priorEntries = priorMeta.snapshot || [];
        const alreadyTracked = new Set(priorEntries.map((en) => en.id));
        const tableSnapshot = [...priorEntries];
        const mergedList = [...existingList];
        let updatedCount = 0, addedCount = 0;

        coerced.forEach((row) => {
          const prev = existingById.get(row.id) || null;
          if (prev) updatedCount++; else addedCount++;
          if (!alreadyTracked.has(row.id)) tableSnapshot.push({ id: row.id, prev });
          const idx = mergedList.findIndex((r) => r.id === row.id);
          if (idx >= 0) mergedList[idx] = row; else mergedList.push(row);
        });

        const { error } = coerced.length ? await supabaseClient.from(cfg.table).upsert(coerced.map(toDbRow)) : { error: null };
        setDataState((prevData) => ({ ...prevData, [cfg.table]: mergedList }));
        setTabExcel((prev) => ({
          ...prev,
          [viewKey]: {
            attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
            message: error
              ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
              : { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"}.${skippedCount > 0 ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"} missing required data (e.g. a date).` : ""}` },
          },
        }));
      } catch (err) {
        setTabExcel((prev) => ({
          ...prev,
          [viewKey]: { ...(prev[viewKey] || {}), busy: false, message: { ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." } },
        }));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleTabRevert(viewKey) {
    const cfg = TAB_EXCEL_CONFIG[viewKey];
    const meta = tabExcel[viewKey];
    if (!cfg || !meta || !meta.snapshot) {
      setTabExcel((prev) => ({ ...prev, [viewKey]: { attached: false, filename: null, snapshot: null } }));
      return;
    }
    setTabExcel((prev) => ({ ...prev, [viewKey]: { ...meta, busy: true } }));
    try {
      const list = [...(data[cfg.table] || [])];
      const writes = [];
      const deletes = [];
      meta.snapshot.forEach(({ id, prev }) => {
        const idx = list.findIndex((r) => r.id === id);
        if (prev) {
          if (idx >= 0) list[idx] = prev; else list.push(prev);
          writes.push(supabaseClient.from(cfg.table).upsert(toDbRow(prev)));
        } else {
          if (idx >= 0) list.splice(idx, 1);
          deletes.push(supabaseClient.from(cfg.table).delete().eq("id", id));
        }
      });
      await Promise.all([...writes, ...deletes]);
      setDataState((prevData) => ({ ...prevData, [cfg.table]: list }));
      setTabExcel((prev) => ({ ...prev, [viewKey]: { attached: false, filename: null, snapshot: null, message: { ok: true, text: "Reverted — back to how this tab was before that file was attached." } } }));
    } catch (err) {
      setTabExcel((prev) => ({ ...prev, [viewKey]: { ...meta, busy: false, message: { ok: false, text: "Couldn't fully revert: " + err.message } } }));
    }
  }

  const DOMESTIC_EXPORT_HEADERS_BASE = ["Container ID", "Sr.", "Customer", "PO / SAP No.", "Movement Through", "Loading Date", "Vehicle No.", "Vehicle Size", "Loading Point", "Destination", "General Component (PKR)", "Fuel Adjustment (PKR)", "Full Freight (PKR)", "Transporter Name", "Invoice Number"];
  const DOMESTIC_EXPORT_HEADERS_WM = ["Container ID", "Sr.", "Customer", "PO / SAP No.", "Movement Through", "Loading Date", "Vehicle No.", "Vehicle Size", "Sender", "Loading Point", "Destination", "General Component (PKR)", "Fuel Adjustment (PKR)", "Full Freight (PKR)", "Transporter Name", "Invoice Number"];

  function buildDomesticExportRow(sr, o, c, includeSender) {
    const cust = getCustomer(data, o.customerId);
    const sender = (data.senders || []).find((s) => s.id === o.senderId) || null;
    const matchedRate = matchContractRateAnyCustomer(o.customerId, o.origin, c, data.contracts, data.contract_groups, c.loadingDate);
    const fuelBaseRate = matchedRate && matchedRate.group ? xnum(matchedRate.group.fuelBaseRate, null) : null;
    const { general: generalAmount, fuelComponent: fuelComponentAmount } = matchedRate ? contractRateComponents(matchedRate) : { general: null, fuelComponent: null };
    const impliedLitres = (fuelComponentAmount !== null && fuelBaseRate) ? fuelComponentAmount / fuelBaseRate : null;
    const price = c.loadingDate ? fuelPriceOnDate(data.fuel_prices, c.loadingDate) : 0;
    const fuelAdjustment = (impliedLitres !== null && price) ? impliedLitres * price : null;
    const fullFreight = (generalAmount !== null && fuelAdjustment !== null) ? generalAmount + fuelAdjustment : null;
    const invoice = (data.invoices || []).find((inv) => inv.containerId === c.id);
    const noMatchNote = !matchedRate ? "No matching contract rate" : !fuelBaseRate ? "Contract has no Fuel Base Rate" : !price ? "No fuel price for loading date" : "";
    return [
      c.id, sr, cust ? (cust.shortName || cust.name) : "", c.poSapNo || "", c.movementThrough || "", c.loadingDate ? fmtDate(c.loadingDate) : "",
      c.vehiclePlate || "", c.vehicleSize || "",
      ...(includeSender ? [senderShortLabel(o, sender)] : []),
      o.origin || "", c.destination || "",
      generalAmount !== null ? generalAmount : noMatchNote,
      fuelAdjustment !== null ? fuelAdjustment : noMatchNote,
      fullFreight !== null ? fullFreight : noMatchNote,
      c.transporter || "", invoice ? invoice.invoiceNumber || "" : "",
    ];

        const url = URL.createObjectURL(blob);

  function handleContractRatesAttach(customerId, contractGroupId, file) {
    const key = contractGroupId || "orphan";
    setContractExcel((prev) => ({ ...prev, [key]: { ...(prev[key] || {}), busy: true, message: null } }));
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        const wsName = wb.Sheets["ContractRates"] ? "ContractRates" : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) throw new Error("That file doesn't have a readable sheet.");
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });
        const rawCoerced = coerceContractRates(rows);
        const skippedCount = rows.length - rawCoerced.length;
        // Always stamped onto every row, never read from the file — see coerceContractRates.
        // Also de-duplicates ids within this same file: if two rows share an id (e.g. someone
        // copy-pasted an existing row in Excel as a starting point for a new one and forgot to
        // clear its ID column), every occurrence after the first gets treated as a genuinely
        // new row instead - two rows with the same id in one upsert() batch make Postgres
        // reject the whole batch outright ("ON CONFLICT DO UPDATE command cannot affect row a
        // second time"), so this has to be caught before it ever reaches the database.
        const seenIds = new Set();
        const coerced = rawCoerced.map((r) => {
          let id = r.id;
          if (seenIds.has(id)) id = genUUID();
          seenIds.add(id);
          return { ...r, id, customerId, contractGroupId: contractGroupId || "" };
        });

        const existingList = data.contracts || [];
        const existingById = new Map(existingList.map((r) => [r.id, r]));
        const priorMeta = contractExcel[key] || {};
        const priorEntries = priorMeta.snapshot || [];
        const alreadyTracked = new Set(priorEntries.map((en) => en.id));
        const tableSnapshot = [...priorEntries];
        const mergedList = [...existingList];
        let updatedCount = 0, addedCount = 0;

        coerced.forEach((row) => {
          const prev = existingById.get(row.id) || null;
          if (prev) updatedCount++; else addedCount++;
          if (!alreadyTracked.has(row.id)) tableSnapshot.push({ id: row.id, prev });
          const idx = mergedList.findIndex((r) => r.id === row.id);
          if (idx >= 0) mergedList[idx] = row; else mergedList.push(row);
        });

        const { error } = coerced.length ? await supabaseClient.from("contracts").upsert(coerced.map(toDbRow)) : { error: null };
        setDataState((prevData) => ({ ...prevData, contracts: mergedList }));
        setContractExcel((prev) => ({
          ...prev,
          [key]: {
            attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
            message: error
              ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
              : { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"}.${skippedCount > 0 ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"} missing required data (Loading Point / Destination).` : ""}` },
          },
        }));
      } catch (err) {
        setContractExcel((prev) => ({
          ...prev,
          [key]: { ...(prev[key] || {}), busy: false, message: { ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." } },
        }));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleContractRatesRevert(contractGroupId) {
    const key = contractGroupId || "orphan";
    const meta = contractExcel[key];
    if (!meta || !meta.snapshot) {

      return;

    setContractExcel((prev) => ({ ...prev, [key]: { ...meta, busy: true } }));
    try {
      const list = [...(data.contracts || [])];
      const writes = [];
      const deletes = [];
      meta.snapshot.forEach(({ id, prev }) => {
        const idx = list.findIndex((r) => r.id === id);
        if (prev) {
          if (idx >= 0) list[idx] = prev; else list.push(prev);
          writes.push(supabaseClient.from("contracts").upsert(toDbRow(prev)));
        } else {
          if (idx >= 0) list.splice(idx, 1);
          deletes.push(supabaseClient.from("contracts").delete().eq("id", id));
        }
      });
      await Promise.all([...writes, ...deletes]);
      setDataState((prevData) => ({ ...prevData, contracts: list }));
      setContractExcel((prev) => ({ ...prev, [key]: { attached: false, filename: null, snapshot: null, message: { ok: true, text: "Reverted — back to how this contract's rates were before that file was attached." } } }));
    } catch (err) {
      setContractExcel((prev) => ({ ...prev, [key]: { ...meta, busy: false, message: { ok: false, text: "Couldn't fully revert: " + err.message } } }));
    }
  }

  const SWAP_EXPORT_HEADERS = ["Swap ID", "Swap Date", "Department", "Swapped By", "Card No.", "Qty (Ltr)", "Amount (PKR)"];
  function buildSwapExportRow(s) {
    return [s.id, s.swapDate ? fmtDate(s.swapDate) : "", s.department || "", s.swappedBy || "", s.cardNumber || "", xnum(s.qtyLtr, ""), xnum(s.amountPkr, "")];
  }

  // Transporter Bills > Statement of Account — download only, no Attach, since this is a
  // read-only summary report (outstanding/paid/balance) rather than editable data meant to be
  // re-imported like the round-trip exports elsewhere.
  const STATEMENT_HEADERS = ["Sr.", "Shipment Type", "Description", "Date", "Transporter Bill No.", "Status", "Total Bill Amount (PKR)", "Paid Amount (PKR)", "Outstanding (PKR)"];
  function handleTransporterStatementExport(transporterName, fromDate, toDate) {
    // Bill-derived rows merged with manually-added "Payment to Transporter" entries, matching
    // the in-app Statement view.
    const flatAll = [];
    (data.orders || []).forEach((o) => {
      orderContainers(o).forEach((c) => {
        if (((c.transporter || "").trim() || "Unassigned") === transporterName) flatAll.push({ o, c });
      });
    });
    const transporterRecord = (data.transporters || []).find((t) => t.name === transporterName);
    const manualPayments = Array.isArray(transporterRecord && transporterRecord.manualPayments) ? transporterRecord.manualPayments : [];
    const billEntries = flatAll
      .filter(({ c }) => c.billReceived)
      .map(({ o, c }) => ({
        type: o.shipmentType || "Import",
        description: [o.jobNumber, c.containerNumber, c.vehiclePlate].filter(Boolean).join(" · ") || "-",
        date: c.transporterBillDate || "", transporterBillNo: c.transporterBillNo || "", status: billStage(c),
        billAmount: containerTotalBillAmount(c), paidAmount: Number(c.billPaidAmount) || 0,
      }));
    const manualEntries = manualPayments.map((p) => ({
      type: "-", description: p.description || "-", date: p.date || "", transporterBillNo: p.referenceNo || "",
      status: "-", billAmount: Number(p.billAmount) || 0, paidAmount: Number(p.paidAmount) || 0,
    }));
    const entries = [...billEntries, ...manualEntries]
      .filter((r) => {
        if (!fromDate && !toDate) return true;
        if (fromDate && r.date && r.date < fromDate) return false;
        if (toDate && r.date && r.date > toDate) return false;
        return true;
      })
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const dataRows = entries.map((r, i) => [
      i + 1, r.type, r.description, r.date ? fmtDate(r.date) : "", r.transporterBillNo,
      r.status, r.billAmount, r.paidAmount, r.billAmount - r.paidAmount,
    ]);
    const rows = [[transporterName || "Transporter"], STATEMENT_HEADERS, ...dataRows];
    const headerWrap = new Set([2, 3, 4, 5, 6, 7, 8, 9]); // every column except Sr.
    const headerOverrides = buildColStyleMap(STATEMENT_HEADERS.length, headerWrap, 5, 6);
    const contentDefault = buildColStyleMap(STATEMENT_HEADERS.length, new Set([3]), 9, 8); // Description wraps
    contentDefault[7] = 22; // Total Bill Amount — bold
    contentDefault[8] = 22; // Paid Amount — bold
    contentDefault[9] = 22; // Outstanding — bold
    const colWidths = colWidthsFor(STATEMENT_HEADERS);
    colWidths[0] = 6.29; // Sr.
    colWidths[3] = 12; colWidths[4] = 12; // Date, Transporter Bill No. — narrower
    colWidths[5] = 20; // Status — wider, "Pending Approval" is the longest label
    colWidths[6] = 13; colWidths[7] = 13; colWidths[8] = 13; // amount columns after Status — narrower
    buildXlsxBuffer([{
      name: "Statement of Account", rows, headerRowIndex: 2, freezeRows: 2,
      colWidths, headerOverrides, contentDefaultCols: contentDefault, titleCell: { row: 1, col: 1 },
      mergeCells: [{ row: 1, startCol: 1, endCol: STATEMENT_HEADERS.length }],
      conditionalCols: { 6: BILL_STATUS_COLOR_RULE }, // Status — same colors as the site's stage badges
    }]).then((buffer) => {
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const rangeSuffix = (fromDate || toDate) ? `-${fromDate || "start"}_to_${toDate || "end"}` : "";
      a.href = url; a.download = `${(transporterName || "Transporter").replace(/\s+/g, "-")}-Statement-of-Account${rangeSuffix}-${todayISO()}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).catch((err) => window.alert("Couldn't build the statement of account: " + err.message));
  }

  function handleSwapExport(customerId, customerName) {
    const rows = (data.fuel_card_swaps || []).filter((s) => s.customerId === customerId);
    const dataRows = rows.map(buildSwapExportRow);
    const sheetRows = [SWAP_EXPORT_HEADERS, ...dataRows];
    const headerNoWrap = new Set([1, 2, 6, 7]); // Swap ID, Swap Date, Qty (Ltr), Amount (PKR)
    const headerWrap = new Set(Array.from({ length: 7 }, (_, i) => i + 1).filter((c) => !headerNoWrap.has(c)));
    const headerOverrides = buildColStyleMap(7, headerWrap, 5, 6);
    const contentDefault = buildColStyleMap(7, new Set([3, 4]), 9, 8); // Department, Swapped By wrap
    contentDefault[7] = 22; // Amount (PKR) — bold
    const colWidths = colWidthsFor(SWAP_EXPORT_HEADERS);
    colWidths[0] = 20; // Swap ID
    buildXlsxBuffer([{
      name: "Fuel Card Swaps", rows: sheetRows, headerRowIndex: 1, colWidths, freezeRows: 1,
      headerOverrides, contentDefaultCols: contentDefault, hiddenCols: [1], // Swap ID — needed for Attach to match rows back correctly, not meant to be seen
    }]).then((buffer) => {
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `${(customerName || "Fuel-Card-Swaps").replace(/\s+/g, "-")}-Swaps-${todayISO()}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).catch((err) => window.alert("Couldn't build the swaps export: " + err.message));
  }

  function handleSwapAttach(customerId, file) {
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: true, message: null } }));
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const arr = new Uint8Array(evt.target.result);
        const wb = XLSX.read(arr, { type: "array" });
        const wsName = wb.Sheets["Fuel Card Swaps"] ? "Fuel Card Swaps" : wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        if (!ws) throw new Error("That file doesn't have a readable sheet.");
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: false });

        const existingList = data.fuel_card_swaps || [];
        const existingById = new Map(existingList.map((r) => [r.id, r]));
        const priorMeta = swapExcel[customerId] || {};
        const priorEntries = priorMeta.snapshot || [];
        const alreadyTracked = new Set(priorEntries.map((en) => en.id));
        const tableSnapshot = [...priorEntries];
        const mergedList = [...existingList];
        let updatedCount = 0, addedCount = 0, skippedCount = 0;
        const toWrite = [];

        rows.forEach((row) => {
          const swapId = xstr(readAnyKey(row, ["Swap ID", "swap id", "id"])).trim();
          const department = xstr(readAnyKey(row, ["Department"])).trim();
          const swappedBy = xstr(readAnyKey(row, ["Swapped By"])).trim();
          const cardNumber = xstr(readAnyKey(row, ["Card No.", "Card No"])).trim();
          const swapDate = normalizeDateStr(readAnyKey(row, ["Swap Date"]));
          const qtyLtr = xnum(readAnyKey(row, ["Qty (Ltr)", "Qty Ltr"]), "");
          const amountPkr = xnum(readAnyKey(row, ["Amount (PKR)", "Amount in PKR"]), "");
          if (!cardNumber && !department && !swapDate) return; // blank row
          if (!swapDate || !cardNumber) { skippedCount++; return; } // required fields missing

          const id = swapId && existingById.has(swapId) ? swapId : genUUID();
          const record = { id, customerId, swapDate, department, swappedBy, cardNumber, qtyLtr, amountPkr };
          const prev = existingById.get(id) || null;
          if (prev) updatedCount++; else addedCount++;
          if (!alreadyTracked.has(id)) tableSnapshot.push({ id, prev });
          const idx = mergedList.findIndex((r) => r.id === id);
          if (idx >= 0) mergedList[idx] = record; else mergedList.push(record);
          toWrite.push(record);
        });

        const { error } = toWrite.length ? await supabaseClient.from("fuel_card_swaps").upsert(toWrite.map(toDbRow)) : { error: null };
        setDataState((prevData) => ({ ...prevData, fuel_card_swaps: mergedList }));
        setSwapExcel((prev) => ({
          ...prev,
          [customerId]: {
            attached: true, filename: file.name, snapshot: tableSnapshot, busy: false,
            message: error
              ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
              : { ok: true, text: `${file.name}: updated ${updatedCount} and added ${addedCount} record${updatedCount + addedCount === 1 ? "" : "s"}.${skippedCount > 0 ? ` Skipped ${skippedCount} row${skippedCount === 1 ? "" : "s"} missing Swap Date or Card No.` : ""}` },
          },
        }));
      } catch (err) {
        setSwapExcel((prev) => ({
          ...prev,
          [customerId]: { ...(prev[customerId] || {}), busy: false, message: { ok: false, text: "Couldn't read that file — make sure it's a valid .xlsx workbook." } },
        }));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function handleSwapRevert(customerId) {
    const meta = swapExcel[customerId];
    if (!meta || !meta.snapshot) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { attached: false, filename: null, snapshot: null } }));
      return;
    }
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...meta, busy: true } }));
    try {
      const list = [...(data.fuel_card_swaps || [])];
      const writes = [];
      const deletes = [];
      meta.snapshot.forEach(({ id, prev }) => {
        const idx = list.findIndex((r) => r.id === id);
        if (prev) {
          if (idx >= 0) list[idx] = prev; else list.push(prev);
          writes.push(supabaseClient.from("fuel_card_swaps").upsert(toDbRow(prev)));
        } else {
          if (idx >= 0) list.splice(idx, 1);
          deletes.push(supabaseClient.from("fuel_card_swaps").delete().eq("id", id));
        }
      });
      await Promise.all([...writes, ...deletes]);
      setDataState((prevData) => ({ ...prevData, fuel_card_swaps: list }));
      setSwapExcel((prev) => ({ ...prev, [customerId]: { attached: false, filename: null, snapshot: null, message: { ok: true, text: "Reverted — back to how the swaps list was before that file was attached." } } }));
    } catch (err) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { ...meta, busy: false, message: { ok: false, text: "Couldn't fully revert: " + err.message } } }));
    }
  }

  // Recomputes every existing swap's Amount (PKR) using the Fuel Price tab's currently
  // selected period mode, without opening and re-saving each one individually. Reuses the
  // same snapshot slot as Attach, so the existing Revert button can undo this too.
  async function handleSwapRecalculate(customerId, fuelPriceMode) {
    setConfirm(null);
    setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: true, message: null } }));
    try {
      const existingList = data.fuel_card_swaps || [];
      const customerSwaps = existingList.filter((s) => s.customerId === customerId);
      const priorMeta = swapExcel[customerId] || {};
      const priorEntries = priorMeta.snapshot || [];
      const alreadyTracked = new Set(priorEntries.map((en) => en.id));
      const tableSnapshot = [...priorEntries];
      let list = [...existingList];
      const toWrite = [];
      let changedCount = 0, unchangedCount = 0;

      customerSwaps.forEach((s) => {
        const newPrice = resolveEffectiveFuelPrice(data.fuel_prices, s.swapDate, fuelPriceMode);
        const newAmount = newPrice && s.qtyLtr !== "" && s.qtyLtr !== null && s.qtyLtr !== undefined ? Number(s.qtyLtr) * newPrice : s.amountPkr;
        if (Math.abs((xnum(newAmount) || 0) - (xnum(s.amountPkr) || 0)) < 0.005) { unchangedCount++; return; }
        if (!alreadyTracked.has(s.id)) tableSnapshot.push({ id: s.id, prev: s });
        const updated = { ...s, amountPkr: newAmount };
        const idx = list.findIndex((r) => r.id === s.id);
        if (idx >= 0) list[idx] = updated;
        toWrite.push(updated);
        changedCount++;
      });

      const { error } = toWrite.length ? await supabaseClient.from("fuel_card_swaps").upsert(toWrite.map(toDbRow)) : { error: null };
      setDataState((prevData) => ({ ...prevData, fuel_card_swaps: list }));
      setSwapExcel((prev) => ({
        ...prev,
        [customerId]: {
          attached: true, filename: prev[customerId] && prev[customerId].filename, snapshot: tableSnapshot, busy: false,
          message: error
            ? { ok: false, text: `Saved locally, but the database update failed: ${error.message}` }
            : { ok: true, text: `Recalculated ${changedCount} entr${changedCount === 1 ? "y" : "ies"}${unchangedCount > 0 ? `, ${unchangedCount} already matched` : ""}. Use Revert to undo.` },
        },
      }));
    } catch (err) {
      setSwapExcel((prev) => ({ ...prev, [customerId]: { ...(prev[customerId] || {}), busy: false, message: { ok: false, text: "Couldn't recalculate: " + err.message } } }));
    }
  }

      const buffer = await buildStyledFullBackupWorkbook(data);
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const name = excelMeta.filename ? excelMeta.filename.replace(/\.xlsx?$/i, "") + "-updated.xlsx" : "logistix-data.xlsx";
      const url = URL.createObjectURL(blob);

      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setExcelBusy(false);
    }

        <Modal title="Export Master Excel File" onClose={() => setShowExportChoice(false)}>
          <p className="text-slate-400 text-sm mb-4">Choose what this export should include.</p>
          <div className="space-y-3">
            <button
              onClick={() => handleExportTemplate("current")}
              className="w-full text-left p-4 rounded-lg border border-slate-800 hover:border-blue-600 hover:bg-slate-800/60 transition-colors"
            >
              <div className="text-white font-medium">Export Current Data</div>
              <div className="text-slate-500 text-sm mt-0.5">Only active/ongoing shipments — anything already Completed is left out.</div>
            </button>
            <button
              onClick={() => handleExportTemplate("all")}
              className="w-full text-left p-4 rounded-lg border border-slate-800 hover:border-blue-600 hover:bg-slate-800/60 transition-colors"
            >
              <div className="text-white font-medium">Export All</div>
              <div className="text-slate-500 text-sm mt-0.5">Every shipment on file, including everything already Completed — useful for a full year-end record.</div>
            </button>
          </div>
        </Modal>
      )}
      {modal && <EntityModal modal={modal} data={data} onClose={() => setModal(null)} onSave={saveItem} role={viewSession.role} />}
      {confirm && (
        <ConfirmModal
          title={confirm.title || (Array.isArray(confirm.id) ? `Delete ${confirm.id.length} ${confirm.label}${confirm.id.length === 1 ? "" : "s"}?` : `Delete this ${confirm.label}?`)}
          message={confirm.message || "This action can't be undone."}
          confirmLabel={confirm.confirmLabel}
          danger={confirm.danger !== undefined ? confirm.danger : true}
          onCancel={() => setConfirm(null)}
          onConfirm={() => confirm.onConfirmAction ? confirm.onConfirmAction() : deleteItem(confirm.entity, confirm.id)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LogistixERP />);
</script>
</body>
</html>
