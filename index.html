let _companyLogoImagePromise = null;
function loadCompanyLogo() {
  if (!_companyLogoImagePromise) {
    _companyLogoImagePromise = new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null); // draw without the logo rather than fail the whole receipt
      img.src = COMPANY_LOGO_DATA_URL;
    });
  }
  return _companyLogoImagePromise;
}

const COMPANY_PROFILE = {
  name: "IBRAYA LOGISTICS (PVT) LTD.",
  tagline: "Forwarding , Transporters & Bonded Carrier Services",
  addressLine1: "Suite # 1011, 10th Floor, Uni Centre",
  addressLine2: "I.I Chundrighar Road, Karachi",
  phone: "Tel: 021-32421628-9  Fax: 021-32466537",
  email: "Email: infoibraya@cyber.net.pk",
};

async function downloadBiltyReceipt(order, data) {
  try {
    const logoImg = await loadCompanyLogo();
    const cust = getCustomer(data, order.customerId);
    const sender = (data.senders || []).find((s) => s.id === order.senderId) || null;
    const isDomestic = (order.shipmentType || "Import") === "Domestic";
    const isExport = order.shipmentType === "Export";
    const containers = (Array.isArray(order.containers) && order.containers.length)
      ? order.containers
      : [{ containerNumber: order.containerNumber || "", sealNumber: order.sealNumber || "", qtyLabel: order.qtyLabel || "" }];
    const container = containers[0] || {};

    const SCALE = 3.5;
    const INK = "#111827", SUB = "#4b5563", LINE = "#111827", BAR = "#111827";

    function box(ctx, x, y, w, h, opts) {
      opts = opts || {};
      if (opts.fill) { ctx.fillStyle = opts.fill; ctx.fillRect(x, y, w, h); }
      ctx.strokeStyle = opts.stroke || LINE;
      ctx.lineWidth = opts.lw || 1;
      ctx.strokeRect(x, y, w, h);
    }
    function line(ctx, x1, y1, x2, y2, opts) {
      opts = opts || {};
      ctx.strokeStyle = opts.stroke || LINE;
      ctx.lineWidth = opts.lw || 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    function txt(ctx, str, x, y, opts) {
      opts = opts || {};
      ctx.fillStyle = opts.color || INK;
      ctx.font = (opts.weight || "normal") + " " + (opts.size || 12) + "px Arial";
      ctx.textAlign = opts.align || "left";
      ctx.fillText(str || "", x, y);
      ctx.textAlign = "left";
    }

    function finish(canvas, W, H) {
      const imgData = canvas.toDataURL("image/jpeg", 0.85);
      if (!window.jspdf || !window.jspdf.jsPDF) {
        window.alert("PDF library didn't load — check your internet connection and try again.");
        return;
      }
      const { jsPDF } = window.jspdf;
      // jsPDF's own built-in "a4" format, in mm - the library guarantees this matches real A4
      // paper (297mm x 210mm landscape), rather than trusting a custom px-based page size
      // against my own DPI assumption, which was overflowing the actual printed page.
      const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4", compress: true });
      const A4_W_MM = 297, A4_H_MM = 210;
      const margin = 6;
      const availW = A4_W_MM - margin * 2, availH = A4_H_MM - margin * 2;
      const PX_TO_MM = 25.4 / 96; // canvas content is authored assuming 96dpi
      const contentWmm = W * PX_TO_MM, contentHmm = H * PX_TO_MM;
      // Scale W and H independently to fill the available space evenly on all sides. Capped at
      // 35% to guard against an extreme, unexpected aspect-ratio mismatch, but otherwise allows
      // enough stretch to actually close the gap - this is text/line/table content, not a
      // photo, so a modest stretch doesn't read as visibly distorted.
      const scaleW = Math.min(availW / contentWmm, 1.35);
      const scaleH = Math.min(availH / contentHmm, 1.35);
      const drawW = contentWmm * scaleW, drawH = contentHmm * scaleH;
      const offsetX = (A4_W_MM - drawW) / 2, offsetY = (A4_H_MM - drawH) / 2;
      pdf.addImage(imgData, "JPEG", offsetX, offsetY, drawW, drawH, undefined, "FAST");
      pdf.save(`Bilty-${order.orderNumber}.pdf`);
    }

    if (isDomestic) {
      // ---- Domestic: its own tailored layout — no Bonded Status, B/L No., Job No.,
      // Shipping Line, Empty Return, or container/seal line items, since none of those
      // apply to a domestic shipment. Shows Domestic Category, PO/SAP No., Movement
      // Through, Loading Date, Vehicle Size, Transporter, and Freight Amount instead.
      const W = 870;
      const fieldRows = ["desc", "poSap", "movement", "loadingDate", "vehicleSize", "transporter", "freight"];
      const pBodyH = 18 + fieldRows.length * 22 + 12;
      const srY = 150;
      const infoY = srY + 82;
      const pY = infoY + 26;
      const remY = pY + 24 + pBodyH + 24;
      const fY = remY + 26;
      const H = fY + 30 + 20;

      const canvas = document.createElement("canvas");
      canvas.width = W * SCALE; canvas.height = H * SCALE;
      const ctx = canvas.getContext("2d");
      ctx.scale(SCALE, SCALE);
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
      box(ctx, 14, 14, W - 28, H - 28, { lw: 1.5 });

      // header: logo + company block
      if (logoImg) ctx.drawImage(logoImg, 30, 20, 56, 48);
      txt(ctx, COMPANY_PROFILE.name, 98, 44, { size: 19, weight: "bold" });
      txt(ctx, COMPANY_PROFILE.tagline, 98, 60, { size: 10, color: SUB });
      txt(ctx, COMPANY_PROFILE.addressLine1, 98, 74, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.addressLine2, 98, 86, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.phone, 98, 100, { size: 9.5, color: SUB });
      txt(ctx, COMPANY_PROFILE.email, 98, 112, { size: 9.5, color: SUB });

      // badges: DOMESTIC + Domestic Category (replaces Bonded Status, which doesn't apply here)
      function badgeStamp(label, x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 128, 22);
        txt(ctx, label, x + 64, y + 15, { size: 11, weight: "bold", color: "#ffffff", align: "center" });
      }
      badgeStamp((order.domesticCategory || "DOMESTIC").toUpperCase(), 430, 30, "#6b7280");
      badgeStamp("DOMESTIC", 430, 58, "#111827");

      // right info box: Bilty No / Loading Date / Vehicle No
      const rbX = 606, rbW = 214;
      box(ctx, rbX, 26, rbW, 112, { lw: 1.2 });
      line(ctx, rbX, 26 + 37, rbX + rbW, 26 + 37);
      line(ctx, rbX, 26 + 74, rbX + rbW, 26 + 74);
      txt(ctx, "BILTY NO.", rbX + 10, 42, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.biltyNumber || order.biltyNumber || "—", rbX + 10, 58, { size: 15, weight: "bold" });
      txt(ctx, "LOADING DATE", rbX + 10, 79, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.loadingDate ? fmtDate(container.loadingDate) : fmtDate(order.createdDate), rbX + 10, 94, { size: 13 });
      txt(ctx, "VEHICLE NO.", rbX + 10, 116, { size: 9.5, weight: "bold", color: SUB });
      txt(ctx, container.vehiclePlate || "Unassigned", rbX + 10, 131, { size: 13, weight: "bold" });

      // sender / receiver
      box(ctx, 32, srY, W - 64, 82, { lw: 1.2 });
      ctx.fillStyle = BAR; ctx.fillRect(32, srY, W - 64, 22);
      line(ctx, 32 + (W - 64) / 2, srY, 32 + (W - 64) / 2, srY + 82);
      txt(ctx, "SENDER'S NAME & ADDRESS", 42, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
      txt(ctx, "RECEIVER'S NAME & ADDRESS", 32 + (W - 64) / 2 + 10, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
      txt(ctx, sender ? sender.name : COMPANY_PROFILE.name, 42, srY + 42, { size: 13, weight: "bold" });
      txt(ctx, order.senderAddress || order.origin || "", 42, srY + 60, { size: 11, color: SUB });
      txt(ctx, cust ? cust.name : "Unknown Customer", 32 + (W - 64) / 2 + 10, srY + 42, { size: 13, weight: "bold" });
      txt(ctx, resolveReceiverAddress(container, cust) || (cust ? cust.location || "" : ""), 32 + (W - 64) / 2 + 10, srY + 60, { size: 11, color: SUB });
      txt(ctx, "Contact# " + (receiverAddressContactNumber(container, cust) || (cust ? cust.phone || "—" : "—")), 32 + (W - 64) / 2 + 10, srY + 75, { size: 11, color: SUB });

      // loading point / destination / movement through / vehicle size
      const infoCols = [32, 244, 456, 656, W - 32];
      box(ctx, 32, infoY, W - 64, 26, { lw: 1.2 });
      for (let i = 1; i < infoCols.length - 1; i++) line(ctx, infoCols[i], infoY, infoCols[i], infoY + 26);
      function labelValue(label, value, x) {
        txt(ctx, label, x, infoY + 17, { size: 10.5, weight: "bold" });
        ctx.font = "bold 10.5px Arial";
        const lw = ctx.measureText(label).width;
        txt(ctx, value, x + lw, infoY + 17, { size: 10.5 });
      }
      labelValue("Loading Point:  ", order.origin || "—", infoCols[0] + 8);
      labelValue("Destination:  ", container.destination || "—", infoCols[1] + 8);
      labelValue("Movement Through:  ", container.movementThrough || "—", infoCols[2] + 8);
      labelValue("Vehicle Size:  ", container.vehicleSize || "—", infoCols[3] + 8);

      // particulars — simple field list, no container/seal line items, no QTY/Amount/Weight grid
      ctx.fillStyle = BAR; ctx.fillRect(32, pY, W - 64, 24);
      txt(ctx, "Particulars", (32 + W - 32) / 2, pY + 16, { size: 10.5, weight: "bold", color: "#ffffff", align: "center" });
      box(ctx, 32, pY, W - 64, 24 + pBodyH, { lw: 1.2 });

      let py = pY + 24 + 18;
      function pRow(label, value) {
        txt(ctx, label, 32 + 8, py, { size: 10, weight: "bold" });
        const lw = ctx.measureText(label).width;
        txt(ctx, value || "—", 32 + 8 + lw + 6, py, { size: 10.5 });
        py += 22;
      }
      pRow("Item Description:", order.description);
      pRow("PO / SAP No.:", container.poSapNo);
      pRow("Movement Through:", container.movementThrough);
      pRow("Loading Date:", container.loadingDate ? fmtDate(container.loadingDate) : "");
      pRow("Vehicle Size:", container.vehicleSize);
      pRow("Transporter:", container.transporter);
      pRow("Freight Amount:", container.freightAmount !== "" && container.freightAmount !== undefined && container.freightAmount !== null ? formatPKR(container.freightAmount) : "");

      // remarks
      txt(ctx, "Remarks:", 32, remY, { size: 10.5, weight: "bold" });
      line(ctx, 32, remY + 10, W - 32, remY + 10);

      // footer
      const fCols = [32, 330, 610, W - 32];
      box(ctx, 32, fY, W - 64, 30, { lw: 1.2 });
      line(ctx, fCols[1], fY, fCols[1], fY + 30);
      line(ctx, fCols[2], fY, fCols[2], fY + 30);
      txt(ctx, "Note: Don't Deliver Goods Without Bilty", fCols[0] + 8, fY + 19, { size: 9.5, weight: "bold", color: "#b91c1c" });
      txt(ctx, "Booking Company: " + (cust ? cust.name.toUpperCase() : "—"), fCols[1] + 8, fY + 19, { size: 10 });
      txt(ctx, "Logistics Manager:", fCols[2] + 8, fY + 19, { size: 10 });

      finish(canvas, W, H);
      return;
    }

    // ---- Import / Export (unchanged) ----
    // ---- compute layout height up-front (depends on how many containers there are AND how
    // many lines the description wraps to) ----
    const W = 870;
    const pColsForMeasure = [32, 410, 488, 578, 668, 753, W - 32];
    // A temporary canvas purely for measuring text width before the real one exists (the real
    // canvas's size depends on pBodyH, which depends on how many lines the description needs -
    // can't create the real canvas until that's known).
    const measureCanvas = document.createElement("canvas");
    const measureCtx = measureCanvas.getContext("2d");
    function wrapToWidth(mctx, text, maxWidth, font) {
      if (!text) return [];
      mctx.font = font;
      const words = text.split(/\s+/).filter(Boolean);
      const lines = [];
      let current = "";
      words.forEach((word) => {
        const candidate = current ? current + " " + word : word;
        if (mctx.measureText(candidate).width <= maxWidth || !current) {
          current = candidate;
        } else {
          lines.push(current);
          current = word;
        }
      });
      if (current) lines.push(current);
      return lines;
    }
    measureCtx.font = "bold 10px Arial";
    const descLabelWidthForWrap = measureCtx.measureText("Item Description:").width;
    const descFirstLineWidth = pColsForMeasure[1] - pColsForMeasure[0] - 8 - descLabelWidthForWrap - 6 - 8;
    // Wrap using the narrower first-line width throughout, for every line — slightly
    // under-uses the space on line 2+ (which don't share the row with the label) but keeps
    // the wrapping simple and guarantees nothing ever overflows the column.
    const descLines = wrapToWidth(measureCtx, order.description, descFirstLineWidth, "normal 10.5px Arial");
    const descExtraLines = Math.max(0, descLines.length - 1);
    const fixedRows = isExport ? 3 : 4; // Item Description, DN/LC/SAP No., Job No. (+ B/L No. for Import/Domestic)
    // Export containers each get one extra line (Empty Pickup Location) below their
    // Container No./Seal No. line, so they need double the per-container height.
    const pBodyH = 18 + fixedRows * 22 + descExtraLines * 16 + containers.length * (isExport ? 62 : 40) + 12;
    const gateBodyH = 150; // Reporting/Gate In/Gate Out section's writable body height
    const srY = 150;
    const infoY = srY + 82;
    const pY = infoY + 26;
    const gY = pY + 24 + pBodyH;
    const remY = gY + 22 + gateBodyH + 24;
    const fY = remY + 26;
    const H = fY + 30 + 20;

    const canvas = document.createElement("canvas");
    canvas.width = W * SCALE; canvas.height = H * SCALE;
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = "alphabetic";

    function stamp(str, cx, cy, opts) {
      opts = opts || {};
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.35);
      ctx.strokeStyle = opts.color || "#9ca3af";
      ctx.fillStyle = opts.color || "#9ca3af";
      ctx.font = "bold " + (opts.size || 13) + "px Arial";
      ctx.textAlign = "center";
      ctx.globalAlpha = 0.85;
      ctx.strokeText(str, 0, 0);
      ctx.restore();
    }

    // ---- data ----
    const bondedStatus = (order.bondedStatus || "Non-Bonded").toUpperCase();
    const shipmentType = (order.shipmentType || "Import").toUpperCase();

    // ---- background & outer border ----
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    box(ctx, 14, 14, W - 28, H - 28, { lw: 1.5 });

    // ---- header: logo + company block ----
    if (logoImg) ctx.drawImage(logoImg, 30, 20, 56, 48);
    txt(ctx, COMPANY_PROFILE.name, 98, 44, { size: 19, weight: "bold" });
    txt(ctx, COMPANY_PROFILE.tagline, 98, 60, { size: 10, color: SUB });
    txt(ctx, COMPANY_PROFILE.addressLine1, 98, 74, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.addressLine2, 98, 86, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.phone, 98, 100, { size: 9.5, color: SUB });
    txt(ctx, COMPANY_PROFILE.email, 98, 112, { size: 9.5, color: SUB });

    // status badges: NON-BONDED / IMPORT (or whatever the order specifies)
    function badgeStamp(label, x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 128, 22);
      txt(ctx, label, x + 64, y + 15, { size: 11, weight: "bold", color: "#ffffff", align: "center" });
    }
    badgeStamp(bondedStatus, 430, 30, "#6b7280");
    badgeStamp(shipmentType, 430, 58, "#111827");

    // right info box: Bilty No / Loading Date / Vehicle No
    const rbX = 658, rbW = 180;
    box(ctx, rbX, 26, rbW, 95, { lw: 1.2 });
    line(ctx, rbX, 26 + 31, rbX + rbW, 26 + 31);
    line(ctx, rbX, 26 + 62, rbX + rbW, 26 + 62);
    txt(ctx, "BILTY NO.", rbX + 8, 40, { size: 8, weight: "bold", color: SUB });
    txt(ctx, container.biltyNumber || order.biltyNumber || "—", rbX + 8, 54, { size: 12.5, weight: "bold" });
    txt(ctx, "LOADING DATE", rbX + 8, 71, { size: 8, weight: "bold", color: SUB });
    txt(ctx, fmtDate(order.createdDate), rbX + 8, 84, { size: 11 });
    txt(ctx, "VEHICLE NO.", rbX + 8, 101, { size: 8, weight: "bold", color: SUB });
    txt(ctx, container.vehiclePlate || "Unassigned", rbX + 8, 114, { size: 11, weight: "bold" });

    // ---- sender / receiver ----
    box(ctx, 32, srY, W - 64, 82, { lw: 1.2 });
    ctx.fillStyle = BAR; ctx.fillRect(32, srY, W - 64, 22);
    line(ctx, 32 + (W - 64) / 2, srY, 32 + (W - 64) / 2, srY + 82);
    txt(ctx, "SENDER'S NAME & ADDRESS", 42, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
    txt(ctx, "RECEIVER'S NAME & ADDRESS", 32 + (W - 64) / 2 + 10, srY + 15, { size: 10.5, weight: "bold", color: "#ffffff" });
    txt(ctx, sender ? sender.name : COMPANY_PROFILE.name, 42, srY + 42, { size: 13, weight: "bold" });
    txt(ctx, order.senderAddress || order.origin || "", 42, srY + 60, { size: 11, color: SUB });
    txt(ctx, cust ? cust.name : "Unknown Customer", 32 + (W - 64) / 2 + 10, srY + 42, { size: 13, weight: "bold" });
    txt(ctx, resolveReceiverAddress(container, cust) || (cust ? cust.location || "" : ""), 32 + (W - 64) / 2 + 10, srY + 60, { size: 11, color: SUB });
    txt(ctx, "Contact# " + (receiverAddressContactNumber(container, cust) || (cust ? cust.phone || "—" : "—")), 32 + (W - 64) / 2 + 10, srY + 75, { size: 11, color: SUB });

    // ---- loading point / destination / shipping line / empty return ----
    const infoCols = [32, 244, 456, 656, W - 32];
    box(ctx, 32, infoY, W - 64, 26, { lw: 1.2 });
    for (let i = 1; i < infoCols.length - 1; i++) line(ctx, infoCols[i], infoY, infoCols[i], infoY + 26);
    function labelValue(label, value, x) {
      txt(ctx, label, x, infoY + 17, { size: 10.5, weight: "bold" });
      ctx.font = "bold 10.5px Arial";
      const lw = ctx.measureText(label).width;
      txt(ctx, value, x + lw, infoY + 17, { size: 10.5 });
    }
    labelValue("Loading Point:  ", order.origin, infoCols[0] + 8);
    labelValue("Destination:  ", container.destination || "—", infoCols[1] + 8);
    labelValue("Shipping Line:  ", order.shippingLine || "—", infoCols[2] + 8);
    labelValue("Empty Return:  ", container.emptyReturnLocation || "—", infoCols[3] + 8);

    // ---- particulars table ----
    const pCols = [32, 410, 488, 578, 668, 753, W - 32];
    const pHead = ["Particulars", "QTY", "Amount", "Weight", "Advance", "Balance"];
    ctx.fillStyle = BAR; ctx.fillRect(32, pY, W - 64, 24);
    for (let i = 0; i < pHead.length; i++) {
      const cx = (pCols[i] + pCols[i + 1]) / 2;
      txt(ctx, pHead[i], cx, pY + 16, { size: 10.5, weight: "bold", color: "#ffffff", align: "center" });
    }
    box(ctx, 32, pY, W - 64, 24 + pBodyH, { lw: 1.2 });
    for (let i = 1; i < pCols.length - 1; i++) line(ctx, pCols[i], pY, pCols[i], pY + 24 + pBodyH);

    // Each row: bold label immediately followed by its value on the SAME line (not stacked).
    let py = pY + 24 + 18;
    function pRow(label, value) {
      txt(ctx, label, pCols[0] + 8, py, { size: 10, weight: "bold" });
      const lw = ctx.measureText(label).width;
      txt(ctx, value || "—", pCols[0] + 8 + lw + 6, py, { size: 10.5 });
      py += 22;
    }
    // Item Description wraps across as many lines as it needs (computed up-front, see
    // descLines above) rather than being cut off — the table's own height already grew to
    // fit this, so every line has room without overlapping the row below it.
    txt(ctx, "Item Description:", pCols[0] + 8, py, { size: 10, weight: "bold" });
    if (descLines.length === 0) {
      txt(ctx, "—", pCols[0] + 8 + descLabelWidthForWrap + 6, py, { size: 10.5 });
      py += 22;
    } else {
      descLines.forEach((lineText, i) => {
        txt(ctx, lineText, pCols[0] + 8 + descLabelWidthForWrap + 6, py, { size: 10.5 });
        py += i === 0 ? 22 : 16;
      });
    }
    pRow("DN / LC / SAP No.:", order.poNumber);
    pRow("Job No.:", order.jobNumber);
    if (!isExport) pRow("B/L No.:", order.blNumber);

    // Container No. and Seal No. on one line per container; Export containers get a second
    // line underneath for their own Empty Pickup Location.
    const qtyRows = [];
    containers.forEach((c) => {
      txt(ctx, "Container No.:", pCols[0] + 8, py, { size: 10, weight: "bold" });
      let lw = ctx.measureText("Container No.:").width;
      let x = pCols[0] + 8 + lw + 6;
      txt(ctx, c.containerNumber || "—", x, py, { size: 10.5 });
      x += ctx.measureText(c.containerNumber || "—").width + 16;
      txt(ctx, "Seal No.:", x, py, { size: 10, weight: "bold" });
      x += ctx.measureText("Seal No.:").width + 6;
      txt(ctx, c.sealNumber || "—", x, py, { size: 10.5 });
      qtyRows.push({ y: py, qty: containerSizeTypeLabel(c) || "01" });
      py += 22;
      if (isExport) {
        txt(ctx, "Empty Pickup Location:", pCols[0] + 8, py, { size: 10, weight: "bold" });
        const lw2 = ctx.measureText("Empty Pickup Location:").width;
        txt(ctx, c.emptyPickupLocation || "—", pCols[0] + 8 + lw2 + 6, py, { size: 10.5 });
        py += 22;
      }
    });
    qtyRows.forEach((q) => txt(ctx, q.qty, (pCols[1] + pCols[2]) / 2, q.y, { size: 11, align: "center" }));

    const midY = pY + 24 + pBodyH / 2;
    // Amount / Advance / Balance: pre-printed "Paid" stamps
    stamp("Paid", (pCols[2] + pCols[3]) / 2, midY, { size: 12 });
    // Weight: show the real figure if entered, otherwise the pre-printed placeholder stamp
    if (container.weight && Number(container.weight) > 0) {
      txt(ctx, Number(container.weight).toLocaleString() + " kg", (pCols[3] + pCols[4]) / 2, midY, { size: 12, align: "center" });
    } else {
      stamp("As Per", (pCols[3] + pCols[4]) / 2, midY - 6, { size: 10 });
      stamp("Document", (pCols[3] + pCols[4]) / 2, midY + 10, { size: 10 });
    }
    stamp("Paid", (pCols[4] + pCols[5]) / 2, midY, { size: 12 });
    stamp("Paid", (pCols[5] + pCols[6]) / 2, midY, { size: 12 });

    // ---- gate timestamps ----
    const gCols = [32, 32 + (W - 64) / 3, 32 + 2 * (W - 64) / 3, W - 32];
    ctx.fillStyle = BAR; ctx.fillRect(32, gY, W - 64, 22);
    for (let i = 1; i < gCols.length - 1; i++) line(ctx, gCols[i], gY, gCols[i], gY + 22 + gateBodyH);
    txt(ctx, "REPORTING DATE & TIME", (gCols[0] + gCols[1]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    txt(ctx, "GATE IN DATE & TIME", (gCols[1] + gCols[2]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    txt(ctx, "GATE OUT DATE & TIME", (gCols[2] + gCols[3]) / 2, gY + 15, { size: 9.5, weight: "bold", color: "#ffffff", align: "center" });
    box(ctx, 32, gY, W - 64, 22 + gateBodyH, { lw: 1.2 });

    // ---- remarks ----
    txt(ctx, "Remarks:", 32, remY, { size: 10.5, weight: "bold" });
    line(ctx, 32, remY + 10, W - 32, remY + 10);

    // ---- footer ----
    const fCols = [32, 330, 610, W - 32];
    box(ctx, 32, fY, W - 64, 30, { lw: 1.2 });
    line(ctx, fCols[1], fY, fCols[1], fY + 30);
    line(ctx, fCols[2], fY, fCols[2], fY + 30);
    txt(ctx, "Note: Don't Deliver Goods Without Bilty", fCols[0] + 8, fY + 19, { size: 9.5, weight: "bold", color: "#b91c1c" });
    txt(ctx, "Booking Company: " + (cust ? cust.name.toUpperCase() : "—"), fCols[1] + 8, fY + 19, { size: 10 });
    txt(ctx, "Logistics Manager:", fCols[2] + 8, fY + 19, { size: 10 });

    finish(canvas, W, H);
  } catch (err) {
    console.error("Bilty receipt error:", err);
    window.alert("Something went wrong generating the bilty receipt: " + err.message);
  }
}

function getWeekData(orders) {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const now = new Date();
  const dayIdx = (now.getDay() + 6) % 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayIdx);
  return days.map((label, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const iso = toLocalDateStr(d);
    const total = orders.filter((o) => o.createdDate === iso).length;
    const delivered = orders.filter((o) => o.deliveredDate === iso).length;
    return { day: label, total, delivered };
  });
}

function getStatusMix(orders) {
  const colors = { Confirmed: "#38bdf8", "Picked Up": "#818cf8", "In Transit": "#3b82f6", Delivered: "#22c55e", Completed: "#a78bfa", Cancelled: "#64748b" };
  const counts = {};
  orders.forEach((o) => { const s = orderAggregateStatus(o); counts[s] = (counts[s] || 0) + 1; });
  return Object.entries(counts).map(([name, value]) => ({ name, value, color: colors[name] || "#64748b" }));
}

function analyticsData(data, rangeDays) {
  const { orders, vehicles, drivers, invoices } = data;
  const cutoff = addDaysISO(todayISO(), -(rangeDays - 1));
  const today = todayISO();
  const inRange = (iso) => iso && iso >= cutoff && iso <= today;

  const ordersInRange = orders.filter((o) => inRange(o.createdDate));

  const allContainers = [];
  orders.forEach((o) => orderContainers(o).forEach((c) => allContainers.push({ ...c, _order: o })));
  const deliveredInRange = allContainers.filter((c) => inRange(c.deliveredDate));

  const activeVehicles = vehicles.filter((v) => v.status === "active").length;
  const paidInvoices = invoices.filter((i) => i.status === "Paid");
  const revenue = paidInvoices.reduce((s, i) => s + i.total, 0);
  const outstanding = invoices.filter((i) => i.status === "Sent" || i.status === "Overdue").reduce((s, i) => s + i.total, 0);

  const onTimeDelivered = deliveredInRange.filter((c) => c._order.eta && c.deliveredDate && c.deliveredDate <= c._order.eta).length;
  const onTimePct = deliveredInRange.length ? Math.round((onTimeDelivered / deliveredInRange.length) * 100) : 0;
  const fleetUtilPct = vehicles.length ? Math.round((activeVehicles / vehicles.length) * 100) : 0;
  const driverList = drivers.filter((d) => d.role === "Driver");
  const onDutyPct = driverList.length ? Math.round((driverList.filter((d) => d.status === "On Duty").length / driverList.length) * 100) : 0;
  const paidRatePct = invoices.length ? Math.round((paidInvoices.length / invoices.length) * 100) : 0;

  const days = [];
  for (let i = rangeDays - 1; i >= 0; i--) days.push(addDaysISO(today, -i));
  const chart = days.map((iso) => ({
    date: iso.slice(5),
    total: orders.filter((o) => o.createdDate === iso).length,
    delivered: allContainers.filter((c) => c.deliveredDate === iso).length,
  }));
  const revenueChart = days.map((iso) => ({
    date: iso.slice(5),
    revenue: invoices.filter((i) => i.status === "Paid" && i.issued === iso).reduce((s, i) => s + i.total, 0),
  }));

  const priorityColors = { Low: "#64748b", Normal: "#38bdf8", Urgent: "#ef4444" };
  const priorityCounts = {};
  allContainers.forEach((c) => { const p = c.priority || "Normal"; priorityCounts[p] = (priorityCounts[p] || 0) + 1; });
  const priorityMix = Object.entries(priorityCounts).map(([name, value]) => ({ name, value, color: priorityColors[name] || "#64748b" }));

  const invoiceStatusColors = { Draft: "#64748b", Sent: "#38bdf8", Paid: "#22c55e", Overdue: "#ef4444" };
  const invStatusCounts = {};
  invoices.forEach((i) => { invStatusCounts[i.status] = (invStatusCounts[i.status] || 0) + 1; });
  const invoiceStatusMix = Object.entries(invStatusCounts).map(([name, value]) => ({ name, value, color: invoiceStatusColors[name] || "#64748b" }));

  const vehiclePalette = ["#3b82f6", "#a855f7", "#22c55e", "#f59e0b", "#ef4444", "#38bdf8"];
  const vehTypeCounts = {};
  vehicles.forEach((v) => { const t = v.type || "Truck"; vehTypeCounts[t] = (vehTypeCounts[t] || 0) + 1; });
  const vehicleTypeMix = Object.entries(vehTypeCounts).map(([name, value], i) => ({ name, value, color: vehiclePalette[i % vehiclePalette.length] }));

  return {
    totalOrders: ordersInRange.length, delivered: deliveredInRange.length, revenue, outstanding,
    activeVehicles, totalVehicles: vehicles.length, fleetUtilPct, onTimePct, onDutyPct, paidRatePct,
    chart, statusMix: getStatusMix(orders),
    revenueChart, priorityMix, invoiceStatusMix, vehicleTypeMix,
  };
}

      <span className={cx("w-9 h-9 rounded-lg flex items-center justify-center shrink-0", iconBg)}>
        <Icon size={16} className="text-white" />
      </span>
      <div>
        <div className="text-slate-500 text-xs">{label}</div>
        <div className="text-white text-lg font-bold">{value}</div>
      </div>
    </div>
  );
}

// A <select> that also lets the user type a value that isn't in the list.
// Picking "+ Custom..." swaps to a text input; "Use list instead" swaps back.
function DropdownWithCustom({ value, onChange, options, selectPlaceholder, customPlaceholder }) {
  const [customMode, setCustomMode] = useState(!!value && !options.includes(value));
  if (customMode) {
    return (
      <div className="flex gap-2">
        <input
          className={inputCls} value={value} autoFocus
          onChange={(e) => onChange(e.target.value)}
          placeholder={customPlaceholder || "Enter custom value"}
        />
        <button type="button" className={cx(btnSecondary, "shrink-0 text-xs px-2.5")} onClick={() => { setCustomMode(false); onChange(""); }}>
          Use list
        </button>
      </div>
    );
  }
  return (
    <select
      className={inputCls} value={value}
      onChange={(e) => {
        if (e.target.value === "__custom__") { setCustomMode(true); onChange(""); return; }
        onChange(e.target.value);
      }}
    >
      <option value="">{selectPlaceholder || "Select..."}</option>
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__custom__">+ Custom...</option>
    </select>
  );
}

// Per-tab Excel attach/export/revert bar — one small toolbar reused across every
// importable tab (Orders x3, Customers, Senders, Transporters, Invoices). Attaching only
// ever touches this tab's own table (and for Orders, only its own shipment type); Export
// downloads just this tab's current data; Revert undoes exactly what that attach changed.
function TabExcelBar({ label, meta, onAttachFile, onExport, onRevert, children }) {
  const fileInputRef = useRef(null);
  const m = meta || {};
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <input
        ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}
        onChange={(e) => {
          const f = e.target.files && e.target.files[0];
          if (f) onAttachFile(f);
          e.target.value = "";
        }}
      />
      {m.attached && (
        <span className="inline-flex items-center gap-1.5 text-xs text-slate-400 bg-slate-900 border border-slate-800 rounded-md px-2 py-1.5">
          <FileSpreadsheet size={12} className="shrink-0" /> {m.filename}
        </span>
      )}
      <button
        disabled={m.busy}
        onClick={() => fileInputRef.current && fileInputRef.current.click()}
        className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition-colors disabled:opacity-50"
      >
        <Upload size={12} /> {m.busy && !m.attached ? "Loading…" : m.attached ? `Attach another ${label} file` : `Attach file to ${label}`}
      </button>
      <button
        disabled={m.busy}
        onClick={onExport}
        className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300 hover:bg-slate-800 transition-colors disabled:opacity-50"
      >
        <Download size={12} /> Export {label}
      </button>
      {m.attached && (
        <button
          disabled={m.busy}
          title="Undo this import — restores this tab's data to how it was before this file was attached"
          onClick={onRevert}
          className="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800 transition-colors disabled:opacity-50"
        >
          {m.busy ? "Reverting…" : "Revert"}
        </button>
      )}
      {children}
      {m.message && <span className={cx("text-xs", m.message.ok ? "text-emerald-400" : "text-red-400")}>{m.message.text}</span>}
    </div>
  );
}

function SearchBox({ value, onChange, placeholder }) {

// A table header with its own up/down sort arrows, replacing a separate sort dropdown.
// `active` is whether this column is the one currently driving the sort; `direction` is
// which way it's currently sorted (only meaningful when active). Clicking either arrow always
// sets this column as the active sort in that direction, regardless of current state.
// className is required (not merged with thCls) so callers needing whitespace-normal aren't
// fighting thCls's hardcoded whitespace-nowrap.
function SortableTh({ label, active, direction, onSort, className }) {
  return (
    <th className={className || thCls}>
      <div className="flex items-center gap-1">
        <span>{label}</span>
        <div className="flex flex-col -my-1">
          <button
            className={cx("leading-none transition-colors", active && direction === "asc" ? "text-blue-400" : "text-slate-600 hover:text-slate-400")}
            onClick={() => onSort("asc")}
            title={`Sort ${label} ascending`}
          ><ChevronUp size={11} /></button>
          <button
            className={cx("leading-none transition-colors", active && direction === "desc" ? "text-blue-400" : "text-slate-600 hover:text-slate-400")}
            onClick={() => onSort("desc")}
            title={`Sort ${label} descending`}
          ><ChevronDown size={11} /></button>
        </div>
      </div>
    </th>
  );
}

function DispatchModal({ containerLabel, initial, transporters, isDomestic, contracts, contractGroups, customerId, loadingPoint, destination, onClose, onConfirm }) {
  const c = initial || {};
  const isEdit = !!initial;
  const [photo, setPhoto] = useState(c.dispatchPhoto || "");
  const [notes, setNotes] = useState(c.dispatchNotes || "");
  const [dispatchedBy, setDispatchedBy] = useState(c.dispatchedBy || "");
  const [dispatchAt, setDispatchAt] = useState(() => (c.dispatchAt ? c.dispatchAt.slice(0, 16) : ""));
  const [transporter, setTransporter] = useState(c.transporter || "");
  const [transporterCustomMode, setTransporterCustomMode] = useState(false);
  const [vehiclePlate, setVehiclePlate] = useState(c.vehiclePlate || "");
  const [freightAmount, setFreightAmount] = useState(c.freightAmount ?? "");
  const [loadingDate, setLoadingDate] = useState(c.loadingDate || "");
  const [emptyReturnLocation, setEmptyReturnLocation] = useState(c.emptyReturnLocation || "");
  const [shifting, setShifting] = useState(c.shifting || "no");
  const [shiftedContainerNo, setShiftedContainerNo] = useState(c.shiftedContainerNo || "");
  const [shiftEmptyReturnDate, setShiftEmptyReturnDate] = useState(c.shiftEmptyReturnDate || "");
  const [busy, setBusy] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [formError, setFormError] = useState(null);

  // Apply Contract Rate: when Yes, Freight Amount is looked up automatically from this
  // customer's contract rates (matching Loading Point, Destination, Movement Through,
  // Vehicle Size, and Vehicle Type — same rate table whether the shipment is Import or
  // Domestic, since a customer's contract isn't split by shipment type) rather than typed
  // in manually. Starts blank (not defaulted to either option) since it's a required choice.
  const [applyContractRate, setApplyContractRate] = useState(c.applyContractRate || "");
  const [movementThrough, setMovementThrough] = useState(c.movementThrough || "");
  const [vehicleSize, setVehicleSize] = useState(c.vehicleSize || c.containerSize || "");
  const [vehicleType, setVehicleType] = useState(c.vehicleType || "");

  const matchedContractRate = useMemo(() => {
    if (applyContractRate !== "yes") return null;
    const norm = (v) => (v || "").trim().toLowerCase();
    const normDestination = norm(destination);
    const shipmentDate = dispatchAt ? dispatchAt.slice(0, 10) : "";
    const match = (contracts || []).find((k) =>
      k.customerId === customerId &&
      norm(k.loadingPoint) === norm(loadingPoint) &&
      norm(k.destination) === normDestination &&
      norm(k.movementThrough) === norm(movementThrough) &&
      norm(k.vehicleSize) === norm(vehicleSize) &&
      norm(k.axleLoadCategory) === norm(vehicleType) &&
      contractRateCoversDate(k, shipmentDate)
    );
    if (!match) return null;
    const groupsById = new Map((contractGroups || []).map((g) => [g.id, g]));
    return { ...match, group: match.contractGroupId ? groupsById.get(match.contractGroupId) : null };
  }, [applyContractRate, contracts, contractGroups, customerId, loadingPoint, destination, movementThrough, vehicleSize, vehicleType, dispatchAt]);

  useEffect(() => {
    if (applyContractRate === "yes" && matchedContractRate) setFreightAmount(matchedContractRate.rate);
  }, [applyContractRate, matchedContractRate]);

  const transporterNames = (transporters || []).map((t) => t.name);
  const isKnownTransporter = !!transporter && transporterNames.includes(transporter);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    setPhotoError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setPhoto(dataUrl);
    } catch (err) {
      setPhotoError("Couldn't read that file — try a different image or PDF.");
    }
    setBusy(false);
  }

  function submit(e) {
    e.preventDefault();
    setFormError(null);
    if (!isDomestic && !photo) { setPhotoError("A loading photo or document is required to confirm dispatch."); return; }
    if (applyContractRate !== "yes" && applyContractRate !== "no") {
      setFormError("Apply Contract Rate is required — select Yes or No.");
      return;
    }
    if (applyContractRate === "yes" && !matchedContractRate) {
      setFormError("Rate not available for this route.");
      return;
    }
    if (!isDomestic && (!transporter.trim() || !vehiclePlate.trim() || freightAmount === "" || !emptyReturnLocation.trim())) {
      setFormError("Transporter, Vehicle No., Freight Amount, and Empty Return Location are all required.");
      return;
    }
    if (isDomestic && (!transporter.trim() || !vehiclePlate.trim() || freightAmount === "")) {
      setFormError("Transporter, Vehicle No., and Freight Amount are all required.");
      return;
    }
    if (!isDomestic && shifting === "yes" && (!shiftedContainerNo.trim() || !shiftEmptyReturnDate)) {
      setFormError("Shifted Container No. and Empty Return Date are required when Shifting is Yes.");
      return;
    }
    onConfirm({
      dispatchPhoto: photo,
      dispatchNotes: notes.trim(),
      dispatchedBy: dispatchedBy.trim(),
      dispatchAt: new Date(dispatchAt).toISOString(),
      transporter: transporter.trim(),
      vehiclePlate: vehiclePlate.trim(),
      freightAmount: Number(freightAmount),
      emptyReturnLocation: emptyReturnLocation.trim(),
      ...(isDomestic ? { loadingDate } : {}),
      shifting,
      shiftedContainerNo: shifting === "yes" ? shiftedContainerNo.trim() : "",
      shiftEmptyReturnDate: shifting === "yes" ? shiftEmptyReturnDate : "",
      applyContractRate, movementThrough: movementThrough.trim(), vehicleSize: vehicleSize.trim(), vehicleType: vehicleType.trim(),
    });
  }

  return (
    <Modal title={`${isEdit ? "Edit Dispatch Details" : "Confirm Dispatch"} — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Actual Dispatch / Pickup Time">
          <input type="datetime-local" className={inputCls} value={dispatchAt} onChange={(e) => setDispatchAt(e.target.value)} required />
        </Field>
        {isDomestic && (
          <Field label="Loading Date (viewable and editable by dispatcher)">
            <input type="date" className={inputCls} value={loadingDate} onChange={(e) => setLoadingDate(e.target.value)} />
          </Field>
        )}
        <div className="grid grid-cols-2 gap-3">
          <Field label="Transporter">
            {!transporterCustomMode ? (
              <select
                className={inputCls}
                value={isKnownTransporter ? transporter : (transporter ? "__custom__" : "")}
                onChange={(e) => {
                  if (e.target.value === "__custom__") { setTransporterCustomMode(true); return; }
                  setTransporter(e.target.value);
                }}
              >
                <option value="">Select transporter</option>
                {transporterNames.map((n) => <option key={n} value={n}>{n}</option>)}
                <option value="__custom__">+ Custom...</option>
              </select>
            ) : (
              <input className={inputCls} value={transporter} onChange={(e) => setTransporter(e.target.value)} placeholder="Custom transporter" autoFocus />
            )}
          </Field>
          <Field label="Vehicle No."><input className={inputCls} value={vehiclePlate} onChange={(e) => setVehiclePlate(e.target.value)} placeholder="Vehicle number" /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Vehicle Size"><input className={inputCls} value={vehicleSize} onChange={(e) => setVehicleSize(e.target.value)} placeholder="e.g. 40'" /></Field>
          <Field label="Vehicle Type">
            <DropdownWithCustom
              value={vehicleType} onChange={setVehicleType} options={AXLE_LOAD_CATEGORIES}
              selectPlaceholder="Select vehicle type" customPlaceholder="e.g. 5x"
            />
          </Field>
        </div>
        <Field label="Movement Through">
          <select className={inputCls} value={movementThrough} onChange={(e) => setMovementThrough(e.target.value)}>
            <option value="">Select</option>
            {MOVEMENT_THROUGH_OPTIONS.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Apply Contract Rate">
          <select className={inputCls} value={applyContractRate} onChange={(e) => setApplyContractRate(e.target.value)} required>
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </Field>
        {applyContractRate === "yes" && !matchedContractRate && (
          <div className="text-red-400 text-xs mb-3 -mt-2">
            <p>Rate not available for this route.</p>
            <p className="text-slate-500 mt-1">Matching against: Loading Point "{loadingPoint || "(blank)"}" · Destination "{destination || "(blank)"}"</p>
          </div>
        )}
        <div className={cx("grid gap-3", isDomestic ? "grid-cols-1" : "grid-cols-2")}>
          <Field label="Freight Amount (PKR)">
            <input
              type="number" min="0" className={inputCls} value={freightAmount}
              onChange={(e) => setFreightAmount(e.target.value)}
              readOnly={applyContractRate === "yes" && !!matchedContractRate}
            />
          </Field>
          {!isDomestic && (
            <Field label="Empty Return Location"><input className={inputCls} value={emptyReturnLocation} onChange={(e) => setEmptyReturnLocation(e.target.value)} /></Field>
          )}
        </div>
        {!isDomestic && (
          <>
            <Field label="Shifting">
              <select className={inputCls} value={shifting} onChange={(e) => setShifting(e.target.value)}>
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </Field>
            {shifting === "yes" && (
              <div className="grid grid-cols-2 gap-3">
                <Field label="Shifted Container No."><input className={inputCls} value={shiftedContainerNo} onChange={(e) => setShiftedContainerNo(e.target.value)} /></Field>
                <Field label="Empty Return Date"><input type="date" className={inputCls} value={shiftEmptyReturnDate} onChange={(e) => setShiftEmptyReturnDate(e.target.value)} /></Field>
              </div>
            )}
            <Field label="Dispatched By (name)">
              <input className={inputCls} value={dispatchedBy} onChange={(e) => setDispatchedBy(e.target.value)} placeholder="Who released/loaded it at origin" />
            </Field>
            <Field label="Loading Photo or Document (required)">
              <input type="file" accept="image/*,application/pdf" onChange={handleFile} className={inputCls} required={!photo} />
              {photoError && <p className="text-red-400 text-xs mt-1">{photoError}</p>}
              {photo && !isPdfDataUrl(photo) && <img src={photo} alt="Dispatch photo" className="mt-2 rounded-lg border border-slate-800 max-h-40 animate-fade-in" />}
              {photo && isPdfDataUrl(photo) && (
                <a href={photo} download="dispatch-document.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2 animate-fade-in">
                  <FileText size={16} /> PDF attached — click to view
                </a>
              )}
            </Field>
          </>
        )}
        <Field label="Notes (seal check, loading discrepancies, etc.)">
          <textarea className={inputCls} rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g. Seal verified and matches manifest, loaded on schedule" />
        </Field>
        {formError && <p className="text-red-400 text-xs mb-2">{formError}</p>}
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" disabled={busy || (!isDomestic && !photo)} className={cx(btnPrimary, (busy || (!isDomestic && !photo)) && "opacity-60 cursor-not-allowed")}>
            {busy ? "Processing…" : isEdit ? "Save Changes" : "Confirm Dispatch"}
          </button>
        </div>
      </form>
    </Modal>
  );
}

function PodModal({ containerLabel, showArrivalReference, existingArrivalDate, onClose, onConfirm }) {
  const [photo, setPhoto] = useState("");
  const [notes, setNotes] = useState("");
  const [receivedBy, setReceivedBy] = useState("");
  const [arrivalAt, setArrivalAt] = useState("");
  const [offloadingAt, setOffloadingAt] = useState("");
  const [busy, setBusy] = useState(false);
  const [photoError, setPhotoError] = useState(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    setPhotoError(null);
    try {
      const dataUrl = await fileToAttachmentDataUrl(file, 900, 0.6);
      setPhoto(dataUrl);
    } catch (err) {
      setPhotoError("Couldn't read that file — try a different image or PDF.");
    }
    setBusy(false);
  }

  function submit(e) {
    e.preventDefault();
    if (!photo) { setPhotoError("A delivery photo or document is required to confirm delivery."); return; }
    onConfirm({
      podPhoto: photo,
      podNotes: notes.trim(),
      podReceivedBy: receivedBy.trim(),
      // Import/Domestic already recorded their arrival date during Under Offloading - keep
      // that value rather than overwriting it with "now".
      ...(showArrivalReference ? {} : { podArrivalAt: new Date(arrivalAt).toISOString() }),
      podOffloadingAt: offloadingAt ? new Date(offloadingAt).toISOString() : "",
    });
  }

  return (
    <Modal title={`Confirm Delivery — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        {showArrivalReference ? (
          <Field label="Actual Arrival Date &amp; Time">
            <div className={cx(inputCls, "bg-slate-900/60 text-slate-300")}>{existingArrivalDate ? fmtDateTime(existingArrivalDate) : "Not recorded"}</div>
          </Field>
        ) : (
          <Field label="Actual Arrival Time">
            <input type="datetime-local" className={inputCls} value={arrivalAt} onChange={(e) => setArrivalAt(e.target.value)} required />
          </Field>
        )}
        <Field label="Offloading Date & Time">
          <input type="datetime-local" className={inputCls} value={offloadingAt} onChange={(e) => setOffloadingAt(e.target.value)} />
        </Field>
        <Field label="Received By (name)">
          <input className={inputCls} value={receivedBy} onChange={(e) => setReceivedBy(e.target.value)} placeholder="Who signed for it at the destination" />
        </Field>
        <Field label="Delivery Photo or Document (required)">
          <input type="file" accept="image/*,application/pdf" onChange={handleFile} className={inputCls} required={!photo} />
          {photoError && <p className="text-red-400 text-xs mt-1">{photoError}</p>}
          {photo && !isPdfDataUrl(photo) && <img src={photo} alt="Proof of delivery" className="mt-2 rounded-lg border border-slate-800 max-h-40 animate-fade-in" />}
          {photo && isPdfDataUrl(photo) && (
            <a href={photo} download="delivery-document.pdf" className="mt-2 flex items-center gap-2 text-blue-400 hover:text-blue-300 text-sm bg-slate-900/60 border border-slate-800 rounded-lg p-2 animate-fade-in">
              <FileText size={16} /> PDF attached — click to view
            </a>
          )}
        </Field>
        <Field label="Notes (damage, shortages, discrepancies, etc.)">
          <textarea className={inputCls} rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="e.g. Minor dent on rear door, otherwise all good" />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>
          <button type="submit" disabled={busy || !photo} className={cx(btnPrimary, (busy || !photo) && "opacity-60 cursor-not-allowed")}>
            {busy ? "Processing…" : "Confirm Delivery"}
          </button>
        </div>
      </form>
    </Modal>
  );
}

// Captures the two things the Empty Return Receiver logs when the rented container's
// box has gone back to the empty yard: the date it happened and any notes. This is what
// advances a container from Delivered (3) to the Import-only Completed (4) stage.
function EmptyReturnModal({ containerLabel, defaultLocation, onClose, onConfirm }) {
  const [emptyReturnDate, setEmptyReturnDate] = useState("");
  const [emptyReturnDescription, setEmptyReturnDescription] = useState("");

  function submit(e) {
    e.preventDefault();
    if (!emptyReturnDate) return;
    onConfirm({ emptyReturnDate, emptyReturnDescription: emptyReturnDescription.trim() });
  }

  return (
    <Modal title={`Confirm Empty Return — ${containerLabel}`} onClose={onClose}>
      <form onSubmit={submit}>
        {defaultLocation && (
          <p className="text-slate-500 text-xs mb-3">Return location on file: <span className="text-slate-300">{defaultLocation}</span></p>
        )}
        <Field label="Empty Return Date">
          <input type="date" className={inputCls} value={emptyReturnDate} onChange={(e) => setEmptyReturnDate(e.target.value)} required />
        </Field>
        <Field label="Description (condition, gate, receipt no., etc.)">
          <textarea className={inputCls} rows={3} value={emptyReturnDescription} onChange={(e) => setEmptyReturnDescription(e.target.value)} placeholder="Notes about the empty return" />
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className={btnSecondary}>Cancel</button>

}

function Gauge({ pct, color, label }) {
  const r = 42, c = 2 * Math.PI * r;
  const dash = c * (Math.min(100, Math.max(0, pct)) / 100);
  return (
    <div className="flex flex-col items-center">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r={r} fill="none" stroke="#1e293b" strokeWidth="10" />
        <circle
          cx="55" cy="55" r={r} fill="none" stroke={color} strokeWidth="10"
          strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform="rotate(-90 55 55)"
        />
        <text x="55" y="61" textAnchor="middle" fontSize="19" fontWeight="700" fill="#ffffff">{Math.round(pct)}%</text>
      </svg>
      <div className="text-xs text-slate-400 mt-2 text-center">{label}</div>
    </div>
  );
}

function TrackingProgress({ stageIndex, cancelled, stages }) {
  const list = stages || STAGES;
  return (
    <div className="flex items-center">
      {list.map((s, i) => (
        <React.Fragment key={s}>
          <div
            title={s}
            className={cx(
              "w-6 h-6 shrink-0 rounded-full flex items-center justify-center text-xs font-semibold",
              cancelled ? "bg-slate-800 text-slate-600"
                : i < stageIndex ? "bg-blue-600 text-white"
                : i === stageIndex ? "bg-blue-600 text-white animate-pulse-ring"
                : "bg-slate-800 text-slate-600"
            )}
          >
            {i < stageIndex ? "✓" : i + 1}
          </div>
          {i < list.length - 1 && (
            <div className={cx("flex-1 h-0.5", !cancelled && i < stageIndex ? "animate-progress-shimmer" : "bg-slate-800")} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function OrdersView({ data, openModal, askDelete, shipmentType, role, isColVisible, domesticCategory: domesticCategoryProp, setDomesticCategory: setDomesticCategoryProp }) {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("All Status");
  // Import/Export don't pass these props at all (they have no Domestic category concept),
  // so this falls back to a local, unused state pair for them - only the Domestic instance's
  // props actually matter, and those are lifted to the root so the Export/Attach bar
  // (rendered outside this component) can see which category is currently open.
  const [localDomesticCategory, setLocalDomesticCategory] = useState(null);
  const domesticCategory = domesticCategoryProp !== undefined ? domesticCategoryProp : localDomesticCategory;
  const setDomesticCategory = setDomesticCategoryProp || setLocalDomesticCategory;
  const typeLabel = { Domestic: "Domestic", Import: "Import", Export: "Export" }[shipmentType] || "";
  const isDomestic = shipmentType === "Domestic";
  // Import and (once a category is picked) Domestic both get the full status block row —
  // dispatcher/admin only. Export never reaches beyond Delivered so it doesn't get one.
  const showStatusBlocks = (shipmentType === "Import" && (role === "admin" || role === "dispatcher_import"))
    || (isDomestic && !!domesticCategory && (role === "admin" || role === "dispatcher_domestic"));

  // Domestic Orders opens on a category picker (tiles, like the Customers page) rather
  // than straight into a table — pick Finished Goods or Wrapping Materials to go further.
  if (isDomestic && !domesticCategory) {
    const counts = {};
    DOMESTIC_CATEGORIES.forEach((cat) => {
      counts[cat] = data.orders.filter((o) => (o.shipmentType || "Import") === "Domestic" && (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === cat).length;
    });
    const tileIcons = { [DOMESTIC_CATEGORIES[0]]: { icon: Package, bg: "bg-blue-600" }, [DOMESTIC_CATEGORIES[1]]: { icon: Package, bg: "bg-purple-600" }, [DOMESTIC_CATEGORIES[2]]: { icon: Package, bg: "bg-teal-600" } };
    return (
      <div className="space-y-5">
        <div>
          <h2 className="text-2xl font-bold text-white">Domestic Orders</h2>
          <p className="text-slate-500 text-sm mt-1">Choose a category to view its orders</p>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {DOMESTIC_CATEGORIES.map((cat) => {
            const { icon: Icon, bg } = tileIcons[cat];
            const count = counts[cat];
            return (
              <div key={cat} className={cx(cardCls, "p-6 cursor-pointer")} onClick={() => setDomesticCategory(cat)}>
                <div className={cx("w-12 h-12 rounded-lg flex items-center justify-center mb-3", bg)}><Icon size={22} className="text-white" /></div>
                <div className="text-white font-semibold text-lg mb-1">{cat}</div>
                <div className="text-slate-500 text-sm">{count} order{count === 1 ? "" : "s"}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // Flatten to one row per container so Job No / Container No / Vehicle No
  // can be real table columns, and orders with multiple containers just get
  // multiple rows instead of being crammed into one cell.
  // For Data Entry specifically, anything settled for 2+ days has "settled" and moves
  // to Order History (admin-only) instead of lingering in their day-to-day orders table.
  const flat = [];
  data.orders.filter((o) => (o.shipmentType || "Import") === shipmentType).filter((o) => !isDomestic || (o.domesticCategory || DOMESTIC_CATEGORIES[0]) === domesticCategory).forEach((o) => {
    const containers = orderContainers(o);
    if (containers.length === 0) {
      flat.push({ order: o, container: null });
    } else {
      containers.forEach((c) => {
        if (role === "data_entry" && isSettledOut(c)) return;
        flat.push({ order: o, container: c });
      });
    }
  });

  const statusOf = ({ order: o, container: c }) => (c ? containerStatus(c, shipmentType) : orderAggregateStatus(o));
  const confirmedCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Confirmed").length : 0;
  const pickedUpCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Picked Up").length : 0;
  const inTransitCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "In Transit").length : 0;
  const underOffloadingCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Under Offloading").length : 0;
  const deliveredCount = showStatusBlocks ? flat.filter((r) => statusOf(r) === "Delivered").length : 0;
  const completedCount = showStatusBlocks && !isDomestic ? flat.filter((r) => statusOf(r) === "Completed").length : 0;

  const rows = flat.filter(({ order: o, container: c }) => {
    const cust = getCustomer(data, o.customerId);
    const text = `${o.orderNumber} ${cust ? cust.name : ""} ${cust ? cust.shortName || "" : ""} ${o.origin} ${o.jobNumber || ""} ${o.poNumber || ""} ${c ? c.containerNumber || "" : ""} ${o.blNumber || ""}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    const st = c ? containerStatus(c, shipmentType) : orderAggregateStatus(o);
    const matchesStatus = status === "All Status" || st === status;
    return matchesQ && matchesStatus;
  });

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          {isDomestic && (
            <button onClick={() => setDomesticCategory(null)} className="text-slate-400 hover:text-white text-sm inline-flex items-center gap-1 mb-2"><ArrowLeft size={14} /> Back to categories</button>
          )}
          <h2 className="text-2xl font-bold text-white">{isDomestic ? domesticCategory : `${typeLabel} Orders`}</h2>
          <p className="text-slate-500 text-sm mt-1">Manage your {typeLabel.toLowerCase()} shipment orders</p>
        </div>
        <button className={btnPrimary} onClick={() => openModal({ type: "order", mode: "add", item: null, presetShipmentType: shipmentType })}>
          <Plus size={16} /> New {typeLabel} Order
        </button>
      </div>

      {showStatusBlocks && (
        <div className={cx("grid grid-cols-2 gap-4", isDomestic ? "lg:grid-cols-5" : "lg:grid-cols-6")}>
          <MiniStat
            label="Confirmed" value={confirmedCount} color="text-blue-400"
            onClick={() => setStatus(status === "Confirmed" ? "All Status" : "Confirmed")}
            active={status === "Confirmed"}
          />
          <MiniStat
            label="Picked Up" value={pickedUpCount} color="text-indigo-400"
            onClick={() => setStatus(status === "Picked Up" ? "All Status" : "Picked Up")}
            active={status === "Picked Up"}
          />
          <MiniStat
            label="In Transit" value={inTransitCount} color="text-blue-400"
            onClick={() => setStatus(status === "In Transit" ? "All Status" : "In Transit")}
            active={status === "In Transit"}
          />
          <MiniStat
            label="Under Offloading" value={underOffloadingCount} color="text-amber-400"
            onClick={() => setStatus(status === "Under Offloading" ? "All Status" : "Under Offloading")}
            active={status === "Under Offloading"}
          />
          <MiniStat
            label="Delivered" value={deliveredCount} color="text-emerald-400"
            onClick={() => setStatus(status === "Delivered" ? "All Status" : "Delivered")}
            active={status === "Delivered"}
          />
          {!isDomestic && (
            <MiniStat
              label="Completed" value={completedCount} color="text-violet-400"
              onClick={() => setStatus(status === "Completed" ? "All Status" : "Completed")}
              active={status === "Completed"}
            />
          )}
        </div>
      )}

      <div className="flex gap-3 flex-wrap">
        <SearchBox value={q} onChange={setQ} placeholder="Search orders, customers, containers..." />
        <select className={inputCls} style={{ width: 170 }} value={status} onChange={(e) => setStatus(e.target.value)}>
          {(isDomestic
            ? ["All Status", "Confirmed", "Picked Up", "In Transit", "Under Offloading", "Delivered", "Cancelled"]
            : showStatusBlocks
            ? ["All Status", "Confirmed", "Picked Up", "In Transit", "Under Offloading", "Delivered", "Completed", "Cancelled"]
            : ["All Status", "Confirmed", "Picked Up", "In Transit", "Delivered", "Cancelled"]
          ).map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      {rows.length === 0 ? (
        <EmptyState
          icon={Package}
          text={`No ${typeLabel.toLowerCase()} orders found.`}
          actionLabel={flat.length === 0 ? `Create your first ${typeLabel.toLowerCase()} order` : null}
          onAction={() => openModal({ type: "order", mode: "add", item: null, presetShipmentType: shipmentType })}
        />
      ) : (
        <div className={tableWrap}>
          <table className="w-full text-sm">
            <thead className={theadCls}>
              <tr>
                {isDomestic ? (
                  <>
                    {isColVisible("ordersDomestic", "customer") && <th className={thCls}>Customer</th>}
                    {isColVisible("ordersDomestic", "poSap") && <th className={thCls}>PO / SAP No.</th>}
                    {isColVisible("ordersDomestic", "movementThrough") && <th className={thCls}>Movement Through</th>}
                    {isColVisible("ordersDomestic", "loadingDate") && <th className={thCls}>Loading Date</th>}
                    {isColVisible("ordersDomestic", "vehicleNo") && <th className={thCls}>Vehicle No.</th>}
                    {isColVisible("ordersDomestic", "vehicleSize") && <th className={thCls}>Vehicle Size</th>}
                    {isColVisible("ordersDomestic", "sender") && (domesticCategory === DOMESTIC_CATEGORIES[1] || domesticCategory === DOMESTIC_CATEGORIES[2]) && <th className={thCls}>Sender</th>}
                    {isColVisible("ordersDomestic", "loadingPoint") && <th className={thCls}>Loading Point</th>}
                    {isColVisible("ordersDomestic", "destination") && <th className={thCls}>Destination</th>}
                    {isColVisible("ordersDomestic", "transporterName") && <th className={thCls}>Transporter Name</th>}
                    {isColVisible("ordersDomestic", "status") && <th className={thCls}>Status</th>}
                    <th className={thCls}></th>
                  </>
                ) : (
                  <>
                    {isColVisible("ordersImportExport", "jobNo") && <th className={thCls}>Job No.</th>}
                    {isColVisible("ordersImportExport", "customer") && <th className={thCls}>Customer</th>}
                    {isColVisible("ordersImportExport", "destination") && <th className={thCls}>Destination</th>}
                    {isColVisible("ordersImportExport", "description") && <th className={thCls}>Description</th>}
                    {isColVisible("ordersImportExport", "containerNo") && <th className={thCls}>Container No.</th>}
                    {isColVisible("ordersImportExport", "vehicleNo") && <th className={thCls}>Vehicle No.</th>}
                    {isColVisible("ordersImportExport", "status") && <th className={thCls}>Status</th>}
                    {isColVisible("ordersImportExport", "emptyStatus") && shipmentType === "Import" && <th className={thCls}>Empty Status</th>}
                    <th className={thCls}></th>
                  </>
                )}
              </tr>
            </thead>
            <tbody>
              {rows.map(({ order: o, container: c }, idx) => {
                const cust = getCustomer(data, o.customerId);
                const st = c ? containerStatus(c, shipmentType) : orderAggregateStatus(o);
                const emptyStatus = c ? emptyStatusOf(c) : "—";
                const sender = isDomestic ? (data.senders || []).find((s) => s.id === o.senderId) || null : null;
                return (
                  <tr key={c ? c.id : o.id + "-" + idx} className={trCls}>
                    {isDomestic ? (
                      <>
                        {isColVisible("ordersDomestic", "customer") && <td className={cx(tdCls, "text-white font-medium")}>{cust ? (cust.shortName || cust.name) : "Unknown"}</td>}
                        {isColVisible("ordersDomestic", "poSap") && <td className={cx(tdCls, "font-mono text-slate-200")}>{c ? (c.poSapNo || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "movementThrough") && <td className={tdCls}>{c ? (c.movementThrough || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "loadingDate") && <td className={tdCls}>{c && c.loadingDate ? fmtDate(c.loadingDate) : "—"}</td>}
                        {isColVisible("ordersDomestic", "vehicleNo") && <td className={tdCls}>{c ? (c.vehiclePlate || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "vehicleSize") && <td className={tdCls}>{c ? (c.vehicleSize || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "sender") && (domesticCategory === DOMESTIC_CATEGORIES[1] || domesticCategory === DOMESTIC_CATEGORIES[2]) && <td className={tdCls}>{senderShortLabel(o, sender) || "—"}</td>}
                        {isColVisible("ordersDomestic", "loadingPoint") && <td className={tdCls}>{o.origin || "—"}</td>}
                        {isColVisible("ordersDomestic", "destination") && <td className={tdCls}>{c ? (c.destination || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "transporterName") && <td className={tdCls}>{c ? (c.transporter || "—") : "—"}</td>}
                        {isColVisible("ordersDomestic", "status") && <td className={tdCls}><Badge text={st} className={orderStatusColor[st]} /></td>}
                      </>
                    ) : (
                      <>
                        {isColVisible("ordersImportExport", "jobNo") && <td className={cx(tdCls, "font-mono text-slate-200")}>{o.jobNumber || "—"}</td>}
                        {isColVisible("ordersImportExport", "customer") && <td className={cx(tdCls, "text-white font-medium")}>{cust ? (cust.shortName || cust.name) : "Unknown"}</td>}
                        {isColVisible("ordersImportExport", "destination") && <td className={tdCls}>{c ? (c.destination || "—") : "—"}</td>}
                        {isColVisible("ordersImportExport", "description") && <td className={tdCls} style={{ whiteSpace: "normal", maxWidth: 220 }}>{o.description || "—"}</td>}
                        {isColVisible("ordersImportExport", "containerNo") && <td className={cx(tdCls, "font-mono")}>{c ? (c.containerNumber || "—") : "—"}</td>}
                        {isColVisible("ordersImportExport", "vehicleNo") && <td className={tdCls}>{c ? (c.vehiclePlate || "—") : "—"}</td>}
                        {isColVisible("ordersImportExport", "status") && <td className={tdCls}><Badge text={st} className={orderStatusColor[st]} /></td>}
                        {isColVisible("ordersImportExport", "emptyStatus") && shipmentType === "Import" && (
                          <td className={tdCls}>{emptyStatus === "—" ? "—" : <Badge text={emptyStatus} className={emptyStatusColor[emptyStatus]} />}</td>
                        )}
                      </>
                    )}
                    <td className={tdCls}>
                      <div className="flex items-center gap-1 justify-end">
                        <button className={iconBtn} title="View" onClick={() => openModal({ type: "order", mode: "view", item: o })}><Eye size={15} /></button>
                        <button className={iconBtn} title="Edit" onClick={() => openModal({ type: "order", mode: "edit", item: o })}><Pencil size={15} /></button>
                        <button className={iconBtnDanger} title="Delete" onClick={() => askDelete({ entity: "orders", id: o.id, label: "order" })}><Trash2 size={15} /></button>
                        {c && <button className={iconBtn} title="Download Bilty" onClick={() => downloadBiltyReceipt({ ...o, containers: [c] }, data)}><Receipt size={15} /></button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}
