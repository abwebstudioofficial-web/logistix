function createLiteClient(url, anonKey) {
  const AUTH = url + "/auth/v1";
  const REST = url + "/rest/v1";
  const STORE_KEY = "sb-lite-session";
  let session = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) session = JSON.parse(raw); } catch (e) {}
  let listeners = [];

  function persistSession(s) {
    session = s;
    try { if (s) localStorage.setItem(STORE_KEY, JSON.stringify(s)); else localStorage.removeItem(STORE_KEY); } catch (e) {}
    listeners.forEach((fn) => fn(s ? "SIGNED_IN" : "SIGNED_OUT", s));
  }

  async function authFetch(path, opts) {
    opts = opts || {};
    const res = await fetch(AUTH + path, { ...opts, headers: { "Content-Type": "application/json", apikey: anonKey, ...(opts.headers || {}) } });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) return { data: null, error: { message: json.error_description || json.msg || json.error || res.statusText } };
    return { data: json, error: null };
  }

  async function refreshIfNeeded() {
    if (!session) return;
    if (session.expires_at && Date.now() / 1000 < session.expires_at - 30) return;
    if (!session.refresh_token) { persistSession(null); return; }
    const { data, error } = await authFetch("/token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (error) { persistSession(null); return; }
    persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
  }

  const auth = {
    async getSession() { await refreshIfNeeded(); return { data: { session } }; },
    onAuthStateChange(cb) {
      listeners.push(cb);
      return { data: { subscription: { unsubscribe() { listeners = listeners.filter((f) => f !== cb); } } } };
    },
    async signInWithPassword({ email, password }) {
      const { data, error } = await authFetch("/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) });
      if (error) return { error };
      persistSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: Date.now() / 1000 + (data.expires_in || 3600) });
      return { error: null };
    },
    async signOut() { persistSession(null); return { error: null }; },
  };

  async function headersFor(extra) {
    await refreshIfNeeded();
    const h = { apikey: anonKey, "Content-Type": "application/json", Authorization: "Bearer " + (session && session.access_token ? session.access_token : anonKey), ...(extra || {}) };
    return h;
  }

  function from(table) {
    return {
      select(cols) {
        let query = `${REST}/${table}?select=${encodeURIComponent(cols || "*")}`;
        const builder = {
          eq(col, val) { query += `&${col}=eq.${encodeURIComponent(val)}`; return builder; },
          order(col, opts) { query += `&order=${col}.${opts && opts.ascending === false ? "desc" : "asc"}`; return builder; },
          async maybeSingle() {
            const res = await fetch(query, { headers: await headersFor() });
            const json = await res.json().catch(() => []);
            if (!res.ok) return { data: null, error: { message: (json && json.message) || res.statusText } };
            return { data: Array.isArray(json) ? (json[0] || null) : json, error: null };
          },
          then(resolve, reject) {
            return headersFor()
              .then((headers) => fetch(query, { headers }))
              .then(async (res) => {
                const json = await res.json().catch(() => []);
                if (!res.ok) return resolve({ data: null, error: { message: (json && json.message) || res.statusText } });
                resolve({ data: json, error: null });
              })
              .catch(reject);
          },
        };
        return builder;
      },
      async upsert(rows) {
        const body = Array.isArray(rows) ? rows : [rows];
        const res = await fetch(`${REST}/${table}`, { method: "POST", headers: await headersFor({ Prefer: "resolution=merge-duplicates,return=minimal" }), body: JSON.stringify(body) });
        if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
        return { error: null };
      },
      update(fields) {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "PATCH", headers: await headersFor({ Prefer: "return=minimal" }), body: JSON.stringify(fields) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
      delete() {
        return {
          async eq(col, val) {
            const res = await fetch(`${REST}/${table}?${col}=eq.${encodeURIComponent(val)}`, { method: "DELETE", headers: await headersFor({ Prefer: "return=minimal" }) });
            if (!res.ok) { const json = await res.json().catch(() => ({})); return { error: { message: json.message || res.statusText } }; }
            return { error: null };
          },
        };
      },
    };
  }

  return { auth, from };
}

function camelToSnake(s) { return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase()); }
function snakeToCamel(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function toDbRow(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => { const v = obj[k]; out[camelToSnake(k)] = v === "" ? null : v; });
  return out;
}
function fromDbRow(row) {
  const out = {};
  Object.keys(row).forEach((k) => { const v = row[k]; out[snakeToCamel(k)] = v === null ? "" : v; });
  return out;
}
function uid(prefix) { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function cx(...args) { return args.filter(Boolean).join(" "); }
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

                  <div className="flex items-center gap-1.5 text-slate-400 text-sm mb-3"><Phone size={13} />{d.phone || "—"}</div>
                  <div className="flex items-center gap-2">
                    <select className={inputCls} value={d.status} onChange={(e) => updateDriverStatus(d.id, e.target.value)}>
                      {DRIVER_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                    <button className={cx(btnSecondary, "shrink-0")} onClick={() => openModal({ type: "driver", mode: "edit", item: d })}><Pencil size={14} /> Edit</button>
                  </div>
                </>
              ) : (
                <div className="flex justify-end">
                  <button className={btnSecondary} onClick={() => openModal({ type: "driver", mode: "edit", item: d })}><Pencil size={14} /> View / Edit</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DriverForm({ initial, onSave, onCancel }) {
  const isEdit = !!initial;
  const d = initial || {};
  const [name, setName] = useState(d.name || "");
  const [email, setEmail] = useState(d.email || "");
  const [role, setRole] = useState(d.role || "Driver");
  const [phone, setPhone] = useState(d.phone || "");
  const [status, setStatus] = useState(d.status || "Available");

  function submit(e) {
    e.preventDefault();
    if (!name.trim() || !email.trim()) return;
    onSave({ id: d.id || uid("drv"), name: name.trim(), email: email.trim(), role, phone: role === "Driver" ? phone.trim() : "", status: role === "Driver" ? status : "" });
  }

  return (
    <form onSubmit={submit}>
      <Field label="Full Name"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Gul Bahar" /></Field>
      <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@example.com" /></Field>
      <Field label="Role">
        <select className={inputCls} value={role} onChange={(e) => setRole(e.target.value)}>
          <option value="Dispatcher">Dispatcher</option>
          <option value="Driver">Driver</option>
        </select>
      </Field>
      {role === "Driver" && (
        <div className="grid grid-cols-2 gap-3">
          <Field label="Phone"><input className={inputCls} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+92..." /></Field>
          <Field label="Status">
            <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
              {DRIVER_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
        </div>
      )}
      <div className="flex justify-end gap-2 mt-2">
        <button type="button" className={btnSecondary} onClick={onCancel}>Cancel</button>
        <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Add Team Member"}</button>
      </div>
    </form>
  );
}

/* ==================== Fleet / Vehicles ==================== */
function FleetView({ data, openModal, askDelete }) {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("All Statuses");
  const active = data.vehicles.filter((v) => v.status === "active").length;
  const maintenance = data.vehicles.filter((v) => v.status === "maintenance").length;
  const idle = data.vehicles.filter((v) => v.status === "idle").length;
  const driverById = new Map(data.drivers.map((d) => [d.id, d]));

  const rows = data.vehicles.filter((v) => {
    const text = `${v.plate} ${v.make} ${v.model} ${v.type}`.toLowerCase();
    const matchesQ = !q || text.includes(q.toLowerCase());
    const matchesStatus = status === "All Statuses" || v.status === status;
    return matchesQ && matchesStatus;
  });

  const statusColor = { active: "bg-emerald-950 text-emerald-400 border-emerald-800", maintenance: "bg-amber-950 text-amber-400 border-amber-800", idle: "bg-slate-800 text-slate-400 border-slate-700" };
  const statusIcon = { active: CheckCircle2, maintenance: Wrench, idle: AlertTriangle };

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-2xl font-bold text-white">Fleet</h2>
          <p className="text-slate-500 text-sm mt-1">Manage vehicles, assignments, and service status</p>
        </div>
        <button className={btnPrimary} onClick={() => openModal({ type: "vehicle", mode: "add", item: null })}><Plus size={16} /> Add Vehicle</button>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <MiniStat label="Active" value={active} color="text-emerald-400" />
        <MiniStat label="In Maintenance" value={maintenance} color="text-amber-400" />
        <MiniStat label="Idle" value={idle} color="text-slate-400" />
      </div>
      <div className="flex gap-3 flex-wrap">
        <SearchBox value={q} onChange={setQ} placeholder="Search by plate, make, or model..." />
        <select className={inputCls} style={{ width: 170 }} value={status} onChange={(e) => setStatus(e.target.value)}>
          {["All Statuses", ...VEHICLE_STATUSES].map((s) => <option key={s} value={s}>{s === "All Statuses" ? s : cap(s)}</option>)}
        </select>
      </div>
      {rows.length === 0 ? (
        <EmptyState icon={Truck} text="No vehicles found." actionLabel="Add first vehicle" onAction={() => openModal({ type: "vehicle", mode: "add", item: null })} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {rows.map((v) => {
            const driver = v.driverId ? driverById.get(v.driverId) : null;
            const StatusIcon = statusIcon[v.status] || Truck;
            return (
              <div key={v.id} className={cx(cardCls, "p-5")}>
                <div className="flex items-start justify-between mb-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center shrink-0"><Truck size={18} className="text-white" /></div>
                    <div className="min-w-0">
                      <div className="text-white font-semibold truncate font-mono">{v.plate}</div>
                      <div className="text-slate-500 text-xs truncate">{v.make} {v.model} {v.year ? `· ${v.year}` : ""}</div>
                    </div>
                  </div>
                  <button className={iconBtnDanger} onClick={() => askDelete({ entity: "vehicles", id: v.id, label: "vehicle" })}><Trash2 size={14} /></button>
                </div>
                <div className="mb-3"><Badge text={cap(v.status)} className={statusColor[v.status] || statusColor.idle} /></div>
                <div className="space-y-1.5 text-slate-400 text-sm mb-3">
                  <div className="flex items-center gap-1.5"><Package size={13} />{v.type || "—"}{v.capacityKg ? ` · ${Number(v.capacityKg).toLocaleString()} kg` : ""}</div>
                  <div className="flex items-center gap-1.5"><Gauge size={13} />{v.mileageKm ? `${Number(v.mileageKm).toLocaleString()} km` : "—"}</div>
                  <div className="flex items-center gap-1.5"><Wrench size={13} />Last service: {v.lastService || "—"}</div>
                  <div className="flex items-center gap-1.5"><Users size={13} />{driver ? driver.name : "Unassigned"}</div>
                </div>
                <div className="flex justify-end">
                  <button className={btnSecondary} onClick={() => openModal({ type: "vehicle", mode: "edit", item: v })}><Pencil size={14} /> Edit</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
function CheckCircle2({ size = 16, className = "" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 17 10"/></svg>;
}

function VehicleForm({ initial, drivers, onSave, onCancel }) {
  const isEdit = !!initial;
  const v = initial || {};
  const [plate, setPlate] = useState(v.plate || "");
  const [type, setType] = useState(v.type || "Truck");
  const [make, setMake] = useState(v.make || "");
  const [model, setModel] = useState(v.model || "");
  const [year, setYear] = useState(v.year || new Date().getFullYear());
  const [capacityKg, setCapacityKg] = useState(v.capacityKg ?? "");
  const [mileageKm, setMileageKm] = useState(v.mileageKm ?? "");
  const [lastService, setLastService] = useState(v.lastService || todayISO());
  const [driverId, setDriverId] = useState(v.driverId || "");
  const [status, setStatus] = useState(v.status || "active");
  const driverOptions = drivers.filter((d) => d.role === "Driver");

  function submit(e) {
    e.preventDefault();
    if (!plate.trim() || !make.trim() || !model.trim()) return;
    onSave({ id: v.id || uid("veh"), plate: plate.trim().toUpperCase(), type, make: make.trim(), model: model.trim(), year: Number(year), capacityKg: Number(capacityKg) || 0, mileageKm: Number(mileageKm) || 0, lastService, driverId, status });
  }

  return (
    <form onSubmit={submit}>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Plate Number"><input className={inputCls} value={plate} onChange={(e) => setPlate(e.target.value)} placeholder="e.g. JW-6205" /></Field>
        <Field label="Vehicle Type"><input className={inputCls} value={type} onChange={(e) => setType(e.target.value)} placeholder="Truck" /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Make"><input className={inputCls} value={make} onChange={(e) => setMake(e.target.value)} placeholder="e.g. Isuzu" /></Field>
        <Field label="Model"><input className={inputCls} value={model} onChange={(e) => setModel(e.target.value)} placeholder="e.g. FVR-240" /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Year"><input type="number" className={inputCls} value={year} onChange={(e) => setYear(e.target.value)} /></Field>
        <Field label="Capacity (kg)"><input type="number" className={inputCls} value={capacityKg} onChange={(e) => setCapacityKg(e.target.value)} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Mileage (km)"><input type="number" className={inputCls} value={mileageKm} onChange={(e) => setMileageKm(e.target.value)} /></Field>
        <Field label="Last Service"><input type="date" className={inputCls} value={lastService} onChange={(e) => setLastService(e.target.value)} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Assigned Driver">
          <select className={inputCls} value={driverId} onChange={(e) => setDriverId(e.target.value)}>
            <option value="">Unassigned</option>
            {driverOptions.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {VEHICLE_STATUSES.map((s) => <option key={s} value={s}>{cap(s)}</option>)}
          </select>
        </Field>
      </div>
      <div className="flex justify-end gap-2 mt-2">
        <button type="button" className={btnSecondary} onClick={onCancel}>Cancel</button>
        <button type="submit" className={btnPrimary}>{isEdit ? "Save Changes" : "Add Vehicle"}</button>
      </div>
    </form>
  );
}

/* ==================== Modal router ==================== */
function EntityModal({ modal, data, onSave, onClose }) {
  if (!modal) return null;
  const { type, mode, item } = modal;
  const title = { vehicle: mode === "edit" ? "Edit Vehicle" : "Add Vehicle", driver: mode === "edit" ? "Edit Team Member" : "Add Team Member" }[type];
  return (
    <Modal title={title} onClose={onClose}>
      {type === "vehicle" && <VehicleForm initial={mode === "edit" ? item : null} drivers={data.drivers} onSave={(i) => onSave("vehicles", i)} onCancel={onClose} />}
      {type === "driver" && <DriverForm initial={mode === "edit" ? item : null} onSave={(i) => onSave("drivers", i)} onCancel={onClose} />}
    </Modal>
  );
}

/* ==================== Main app ==================== */
function FleetApp() {
  const [authSession, setAuthSession] = useState(undefined); // undefined = not checked yet
  const [profile, setProfile] = useState(null);
  const [dataState, setDataState] = useState(null);
  const [dataLoading, setDataLoading] = useState(false);
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [tab, setTab] = useState("fleet"); // "fleet" | "drivers"
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setAuthSession(data.session || null));
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, sess) => setAuthSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (authSession) loadProfileAndData();
    else if (authSession === null) { setProfile(null); setDataState(null); }
    // eslint-disable-next-line
  }, [authSession]);

  async function loadProfileAndData() {
    setDataLoading(true);
    const userId = authSession.user.id;
    const { data: profRow } = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
    const prof = profRow ? fromDbRow(profRow) : { id: userId, name: authSession.user.email, role: "staff" };
    setProfile(prof);
    if (prof.role === "admin" || prof.role === "data_entry") await refreshData();
    setDataLoading(false);
  }

  async function refreshData() {
    const [driversRes, vehiclesRes] = await Promise.all([
      supabaseClient.from("drivers").select("*").order("created_at", { ascending: false }),
      supabaseClient.from("vehicles").select("*").order("created_at", { ascending: false }),
    ]);
    setDataState({
      drivers: (driversRes.data || []).map(fromDbRow),
      vehicles: (vehiclesRes.data || []).map(fromDbRow),
    });
  }

  async function handleLogin(email, password) {
    setAuthBusy(true); setAuthError(null);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setAuthError(error.message);
    setAuthBusy(false);
  }

  async function handleLogout() { await supabaseClient.auth.signOut(); }

  async function saveItem(entity, item) {
    const row = toDbRow(item);
    const { error } = await supabaseClient.from(entity).upsert(row);
    if (error) { window.alert("Couldn't save: " + error.message); return; }
    setDataState((prev) => {
      const list = prev[entity];
      const idx = list.findIndex((x) => x.id === item.id);
      const next = idx > -1 ? list.map((x) => (x.id === item.id ? item : x)) : [item, ...list];
      return { ...prev, [entity]: next };
    });
    setModal(null);
  }

  async function deleteItem(entity, id) {
    const { error } = await supabaseClient.from(entity).delete().eq("id", id);
    if (error) { window.alert("Couldn't delete: " + error.message); return; }
    setDataState((prev) => ({ ...prev, [entity]: prev[entity].filter((x) => x.id !== id) }));
    setConfirm(null);
  }

  async function updateDriverStatus(driverId, status) {
    const { error } = await supabaseClient.from("drivers").update({ status }).eq("id", driverId);
    if (error) { window.alert("Couldn't update driver: " + error.message); return; }
    setDataState((prev) => ({ ...prev, drivers: prev.drivers.map((d) => (d.id === driverId ? { ...d, status } : d)) }));
  }

  // Still checking for an existing session
  if (authSession === undefined) {
    return <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center"><div className="text-slate-500 text-sm">Loading…</div></div>;
  }

  if (!authSession) {
    return <AuthScreen onLogin={handleLogin} busy={authBusy} error={authError} />;
  }

  if (dataLoading || !profile) {
    return <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center"><div className="text-slate-500 text-sm">Loading…</div></div>;
  }

  if (profile.role !== "admin" && profile.role !== "data_entry") {
    return (
      <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center p-4">
        <div className="max-w-sm text-center">
          <AlertTriangle size={32} className="text-amber-500 mx-auto mb-3" />
          <h2 className="text-white font-semibold text-lg mb-1">Access restricted</h2>
          <p className="text-slate-500 text-sm mb-5">The Fleet &amp; Drivers site is only available to Admin and Data Entry accounts. Signed in as {profile.name || profile.id} ({profile.role || "unknown role"}).</p>
          <button className={btnSecondary} onClick={handleLogout}><LogOut size={14} /> Sign out</button>
        </div>
      </div>
    );
  }

  if (!dataState) {
    return <div className="min-h-screen w-full bg-slate-950 flex items-center justify-center"><div className="text-slate-500 text-sm">Loading…</div></div>;
  }

  const tabBtnCls = (active) => cx("px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2", active ? "bg-blue-600 text-white" : "text-slate-400 hover:text-slate-200 hover:bg-slate-900");

  return (
    <div className="min-h-screen w-full bg-slate-950 text-slate-200">
      <header className="border-b border-slate-800 bg-slate-900/50">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center shrink-0"><Truck size={18} className="text-white" /></div>
            <div>
              <div className="text-white font-bold text-sm tracking-wide">LOGISTIX · FLEET &amp; DRIVERS</div>
              <div className="text-slate-500 text-xs">{profile.name || profile.id}</div>
            </div>
          </div>
          <button className={cx(btnSecondary, "!px-3 !py-1.5")} onClick={handleLogout}><LogOut size={14} /> Sign out</button>
        </div>
        <div className="max-w-6xl mx-auto px-4 sm:px-6 pb-3 flex gap-2">
          <button className={tabBtnCls(tab === "fleet")} onClick={() => setTab("fleet")}><Truck size={15} /> Fleet</button>
          <button className={tabBtnCls(tab === "drivers")} onClick={() => setTab("drivers")}><Users size={15} /> Drivers</button>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6">
        {tab === "fleet" ? (
          <FleetView data={dataState} openModal={setModal} askDelete={setConfirm} />
        ) : (
          <DriversView data={dataState} openModal={setModal} askDelete={setConfirm} updateDriverStatus={updateDriverStatus} />
        )}
      </main>

      <EntityModal modal={modal} data={dataState} onSave={saveItem} onClose={() => setModal(null)} />

      {confirm && (
        <ConfirmModal
          title={`Delete this ${confirm.label}?`}
          message="This action can't be undone."
          onCancel={() => setConfirm(null)}
          onConfirm={() => deleteItem(confirm.entity, confirm.id)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FleetApp />);
</script>
<script>
  // Explicit transform instead of Babel's automatic text/babel scanning: forces the classic
  // JSX runtime (React.createElement calls) rather than whatever the loaded Babel version
  // might default to, which otherwise can silently produce ES module import statements that
  // fail when run as a plain script.
  (function () {
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var script = document.createElement('script');
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>
</body>
